<style>

.bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px;color:var(--c-text-2)}

.rd{padding:0 22px}

/* 設定の行 */
.sr{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 12px;border-top:1px solid var(--c-border)}

.sr b{font-size:16px;display:block;line-height:1.3} .sr small{font-size:12.5px;color:var(--c-text-3);display:block;line-height:1.35}
.sr .v{margin-left:auto;font-size:13.5px;color:var(--c-text-2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.sr .v svg.ui-ico{width:15px;height:15px;color:var(--c-border-2)}

.gl{font:700 12.5px var(--font);color:var(--c-text-3);margin:20px 8px 8px;letter-spacing:.04em}
.btn{height:52px;border-radius:16px;background:var(--c-primary);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

.sw{width:50px;height:30px;border-radius:999px;background:var(--c-surface-3);position:relative;box-shadow:inset 0 0 0 1.5px #a89c86;flex:none;margin-left:auto}

.rail{position:absolute;inset:0 auto 0 0;width:256px;background:var(--c-rail);border-right:1px solid var(--c-border);padding:20px 14px;display:flex;flex-direction:column;gap:2px}

.rail .q kbd{margin-left:auto;font:400 11px var(--font);border:1px solid var(--c-border-2);border-radius:5px;padding:1px 5px}
.rail .tb{height:42px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--c-text-2);font-size:15px}
.rail .tb.on{background:var(--c-surface);color:var(--c-text);font-weight:700;box-shadow:var(--shadow-1)} .rail .tb.on svg{color:var(--c-primary)}

.pane{position:absolute;top:0;bottom:0;background:var(--c-bg)}

.door b{position:absolute;right:24px;top:22px;writing-mode:vertical-rl;font:700 30px var(--font-display);letter-spacing:.12em}
.door small{position:absolute;right:66px;top:26px;writing-mode:vertical-rl;font:400 11px var(--font);letter-spacing:.2em;opacity:.9}
.door i{position:absolute;left:20px;bottom:16px;font:700 20px var(--font-display);font-style:normal} .door i small{position:static;writing-mode:horizontal-tb;display:block;font:700 11px var(--font);letter-spacing:.1em}
.desk .ln{display:flex;align-items:center;gap:12px;height:58px;padding:0 8px 0 16px;color:var(--c-text-3);font:400 16px var(--font-display)}

.sys h3{font:700 19px var(--font-display);margin:26px 0 12px} .sys h3:first-child{margin-top:0} .sys h3 small{font:400 13px var(--font);color:var(--c-text-3);margin-left:10px}

<div id="root"></div>

<script src="../../js/icons-phosphor.js"></script>
<script>
const ic = (n) => KN.icons.svg(n);
const NB = { "くらし": "#55704a", "仕事": "#2f5d86", "読書": "#5f4b8b", "旅": "#a2582a", "thinking": "#8f3b3b", "庭": "#3f7565", "": "#cdbfa3" };
const P = (n) => `../../img/season-photo/k${n}.webp`;
const NOTES = [
  { t: "秋の小さな旅", x: "週末に、近くの山あいの町まで出かけた。電車で一時間ほど。駅前の通りは静かで、古い商店が並んでいる。", nb: "旅", d: "今日 8:30", fav: 1, pic: P(47) },
  { t: "献立の案", x: "月：焼き魚と味噌汁　火：鍋　水：カレー。足りないものは買うものへ。", nb: "くらし", d: "昨日" },
  { t: "読書メモ：随筆", x: "静かな文章だった。季節の移りを、台所の窓から書いている。毎日は似ているが、同じ日は無い。", nb: "読書", d: "11月11日", pic: P(50) },
  { t: "考えごと：道具について", x: "長く使う道具は、手入れのしやすさで選ぶ。新しさより、直せること。", nb: "thinking", d: "11月9日", fav: 1 },
  { t: "庭の手入れ", x: "落ち葉を集める。鉢を軒下へ。球根を植える。", nb: "くらし", d: "11月8日", pic: P(52) },
  { t: "旅行の持ち物", x: "着替え、充電器、切符。", nb: "旅", d: "11月7日" },
  { t: "打ち合わせの控え", x: "資料は来週まで。次回は月末。", nb: "仕事", d: "11月5日" },
  { t: "きのこの炊きこみご飯", x: "米 二合、きのこ 三種、油揚げ 一枚。きのこをほぐし、調味料と一緒に炊く。", nb: "くらし", d: "10月30日", fav: 1, pic: P(49) },
