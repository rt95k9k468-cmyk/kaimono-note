<!doctype html>
<!-- DIAG（一時）：アプリを使わない最小の頁。送る器の中の紙（transform・opacity の transition で入ってくる）に、
     スクロール連動の動き（animation-timeline: scroll()）を持つ ::after。紙をまるごと組み直すのを繰り返す。
     ?sda=0|1 &sheet=0|1 で一つずつ外す。終わると window.__done。 -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; height: 100%; font: 14px sans-serif; }
  .body { position: absolute; inset: 0; overflow: auto; }
  .sheet { position: relative; background: #fdfdfd; border-radius: 16px 16px 0 0; min-height: 62vh; }
  .anim .sheet { transition: transform 220ms ease-out, opacity 220ms ease-out; }
  .anim .sheet.from-left { transform: translateX(-22px); opacity: 0; transition: none; }
  .grip { display: block; padding: 12px 0; position: sticky; top: 0; z-index: 1; background: #fdfdfd; }
  .grip::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 16px;
    background: linear-gradient(#fdfdfd, transparent); pointer-events: none; opacity: 0; }
  .sda .grip::after { animation: edge-in linear both; animation-timeline: scroll(nearest block); animation-range: 0 24px; }
  @keyframes edge-in { to { opacity: 1; } }
  .sheet p { margin: 0; padding: 12px; border-bottom: 1px solid #ddd; }
</style>
<div class="body"></div>
<script>
  const q = new URLSearchParams(location.search), on = (k) => q.get(k) !== "0";
  document.documentElement.className = (on("sda") ? "sda " : "") + (on("sheet") ? "anim" : "");
  const body = document.querySelector(".body");
  const fill = (m) => {
    const s = document.createElement("div");
    s.className = "sheet" + (m ? " from-left" : "");
    s.innerHTML = `<i class="grip"></i>` + Array.from({ length: 30 }, (_, i) => `<p>予定 ${m}-${i}</p>`).join("");
    body.replaceChildren(s);
    if (m) { s.getBoundingClientRect(); requestAnimationFrame(() => s.classList.remove("from-left")); }
  };
  const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
  (async () => {
    fill(0);
    await wait(300);
    for (let m = 1; m <= 16; m++) {
      if (m % 3 === 0) body.scrollTop = 260;
      fill(m);
      await wait(m % 2 ? 120 : 400);   // 動きの途中でも、終わってからでも組み直す
    }
    window.__done = true;
  })();
</script>
