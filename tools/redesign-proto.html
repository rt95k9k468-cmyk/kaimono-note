<!doctype html>
<!--
  全面リデザインの見本（tools/redesign-proto.html。docs/redesign.md）。配らない（deploy が消す）。手元のサーバーで開く：
    http://localhost:8765/tools/redesign-proto.html#tasks   （#daily・#notes・#tasks・#shopping・#health・#settings）
    ?display=gothic（見出しをゴシックに）・?accent=ai（主色を藍に）・?theme=dark・?sheet=task（紙を開いて始める）
    ?face=month（やることの月の面）・?peek=month（ほかの席で暦を月まで引いた姿）・?cal=photo（月の暦を写真の上に残す案）
  偽の記録は無難な字だけ。本物の記録（localStorage・IndexedDB）には読みも書きもしない。
  読むのは保存に触れない部品だけ（util.js・絵）。色・字・形の札はここの :root が正——作るときは base.css へ写す。
  決まったら消す。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>くらしノート — 全面リデザインの見本</title>
<style>
/* ---------- 札（作るときは css/base.css の :root へ） ---------- */
:root {
  --c-bg: #f4efe5;            /* 地：生成り。白すぎず、灰に寄せない */
  --c-rail: #eee7d9;          /* 左の列（広い画面） */
  --c-surface: #fffdf8;       /* 札・カード：温かい白 */
  --c-surface-2: #ebe4d6;     /* 沈んだ面（選ぶ帯の地・絵の台） */
  --c-surface-3: #ded5c3;
  --c-line: #e5ddce;
  --c-line-2: #cfc5b2;
  --c-text: #25201a;          /* 墨 */
  --c-text-2: #5a5146;
  --c-text-3: #6f6558;
  --c-text-on: #ffffff;
  --c-primary: #bf4128;       /* 朱。字にも塗りにも同じ一色（白字 5.2・地の上 4.6） */
  --c-primary-soft: #f7e3da;
  --c-primary-ink: #8e2e1b;
  --c-ai: #2b5a8c;            /* 藍：予定・値段の印 */
  --c-ai-soft: #dfe8f2;
  --c-take: #2a7354;          /* 若竹：やること・済ませた */
  --c-take-soft: #dcebe2;
  --c-yamabuki: #8a6410;      /* 山吹：お酒・最安 */
  --c-yamabuki-fill: #dfa32b;
  --c-yamabuki-soft: #f6ead0;
  --c-fuji: #5d4c98;          /* 藤：睡眠 */
  --c-fuji-soft: #e7e2f2;
  --c-kaki: #a04d17;          /* 柿：消費 */
  --c-kaki-fill: #d9732e;
  --c-kaki-soft: #f8e4d3;
  --shadow-1: 0 1px 2px rgba(60, 40, 15, .05), 0 6px 18px -10px rgba(60, 40, 15, .18);
  --shadow-2: 0 2px 6px rgba(60, 40, 15, .08), 0 14px 32px -12px rgba(60, 40, 15, .26);
  --shadow-3: 0 10px 40px rgba(40, 25, 10, .22);
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Noto Sans JP", sans-serif;
  --font-display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --font-num: ui-rounded, "SF Pro Rounded", var(--font);
  --ease: cubic-bezier(.32, .72, 0, 1);
  --sky: url("img/sky/winter-morning.webp");
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
:root[data-display="gothic"] { --font-display: var(--font); }
:root[data-accent="ai"] { --c-primary: #2b5a8c; --c-primary-soft: #dfe8f2; --c-primary-ink: #1e4268; --c-ai: #bf4128; --c-ai-soft: #f7e3da; }
:root[data-theme="dark"] {
  --c-bg: #1b1916; --c-rail: #161412; --c-surface: #262320; --c-surface-2: #322e29; --c-surface-3: #403a33;
  --c-line: #37322c; --c-line-2: #4b443b; --c-text: #f1ebdf; --c-text-2: #c2b9aa; --c-text-3: #a39a8b;
  --c-primary: #ee8468; --c-primary-soft: #46261d; --c-primary-ink: #f6b29f; --c-text-on: #1b1916;
  --c-ai: #8db5e2; --c-ai-soft: #1f3147; --c-take: #7cc7a2; --c-take-soft: #1d3a2d;
  --c-yamabuki: #e3b95a; --c-yamabuki-soft: #3d3118; --c-fuji: #b3a5e6; --c-fuji-soft: #2e2848;
  --c-kaki: #eb9a62; --c-kaki-soft: #43291a;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3); --shadow-2: 0 8px 24px rgba(0, 0, 0, .45);
  --sky: url("img/sky/winter-night.webp");
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--c-bg); color: var(--c-text); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.ui-ico { width: 22px; height: 22px; flex: none; display: block; }
.ui-ico .ico-solid { display: none; }
.is-on > .ui-ico .ico-line, .is-on .tab-ico .ico-line { display: none; }
.is-on > .ui-ico .ico-solid, .is-on .tab-ico .ico-solid { display: block; }
.p-icon { width: 26px; height: 26px; display: block; }
.press { transition: transform .12s var(--ease), background-color .12s, opacity .12s; }
.press:active { transform: scale(.965); }

/* ---------- 骨組み ---------- */
.app { height: 100%; display: flex; flex-direction: column; position: relative; }
.rail { display: none; }
.stage { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.stage::-webkit-scrollbar { display: none; }

/* 頭：空の帯に題（白い字）。暦は紙の上で読む */
.head { position: relative; }
.head-sky { position: absolute; inset: 0 0 auto 0; height: calc(102px + var(--safe-t)); background: var(--sky) center 60% / cover; }
.head-sky::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(20, 14, 8, .5), rgba(20, 14, 8, .22) 52%, rgba(20, 14, 8, 0) 84%), linear-gradient(180deg, rgba(20, 14, 8, .26), rgba(20, 14, 8, 0) 50%); }
.head-top { position: relative; display: flex; align-items: flex-end; gap: 8px; height: calc(76px + var(--safe-t)); padding: 0 12px 10px 20px; color: #fff; }
.head-names { flex: 1; min-width: 0; text-shadow: 0 1px 10px rgba(0, 0, 0, .35); }
.head-eye { font-size: 12px; font-weight: 700; letter-spacing: .1em; opacity: .94; }
.head-title { font: 700 27px/1.25 var(--font-display); letter-spacing: .02em; white-space: nowrap; }
.head-title small { font: 700 15px var(--font); margin-left: 8px; letter-spacing: .04em; }
.head-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: rgba(30, 22, 14, .3); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); }
.tray { position: relative; background: var(--c-bg); border-radius: 24px 24px 0 0; padding: 12px 8px 2px; min-height: 26px; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk-d { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 2px 6px; min-width: 0; }
.wk-w { font-size: 11px; line-height: 16px; color: var(--c-text-3); }
.wk-d.is-sat .wk-w { color: var(--c-ai); } .wk-d.is-sun .wk-w { color: var(--c-primary); }
.wk-n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font: 700 17px var(--font-num); }
.wk-d.is-today .wk-n { background: var(--c-primary); color: var(--c-text-on); box-shadow: 0 4px 10px -4px var(--c-primary); }
.wk-tags { display: flex; flex-direction: column; gap: 2px; width: 100%; min-height: 32px; }   /* 札二段ぶんはいつも空ける（週を送っても背が変わらない） */
.wk-tag { font-size: 10px; font-weight: 700; line-height: 15px; height: 15px; padding: 0 4px; border-radius: 4px; overflow: hidden; white-space: nowrap;
  background: var(--c-take-soft); color: var(--c-take); }
.wk-tag.is-plan { background: var(--c-ai-soft); color: var(--c-ai); }

/* 月の暦（暦は 暦なし／週／月 の三段のまま。札は字のまま——点にしない）。ふつうの月は名前二つ、月の面（.is-tall）は入るだけ＋あふれは +n */
.mo-w { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; line-height: 20px; color: var(--c-text-3); }
.mo-w .is-sat { color: var(--c-ai); } .mo-w .is-sun { color: var(--c-primary); }
.mo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); --mo-h: 62px; }
.mo.is-tall { --mo-h: 77px; }
.mo-c { min-height: var(--mo-h); padding: 2px 1px 3px; border-top: 1px solid var(--c-line); border-right: 1px solid var(--c-line); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.mo-c:nth-child(7n) { border-right: 0; }
.mo-n { width: 26px; height: 26px; border-radius: 50%; font: 700 15px/26px var(--font-num); text-align: center; flex: none; }
.mo-c.is-sat .mo-n { color: var(--c-ai); } .mo-c.is-sun .mo-n { color: var(--c-primary); }
.mo-c.is-out .mo-n { color: var(--c-line-2); }
.mo-c.is-today .mo-n { background: var(--c-primary); color: var(--c-text-on); box-shadow: 0 3px 8px -3px var(--c-primary); }
.mo-t { width: 100%; font-size: 10px; font-weight: 700; line-height: 15px; height: 15px; padding: 0 3px; border-radius: 4px; overflow: hidden; white-space: nowrap; flex: none;
  background: var(--c-take-soft); color: var(--c-take); }
.mo-t.is-plan { background: var(--c-ai-soft); color: var(--c-ai); }
.mo-t.is-dead { background: var(--c-yamabuki-soft); color: var(--c-yamabuki); }
.mo-t.is-past { background: var(--c-surface-2); color: var(--c-text-3); }
.mo-more { font: 700 10px/12px var(--font-num); color: var(--c-text-3); }
.card.month { padding: 10px 12px 6px; overflow: hidden; }
/* 見比べ用（?cal=photo）：月の暦を今と同じく写真の上に残す案。数字は白、札は塗った紙色 */
:root[data-cal="photo"] .head.is-month .head-sky { height: auto; bottom: -24px; }
:root[data-cal="photo"] .head.is-month .head-sky::after { background: linear-gradient(180deg, rgba(20, 14, 8, .46), rgba(20, 14, 8, .3)); }
:root[data-cal="photo"] .head.is-month .tray { background: transparent; }
:root[data-cal="photo"] .head.is-month :is(.mo-w, .mo-w span, .mo-n) { color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .45); }
:root[data-cal="photo"] .head.is-month .mo-c { border-color: rgba(255, 255, 255, .26); }
:root[data-cal="photo"] .head.is-month .mo-c.is-out .mo-n { color: rgba(255, 255, 255, .5); }
:root[data-cal="photo"] .head.is-month .mo-c.is-sat .mo-n { color: #cfe2ff; } :root[data-cal="photo"] .head.is-month .mo-c.is-sun .mo-n { color: #ffd4c9; }
:root[data-cal="photo"] .head.is-month .mo-c.is-today .mo-n { color: #fff; text-shadow: none; }
:root[data-cal="photo"] .head.is-month .mo-t { background: var(--c-surface); }
:root[data-cal="photo"] .head.is-month .mo-t.is-past { background: rgba(255, 253, 248, .72); }
:root[data-cal="photo"] .head.is-month .mo-more { color: #fff; }
:root[data-cal="photo"] .head.is-month + .page { position: relative; background: var(--c-bg); border-radius: 24px 24px 0 0; padding-top: 16px; }

.page { padding: 10px 16px calc(104px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px; }
.page.is-in { animation: page-in .26s var(--ease); }
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } }

/* 下の帯：塗った面（ぼかさない）。＋は帯と同じ段の右 */
.bar { position: absolute; left: 12px; right: 80px; bottom: calc(10px + var(--safe-b)); height: 62px; display: flex; padding: 5px; z-index: 5;
  background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 31px; box-shadow: var(--shadow-2); }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 26px;
  color: var(--c-text-2); font-size: 10.5px; letter-spacing: .01em; position: relative; }
.tab .tab-ico { width: 24px; height: 24px; }
.tab.is-on { color: var(--c-primary-ink); font-weight: 700; background: var(--c-primary-soft); }   /* 薄い朱の上の字は -ink（朱そのものは 4.2） */
.tab.is-on .tab-ico { color: var(--c-primary); }
.tab-badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--c-ai); color: #fff;
  font: 700 11px/17px var(--font-num); text-align: center; box-shadow: 0 0 0 2px var(--c-surface); }
.fab { position: absolute; right: 12px; bottom: calc(13px + var(--safe-b)); width: 56px; height: 56px; border-radius: 50%; z-index: 5; display: grid; place-items: center;
  background: var(--c-primary); color: var(--c-text-on); box-shadow: 0 10px 22px -8px var(--c-primary), 0 2px 6px rgba(60, 40, 15, .2); }
.fab .ui-ico { width: 26px; height: 26px; }

/* ---------- 部品 ---------- */
.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.sec { display: flex; align-items: baseline; gap: 8px; padding: 6px 4px 0; }
.sec-t { font: 700 19px/1.3 var(--font-display); letter-spacing: .02em; }
.sec-n { font-size: 13px; color: var(--c-text-3); }
.sec-a { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--c-primary); }
.sec-a .ui-ico { width: 16px; height: 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 13px; background: var(--c-surface-2); }
.seg-b { min-width: 58px; height: 36px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--c-text-2); display: grid; place-items: center; }
.seg-b.is-on { background: var(--c-surface); color: var(--c-text); box-shadow: 0 1px 3px rgba(60, 40, 15, .16); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--c-surface); border: 1px solid var(--c-line-2);
  font-size: 14px; font-weight: 700; white-space: nowrap; }
.chip.is-soft { border-color: transparent; background: var(--c-surface-2); font-weight: 400; height: 30px; font-size: 13px; padding: 0 11px; }
.chip .ui-ico { width: 16px; height: 16px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c-take); flex: none; }
.row-tools { display: flex; align-items: center; gap: 8px; }
.row-tools .sp { flex: 1; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--c-line-2); flex: none; display: grid; place-items: center; position: relative; transition: background-color .18s, border-color .18s; }
.check::before { content: ""; position: absolute; inset: -9px; }
.check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .26s .06s var(--ease); }
.is-done > .check, .check.is-done { background: var(--c-take); border-color: var(--c-take); }
.is-done > .check svg, .check.is-done svg { stroke-dashoffset: 0; }
.btn { height: 52px; padding: 0 22px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; }
.btn.is-main { background: var(--c-primary); color: var(--c-text-on); }
.btn.is-soft { background: var(--c-surface-2); color: var(--c-text); }
.btn.is-tint { background: var(--c-yamabuki-soft); color: var(--c-yamabuki); }
.tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--tile-bg, var(--c-surface-2)); color: var(--tile-ink, var(--c-text-2)); }

/* ---------- tasks ---------- */
.strip { padding: 14px 16px 12px; }
.strip-top { display: flex; align-items: baseline; gap: 8px; }
.strip-now { font: 700 13px var(--font-num); color: var(--c-primary); background: var(--c-primary-soft); padding: 2px 9px; border-radius: 10px; }
.strip-next { font-size: 15px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip-left { font-size: 13px; color: var(--c-text-2); margin-left: auto; white-space: nowrap; }
.strip-bar { position: relative; height: 26px; margin-top: 12px; border-radius: 8px; background: var(--c-surface-2); overflow: hidden; }
.strip-past { position: absolute; inset: 0 auto 0 0; background: var(--c-surface-3); opacity: .55; }
.strip-b { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; background: var(--c-take); min-width: 6px; }
.strip-b.is-plan { background: var(--c-ai); } .strip-b.is-act { background: transparent; box-shadow: inset 0 0 0 2px var(--c-fuji); }
.strip-pin { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--c-primary); }
.strip-pin::after { content: ""; position: absolute; left: -4px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--c-primary); box-shadow: 0 0 0 2px var(--c-surface); }
.strip-wrap { position: relative; }
.strip-tk { display: flex; justify-content: space-between; margin-top: 4px; font: 400 11px var(--font-num); color: var(--c-text-3); padding: 0 1px; }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl-row { display: grid; grid-template-columns: 50px minmax(0, 1fr); align-items: start; gap: 6px; }
.tl-t { font: 700 14px/52px var(--font-num); color: var(--c-text-2); text-align: right; padding-right: 6px; }
.task { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 9px 14px 9px 16px; position: relative; overflow: hidden; }
.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--k, var(--c-take)); }
.task.is-plan { --k: var(--c-ai); } .task.is-act { --k: var(--c-fuji); }
.task-ico { color: var(--k, var(--c-take)); }
.task-main { flex: 1; min-width: 0; }
.task-t { font-size: 16px; font-weight: 700; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-m { font-size: 13px; color: var(--c-text-2); display: flex; gap: 8px; }
.task.is-done .task-t { text-decoration: line-through; text-decoration-color: var(--c-text-3); color: var(--c-text-3); }
.tl-now { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.tl-now span { font: 700 12px var(--font-num); color: var(--c-text-on); background: var(--c-primary); padding: 2px 9px; border-radius: 10px; }
.tl-now::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: var(--c-primary); }
.tl-gap { margin-left: 56px; font-size: 13px; color: var(--c-text-3); padding: 2px 0 2px 14px; border-left: 2px dotted var(--c-line-2); }
.list { overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; }
.li + .li { border-top: 1px solid var(--c-line); }
.li-main { flex: 1; min-width: 0; }
.li-t { font-size: 16px; font-weight: 700; line-height: 1.35; }
.li-s { font-size: 13px; color: var(--c-text-2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.li-s .ui-ico { width: 14px; height: 14px; }
.li-end { text-align: right; flex: none; }
.week-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 9px 14px; align-items: baseline; }
.week-row + .week-row { border-top: 1px solid var(--c-line); }
.week-d { font: 700 17px var(--font-num); } .week-d small { font: 400 11px var(--font); color: var(--c-text-3); margin-left: 3px; }
.week-row.is-today .week-d { color: var(--c-primary); }
.week-i { display: flex; align-items: center; gap: 7px; font-size: 14px; line-height: 1.7; }
.week-i .num { color: var(--c-text-2); font-size: 13px; }

/* ---------- daily ---------- */
.kou { display: flex; gap: 14px; padding: 12px; align-items: stretch; }
.kou-art { width: 92px; aspect-ratio: 720 / 1075; border-radius: 6px; background: #d8cfbd center / cover; box-shadow: 0 0 0 4px var(--c-surface), 0 0 0 5px var(--c-line-2), 0 6px 14px -6px rgba(60, 40, 15, .5); margin: 5px; flex: none; }
.kou-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 6px; }

  const WD = "月火水木金土日";
  let face = q.get("face") || "today";
  function monthGrid(tall) {
    const cells = []; for (let d = 26; d <= 31; d++) cells.push([d, 1]); for (let d = 1; d <= 30; d++) cells.push([d, 0]); for (let d = 1; d <= 6; d++) cells.push([d, 1]);
    const max = tall ? (mid() ? 4 : 3) : 2;
    return `<div class="mo-w">${WD.split("").map((w, i) => `<span class="${i === 5 ? "is-sat" : i === 6 ? "is-sun" : ""}">${w}</span>`).join("")}</div>
      <div class="mo${tall ? " is-tall" : ""}">${cells.map(([d, out], i) => {
        const items = out ? [] : (MONTH[d] || []), show = items.length > max ? items.slice(0, max - 1) : items, col = i % 7;
        return `<div class="mo-c${out ? " is-out" : ""}${d === 10 && !out ? " is-today" : ""}${col === 5 ? " is-sat" : ""}${col === 6 || (!out && HOL.includes(d)) ? " is-sun" : ""}"><span class="mo-n">${d}</span>${
          show.map(([t, k]) => `<span class="mo-t is-${k}${d < 10 && k === "todo" ? " is-past" : ""}">${t}</span>`).join("")}${items.length > show.length ? `<span class="mo-more">+${items.length - show.length}</span>` : ""}</div>`;
      }).join("")}</div>`;
  }
  const ANY = [["電球を替える", "前の日から"], ["本を返す", "今週"], ["書類を出す", "11月14日まで"]];
  const SHOP = [
    ["食品", "#2a7354", [["牛乳", "スーパー", 198, true, "3日前", true], ["卵", "スーパー", 248, false, "3日前", false], ["食パン", "スーパー", 158, false, "3日前", false]]],
    ["日用品", "#2b5a8c", [["洗剤", "ドラッグストア", 348, true, "昨日", false], ["電球", "", 0, false, "", false]]],
  ];
  const BOOKS = [["くらし", "#bf4128", "pt-asa", 42], ["仕事", "#2b5a8c", "pt-shima", 31], ["読書", "#2a7354", "pt-nami", 18], ["旅", "#c9891b", "pt-ichi", 9], ["レシピ", "#a04d17", "pt-ten", 24], ["考えごと", "#5d4c98", "pt-asa", 12]];
  const NOTES = [["献立の案", "今日 10:12", 4], ["旅行の持ち物", "昨日", 3], ["読みたい本", "11月6日", 2], ["部屋の片づけ", "11月5日", 0], ["庭の手入れ", "11月4日", 2]];
  const KG = [64.9, 64.6, 64.8, 65.1, 64.7, 64.3, 64.5, 64.8, 64.6, 64.2, 64.4, 64.7, 64.5, 64.1, 64.3, 64.4, 64.2, 64.0, 64.3, 64.1, 64.0];
  const METS = [["steps", "歩数", "6,240", "歩", "--c-take", [5, 7, 4, 8, 6, 9, 7]], ["flame", "総消費", "2,104", "kcal", "--c-kaki", [6, 7, 6, 8, 7, 7, 8]],
    ["moon", "睡眠", "6:40", "", "--c-fuji", [7, 6, 8, 5, 7, 6, 7]], ["drink", "飲酒", "0", "g", "--c-yamabuki", [0, 5, 0, 0, 8, 3, .6]]];
  const MEALS = [["sunrise", "朝食", "トースト・ヨーグルト", 420, "#dfa32b"], ["sun", "昼食", "そば・小鉢", 610, "#2e8fc4"], ["moon", "夕食", "", 0, "#3a4a9c"], ["snack", "間食", "みかん", 60, "#b9528f"]];

  function line(vals, w, h, pad, lo, hi) {
    if (lo == null) { lo = Math.min(...vals); hi = Math.max(...vals); }
    const sx = w / (vals.length - 1);
    const pt = vals.map((v, i) => [i * sx, pad + (h - pad * 2) * (1 - (v - lo) / (hi - lo || 1))]);
    let d = `M${pt[0][0]},${pt[0][1].toFixed(1)}`;
    for (let i = 1; i < pt.length; i++) { const [x0, y0] = pt[i - 1], [x1, y1] = pt[i], mx = (x0 + x1) / 2; d += ` C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`; }
    return { d, pt };
  }

  /* ---- 頭・帯・左の列 ---- */
  function head(seat) {
    const plain = seat === "notes" || seat === "settings";
    const tall = seat === "tasks" && face === "month", month = !plain && (tall || q.get("peek") === "month");
    $("head").classList.toggle("is-month", month && !wide());
    const title = seat === "notes" ? "Notes" : '11月10日<small>火曜日</small>';
    const eye = seat === "notes" ? "128 冊のあいだに" : "2026 ・ 立冬";
    const days = WEEK.map(([w, n, tags], i) => `<div class="wk-d${n === 10 ? " is-today" : ""}${i === 5 ? " is-sat" : i === 6 ? " is-sun" : ""}">
        <div class="wk-top"><span class="wk-w">${w}</span><span class="wk-n">${n}</span></div>
        <div class="wk-tags">${tags.slice(0, mid() ? 3 : 2).map(([t, p]) => `<span class="wk-tag${p ? " is-plan" : ""}">${t}</span>`).join("")}</div></div>`).join("");
    $("head").innerHTML = seat === "settings" ? "" : `<div class="head-sky"></div>
      <div class="head-top"><div class="head-names"><div class="head-eye">${seat === "notes" ? "" : eye}</div><h1 class="head-title">${title}</h1></div>
        ${wide() ? "" : `<button class="head-btn press" aria-label="さがす">${ic("search")}</button>`}<button class="head-btn press" data-go="settings" aria-label="設定">${ic("gear")}</button></div>
      <div class="tray">${plain || (tall && wide()) ? "" : month && !wide() ? monthGrid(tall) : `<div class="wk">${days}</div>`}</div>`;
  }
  function nav(seat) {
    const tabs = SEATS.map(([id, i]) => `<button class="tab press${id === seat ? " is-on" : ""}" data-go="${id}">${ic(i, "tab-ico")}<span>${id}</span>${id === "tasks" ? '<i class="tab-badge">3</i>' : ""}</button>`).join("");
    $("bar").innerHTML = tabs;
    const cal = []; for (let d = 26; d <= 31; d++) cal.push([d, 1]); for (let d = 1; d <= 30; d++) cal.push([d, 0]); for (let d = 1; d <= 6; d++) cal.push([d, 1]);
    $("rail").innerHTML = `<div class="brand"><span class="brand-m">暮</span><b>くらしノート</b></div>
      <button class="rail-find press">${ic("search")}さがす<kbd>Ctrl K</kbd></button>${tabs}
      <div class="rail-sp"></div>
      <div class="card mini"><div class="mini-h"><span>2026年 11月</span><span class="chev">${ic("chevron")}</span></div>
        <div class="mini-g">${"月火水木金土日".split("").map((w) => `<span>${w}</span>`).join("")}${cal.map(([d, out]) => `<i class="${out ? "is-out" : d === 10 ? "is-today" : ""}">${d}</i>`).join("")}</div></div>
      <button class="tab press${seat === "settings" ? " is-on" : ""}" data-go="settings">${ic("gear", "tab-ico")}<span>settings</span></button>`;
    $("fab").innerHTML = ic("plus");
    $("fab").style.display = seat === "settings" ? "none" : "";
    $("bar").style.display = "";
  }

  /* ---- tasks ---- */
  const taskCard = (x) => `<button class="card task press is-${x.kind}" data-sheet="task">${ic(x.ico, "task-ico")}
      <span class="task-main"><span class="task-t">${x.title}</span><span class="task-m"><span>${x.meta}</span></span></span>
      ${x.kind === "act" ? "" : `<span class="check" data-check>${CHECK}</span>`}</button>`;
  function tasks() {
    const pos = (h) => ((h - 5) / 18 * 100).toFixed(2) + "%";
    const strip = `<div class="card strip"><div class="strip-top"><span class="strip-next">次は 14:00 資料をまとめる</span><span class="strip-left">あと3時間30分</span></div>
      <div class="strip-wrap"><div class="strip-bar"><div class="strip-past" style="width:${pos(10.5)}"></div>
        ${TASKS.filter((x) => x.s).map((x) => `<i class="strip-b is-${x.kind}" style="left:${pos(x.s)};width:${(x.m / 60 / 18 * 100).toFixed(2)}%"></i>`).join("")}</div>
        <i class="strip-pin" style="left:${pos(10.5)}"></i></div>
      <div class="strip-tk">${[5, 8, 11, 14, 17, 20, 23].map((h) => `<span>${h}</span>`).join("")}</div></div>`;
    const tl = `<div class="tl">${TASKS.map((x) => x.now ? `<div class="tl-now"><span>いま ${x.now}</span></div>` : x.gap ? `<div class="tl-gap">${x.gap}</div>`
      : `<div class="tl-row"><div class="tl-t">${x.t}</div>${taskCard(x)}</div>`).join("")}</div>`;
    const any = `<div class="sec"><h2 class="sec-t">時刻なし</h2><span class="sec-n">${ANY.length}</span></div>
      <div class="card list">${ANY.map(([t, s]) => `<div class="li"><span class="li-main"><span class="li-t">${t}</span><span class="li-s">${s}</span></span><span class="check" data-check>${CHECK}</span></div>`).join("")}</div>`;
    const tools = `<div class="row-tools"><div class="seg">${[["今日", "today"], ["週", "week"], ["月", "month"]].map(([t, f]) => `<button class="seg-b${f === face ? " is-on" : ""}" data-seg data-face="${f}">${t}</button>`).join("")}</div><span class="sp"></span>
      <button class="chip press">仕事だけ</button></div>`;
    const week = `<div class="sec"><h2 class="sec-t">今週</h2><span class="sec-n">11月9日〜15日</span></div><div class="card list">${WEEK.filter(([, n]) => n >= 10).map(([w, n, tags]) =>
      `<div class="week-row${n === 10 ? " is-today" : ""}"><div class="week-d">${n}<small>${w}</small></div><div>${tags.length ? tags.map(([t, p]) =>
        `<div class="week-i"><i class="dot" style="background:var(${p ? "--c-ai" : "--c-take"})"></i>${t}</div>`).join("") : '<div class="week-i" style="color:var(--c-line-2)">—</div>'}</div></div>`).join("")}</div>`;
    if (face === "month") {
      const list = `<div class="sec"><h2 class="sec-t">11月の予定</h2><span class="sec-n">${Object.keys(MONTH).length}日</span></div><div class="card list">${Object.keys(MONTH).map((d) =>
        `<div class="week-row${+d === 10 ? " is-today" : ""}"><div class="week-d">${d}<small>${WD[(+d + 5) % 7]}</small></div><div>${MONTH[d].map(([t, k, at]) =>
          `<div class="week-i"><i class="dot" style="background:var(${k === "plan" ? "--c-ai" : k === "dead" ? "--c-yamabuki-fill" : "--c-take"})"></i>${at ? `<span class="num">${at}</span>` : ""}${t}</div>`).join("")}</div></div>`).join("")}</div>`;
      return wide() ? `${tools}<div class="cols is-cal"><div class="col"><div class="card month">${monthGrid(true)}</div></div><div class="col">${list}</div></div>` : tools + list;
    }
    return mid() ? `${tools}<div class="cols"><div class="col">${strip}${tl}</div><div class="col">${any}${week}</div></div>` : tools + strip + tl + any;
  }

  /* ---- daily ---- */
  function daily() {
    const kou = `<div class="card kou press"><div class="kou-art" style="background-image:url(img/season/k54.webp)"></div><div class="kou-main">
      <div class="kou-eye">二十四節気　立冬</div><div class="kou-t">山茶始開</div><div class="kou-s">つばきはじめてひらく　11月7日〜11日</div>
      <div class="kou-l">山茶花が咲きはじめるころ</div></div></div>`;
    const acts = `<div class="acts"><button class="card act is-main press"><img src="img/think/diary.webp" alt="">日記に書く</button>
      <button class="card act press"><img src="img/think/note.webp" alt="">ノート</button><button class="card act press"><img src="img/think/think.webp" alt="">思考</button></div>`;
    const chip = (i, t) => `<span class="chip is-soft">${ic(i)}${t}</span>`;
    const log = `<div class="sec"><h2 class="sec-t">Daily Log</h2><span class="sec-n">2026年 11月</span><button class="sec-a">${ic("copy")}</button></div>
      <div class="card list">
        <div class="day is-today"><div class="day-n"><b>10</b><span>火</span></div><div><button class="day-x is-empty press">${ic("edit")}この日のことを書く</button>
          <div class="day-c">${chip("check", "病院の予約")}${chip("book", "試しの本 30分")}</div></div></div>
        <div class="day"><div class="day-n"><b>9</b><span>月</span></div><div><p class="day-x">朝は冷えたので、厚手の上着を出した。昼は近くの公園まで歩いた。</p>
          <div class="day-c">${chip("check", "散歩")}${chip("cart", "牛乳・卵")}</div></div></div>
        <div class="day"><div class="day-n"><b>8</b><span>日</span></div><div><p class="day-x">部屋の片づけ。本棚を一段ぶん整理した。</p>
          <div class="day-c">${chip("check", "掃除")}</div></div></div>
      </div>`;
    const then = `<div class="sec"><h2 class="sec-t">あの日</h2><span class="sec-n">11月10日</span></div>
      <div class="card list"><div class="then"><span class="then-y">2025</span><p class="then-x">初めての道を通って帰った。銀杏がきれいだった。</p></div>
        <div class="then" style="border-top:1px solid var(--c-line)"><span class="then-y">2024</span><p class="then-x">新しい手帳を買った。</p></div></div>`;
    return mid() ? `<div class="cols"><div class="col">${acts}${log}</div><div class="col">${kou}${then}</div></div>` : kou + acts + log + then;
  }

  /* ---- notes ---- */
  function notes() {
    const find = `<div class="search">${ic("search")}ノートをさがす<kbd>Ctrl K</kbd></div>`;
    const stats = `<div class="stats">${[["notes", "128", "すべて"], ["star", "12", "★"], ["thought", "5", "問い"]].map(([i, n, t]) =>
      `<button class="card stat press">${ic(i)}<b>${n}</b><span>${t}</span></button>`).join("")}</div>`;
    const rec = `<div class="sec"><h2 class="sec-t">最近</h2><button class="sec-a">すべて${ic("chevron")}</button></div><div class="hs">${NOTES.map(([t, d, b]) =>
      `<button class="card note press"><div class="note-cv ${t === "旅行の持ち物" ? "" : BOOKS[b][2]}" style="--cv:${BOOKS[b][1]}${t === "旅行の持ち物" ? ";background:url(img/season-photo/k10.webp) center/cover" : ""}"></div><div class="note-b"><div class="note-t">${t}</div><div class="note-d">${BOOKS[b][0]}・${d}</div></div></button>`).join("")}</div>`;
    const shelf = `<div class="sec"><h2 class="sec-t">本棚</h2><span class="sec-n">${BOOKS.length}</span><button class="sec-a">${ic("plus")}</button></div><div class="shelf">${BOOKS.map(([t, c, p, n]) =>
      `<button class="book press"><div class="book-cv ${p}" style="--cv:${c}"><span class="book-lb">${t}</span></div><span class="book-n">${n}</span></button>`).join("")}</div>`;
    const tags = `<div class="sec"><h2 class="sec-t">タグ</h2></div><div class="tags">${["献立", "家", "庭", "買ったもの", "あとで読む", "旅"].map((t) => `<button class="chip press">${ic("tag")}${t}</button>`).join("")}</div>`;
    const list = `<div class="sec"><h2 class="sec-t">くらし</h2><span class="sec-n">42</span></div><div class="card list">${NOTES.slice(0, 4).map(([t, d, b], i) =>
      `<div class="nl"><div><div class="nl-t">${t}</div><div class="nl-x">試しの本文。買うもの、作る順、気づいたこと。</div><div class="note-d">${d}</div></div><div class="nl-cv ${BOOKS[(b + i) % 6][2]}" style="--cv:${BOOKS[(b + i) % 6][1]}"></div></div>`).join("")}</div>`;
    return wide() ? `<div class="cols"><div class="col">${find}${rec}${shelf}${tags}</div><div class="col">${stats}${list}</div></div>` : find + stats + rec + shelf + tags;
  }

  /* ---- shopping ---- */
  function shopping() {
    const n = SHOP.reduce((s, c) => s + c[2].length, 0);
    const tools = `<div class="row-tools"><div class="seg"><button class="seg-b is-on" data-seg>リスト</button><button class="seg-b" data-seg>価格</button></div><span class="sp"></span><span class="sec-n num">${n} 品</span></div>`;
    const cats = SHOP.map(([cat, c, items]) => `<div class="card list"><div class="cat-h"><i class="dot" style="background:${c}"></i>${cat}<span class="sec-n num">${items.length}</span></div>${items.map(([name, store, yen, best, when, fav]) =>
      `<div class="li" data-sheet="task"><span class="tile" style="--tile-bg:color-mix(in srgb, ${c} 13%, var(--c-surface));--tile-ink:${c}">${pic(name)}</span>
        <span class="li-main"><span class="li-t">${name}</span><span class="li-s">${store ? `${store}・${when}` : "値段はまだ"}</span></span>
        <span class="li-end">${yen ? `<div class="price">¥${yen}</div><div class="price-s">${best ? `<span class="crown">${ic("crown")}最安</span>` : ""}</div>` : ""}</span>
        <span class="check" data-check>${CHECK}</span></div>`).join("")}</div>`).join("");
    const got = `<button class="card li press" style="width:100%"><span class="tile">${ic("check")}</span><span class="li-main"><span class="li-t">今日買ったもの</span><span class="li-s">2品</span></span><span class="chev">${ic("chevron")}</span></button>`;
    const cmp = `<div class="sec"><h2 class="sec-t">牛乳</h2><span class="sec-n">お店ごとの値段</span></div><div class="card cmp">${[["スーパー", 198, 1], ["ドラッグストア", 215, 0], ["コンビニ", 258, 0]].map(([s, y, b]) =>
      `<div class="cmp-r${b ? " is-best" : ""}"><span>${s}</span><div class="cmp-b"><i style="width:${y / 258 * 100}%"></i></div><b>¥${y}</b></div>`).join("")}</div>`;
    const soon = `<div class="sec"><h2 class="sec-t">そろそろ</h2></div><div class="tags">${["米", "トイレットペーパー", "しょうゆ"].map((t) => `<button class="chip press">${ic("plus")}${t}</button>`).join("")}</div>`;
    return mid() ? `${tools}<div class="cols"><div class="col">${cats}${got}</div><div class="col">${cmp}${soon}</div></div>` : tools + cats + got;
  }

  /* ---- health ---- */
  function health() {
    const mets = `<div class="mets">${METS.map(([i, t, v, u, c, bars]) => `<button class="card met press" style="--mc:var(${c})"><div class="met-h">${ic(i)}${t}</div>
      <div class="met-v">${v}<small>${u}</small></div><div class="bars">${bars.map((b) => `<i style="height:${Math.max(8, b * 10)}%"></i>`).join("")}</div></button>`).join("")}</div>`;
    const sp = line(KG.map((_, i) => { const a = KG.slice(Math.max(0, i - 3), i + 1); return a.reduce((x, y) => x + y, 0) / a.length; }), 150, 40, 4);
    const kg = `<button class="card hero press"><div class="hero-h">${ic("scale") || ic("trend")}体重</div><div class="hero-v">64.0<small>kg</small></div>
      <div class="hero-s">7日平均 64.0・<b>−0.2</b> /週</div>
      <svg class="spark" viewBox="0 0 150 40" preserveAspectRatio="none"><path d="${sp.d} L150,40 L0,40 Z" fill="var(--c-primary-soft)"/><path d="${sp.d}" fill="none" stroke="var(--c-primary)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></button>`;
    const kcal = `<button class="card hero press"><div class="hero-h">${ic("meal")}食事</div><div class="hero-v">1,090<small>kcal</small></div><div class="hero-s">朝・昼・間食</div>
      <div class="slots">${MEALS.map(([, , , k, c]) => `<i class="${k ? "is-in" : ""}" style="--sc:${c}"></i>`).join("")}</div></button>`;
    const meals = `<div class="sec"><h2 class="sec-t">今日の食事</h2><button class="sec-a">${ic("sparkles")}AI推計</button></div><div class="card list">${MEALS.map(([i, t, x, k, c]) =>
      `<div class="li meal" style="--sc:${c}"><span class="tile">${ic(i)}</span><span class="li-main"><span class="li-t">${t}</span><span class="li-s">${x || "まだ"}</span></span>
        ${k ? `<span class="li-end"><div class="price">${k}</div><div class="price-s">kcal</div></span>` : `<span class="meal-add">${ic("plus")}</span>`}</div>`).join("")}</div>`;
    const urge = `<button class="btn is-tint press" style="width:100%">${ic("clock")}飲みたくなった</button>`;
    const big = line(KG, 320, 150, 14);
    const avg = line(KG.map((_, i) => { const a = KG.slice(Math.max(0, i - 4), i + 1); return a.reduce((x, y) => x + y, 0) / a.length; }), 320, 150, 14, Math.min(...KG), Math.max(...KG));
    const chart = `<div class="card chart"><div class="row-tools"><h2 class="sec-t" style="font-size:17px">体重の推移</h2><span class="sp"></span><div class="seg">${["7日", "30日", "1年"].map((t, i) => `<button class="seg-b${i === 1 ? " is-on" : ""}" data-seg style="min-width:46px;padding:0 8px;height:32px">${t}</button>`).join("")}</div></div>
      <div class="chart-box"><svg viewBox="0 0 320 150" preserveAspectRatio="none">${[20, 62, 104, 146].map((y) => `<line x1="0" x2="320" y1="${y}" y2="${y}" stroke="var(--c-line)" vector-effect="non-scaling-stroke"/>`).join("")}
        <line x1="0" x2="320" y1="128" y2="128" stroke="var(--c-ai)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
        <path d="${avg.d} L320,150 L0,150 Z" fill="var(--c-primary-soft)" opacity=".7"/><path d="${avg.d}" fill="none" stroke="var(--c-primary)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
      <div class="dots">${big.pt.map(([x, y]) => `<i style="left:${(x / 320 * 100).toFixed(1)}%;top:${(y / 150 * 100).toFixed(1)}%"></i>`).join("")}</div></div>
      <div class="strip-tk"><span>10月20日</span><span style="color:var(--c-ai)">目標 62.0</span><span>今日</span></div></div>`;
    if (wide()) return `${mets}<div class="cols is-3"><div class="col"><div class="duo" style="grid-template-columns:1fr">${kg}${kcal}</div>${urge}</div><div class="col">${meals}</div><div class="col">${chart}</div></div>`;
    return mid() ? `${mets}<div class="cols"><div class="col"><div class="duo">${kg}${kcal}</div>${meals}</div><div class="col">${chart}${urge}</div></div>` : `${mets}<div class="duo">${kg}${kcal}</div>${meals}${urge}${chart}`;
  }

  /* ---- settings ---- */
  function settings() {
    const g = (rows) => `<div class="card list">${rows.map(([i, t, s]) => `<div class="li"><span class="tile is-set">${ic(i)}</span><span class="li-main"><span class="li-t">${t}</span><span class="li-s">${s}</span></span><span class="chev">${ic("chevron")}</span></div>`).join("")}</div>`;
    const a = g([["download", "控え", "端末の外の控え・書き出し・復元"]]) + g([["palette", "表示・操作", "明るさ・基調色・文字"], ["bell", "通知・プライバシー", "通知 オフ・ロック オフ"]]);
    const b = `<div class="sec"><h2 class="sec-t">席ごと</h2></div>` + g([["book", "daily", "日記・あの日・季節"], ["notes", "notes", "並び・ノートブック・タグ"], ["checklist", "tasks", "時間割・一日の道"], ["cart", "shopping", "お店・カテゴリ"], ["heart", "health", "目標・中継所"]]);
    return `<div class="set-hero"><h1>Settings</h1><img src="img/set/root.webp" alt=""></div>` + (mid() ? `<div class="cols"><div class="col">${a}</div><div class="col">${b}</div></div>` : a + b);
  }

  /* ---- 紙（やること） ---- */
  function openSheet() {
    const r = $("sheet-root");
    r.innerHTML = `<div class="veil" data-close></div><div class="sheet" style="--k:var(--c-take)"><div class="sheet-top"><div class="grab"></div>
      <div class="row-tools"><button class="round press" data-close aria-label="閉じる">${ic("close")}</button><span class="sp"></span><button class="round press" aria-label="ほか">${ic("more")}</button></div>
      <div class="sheet-id"><span class="sheet-ico">${ic("cart")}</span><div><div class="sheet-when num">今日 17:00</div><div class="sheet-t">買い物へ行く</div></div></div></div>
      <div class="sheet-body"><div class="row-tools"><div class="seg"><button class="seg-b is-on" data-seg>やること</button><button class="seg-b" data-seg>予定</button></div><span class="sp"></span>
        <div class="seg"><button class="seg-b" data-seg>仕事</button><button class="seg-b is-on" data-seg>くらし</button></div></div>
        <div class="card list">${[["calendar", "11月10日（火）", "今日"], ["clock", "17:00 〜 17:30", "30分"], ["repeat", "くりかえし", "なし"]].map(([i, t, s]) =>
          `<div class="fr">${ic(i)}<b>${t}</b><span>${s}</span><span class="chev">${ic("chevron")}</span></div>`).join("")}</div>
        <div class="card list"><div class="fr">${ic("plus")}<b>手順を足す</b></div></div>
        <div class="card memo">メモ、持ちもの、電話番号…</div>
        <button class="btn is-main press" data-close>保存</button></div></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add("is-open")));
  }
  function closeSheet() { const r = $("sheet-root"); r.classList.remove("is-open"); setTimeout(() => { if (!r.classList.contains("is-open")) r.innerHTML = ""; }, 440); }

  /* ---- 流れ ---- */
  const VIEWS = { daily, notes, tasks, shopping, health, settings };
  let cur = "";
  function show(seat, still) {
    if (!VIEWS[seat]) seat = "tasks";
    cur = seat;
    head(seat); nav(seat);
    const p = $("page");
    p.innerHTML = VIEWS[seat]();
    p.classList.remove("is-in");
    if (!still) { void p.offsetWidth; p.classList.add("is-in"); }
    $("stage").scrollTop = 0;
    if (location.hash.slice(1) !== seat) history.replaceState(null, "", "#" + seat + location.search);
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-check],[data-go],[data-seg],[data-close],[data-sheet],#fab");
    if (!t) return;
    if (t.matches("[data-check]")) { e.stopPropagation(); t.classList.toggle("is-done"); const row = t.closest(".task"); if (row) row.classList.toggle("is-done"); return; }
    if (t.matches("[data-go]")) return show(t.dataset.go);
    if (t.matches("[data-face]")) { face = t.dataset.face === "month" ? "month" : "today"; return show(cur, true); }
    if (t.matches("[data-seg]")) { t.parentNode.querySelectorAll(".seg-b").forEach((b) => b.classList.toggle("is-on", b === t)); return; }
    if (t.matches("[data-close]")) return closeSheet();
    openSheet();
  });
  let w = innerWidth;
  addEventListener("resize", () => { if (innerWidth !== w) { w = innerWidth; show(cur, true); } });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "tasks", true);
  if (q.get("sheet")) openSheet();
})();
</script>
</body>
</html>
