<title>季節の絵を見比べる — くらしノート</title>
<!--
  一時の見比べ（3.0 の E1・docs/season-art.md）。同じ日の daily の紙に、広重（img/season/）と写真
  （img/season-photo/）を同じ敷き方で並べる。どちらにするか決めたら消す。
  アプリの一部ではない（sw.js の ASSETS にも build-standalone.js にも載せない）。store も触らない。
  紙の層は css/screens.css の「季節の絵」と同じ（候の色のぼかし・紙の色の幕・絵・紙の色）。
-->
<link rel="stylesheet" href="../css/base.css">
<style>
  html, body { height: auto; overflow: auto; position: static; overscroll-behavior: auto; }
  body { margin: 0; background: var(--c-bg); color: var(--c-text); font-family: var(--font, system-ui, sans-serif);
         padding: max(12px, env(safe-area-inset-top)) 10px 40px; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bar input[type=date] { font: inherit; font-size: 16px; padding: 6px 8px; border-radius: 10px;
         border: 1px solid var(--c-border, #ccc); background: var(--c-surface, #fff); color: inherit; }
  button { font: inherit; font-size: 17px; padding: 6px 12px; border-radius: 10px; border: 0;
           background: var(--c-surface-2, #e6e6ea); color: inherit; }
  button[aria-pressed=true] { background: var(--c-text); color: var(--c-bg); }
  .kou { font-size: 15px; color: var(--c-text-2, #666); margin: 0 2px 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pane h2 { font-size: 17px; margin: 0 0 4px 4px; }
  .sheet { --c: transparent; --img: none; --alpha: 24%; --tint: 38%;
    --veil: color-mix(in srgb, var(--c-sheet) calc(100% - var(--alpha)), transparent);
    aspect-ratio: 9 / 16; border-radius: 22px 22px 0 0; overflow: hidden; padding: 18px 12px;
    background:
      linear-gradient(to bottom, color-mix(in srgb, var(--c) var(--tint), transparent), transparent 55%),
      linear-gradient(to bottom, var(--veil) 0, var(--veil) 40%, var(--c-sheet) 85%),
      var(--img) center top / cover no-repeat,
      var(--c-sheet); }
  .raw .sheet { background: var(--img) center / cover no-repeat, var(--c-sheet); }
  .raw .sheet > * { visibility: hidden; }
  .sheet .d { font-size: 20px; white-space: nowrap; font-weight: 700; letter-spacing: .02em; }
  .sheet .s { font-size: 12px; color: var(--c-text-2, #666); margin: 4px 0 18px; }
  .sheet .ln { height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--c-text) 22%, transparent); margin: 12px 0; }
  .cr { font-size: 12px; line-height: 1.45; color: var(--c-text-2, #666); margin: 6px 4px 0; word-break: break-all; }
  .cr a { color: inherit; }
  label.al { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 12px 2px; }
  label.al input { flex: 1; }
  .all { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
  .all button { padding: 4px; background: var(--c-surface, #fff); text-align: left; font-size: 12px; }
  .all button[aria-current=true] { outline: 3px solid var(--c-text); }
  .all .two { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .all img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; border-radius: 6px; }
  :root { color-scheme: light dark; }
</style>
</head>
<body>
<div class="bar">
  <button id="prev" aria-label="前の候">‹</button>
  <input type="date" id="day">
  <button id="next" aria-label="次の候">›</button>
  <button id="today">今日</button>
  <button id="raw" aria-pressed="false">そのまま</button>
</div>
<div class="kou" id="kou"></div>
<div class="pair" id="pair">
  <div class="pane"><h2>広重</h2><div class="sheet" id="sa"></div><div class="cr" id="ca"></div></div>
  <div class="pane"><h2>写真</h2><div class="sheet" id="sb"></div><div class="cr" id="cb"></div></div>
</div>
<label class="al">濃さ <input type="range" id="alpha" min="6" max="70" value="24"> <span id="av">24%</span></label>
<div class="all" id="all"></div>

<script src="../js/season.js"></script>

    ["Japan Alps at Spring (skyseeker) 001","Kazuhiko Teramoto from JAPAN","CC BY 2.0","https://commons.wikimedia.org/wiki/File:Japan_Alps_at_Spring_(skyseeker)_001.jpg","春の日本アルプス。残る雪"],
    ["Cherry and peach blossoms at rinrin road - panoramio","Toshihiro Matsui","CC BY-SA 3.0","https://commons.wikimedia.org/wiki/File:Cherry_and_peach_blossoms_at_rinrin_road_-_panoramio.jpg","桃と桜の並木（りんりんロード）"],
    ["桜と菜の花と青空と (Cherry blossoms and Rape seeds under Blue sky) 06 Apr, 2014 - panoramio","Hiroaki Kaneko","CC BY-SA 3.0","https://commons.wikimedia.org/wiki/File:%E6%A1%9C%E3%81%A8%E8%8F%9C%E3%81%AE%E8%8A%B1%E3%81%A8%E9%9D%92%E7%A9%BA%E3%81%A8_(Cherry_blossoms_and_Rape_seeds_under_Blue_sky)_06_Apr,_2014_-_panoramio.jpg","菜の花と桜"]];

  const S = KN.season, A = KN.seasonArt;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const WD = "日月火水木金土";

  /* 候 k の初日（今日から前後一年で探す） */
  function firstDayOf(k, from) {
    const base = parse(from);
    for (let i = -190; i <= 190; i++) {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
      const r = S.of(key(d));
      if (r && r.k === k && r.first) return key(d);
    }
    return from;
  }

  function sheet(el, day, file) {
    const d = parse(day), r = S.of(day);
    el.style.setProperty("--c", A.colorOf(r.k));
    el.style.setProperty("--img", `url("${new URL("../" + file, location.href).href}")`);
    el.innerHTML = `<div class="d">${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）</div>
      <div class="s">${esc(S.line(day))}</div>` + '<div class="ln"></div>'.repeat(9);
  }

  let day = key(new Date());
  function render() {
    const r = S.of(day), k = r.k, nn = pad(k);
    $("day").value = day;
    $("kou").textContent = `${nn}　${S.line(day)}`;
    sheet($("sa"), day, `img/season/k${nn}.webp`);
    sheet($("sb"), day, `img/season-photo/k${nn}.webp`);
    const a = A.ART[k], p = PHOTO[k];
    $("ca").innerHTML = `${esc(a.title)}<br>${esc(a.author)}・${esc(a.holder)}<br>${esc(a.why)}`;
    $("cb").innerHTML = p ? `${esc(p[0])}<br>${esc(p[1])}・${esc(p[2])}<br>${esc(p[4])}<br><a href="${esc(p[3])}">Commons</a>` : "";
    document.querySelectorAll(".all button").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.k === k)));
  }

  const step = (dir) => { day = firstDayOf((S.of(day).k + dir + 72) % 72, day); render(); };
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("today").onclick = () => { day = key(new Date()); render(); };
  $("day").onchange = (e) => { if (e.target.value) { day = e.target.value; render(); } };
  $("raw").onclick = (e) => {
    const on = e.target.getAttribute("aria-pressed") !== "true";
    e.target.setAttribute("aria-pressed", String(on));
    $("pair").classList.toggle("raw", on);
  };
  $("alpha").oninput = (e) => {
    $("av").textContent = e.target.value + "%";
    document.querySelectorAll(".sheet").forEach((s) => s.style.setProperty("--alpha", e.target.value + "%"));
  };

  /* 72候の一覧（左が広重・右が写真）。押すとその候の初日へ。 */
  const today = key(new Date());
  $("all").innerHTML = Array.from({ length: 72 }, (_, k) => `<button data-k="${k}">
      <div class="two"><img loading="lazy" src="../img/season/k${pad(k)}.webp" alt=""><img loading="lazy" src="../img/season-photo/k${pad(k)}.webp" alt=""></div>
      ${pad(k)} ${esc(S.KOU[k][0])}</button>`).join("");
  $("all").onclick = (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    day = firstDayOf(+b.dataset.k, today); render(); scrollTo({ top: 0, behavior: "smooth" });
  };

  /* 暗い色では、アプリと同じく薄く（css/screens.css の 14%） */
  if (matchMedia("(prefers-color-scheme: dark)").matches) {
    $("alpha").value = 14; $("alpha").dispatchEvent(new Event("input"));
    document.querySelectorAll(".sheet").forEach((s) => s.style.setProperty("--tint", "14%"));
  }
  render();
})();
</script>
</body>
</html>
