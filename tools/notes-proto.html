<!doctype html>
<!--
  ノートの見本（tools/notes-proto.html）。
  Notion・Evernote から移るかを決める前に、iPad・パソコン・iPhone で「階層・検索・見やすさ・表・書き出し」を
  触って確かめるための一回きりのページ。アプリ本体には入らない（index.html・sw.js・build-standalone.js に載せない）。
  ・中身は偽物。決まった種から毎回同じものを作る。?n=30000 で数を変えられる（200〜30000、ふだんは3000）。
  ・本物のデータ（localStorage・IndexedDB・キャッシュ）には読みも書きもしない。直したものは記憶の中だけで、
    閉じると消える。同じ場所（同じ origin）にアプリの記録があるので、保存の道具は一つも呼ばないこと。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>ノート — 見本</title>
<style>
:root {
  --bg: #f0eff3;
  --side: #f6f5f8;
  --surface: #ffffff;
  --surface-2: #e8e8e8;
  --text: #111113;
  --text-2: #636363;
  --border: #e4e4e8;
  --border-2: #cfcfd6;
  --primary: #b84944;
  --accent: #2072ab;
  --hover: rgba(17, 17, 19, .05);
  --sel: rgba(184, 73, 68, .10);
  --mark: rgba(215, 154, 74, .32);
  --shadow: 0 10px 40px rgba(0, 0, 0, .16);
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic Medium", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
  --side-w: 288px;
  --page-w: 720px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121216; --side: #16161b; --surface: #1c1c22; --surface-2: #26262d;
    --text: #ececed; --text-2: #a6a6ab; --border: #2e2e36; --border-2: #45454f;
    --primary: #f2938e; --accent: #6fb6e8;
    --hover: rgba(255, 255, 255, .06); --sel: rgba(242, 147, 142, .14); --mark: rgba(215, 154, 74, .38);
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); font-size: 16px; color: var(--text); background: var(--surface);
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; text-align: inherit; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.lab { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); }

/* ---------- 骨組み ---------- */
.shell { display: flex; height: 100vh; height: 100dvh; }
.side { width: var(--side-w); flex: none; background: var(--side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: calc(16px + env(safe-area-inset-top)) 18px 8px; }
.side-name { font-weight: 700; font-size: 17px; }
.find-btn { display: flex; align-items: center; gap: 8px; margin: 4px 12px 6px; padding: 8px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2); font-size: 15px; }
.find-btn kbd { margin-left: auto; font: 12px var(--font); color: var(--text-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 1px 6px; }
.tree { flex: 1; overflow-y: auto; padding: 2px 8px 16px; overscroll-behavior: contain; }
.side-label { font-size: 12.5px; color: var(--text-2); padding: 14px 10px 4px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 6px; min-height: 32px; border-radius: 8px; cursor: pointer;
  padding: 0 8px 0 calc(4px + var(--d, 0) * 16px); font-size: 14.5px; user-select: none; -webkit-user-select: none; }
.row .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row.is-current { background: var(--sel); font-weight: 600; }
.row.nb-row { font-weight: 600; }
.row.more .name { color: var(--text-2); }
.row-ic { width: 17px; height: 17px; color: var(--text-2); }
.twist, .twist-pad { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 6px; color: var(--text-2); }
.twist .ic { width: 15px; height: 15px; transition: transform .16s ease; }
.twist.is-open .ic { transform: rotate(90deg); }
.side-foot { padding: 6px 10px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
.foot-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border-radius: 8px;
  color: var(--text-2); font-size: 14.5px; }
.scrim { display: none; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.bar { flex: none; display: flex; align-items: center; gap: 2px; min-height: calc(52px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); }
.ib { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px; color: var(--text-2); }
.ib .ic { width: 22px; height: 22px; }
.ib.is-on { color: var(--primary); }
.ib.is-on .ic { fill: currentColor; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
.crumb { flex: 0 1 auto; min-width: 2.5em; max-width: 220px; padding: 6px 6px; border-radius: 6px; font-size: 14px;
  color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb:last-child { color: var(--text); font-weight: 600; }
.crumb-sep { flex: none; color: var(--text-2); opacity: .55; font-size: 13px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.page { --pad: 56px; max-width: calc(var(--page-w) + var(--pad) * 2); margin: 0 auto;
  padding: 28px var(--pad) calc(40vh + env(safe-area-inset-bottom)); }

/* ---------- ノート ---------- */
.title { display: block; width: 100%; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent;
  color: var(--text); font: 700 34px/1.3 var(--font); padding: 0; margin: 0 0 10px; }
.title::placeholder, .doc-edit::placeholder { color: var(--text-2); opacity: .5; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--text-2); font-size: 14px; margin: 0 0 28px; }
.doc, .doc-edit { font-size: 17px; line-height: 1.85; }
.doc { min-height: 3.6em; cursor: text; overflow-wrap: anywhere; }
.doc.is-empty { min-height: 30vh; }
.doc > * { margin: 0; }
.doc .blank { height: .9em; }
.doc .h1 { font-size: 1.45em; font-weight: 700; line-height: 1.45; margin: 1.1em 0 .25em; }
.doc .h2 { font-size: 1.2em; font-weight: 700; line-height: 1.5; margin: 1em 0 .2em; }
.doc .h3 { font-size: 1.04em; font-weight: 700; margin: .8em 0 .1em; }
.doc > :first-child { margin-top: 0; }
.doc .li, .doc .ol, .doc .check { position: relative; padding-left: calc(1.6em + var(--i, 0) * 1.5em); }
.doc .li::before { content: ""; position: absolute; left: calc(.6em + var(--i, 0) * 1.5em); top: .8em;
  width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .75; }
.doc .ol .num { position: absolute; left: calc(var(--i, 0) * 1.5em); width: 1.3em; text-align: right;
  color: var(--text-2); font-variant-numeric: tabular-nums; }
.doc .check .box { position: absolute; left: calc(.12em + var(--i, 0) * 1.5em); top: .4em; width: 1.05em; height: 1.05em;
  border: 1.6px solid var(--text-2); border-radius: 5px; }
.doc .check.is-done .tx { color: var(--text-2); text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--text-2) 55%, transparent); }
.doc .check.is-done .box { background: var(--primary); border-color: var(--primary); }
.doc .check.is-done .box::after { content: ""; position: absolute; left: 31%; top: 10%; width: 30%; height: 56%;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.doc .quote { border-left: 3px solid var(--border-2); padding-left: 14px; color: var(--text-2); }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 1.1em 0; }
.doc strong { font-weight: 700; }
.lnk { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.doc-edit { display: block; width: 100%; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent;
  color: var(--text); font-family: var(--font); padding: 0; min-height: 30vh; }
.mirror { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: pre-wrap; overflow-wrap: anywhere; padding: 0; }

.kids { margin-top: 44px; border-top: 1px solid var(--border); padding-top: 14px; }
.kids-label, .sec-label { font-size: 13px; color: var(--text-2); font-weight: 600; margin: 0 0 6px; }
.sec-label { margin: 30px 0 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 10px; cursor: pointer; width: 100%; }
.item .item-ic { width: 19px; height: 19px; color: var(--text-2); }
.item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .nm { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .path { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .when { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.item.more .nm { color: var(--text-2); }

/* ---------- 入口 ---------- */
.home-title { display: flex; align-items: center; gap: 12px; font: 700 34px/1.3 var(--font); margin: 0 0 18px; }
.home-title .dot { width: 14px; height: 14px; }
.home-find { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 14px;
  background: var(--bg); color: var(--text-2); font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 14px; min-height: 86px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface); }
.card .card-ic { width: 19px; height: 19px; color: var(--text-2); }
.card .nm { font-weight: 600; font-size: 15.5px; line-height: 1.45; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .path { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.nb { min-height: 0; padding: 16px; font-weight: 600; }

/* ---------- 表 ---------- */
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; margin: 0 0 12px; }
.seg button { padding: 6px 16px; border-radius: 8px; font-size: 14px; color: var(--text-2); }
.seg button.is-on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.tbl-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
.tbl-scroll table { border-collapse: collapse; width: 100%; font-size: 15px; }
.tbl-scroll th { text-align: left; font-weight: 600; font-size: 13.5px; color: var(--text-2); background: var(--side);
  padding: 10px 12px; white-space: nowrap; cursor: pointer; user-select: none; -webkit-user-select: none; }
.tbl-scroll td { padding: 10px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
.tbl-scroll .r { text-align: right; font-variant-numeric: tabular-nums; }
.arrow { margin-left: 4px; color: var(--primary); }
.cards .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.cards .kv .k { color: var(--text-2); }

/* ---------- さがす ---------- */
.finder { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: flex-start;
  padding-top: 11vh; background: rgba(0, 0, 0, .28); }
.finder-box { width: min(660px, 100% - 32px); max-height: 72vh; display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.finder-top { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--border); }
.finder-top > .ic { color: var(--text-2); }
#q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 18px var(--font); padding: 10px 0; }
#q::-webkit-search-cancel-button { display: none; }
.results { overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
.res { padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.res.is-active { background: var(--sel); }
.res-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15.5px; }
.res-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-ic { width: 17px; height: 17px; color: var(--text-2); }
.res-path { font-size: 12.5px; color: var(--text-2); margin: 2px 0 0 25px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-snip { font-size: 13.5px; color: var(--text-2); margin: 3px 0 0 25px; line-height: 1.55; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.res-none { padding: 18px 12px; color: var(--text-2); }
mark { background: var(--mark); color: inherit; border-radius: 3px; }

@media (hover: hover) {
  .row:hover, .item:hover, .foot-btn:hover, .crumb:hover, .ib:hover, .twist:hover, .res:hover { background: var(--hover); }
  .row.is-current:hover, .res.is-active:hover { background: var(--sel); }
  .card:hover { border-color: var(--border-2); }
}
@media (hover: none) { .find-btn kbd { display: none; } }
@media (pointer: coarse) {
  .row { min-height: 40px; font-size: 16px; }
  .ib { width: 44px; height: 44px; }
}
@media (min-width: 900px) {
  .shell.is-collapsed .side { display: none; }
}
@media (max-width: 899.98px) {
  .side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(86vw, 340px);
    transform: translateX(-102%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow); }
  .shell.is-drawer .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 29; background: rgba(0, 0, 0, .28);
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .shell.is-drawer .scrim { opacity: 1; pointer-events: auto; }
  .page { --pad: 36px; }
  .title, .home-title { font-size: 30px; }
}
@media (max-width: 599.98px) {
  .page { --pad: 20px; padding-top: 14px; }
  .title, .home-title { font-size: 26px; }
  .crumb { max-width: 130px; }
  .cards { grid-template-columns: 1fr 1fr; }
  .finder { padding: 0; align-items: stretch; }
  .finder-box { width: 100%; max-height: none; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="ノートの一覧">
    <div class="side-head"><span class="side-name">ノート</span><span class="chip">見本</span></div>
    <button class="find-btn" id="side-find" type="button"><i data-ic="search"></i>さがす<kbd id="kbd">Ctrl K</kbd></button>
    <div class="tree" id="tree" role="tree"></div>
    <div class="side-foot"><button class="foot-btn" id="export" type="button"><i data-ic="down"></i>書き出し</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="bar">
      <button class="ib" id="menu" type="button" aria-label="一覧"><i data-ic="menu"></i></button>
      <nav class="crumbs" id="crumbs" aria-label="道すじ"></nav>
      <button class="ib" id="find" type="button" aria-label="さがす"><i data-ic="search"></i></button>
      <button class="ib" id="fav" type="button" aria-label="★" aria-pressed="false"><i data-ic="star"></i></button>
      <button class="ib" id="add" type="button" aria-label="中にノートを足す"><i data-ic="plus"></i></button>
    </header>
    <div class="scroll" id="scroll"><div class="page" id="page"></div></div>
  </main>
</div>
<div class="finder" id="finder" hidden>
  <div class="finder-box" role="dialog" aria-label="さがす">
    <div class="finder-top">
      <i data-ic="search"></i>
      <input id="q" type="search" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="さがす">
      <button class="ib" id="q-close" type="button" aria-label="閉じる"><i data-ic="close"></i></button>
    </div>
    <div class="results" id="results" role="listbox"></div>
  </div>
</div>
<script>
(() => {
  "use strict";

  /* ---------- 道具 ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  function el(tag, a, ...kids) {
    const e = document.createElement(tag);
    if (a) for (const k in a) {
      const v = a[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
    return e;
  }
  const ICON = {
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
    star: '<path d="M12 3.8l2.5 5.1 5.6.8-4.05 3.95.95 5.6L12 16.6l-5 2.65.95-5.6L3.9 9.7l5.6-.8z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chev: '<path d="M9.5 6l6 6-6 6"/>',
    doc: '<path d="M6.5 3.5h7.5l4 4v12.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 12.5h6M9 16h4"/>',
    grid: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M10 10v9"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    down: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
  };
  function icon(name, cls) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    s.setAttribute("class", "ic" + (cls ? " " + cls : ""));
    s.innerHTML = ICON[name];
    return s;
  }
  $$("i[data-ic]").forEach((i) => i.replaceWith(icon(i.dataset.ic)));

  const COLORS = ["#5ea55a", "#d4695f", "#d79a4a", "#5b9bd5", "#4fb3c4", "#9b7ede", "#48b39a", "#e07fa8"];
  function hashColor(name) {
    let h = 0;
    for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  /* かな畳み：全角半角・大小文字・カタカナとひらがなを同じに見る */
  const fold = (s) => String(s).normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const p2 = (x) => String(x).padStart(2, "0");
  const jDate = (t) => { const d = new Date(t); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
  const shortDate = (t) => {
    const d = new Date(t);
    return d.getFullYear() === new Date().getFullYear() ? `${d.getMonth() + 1}月${d.getDate()}日` : jDate(t);
  };
  const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
  function iso(t) {
    const d = new Date(t), off = -d.getTimezoneOffset(), a = Math.abs(off);
    return `${ymd(t)}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}${off >= 0 ? "+" : "-"}${p2(Math.floor(a / 60))}:${p2(a % 60)}`;
  }
  const lab = (color, text) => el("span", { class: "lab" }, el("span", { class: "dot", style: "background:" + color }), text);
  const wide = () => matchMedia("(min-width: 900px)").matches;
  function grow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

  /* ---------- 偽のノート（決まった種から。毎回同じ形） ---------- */
  function rng(a) {
    return () => {
      a = (a + 0x6D2B79F5) | 0;

  /* ---------- 本文：読むときは整え、押した字から書く ---------- */
  const LINE = /^( *)(#{1,3} |[-*] \[[ xX]\] |[-*] |\d+\. |> )?(.*)$/;

      if (m[1] != null) host.append(el("strong", { text: m[1] }));
      else {

  }

    const k = S.kids.get(keyOf(n));
    if (k) k.splice(k.indexOf(n.id), 1);
    S.notes.splice(S.notes.lastIndexOf(n), 1);
    S.treeBuilt = false;
  }
  function leave() {
    const n = S.cur && S.byId.get(S.cur);
    if (n && n.isNew) { if (!n.title.trim() && !n.body.trim()) drop(n); else delete n.isNew; }
  }
  function go(id, opt = {}) {
    if (S.editing) S.editing.ta.blur();
    if (S.editing) endEdit();
    leave();
    S.cur = id || null;
    if (S.cur && !S.cur.startsWith("nb:") && !S.byId.has(S.cur)) S.cur = null;
    if (opt.push !== false) history.pushState(null, "", S.cur ? "#/" + encodeURIComponent(S.cur) : "#/");
    render();
    $("#scroll").scrollTop = 0;
    if (!wide()) setDrawer(false);
  }
  addEventListener("popstate", () => go(fromHash(), { push: false }));
  function setDrawer(v) { S.drawer = v; $("#shell").classList.toggle("is-drawer", v); }
  function addNote() {
    let notebook = NB[0].name, parent = null;
    const cur = S.cur && S.byId.get(S.cur);
    if (S.cur && !cur) notebook = S.cur.slice(3);
    else if (cur) {
      notebook = cur.notebook;
      parent = cur.isNew && !cur.title.trim() && !cur.body.trim() ? cur.parent : cur.id;
    }
    const p = parent && S.byId.get(parent);
    const n = add({ notebook, parent, createdAt: Date.now(), updatedAt: Date.now(), depth: p ? p.depth + 1 : 0 }, true);
    n.isNew = true;
    index(n);
    S.open.add(parent || "nb:" + notebook);
    S.treeBuilt = false;
    go(n.id);
    const t = $("#page .title");
    if (t) t.focus();
  }
  $("#menu").addEventListener("click", () => (wide() ? $("#shell").classList.toggle("is-collapsed") : setDrawer(!S.drawer)));
  $("#scrim").addEventListener("click", () => setDrawer(false));
  $("#add").addEventListener("click", addNote);
  $("#fav").addEventListener("click", () => {
    const n = S.byId.get(S.cur);
    if (!n) return;
    n.fav = !n.fav;
    renderTree();
    render();
  });

  /* ---------- さがす ---------- */
  let results = [], active = 0;
  function search(terms) {
    const out = [];
    for (const n of S.notes) {
      let ok = true, inTitle = true;
      for (const t of terms) {
        if (n._t.includes(t)) continue;
        inTitle = false;
        if (!n._b.includes(t)) { ok = false; break; }
      }
      /* 題に当たる＞題の頭で当たる・中にノートを持つ（旅や会議の入口）＞本文だけ。同じなら新しい順 */
      if (ok) out.push({ n, s: (inTitle ? 4 : 0) + (n._t.startsWith(terms[0]) ? 1 : 0) + (n._t === terms.join(" ") ? 4 : 0)
        + (S.kids.has(n.id) && S.kids.get(n.id).length ? 1.5 : 0) });
    }
    out.sort((a, b) => b.s - a.s || b.n.updatedAt - a.n.updatedAt);
    return out.slice(0, 60).map((x) => x.n);
  }
  function hl(text, terms) {
    const frag = document.createDocumentFragment();
    if (!terms.length) { frag.append(text); return frag; }
    const chars = Array.from(text), map = [];
    let fs = "";
    chars.forEach((c, i) => { const f = fold(c); for (let j = 0; j < f.length; j++) map.push(i); fs += f; });
    const on = new Array(chars.length).fill(false);
    for (const t of terms) for (let p = fs.indexOf(t); p !== -1; p = fs.indexOf(t, p + t.length)) for (let k = p; k < p + t.length; k++) on[map[k]] = true;
    let buf = "", cur = false;
    const flush = () => { if (buf) frag.append(cur ? el("mark", { text: buf }) : buf); buf = ""; };
    chars.forEach((c, i) => { if (on[i] !== cur) { flush(); cur = on[i]; } buf += c; });
    flush();
    return frag;
  }
  function snippet(n, terms) {
    const p = plain(n), f = fold(p);
    let i = -1;
    for (const t of terms) if ((i = f.indexOf(t)) >= 0) break;
    if (i < 0) return p.slice(0, 90);
    const a = Math.max(0, i - 20);
    return (a ? "…" : "") + p.slice(a, a + 110);
  }
  function runSearch() {
    const t0 = performance.now();
    const terms = fold($("#q").value).split(/\s+/).filter(Boolean);
    results = terms.length ? search(terms) : S.notes.slice().sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 12);
    window.__proto.searchMs = performance.now() - t0;
    active = 0;
    const frag = document.createDocumentFragment();
    results.forEach((n, i) => frag.append(el("div", { class: "res" + (i ? "" : " is-active"), role: "option", "data-i": i },
      el("div", { class: "res-title" }, icon(n.table ? "grid" : "doc", "res-ic"), el("span", null, hl(nameOf(n), terms))),
      el("div", { class: "res-path", text: pathText(n) }),
      terms.length ? el("div", { class: "res-snip" }, hl(snippet(n, terms), terms)) : null)));
    if (!results.length) frag.append(el("div", { class: "res-none", text: "なし" }));
    $("#results").replaceChildren(frag);
    $("#results").scrollTop = 0;
  }
  function openFinder() {
    if (S.editing) S.editing.ta.blur();
    setDrawer(false);
    $("#finder").hidden = false;
    const q = $("#q");
    q.value = "";
    q.focus();
    runSearch();
  }
  function closeFinder() { $("#finder").hidden = true; }
  function move(d) {
    if (!results.length) return;
    active = (active + d + results.length) % results.length;
    const items = $("#results").children;
    [...items].forEach((x, i) => x.classList.toggle("is-active", i === active));
    items[active].scrollIntoView({ block: "nearest" });
  }
  function choose(i) { const n = results[i]; if (!n) return; closeFinder(); go(n.id); }
  $("#q").addEventListener("input", runSearch);
  $("#q").addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") { e.preventDefault(); choose(active); }
    else if (e.key === "Escape") { e.preventDefault(); closeFinder(); }
  });
  $("#results").addEventListener("click", (e) => { const r = e.target.closest(".res"); if (r) choose(+r.dataset.i); });
  $("#finder").addEventListener("click", (e) => { if (e.target.id === "finder") closeFinder(); });
  $("#q-close").addEventListener("click", closeFinder);
  $("#side-find").addEventListener("click", openFinder);
  $("#find").addEventListener("click", openFinder);
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "k") {
      e.preventDefault();
      $("#finder").hidden ? openFinder() : closeFinder();
    } else if (e.key === "Escape" && !e.isComposing) {
      if (!$("#finder").hidden) closeFinder();
      else if (S.drawer) setDrawer(false);
      else if (S.editing) S.editing.ta.blur();
    }
  });
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || "") || /Macintosh/.test(navigator.userAgent);
  $("#kbd").textContent = mac ? "⌘K" : "Ctrl K";

  /* ---------- 書き出し：ノートブックと階層はフォルダ、1件ずつ .md（表は .csv も） ---------- */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {
    const enc = new TextEncoder(), parts = [], central = [], d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const h = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4], [18, size, 4],
        [22, size, 4], [26, name.length, 2], [28, 0, 2]].forEach(([o, v, n]) => (n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true)));
      parts.push(h, name, f.data);
      const c = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4],
        [20, size, 4], [24, size, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4],
        [42, offset, 4]].forEach(([o, v, n]) => (n === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true)));
      central.push(c, name);
      offset += 30 + name.length + size;
    }
    const cd = central.reduce((s, p) => s + p.byteLength, 0), e = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cd, 4], [16, offset, 4],
      [20, 0, 2]].forEach(([o, v, n]) => (n === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true)));
    return new Blob([...parts, ...central, e], { type: "application/zip" });
  }
  function exportZip() {
    const enc = new TextEncoder(), files = [], used = new Map();
    const safe = (s) => s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "・").trim().slice(0, 60).replace(/[. ]+$/, "") || "無題";
    const uniq = (dir, base) => {
      let set = used.get(dir);
      if (!set) used.set(dir, (set = new Set()));
      let name = base;
      for (let i = 2; set.has(name.toLowerCase()); i++) name = `${base} (${i})`;
      set.add(name.toLowerCase());
      return name;
    };
    const front = (n) => ["---", `title: ${JSON.stringify(n.title)}`, `id: ${n.id}`, `created: ${iso(n.createdAt)}`,
      `updated: ${iso(n.updatedAt)}`, `notebook: ${JSON.stringify(n.notebook)}`, n.parent ? `parent: ${n.parent}` : null,
      n.tags.length ? `tags: [${n.tags.map((t) => JSON.stringify(t)).join(", ")}]` : null, n.fav ? "favorite: true" : null,
      "---", ""].filter((x) => x != null).join("\n");
    const csv = (t) => "﻿" + [t.cols.map((c) => c[0]), ...t.rows].map((r) => r.map((v) => {
      const s = String(v);
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(",")).join("\r\n") + "\r\n";
    const walk = (key, dir) => {
      for (const id of S.kids.get(key) || []) {
        const n = S.byId.get(id), base = uniq(dir, safe(nameOf(n)));
        let text = front(n) + (n.title ? `# ${n.title}\n\n` : "") + n.body + "\n";
        if (n.table) {
          files.push({ name: `${dir}/${base}.csv`, data: enc.encode(csv(n.table)) });
          text = front(n) + `# ${n.title}\n\n` + (n.body ? n.body + "\n\n" : "") + `[${base}.csv](${encodeURIComponent(base)}.csv)\n`;
        }
        files.push({ name: `${dir}/${base}.md`, data: enc.encode(text) });
        if ((S.kids.get(id) || []).length) walk(id, `${dir}/${base}`);
      }
    };
    for (const nb of NB) walk("nb:" + nb.name, safe(nb.name));
    const a = el("a", { href: URL.createObjectURL(zip(files)), download: `notes-sample-${ymd(Date.now())}.zip` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    window.__proto.exported = files.length;
  }
  $("#export").addEventListener("click", exportZip);

  /* ---------- 始まり ---------- */
  const N = Math.min(30000, Math.max(200, parseInt(new URLSearchParams(location.search).get("n"), 10) || 3000));
  window.__proto = { S };
  const t0 = performance.now();
  generate(N);
  S.notes.forEach(index);
  window.__proto.genMs = performance.now() - t0;
  S.cur = fromHash();
  render();
})();
</script>
</body>
</html>
