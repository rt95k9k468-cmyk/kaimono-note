<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>かいものノート</title>
<meta name="description" content="買い物リストと、店ごとの値段くらべ。どのお店が一番安いかがすぐ分かる買い物メモアプリ。">
<meta name="theme-color" content="#2f8f5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171400" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かいものノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="app" id="app">
  <main class="screens" id="screens">
    <section class="screen is-active" id="screen-list"     data-screen="list"     role="tabpanel" aria-label="買い物リスト"></section>
    <section class="screen"           id="screen-prices"   data-screen="prices"   role="tabpanel" aria-label="商品と価格" hidden></section>
    <section class="screen"           id="screen-compare"  data-screen="compare"  role="tabpanel" aria-label="お店くらべ" hidden></section>
    <section class="screen"           id="screen-settings" data-screen="settings" role="tabpanel" aria-label="設定" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="メインナビゲーション"></nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/backup.js"></script>
<script src="js/product-sheet.js"></script>
<script src="js/screen-list.js"></script>
<script src="js/screen-prices.js"></script>
<script src="js/screen-compare.js"></script>
<script src="js/screen-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
