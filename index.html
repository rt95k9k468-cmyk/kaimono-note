<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 二つ目の鍵（R29、docs/settings.md）。字の無害化（html）が一か所漏れても、よそのスクリプトは動かない。
     直書きのスクリプトは無い。style 属性を使うので style は unsafe-inline。中継所・AI の窓口・Dropbox は
     利用者が決める URL なので connect は https 全般。写真は data:、.ics などは blob:。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:">
<!-- No maximum-scale: every text field is 16px or larger, so iOS has no
     reason to zoom on focus, and capping the scale would only take
     pinch-zoom away from people who need to enlarge the text. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>くらしノート</title>
<meta name="description" content="daily・やること・買うもの・からだを一冊に。日記、時間割のTodo、買い物リストと店ごとの値段くらべ、体重と食事の記録。">
<meta name="theme-color" content="#f0eff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="くらしノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="app" id="app">
  <main class="screens" id="screens">
    <!-- 上の帯と暦は、全タブで一つ（docs/shared-header.md）。帯（#head）は
         タブの流れ（#panes の中の画面）の外に居るので、席を移っても動かない。
         設定は deck の外——共通の帯ごと押しのけて上に重なる一枚なので。 -->
    <div class="deck" id="deck">
      <div class="head" id="head" hidden></div>
      <div class="panes" id="panes">
        <section class="screen"           id="screen-archive"  data-screen="archive"  role="tabpanel" aria-label="daily" hidden></section>
        <section class="screen"           id="screen-notes"    data-screen="notes"    role="tabpanel" aria-label="notes" hidden></section>
        <section class="screen"           id="screen-todo"     data-screen="todo"     role="tabpanel" aria-label="tasks" hidden></section>
        <section class="screen is-active" id="screen-list"     data-screen="list"     role="tabpanel" aria-label="shopping"></section>
        <section class="screen"           id="screen-prices"   data-screen="prices"   role="tabpanel" aria-label="prices" hidden></section>
        <section class="screen"           id="screen-diet"     data-screen="diet"     role="tabpanel" aria-label="health" hidden></section>
      </div>
    </div>
    <section class="screen"           id="screen-settings" data-screen="settings" role="tabpanel" aria-label="Settings" hidden></section>
  </main>

  <!-- The add bar lives here, outside the scrolling screens. It used to be a
       sticky element inside the list, and iOS painted the text caret way above
       the field it belonged to. A plain flex child at the bottom of the shell
       has no sticky offset for the caret to disagree with. -->
  <div class="dock" id="dock" hidden></div>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="メインナビゲーション"></nav>
</div>

<!-- Shown only when a phone is held sideways. See the portrait-only block in
     base.css for why an app that asks for portrait in its manifest still
     needs this. -->
<div class="rotate-note">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2" width="10" height="20" rx="2.4"/>
    <path d="M10.4 18.8h3.2"/>
  </svg>
  <b>縦向きでお使いください</b>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
