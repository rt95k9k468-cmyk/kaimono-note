<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale: every text field is 16px or larger, so iOS has no
     reason to zoom on focus, and capping the scale would only take
     pinch-zoom away from people who need to enlarge the text. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>くらしノート</title>
<meta name="description" content="やることと買うものとからだを一冊に。日付つきのTodo、買い物リスト、店ごとの値段くらべ、体重と食事の記録。">
<meta name="theme-color" content="#2f8f5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171400" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="くらしノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="app" id="app">
  <main class="screens" id="screens">
    <section class="screen"           id="screen-todo"     data-screen="todo"     role="tabpanel" aria-label="やること" hidden></section>
    <section class="screen is-active" id="screen-list"     data-screen="list"     role="tabpanel" aria-label="買い物リスト"></section>
    <section class="screen"           id="screen-prices"   data-screen="prices"   role="tabpanel" aria-label="商品と価格" hidden></section>
    <section class="screen"           id="screen-diet"     data-screen="diet"     role="tabpanel" aria-label="ダイエット" hidden></section>
    <section class="screen"           id="screen-compare"  data-screen="compare"  role="tabpanel" aria-label="お店くらべ" hidden></section>
    <section class="screen"           id="screen-settings" data-screen="settings" role="tabpanel" aria-label="設定" hidden></section>
  </main>

  <!-- The add bar lives here, outside the scrolling screens. It used to be a
       sticky element inside the list, and iOS painted the text caret way above
       the field it belonged to. A plain flex child at the bottom of the shell
       has no sticky offset for the caret to disagree with. -->
  <div class="dock" id="dock" hidden></div>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="メインナビゲーション"></nav>
</div>

<!-- Shown only when a phone is held sideways. See the portrait-only block in
     base.css for why an app that asks for portrait in its manifest still
     needs this. -->
<div class="rotate-note">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2" width="10" height="20" rx="2.4"/>
    <path d="M10.4 18.8h3.2"/>
  </svg>
  <b>縦向きでお使いください</b>
  <span>画面を縦に戻すと続きから使えます</span>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/product-icons.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/reorder.js"></script>
<script src="js/keypad.js"></script>
<script src="js/backup.js"></script>
<script src="js/insights.js"></script>
<script src="js/pull-refresh.js"></script>
<script src="js/notify.js"></script>
<script src="js/food-data.js"></script>
<script src="js/diet.js"></script>
<script src="js/diet-ai.js"></script>
<script src="js/health-sync.js"></script>
<script src="js/relay-code.js"></script>
<script src="js/health-relay.js"></script>
<script src="js/product-sheet.js"></script>
<script src="js/screen-todo.js"></script>
<script src="js/screen-diet.js"></script>
<script src="js/screen-list.js"></script>
<script src="js/screen-prices.js"></script>
<script src="js/screen-compare.js"></script>
<script src="js/screen-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
