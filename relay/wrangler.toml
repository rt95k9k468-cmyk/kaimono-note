# くらしノートの中継所。setup.sh がこのファイルの二か所を書き換えます。
#
#   RELAY_PATH  … 合言葉になる道（setup.sh が作ります）
#   kv_namespaces の id … KVの置き場（setup.sh が作って書き込みます）
#
# 手で建てるときは relay/README.md を見てください。

name = "kurashi-relay"
main = "worker.js"
compatibility_date = "2026-08-01"

# 使った分だけの無料枠で動きます。観測は要らないので切っておきます
# （健康データの行き来を、余計なところに残さないため）。
[observability]
enabled = false

[vars]
# ← setup.sh がここに、当てられない道を書き込みます。
#    手で書くなら "/kn-" のあとに英数字を十数文字。
RELAY_PATH = ""

[[kv_namespaces]]
binding = "MAIL"
# ← setup.sh がここに、作った置き場の id を書き込みます。
id = ""
