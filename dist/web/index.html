      const s = scroller.getBoundingClientRect();
      if (f.top >= s.top + 4 && f.bottom <= s.bottom - 4) return;   // already visible
      field.scrollIntoView({ block: "center", behavior: "smooth" });
    };

    el.addEventListener("focusin", (e) => {
      const field = e.target.closest("input, textarea, select");
      if (!field) return;
      [140, 340, 620].forEach((ms) => setTimeout(() => {
        if (document.activeElement === field) scrollFieldIntoView(field);
      }, ms));
    });

    // Drag-down-to-dismiss, only while the sheet is anchored to the bottom
    // (above 640px it becomes a centred dialog with a different transform).
    const isBottomSheet = () => window.matchMedia("(max-width: 639px)").matches;
    let startY = null;
    const head = el.querySelector(".sheet-head");
    const handleBar = el.querySelector(".sheet-handle");
    [head, handleBar].forEach((zone) => {
      zone.addEventListener("touchstart", (e) => {
        startY = isBottomSheet() ? e.touches[0].clientY : null;
      }, { passive: true });
      zone.addEventListener("touchmove", (e) => {
        if (startY == null) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0) el.style.transform = `translate(-50%, ${dy}px)`;
      }, { passive: true });
      zone.addEventListener("touchend", (e) => {
        if (startY == null) return;
        const dy = (e.changedTouches[0] || {}).clientY - startY;
        el.style.transform = "";
        if (dy > 90) close();
        startY = null;
      });
    });

    const handle = { close, el };
    openSheets.push(handle);

    // Focus the first meaningful control.
    setTimeout(() => {
      const target = el.querySelector("input, textarea, select, button:not(.js-close)");
      if (target && !("ontouchstart" in window)) target.focus();
    }, 320);

    return handle;
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openSheets.length) {
      openSheets[openSheets.length - 1].close();
    }
  });

  /* ---------------- toast ---------------- */

  let toastTimer = null;

  function toast(message, { action, duration = 3600 } = {}) {
    const root = toastRoot();
    root.innerHTML = "";
    clearTimeout(toastTimer);

    const el = node(html`
      <div class="toast">
        <span class="toast-msg">${message}</span>
        ${action ? html`<button class="toast-action">${action.label}</button>` : ""}
      </div>
    `);

    if (action) {
      el.querySelector(".toast-action").addEventListener("click", (e) => {
        // Stop it reaching the tap-to-dismiss below: the action closes the
        // toast itself, and running both would be doing the same work twice.
        e.stopPropagation();
        action.onClick();
        dismiss();
      });
    }

    /* Tapped anywhere else: gone. It is an aside, not a question, and sitting
       out its 3.6 seconds to see the row underneath is a poor deal. */
    el.addEventListener("click", () => dismiss());

    let gone = false;
    function dismiss() {
      if (gone) return;
      gone = true;
      clearTimeout(toastTimer);
      el.classList.add("is-out");
      setTimeout(() => el.remove(), 220);
    }

    root.append(el);
    toastTimer = setTimeout(dismiss, duration);
    return { dismiss };
  }

  /* ---------------- confirm ---------------- */

  function confirm({ title, message, okLabel = "OK", cancelLabel = "キャンセル", danger = false }) {
    return new Promise((resolve) => {
      let settled = false;
      const body = node(html`<div class="stack" style="gap:8px"><p style="color:var(--c-text-2);line-height:1.6">${message || ""}</p></div>`);
      const foot = node(html`
        <div style="display:flex;gap:8px;width:100%">
          <button class="btn btn-soft js-cancel" style="flex:1">${cancelLabel}</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"} js-ok" style="flex:1">${okLabel}</button>
        </div>
      `);

      const h = sheet({
        title, content: body, footer: foot,
        onClose: () => { if (!settled) { settled = true; resolve(false); } },
      });

      foot.querySelector(".js-cancel").addEventListener("click", () => h.close());
      foot.querySelector(".js-ok").addEventListener("click", () => {
        settled = true;
        resolve(true);
        h.close();
      });
    });
  }

  /* ---------------- prompt ---------------- */

  function prompt({ title, label, value = "", placeholder = "", okLabel = "保存", inputMode }) {
    return new Promise((resolve) => {
      let settled = false;
      const body = node(html`
        <label class="field">
          ${label ? html`<span class="field-label">${label}</span>` : ""}
          <input class="input js-input" value="${value}" placeholder="${placeholder}"
                 ${inputMode ? KN.util.raw(`inputmode="${inputMode}"`) : ""}>
        </label>
      `);
      const foot = node(html`
        <div style="display:flex;gap:8px;width:100%">
          <button class="btn btn-soft js-cancel" style="flex:1">キャンセル</button>
          <button class="btn btn-primary js-ok" style="flex:1">${okLabel}</button>
        </div>
      `);

      const h = sheet({
        title, content: body, footer: foot,
        onClose: () => { if (!settled) { settled = true; resolve(null); } },
      });

      const input = body.querySelector(".js-input");
      function submit() {
        settled = true;
        resolve(input.value.trim());
        h.close();
      }
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      foot.querySelector(".js-ok").addEventListener("click", submit);
      foot.querySelector(".js-cancel").addEventListener("click", () => h.close());
    });
  }

  /* ---------------- store picker ---------------- */

  /** Chips of known stores + inline "new store" field. Resolves to a storeId. */
  /**
   * @param opts.selectedId  the shop to start on, or null
   * @param opts.autoPick    fall back to the first shop when nothing is given.
   *   Off where landing on a shop by default would be a decision made for the
   *   user — recording a price against whichever shop happens to sort first
   *   is not a thing anyone asked for.
   */
  function storePicker(container, { selectedId, onSelect, autoPick = true }) {
    const stores = KN.store.sortedStores();
    let current = selectedId || (autoPick ? (stores[0] && stores[0].id) : null) || null;

    function render() {
      container.innerHTML = "";
      const wrap = node(html`<div class="chip-wrap"></div>`);
      stores.forEach((s) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(s.id === current)}">
            <span class="dot" style="background:${s.color}"></span>${s.name}
          </button>
        `);
        chip.addEventListener("click", () => {
          current = s.id;
          onSelect(current);
          render();
        });
        wrap.append(chip);
      });

      const addChip = node(html`<button type="button" class="chip">＋ お店を追加</button>`);
      addChip.addEventListener("click", async () => {
        const name = await prompt({ title: "お店を追加", label: "お店の名前", placeholder: "例：イオン 〇〇店" });
        if (!name) return;
        const rec = KN.store.addStore(name);
        stores.length = 0;
        KN.store.sortedStores().forEach((s) => stores.push(s));
        current = rec.id;
        onSelect(current);
        render();
      });
      wrap.append(addChip);
      container.append(wrap);
    }

    render();
    if (current) onSelect(current);
    return { get current() { return current; } };
  }

  /* ---------------- horizontal chip filter ---------------- */

  /**
   * A sideways-scrolling row of filter chips that survives a re-render.
   *
   * Rebuilding the row from scratch on every tap threw its scroll position
   * away, so choosing a category that had been scrolled into view sent the
   * whole row back to the left and the chip just pressed could end up off
   * the screen. Here the row is kept: while the chips themselves are
   * unchanged only `aria-pressed` moves, and the scroller is never touched.
   * A real change — a category gaining items, or disappearing — does rebuild,
   * and puts the scroll position back where it was.
   *
   * @param {HTMLElement} host
   * @param {Array<{id:string,label:string,emoji?:string,color?:string,count?:number}>} chips
   * @param {{activeId:string, onPick:Function}} opts
   */
  function chipRow(host, chips, { activeId, onPick }) {
    const sig = chips.map((c) => `${c.id}␀${c.label}␀${c.count == null ? "" : c.count}`).join("|");
    let row = host.querySelector(".chip-row");

    if (row && row.dataset.sig === sig) {
      row.querySelectorAll(".chip").forEach((el) => {
        el.setAttribute("aria-pressed", String(el.dataset.id === String(activeId)));
      });
      return row;
    }

    const left = row ? row.scrollLeft : 0;
    host.innerHTML = "";
    row = node(html`<div class="chip-row"></div>`);
    row.dataset.sig = sig;

    chips.forEach((c) => {
      /* Only written when there is a colour: `--cat:` with nothing after it is
         an empty value, not an absent one, so `var(--cat, var(--c-primary))`
         would substitute nothing and the selected 「すべて」 chip would lose
         its green rather than fall back to it. */
      const el = node(html`
        <button type="button" class="chip" data-id="${c.id}"
                aria-pressed="${String(c.id === activeId)}"
                ${c.color ? KN.util.raw(`style="--cat:${c.color}"`) : ""}>
          ${c.emoji ? html`<span class="chip-emoji">${c.emoji}</span>` : ""}${c.label}
          ${c.count != null ? html`<span class="chip-count">${String(c.count)}</span>` : ""}
        </button>
      `);
      el.addEventListener("click", () => onPick(c.id));
      row.append(el);
    });

    host.append(row);
    row.scrollLeft = left;
    return row;
  }

  /* ---------------- category picker ---------------- */

  function categoryPicker(container, { selectedId, onSelect }) {
    let current = selectedId || KN.store.OTHER_CATEGORY;

    function render() {
      container.innerHTML = "";
      const wrap = node(html`<div class="chip-wrap"></div>`);
      KN.store.sortedCategories().forEach((c) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(c.id === current)}"
                  style="--cat:${c.color || ""}">
            <span class="chip-emoji">${c.emoji}</span>${c.name}
          </button>
        `);
        chip.addEventListener("click", () => {
          current = c.id;
          haptic();
          onSelect(current);
          render();
        });
        wrap.append(chip);
      });
      container.append(wrap);
    }

    render();
    return {
      get current() { return current; },
      /** Move the selection without firing onSelect — for when something else
       *  changed the category, e.g. a rename that re-guessed it. */
      set(id) { if (id && id !== current) { current = id; render(); } },
    };
  }

  /* ---------------- layout: rows or tiles ---------------- */

  /* Both lists are laid out the same way, from one setting. Two screens
     disagreeing about how a product looks would be a setting the app keeps
     rather than a way of looking at it. */

  const isTiles = () => KN.store.get().settings.layout === "tiles";

  function toggleLayout() {
    const to = isTiles() ? "rows" : "tiles";
    haptic(10);
    KN.store.update((s) => { s.settings.layout = to; });
  }

  /** Paints a topbar button with the layout it switches *to*. */
  function paintLayoutButton(btn) {
    if (!btn) return;
    const toTiles = !isTiles();
    btn.innerHTML = "";
    btn.append(node(html`${icon(toTiles ? "tiles" : "rows")}`));
    const label = toTiles ? "タイル表示にする" : "リスト表示にする";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }

  /* ---------------- swipe: right to take, left to archive ---------------- */

  /* One gesture for both screens and both layouts. Right is the tab's own
     positive action — ★ on the list, onto the list on the price screen — and
     left is always the archive. Nothing stays open, because neither has a
     second step to confirm; the card springs back and the change lands as it
     goes, with the toast holding the undo.

     Past the trigger the card only creeps, so the finger can feel where the
     edge is instead of watching for it. A tile is a third of a screen across,
     so it gets its own shorter throw — the same gesture, scaled to what is
     actually under the thumb.

     @param wrap  the positioned container holding the panels
     @param card  the part that moves
     @param opts  {onRight, onLeft, tiles} */
  function swipeActions(wrap, card, { onRight, onLeft, tiles }) {
    const TRIGGER = tiles ? 34 : 68;
    const MAX = tiles ? 52 : 104;
    const SLOP = tiles ? 10 : 14;
    const DOMINANCE = 1.6;

    let startX = 0, startY = 0, dx = 0, dir = 1;
    let dragging = false, decided = false, pointerId = null, swallowClick = false;
    let armed = false, pending = null, rafId = 0;

    // Pointer moves arrive faster than the screen refreshes; painting once per
    // frame is the difference between gliding and stuttering.
    const paint = () => {
      rafId = 0;
      if (pending === null) return;
      card.style.transform = `translate3d(${pending}px, 0, 0)`;
    };
    const schedule = (v) => {
      pending = v;
      if (!rafId) rafId = requestAnimationFrame(paint);
    };

    card.addEventListener("touchmove", (e) => { if (dragging) e.preventDefault(); }, { passive: false });

    card.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = false;
      decided = false;
      armed = false;
    });

    card.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pointerId) return;
      // Held still long enough to lift the row out of the list — from there the
      // gesture belongs to the reorder.
      if (KN.reorder && KN.reorder.isActive && KN.reorder.isActive()) return;
      const mx = e.clientX - startX;
      const my = e.clientY - startY;

      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
        decided = true;
        // Clearly sideways, not a drifting scroll: a diagonal belongs to the
        // list, which stays scrollable throughout.
        dragging = Math.abs(mx) >= SLOP && Math.abs(mx) > Math.abs(my) * DOMINANCE;
        if (!dragging) return;
        dir = mx > 0 ? 1 : -1;
        card.setPointerCapture(pointerId);
        card.style.transition = "none";
        wrap.classList.add("is-swiping", dir > 0 ? "is-right" : "is-left");
      }
      if (!dragging) return;

      const travel = mx * dir;
      dx = dir * Math.min(MAX, travel <= TRIGGER ? Math.max(0, travel)
        : TRIGGER + (travel - TRIGGER) * 0.32);
      const now = Math.abs(dx) >= TRIGGER;
      if (now !== armed) {
        armed = now;
        wrap.classList.toggle("is-armed", armed);
        if (armed) haptic(10);
      }
      schedule(dx);
    });

    const finish = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      if (!dragging) return;

      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      pending = null;
      card.style.transition = "";
      card.style.transform = "";
      const fired = armed;
      const way = dir;
      dragging = false;
      armed = false;
      swallowClick = true;
      // Let the card glide home before the store change rebuilds the list;
      // committing on the spot would swap it out mid-flight.
      setTimeout(() => {
        wrap.classList.remove("is-swiping", "is-armed", "is-left", "is-right");
        if (!fired) return;
        if (way > 0) { if (onRight) onRight(); }
        else if (onLeft) onLeft();
      }, 200);
    };
    card.addEventListener("pointerup", finish);
    card.addEventListener("pointercancel", finish);

    // A pointer sequence still fires a click afterwards; left alone it would
    // press whatever the finger lifted over at the end of every swipe.
    card.addEventListener("click", (e) => {
      if (!swallowClick) return;
      swallowClick = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  }

  /* ---------------- search: a button, and the bar it opens ----------------

     A search bar is worth its height only while it is being used. Left up
     permanently it costs a row of the list on every screen, every day, to
     answer a question asked once a week — so it lives behind the magnifier
     next to the layout button, and folds away again when the query is
     cleared. Same three parts on every screen that has one, wired here so
     they cannot drift apart.

     @param els  { searchBtn, searchWrap, search, searchClear }
     @param onChange  called after the query changes; repaint the list
     @param setQuery  hands the folded query back to the screen
  */
  function wireSearch(els, onChange, setQuery) {
    const paint = () => {
      const open = !els.searchWrap.hidden;
      els.searchBtn.classList.toggle("is-on", open);
      els.searchBtn.setAttribute("aria-expanded", String(open));
    };

    const clear = () => {
      els.search.value = "";
      els.searchClear.hidden = true;
      setQuery("");
      onChange();
    };

    els.searchBtn.addEventListener("click", () => {
      const opening = els.searchWrap.hidden;
      els.searchWrap.hidden = !opening;
      if (opening) setTimeout(() => els.search.focus(), 30);
      else clear();
      paint();
      KN.util.haptic();
    });

    els.search.addEventListener("input", () => {
      // Folded, so 「え」 finds 「エマール」 — the same rule the suggestions use.
      els.searchClear.hidden = !els.search.value;
      setQuery(KN.util.foldKana(els.search.value));
      onChange();
    });

    els.searchClear.addEventListener("click", () => { clear(); els.search.focus(); });

    paint();
  }

  KN.ui = {
    sheet, toast, confirm, prompt, storePicker, categoryPicker, chipRow,
    isTiles, toggleLayout, paintLayoutButton, swipeActions, wireSearch,
  };
})();

/* ---- js/reorder.js ---- */
/* =========================================================
   くらしノート — long-press to lift, drag to reorder

   Press and hold a row and it lifts off the list — a shadow under it, a
   fraction larger, following your finger. The rows it passes glide aside, and
   a faded copy of the row itself sits in the gap they open, showing exactly
   where it will land while you are still holding it. Let go and it settles
   onto its own ghost.

   Holding still is what starts it. Moving first means you meant to scroll the
   list or swipe the row away, and those keep working untouched: the lift is
   cancelled the moment the finger travels more than a few pixels before the
   timer is up.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { haptic } = KN.util;

  const HOLD   = 400;   // press this long before the row lifts
  const CANCEL = 8;     // travel further than this first and it was a scroll
  const EDGE   = 64;    // how near the end of the list auto-scroll starts
  const SPEED  = 14;    // auto-scroll, px per frame at the very edge
  const DROP   = 190;   // how long the row takes to settle into its gap

  let drag = null;

  /** True while a row is lifted — other gesture handlers stand down on this. */
  const isActive = () => !!drag;

  /**
   * @param {Element} container  the list; only its direct children move
   * @param {object} opts
   * @param {string} opts.item   selector for the rows
   * @param {Function} opts.onDrop  (fromIndex, toIndex) — commit the new order
   * @param {Function} [opts.blocked]  return true to refuse to start
   * @param {Function} [opts.onCross]  (clientY) => target|null, asked every frame
   *        while dragging; a truthy target means the row is over somewhere
   *        else and the drop belongs to that instead of to this list
   * @param {Function} [opts.onDropCross]  (target) — commit that move
   */
  function attach(container, opts) {
    container.addEventListener("pointerdown", (e) => arm(e, container, opts));
  }

  /* ---------------- the press ---------------- */

  function arm(e, container, opts) {
    if (drag) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (opts.blocked && opts.blocked()) return;

    const el = e.target.closest(opts.item);
    if (!el || el.parentElement !== container) return;

    const startX = e.clientX, startY = e.clientY, pointerId = e.pointerId;

    const moved = (ev) => {
      if (ev.pointerId !== pointerId) return;
      if (Math.abs(ev.clientX - startX) > CANCEL || Math.abs(ev.clientY - startY) > CANCEL) done();
    };
    const done = () => {
      clearTimeout(timer);
      document.removeEventListener("pointermove", moved);
      document.removeEventListener("pointerup", done);
      document.removeEventListener("pointercancel", done);
    };
    const timer = setTimeout(() => { done(); lift({ container, opts, el, pointerId, startY }); }, HOLD);

    document.addEventListener("pointermove", moved);
    document.addEventListener("pointerup", done);
    document.addEventListener("pointercancel", done);
  }

  /* ---------------- the lift ---------------- */

  function lift({ container, opts, el, pointerId, startY }) {
    const kids = Array.prototype.filter.call(container.children, (k) => k.matches(opts.item));
    const from = kids.indexOf(el);
    if (from < 0) return;
    /* One row on its own has nowhere to go *within* its list — but if the
       screen accepts drops elsewhere (the todo groups are days), picking it up
       is exactly how it gets there, so a group of one still lifts. */
    if (kids.length < 2 && !opts.onCross) return;

    // Measured once, before anything moves. Everything after this is arithmetic
    // on these numbers, so a row half way through its own transition cannot
    // feed a wrong position back in.
    const rects = kids.map((k) => k.getBoundingClientRect());
    const gap = rects.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 0;
    const scroller = findScroller(container);

    /* A faded stand-in for the row, parked in whichever gap it would drop into.
       Without it the gap is just a hole in the list and you have to picture
       what goes there; with it, the answer is on screen the whole time.

       Positioned rather than laid out, and sized from the measurement above, so
       adding it to the container cannot disturb the rows it is standing among.
       Inert too — aria-hidden, untabbable — because it is a picture of a row
       that already exists a couple of hundred pixels further up. */
    const contRect = container.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add("reorder-ghost");
    ghost.removeAttribute("id");
    ghost.setAttribute("aria-hidden", "true");
    ghost.querySelectorAll("button, input, a, [tabindex]").forEach((c) => c.setAttribute("tabindex", "-1"));
    ghost.style.left = Math.round(rects[from].left - contRect.left) + "px";
    ghost.style.width = Math.round(rects[from].width) + "px";
    ghost.style.height = Math.round(rects[from].height) + "px";
    container.append(ghost);

    drag = {
      container, opts, el, kids, rects, from, to: from,
      // What the rows in between move by is the lifted row's own height —
      // it is the space that opens where it was and closes where it lands,
      // whatever the rows around it happen to measure.
      step: rects[from].height + gap,
      scroller, startScroll: scroller ? scroller.scrollTop : 0,
      startY, clientY: startY, pointerId, raf: 0,
      ghost, contTop: contRect.top,
    };

    container.classList.add("is-reordering");
    el.classList.add("reorder-lift");
    try { el.setPointerCapture(pointerId); } catch (err) { /* mouse in a test rig */ }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
    // The list must not scroll under a row being carried across it.
    document.addEventListener("touchmove", swallowTouch, { passive: false });

    haptic(18);
    paint();
    drag.raf = requestAnimationFrame(tick);
  }

  const swallowTouch = (e) => { if (drag) e.preventDefault(); };

  function onMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.clientY = e.clientY;
  }

  /* Auto-scroll and painting share a frame loop rather than riding on pointer
     events: holding the finger still at the end of the list still has to keep
     scrolling, and no pointer events arrive while it is still. */
  function tick() {
    if (!drag) return;
    autoScroll();
    paint();
    drag.raf = requestAnimationFrame(tick);
  }

  function autoScroll() {
    const d = drag;
    if (!d.scroller) return;
    const r = d.scroller.getBoundingClientRect();
    let v = 0;
    if (d.clientY < r.top + EDGE) v = -SPEED * Math.min(1, (r.top + EDGE - d.clientY) / EDGE);
    else if (d.clientY > r.bottom - EDGE) v = SPEED * Math.min(1, (d.clientY - (r.bottom - EDGE)) / EDGE);
    if (v) d.scroller.scrollTop += v;
  }

  function paint() {
    const d = drag;
    /* Carried out of its own list and over another one. The todo screen uses
       this to reschedule by dragging: the groups are days, so dropping a row
       into 「明日」 is how a thing becomes tomorrow's. Asked every frame, so
       the target can light up while the finger is still over it. */
    if (d.opts.onCross) d.cross = d.opts.onCross(d.clientY) || null;
    // Scrolling moves the row's own layout position along with everything
    // else, so it has to be added back in for the row to stay under the finger.
    const delta = (d.clientY - d.startY) + (d.scroller ? d.scroller.scrollTop - d.startScroll : 0);
    d.el.style.transform = `translate3d(0, ${Math.round(delta)}px, 0)`;

    const mid = d.rects[d.from].top + d.rects[d.from].height / 2 + delta;
    let to = d.from;
    for (let i = d.from - 1; i >= 0; i--) {
      if (mid < d.rects[i].top + d.rects[i].height / 2) to = i; else break;
    }
    for (let i = d.from + 1; i < d.rects.length; i++) {
      if (mid > d.rects[i].top + d.rects[i].height / 2) to = i; else break;
    }
    if (to !== d.to) { d.to = to; haptic(8); }
    placeGhost();

    d.kids.forEach((k, i) => {
      if (i === d.from) return;
      let shift = 0;
      if (d.to > d.from && i > d.from && i <= d.to) shift = -d.step;
      else if (d.to < d.from && i >= d.to && i < d.from) shift = d.step;
      k.style.transform = shift ? `translate3d(0, ${shift}px, 0)` : "";
    });
  }

  /** Put the stand-in where the row would land — the same slot the gap opens. */
  function placeGhost() {
    const d = drag;
    if (!d.ghost) return;
    d.ghost.style.top = Math.round(slotTop(d) - d.contTop) + "px";
  }

  /** Viewport-space top of the gap for the current target, measured against the
   *  positions everything had when the lift started. */
  function slotTop(d) {
    const a = d.rects[d.from];
    if (d.to > d.from) return d.rects[d.to].bottom - a.height;
    if (d.to < d.from) return d.rects[d.to].top;
    return a.top;
  }

  /* ---------------- the drop ---------------- */

  function onUp(e) {
    if (!drag || (e && e.pointerId !== drag.pointerId)) return;
    const d = drag;
    drag = null;

    cancelAnimationFrame(d.raf);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", swallowTouch);

    const a = d.rects[d.from];
    const landing = slotTop(d);
    const scrolled = d.scroller ? d.scroller.scrollTop - d.startScroll : 0;

    d.el.classList.remove("reorder-lift");
    d.el.classList.add("reorder-drop");
    d.el.style.transform = `translate3d(0, ${Math.round(landing - a.top + scrolled)}px, 0)`;
    haptic(12);

    // The press that lifted the row would otherwise land as a tap on release
    // and open whatever the row opens.
    const eatClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener("click", eatClick, true);
    setTimeout(() => document.removeEventListener("click", eatClick, true), 350);

    // The stand-in fades out from under the row settling onto it, so the two
    // are never both solid in the same place.
    if (d.ghost) d.ghost.classList.add("is-going");

    setTimeout(() => {
      d.container.classList.remove("is-reordering");
      if (d.ghost) d.ghost.remove();
      d.kids.forEach((k) => {
        k.style.transform = "";
        k.classList.remove("reorder-drop");
      });
      // Committing last means the re-render it triggers replaces rows that are
      // already sitting where they belong, so nothing jumps at the swap.
      if (d.cross) d.opts.onDropCross(d.cross);
      else if (d.to !== d.from) d.opts.onDrop(d.from, d.to);
    }, DROP);
  }

  function findScroller(el) {
    let n = el.parentElement;
    while (n && n !== document.body) {
      const o = getComputedStyle(n).overflowY;
      if (o === "auto" || o === "scroll") return n;
      n = n.parentElement;
    }
    return null;
  }

  /** Move one entry of a list and write the result back as `order` fields. */
  function applyOrder(records, from, to, pick) {
    const ids = records.map((r) => r.id);
    const [moved] = ids.splice(from, 1);
    ids.splice(to, 0, moved);
    KN.store.update((s) => {
      ids.forEach((id, i) => {
        const rec = pick(s).find((r) => r.id === id);
        if (rec) rec.order = i;
      });
    });
  }

  KN.reorder = { attach, isActive, applyOrder };
})();

/* ---- js/keypad.js ---- */
/* =========================================================
   くらしノート — the number pad

   iOS will hand you a numeric keypad, but it has no operators, no 税 keys, and
   a system toolbar above it that a web page cannot remove. So the field asks
   for no keyboard at all (`inputmode="none"`) and this pad slides up instead:
   digits, the four operators, both tax rates, a backspace and a 確定.

   The field itself is the display. There is no second readout to keep in sync,
   the caret goes where you tap, and what you see is exactly what is stored
   once 確定 works the sum out.

   Nothing here takes focus. Every key cancels the press that would move it, so
   the caret stays in the field the whole time and the pad never has to put it
   back afterwards.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, haptic } = KN.util;

  /* Both rates, because Japan has both and a grocery list meets both in the
     same basket: 8% on food under 軽減税率, 10% on everything else. One key
     would be wrong about half the shelf, and which half is not something the
     app can work out from a price. 8% first — it is the one a food shop
     reaches for most. */
  const TAX_RATES = [0.08, 0.1];

  let pad = null;      // the element, built once
  let field = null;    // the input it is typing into
  let opts = {};

  /* ---------------- building ---------------- */

  const KEYS = [
    ["7", "8", "9", { op: "/", label: "÷" }],
    ["4", "5", "6", { op: "*", label: "×" }],
    ["1", "2", "3", { op: "-", label: "−" }],
    /* 「00」 was here. It saved one press on prices ending in two zeros, which
       a grocery list almost never has — 「298」「1,480」 — while the discount
       on the shelf tag is something this pad could work out and could not. */
    [{ pct: true }, "0", ".", { op: "+", label: "＋" }],
  ];

  function build() {
    pad = node(html`
      <div class="keypad" role="group" aria-label="数字キーボード" hidden>
        <div class="keypad-grid js-grid"></div>
        <div class="keypad-actions">
          ${TAX_RATES.map((r) => html`
            <button type="button" class="key key-tax js-tax" data-rate="${String(r)}"
                    aria-label="税${Math.round(r * 100)}パーセントを足す">
              <span class="key-tax-cap">税</span><span class="key-tax-rate">+${Math.round(r * 100)}%</span>
            </button>
          `)}
          <button type="button" class="key key-ok js-ok" aria-label="確定">確定</button>
          <button type="button" class="key key-back js-back" aria-label="1文字消す">${icon("backspace")}</button>
        </div>
      </div>
    `);

    const grid = pad.querySelector(".js-grid");
    KEYS.forEach((row) => row.forEach((k) => {
      if (k && k.pct) {
        const btn = node(html`
          <button type="button" class="key key-off js-off" aria-label="割引の率を入れる">
            <span class="key-off-cap">割引</span><span class="key-off-main">−％</span>
          </button>
        `);
        btn.addEventListener("click", discount);
        grid.append(btn);
        return;
      }
      const isOp = typeof k === "object";
      const btn = node(html`
        <button type="button" class="key ${isOp ? "key-op" : ""}">${isOp ? k.label : k}</button>
      `);
      btn.addEventListener("click", () => insert(isOp ? k.op : k));
      grid.append(btn);
    }));

    pad.querySelector(".js-back").addEventListener("click", backspace);
    pad.querySelectorAll(".js-tax").forEach((k) => {
      k.addEventListener("click", () => applyTax(parseFloat(k.dataset.rate)));
    });
    /* One key, two jobs, and never both at once: while a sum is on screen it
       is ＝ and works the answer out in place; once the field holds a plain
       number it is 確定 and puts the pad away. Pressing 確定 on a half-typed
       sum used to swallow the working and close in the same motion, which
       gave you no chance to look at what it came to. */
    pad.querySelector(".js-ok").addEventListener("click", () => {
      if (field && KN.util.isExpression(field.value)) equals();
      else commit();
    });

    /* Nothing on the pad may steal the caret — not the keys, and not the gaps
       between them. Landing a fast thumb a few pixels wide of a key used to
       blur the field, and the blur handler below then put the pad away
       mid-sum. Cancelling the press on the whole pad keeps focus wherever the
       finger lands; clicks still fire, so the keys work exactly as before. */
    pad.addEventListener("pointerdown", (e) => e.preventDefault());
    pad.addEventListener("mousedown", (e) => e.preventDefault());

    /* Since a lost caret no longer takes the pad down with it (see
       restoreOrClose), there has to be a deliberate way out other than 確定:
       a press anywhere that is neither the pad nor the field it is typing
       into means the user is done with it. But not this instant — see
       closeAfterTap: the finger is still on the glass. */
    document.addEventListener("pointerdown", (e) => {
      if (!isOpen()) return;
      if (pad.contains(e.target)) return;
      if (field && (e.target === field || field.contains(e.target))) return;
      closeAfterTap();
    }, true);

    document.getElementById("sheet-root").append(pad);
  }

  /* ---------------- editing ---------------- */

  function fire() {
    field.dispatchEvent(new Event("input", { bubbles: true }));
    refreshOk();
  }

  /** Keep the big green key showing whichever of its two jobs applies now. */
  function refreshOk() {
    if (!pad) return;
    const ok = pad.querySelector(".js-ok");
    if (!ok) return;
    const sum = !!field && KN.util.isExpression(field.value);
    ok.classList.toggle("is-equals", sum);
    ok.textContent = sum ? "＝" : "確定";
    ok.setAttribute("aria-label", sum ? "計算する" : "確定");
  }

  /* Work the sum out and leave it on screen. The pad stays up and the caret
     stays put, so the answer can be read, taxed, or typed over before
     anything is committed. */
  function equals() {
    if (!field) return;
    const n = KN.util.calc(field.value);
    // 「198+」 is not wrong, it is unfinished — say nothing and wait.
    if (n == null) { haptic(20); return; }
    field.value = String(Math.round(n * 100) / 100);
    setCaret(field.value.length);
    haptic(14);
    fire();
  }

  function insert(text) {
    if (!field) return;
    const at = field.selectionStart != null ? field.selectionStart : field.value.length;
    const end = field.selectionEnd != null ? field.selectionEnd : at;
    field.value = field.value.slice(0, at) + text + field.value.slice(end);
    setCaret(at + text.length);
    haptic();
    fire();
  }

  function backspace() {
    if (!field) return;
    const at = field.selectionStart != null ? field.selectionStart : field.value.length;
    const end = field.selectionEnd != null ? field.selectionEnd : at;
    if (end > at) {
      field.value = field.value.slice(0, at) + field.value.slice(end);
      setCaret(at);
    } else if (at > 0) {
      field.value = field.value.slice(0, at - 1) + field.value.slice(at);
      setCaret(at - 1);
    }
    haptic();
    fire();
  }

  /* 「20%引き」 on the shelf tag. Press this after the sticker price and the
     field reads 「398-%」 with the caret parked between the two, so the rate
     you type next lands where it belongs and the whole thing stays readable
     as 「398-12%」. The answer comes from ＝, like any other sum. */
  function discount() {
    if (!field) return;
    const at = field.selectionStart != null ? field.selectionStart : field.value.length;
    const end = field.selectionEnd != null ? field.selectionEnd : at;
    const before = field.value.slice(0, at);
    // Nothing to take the discount off yet, or a rate already waiting for one.
    if (!before || /[+\-*/%]$/.test(before) || field.value.indexOf("%") >= 0) {
      haptic(20);
      return;
    }
    field.value = before + "-%" + field.value.slice(end);
    setCaret(at + 1);
    haptic(12);
    fire();
  }

  /* Works the sum out first, so 「198+250」 gets the tax on the total rather
     than on whatever was typed last, then rounds down — which is what a
     Japanese shelf price does with the fraction of a yen. */
  function applyTax(rate) {
    if (!field) return;
    const n = KN.util.calc(field.value);
    if (n == null) { haptic(20); return; }
    field.value = String(Math.floor(n * (1 + rate)));
    setCaret(field.value.length);
    haptic(14);
    fire();
  }

  /** Replace the expression with its answer and put the pad away. */
  function commit() {
    if (!field) return;
    const n = KN.util.calc(field.value);
    if (n != null) {
      field.value = String(Math.round(n * 100) / 100);
      fire();
    }
    haptic(12);
    const done = opts.onCommit;
    const input = field;
    close();
    // Let the caret go too. Otherwise the field is still focused, and the next
    // tap on it fires no `focus` — the pad would refuse to come back.
    input.blur();
    done && done();
  }

  function setCaret(i) {
    try { field.setSelectionRange(i, i); } catch (err) { /* not every type allows it */ }
  }

  /* ---------------- showing and hiding ---------------- */

  function open(input, options) {
    if (!pad) build();
    field = input;
    opts = options || {};
    pad.hidden = false;
    refreshOk();
    // Published so a sheet can sit above the pad exactly as it sits above a
    // real keyboard — same mechanism, see --kb in app.js.
    requestAnimationFrame(() => {
      document.documentElement.style.setProperty("--pad", pad.offsetHeight + "px");
      pad.classList.add("is-open");
      opts.onOpen && opts.onOpen();
    });
  }

  function close() {
    if (!pad || pad.hidden) return;
    pad.classList.remove("is-open");
    pad.hidden = true;
    // The field is what the app reads to decide whether a keyboard is up (and
    // whether to hide the tab bar behind it). Let it go with the pad — if it
    // is still there. A form that has been rebuilt underneath us has not.
    const was = field;
    field = null;
    opts = {};
    if (was && was.isConnected && document.activeElement === was) was.blur();
    document.documentElement.style.setProperty("--pad", "0px");
    guardGhostClick();
    // The pad standing in for the keyboard means the app's idea of one has to
    // be re-read now, whether or not a blur was there to announce it.
    KN.remeasure && KN.remeasure();
  }

  /* ---------------- the click that lands somewhere else ----------------

     The pad is a third of the screen. Closing it hands all of that height
     back at once, and everything above slides down into it — while a finger
     is still on the glass. A tap is not one event but three: press, release,
     click. If the pad goes away on the press, the layout has moved by the
     time the click is worked out, and the browser hands it to whatever is
     under the point *now*.

     On the price sheet this was a data loss: with the pad up, 「追加」 sat
     where a saved row's 🗑 landed once the pad was gone. Pressing 追加
     deleted a price and recorded nothing.

     So a press outside the pad no longer closes it — it arms the close, and
     the pad stays up until the tap it belongs to has been delivered in full.
     Nothing moves under the finger, and 追加 gets its own click. */

  let armed = false;
  let armedFor = null;

  function closeAfterTap() {
    if (armed) return;
    armed = true;
    // Which field this close belongs to. If the tap turns out to open the pad
    // on something else, the close is stale and must not take the new one down.
    armedFor = field;
    // Capture, so this runs before the button's own handler and can hand the
    // close to the end of the queue — after the whole click has been
    // dispatched, whatever it turns out to do.
    document.addEventListener("click", onTapEnd, true);
    document.addEventListener("pointerup", onTapEnd, true);
    document.addEventListener("pointercancel", onTapEnd, true);
    document.addEventListener("touchend", onTapEnd, true);
  }

  function onTapEnd() {
    if (!armed) return;
    armed = false;
    document.removeEventListener("click", onTapEnd, true);
    document.removeEventListener("pointerup", onTapEnd, true);
    document.removeEventListener("pointercancel", onTapEnd, true);
    document.removeEventListener("touchend", onTapEnd, true);
    // A release is not the end of the tap: the click still has to be worked
    // out and delivered. Wait past it before giving the height back.
    const was = armedFor;
    setTimeout(() => {
      if (armed) return;              // another tap is in flight
      if (field && field !== was) return; // the pad moved to another field
      close();
    }, 90);
  }

  /* Belt and braces for the same failure. If anything else takes the pad down
     mid-tap — a blur, a sheet closing, a handler calling close() — a click
     that ends up somewhere other than where the finger went down is not a
     tap the user made. Throw it away. */

  let downTarget = null;
  document.addEventListener("pointerdown", (e) => { downTarget = e.target; }, true);
  document.addEventListener("touchstart", (e) => {
    downTarget = (e.touches[0] && e.touches[0].target) || downTarget;
  }, true);

  let guardUntil = 0;
  function guardGhostClick() { guardUntil = Date.now() + 400; }

  document.addEventListener("click", (e) => {
    if (!guardUntil || Date.now() > guardUntil) return;
    const from = downTarget;
    // Same element, or one contains the other: the tap stayed where it began.
    if (from && (from === e.target || from.contains(e.target) || e.target.contains(from))) return;
    guardUntil = 0;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  const isOpen = () => !!(pad && !pad.hidden);

  /* Focus left the field — but where did it go? Onto another control is a
     real exit and the pad goes away. Nowhere at all (activeElement back on
     <body>, or on the pad itself) means the tap simply fell off the edge of a
     key, and taking the pad down there loses the sum the user is halfway
     through typing. Hand the caret back and stay open. */
  function restoreOrClose(input) {
    // The pad has already been handed to another field — this blur is the tail
    // end of leaving the old one, not a reason to take the new one down.
    if (field && field !== input) return;
    const a = document.activeElement;
    const wentNowhere = !a || a === document.body || a === document.documentElement
      || (pad && pad.contains(a));
    if (isOpen() && field === input && wentNowhere && input.isConnected) {
      input.focus({ preventScroll: true });
      return;
    }
    close();
  }

  /**
   * Give a field this pad instead of the system keyboard.
   * @param {HTMLInputElement} input
   * @param {object} [options]
   * @param {Function} [options.onOpen]    after the pad is up and measured
   * @param {Function} [options.onCommit]  after 確定
   */
  function bind(input, options) {
    // `none` is the whole trick: the field still focuses, still shows a caret,
    // still takes a tap to position it — iOS just does not raise a keyboard,
    // so there is no system toolbar above it either.
    input.setAttribute("inputmode", "none");
    input.setAttribute("autocomplete", "off");
    input.addEventListener("focus", () => open(input, options));
    // Focus alone is not enough: a field that never lost it fires no `focus`,
    // so tapping a field the pad was dismissed over has to bring it back too.
    input.addEventListener("click", () => { if (!isOpen()) open(input, options); });
    input.addEventListener("blur", () => {
      setTimeout(() => {
        if (document.activeElement !== input) restoreOrClose(input);
      }, 60);
    });
  }

  KN.keypad = { bind, open, close, isOpen };
})();

/* ---- js/backup.js ---- */
/* =========================================================
   くらしノート — automatic local snapshots

   A page cannot write files to the phone on its own, so "automatic
   backup" here means rolling copies kept in the app's own storage.
   They cover the accidents that actually happen — a stray「すべて削除」,
   a restore from the wrong file — but not a lost or wiped phone, so the
   manual export is still nudged once the data is worth protecting.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { today } = KN.util;
  const store = KN.store;

  // Kept apart from the live data so「すべて削除」cannot take the snapshots with it.
  const SNAP_KEY = "kaimono-note-snapshots";
  const KEEP = 7;
  const REMIND_AFTER_DAYS = 30;
  const REMIND_MIN_PRODUCTS = 5;

  function read() {
    try {
      const list = JSON.parse(localStorage.getItem(SNAP_KEY) || "[]");
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  }

  function write(list) {
    // Snapshots must never crowd out the live shopping data. If the quota is
    // full, drop the oldest and retry instead of letting the write throw.
    let keep = list.slice(-KEEP);
    while (keep.length) {
      try {
        localStorage.setItem(SNAP_KEY, JSON.stringify(keep));
        return true;
      } catch (err) {
        keep = keep.slice(1);
      }
    }
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* nothing left to do */ }
    return false;
  }

  function summarize(state) {
    return {
      products: (state.products || []).length,
      stores: (state.stores || []).length,
      items: (state.items || []).length,
    };
  }

  function isEmpty(state) {
    const s = summarize(state);
    return !s.products && !s.stores && !s.items;
  }

  /** Store the current state. Returns false when there was nothing worth keeping. */
  function snapshot(reason) {
    const state = store.get();
    if (isEmpty(state)) return false;

    const list = read();
    const payload = JSON.stringify(state);

    // Skip an identical repeat, otherwise simply opening the app on quiet days
    // would push the genuinely different older snapshots out of the window.
    const last = list[list.length - 1];
    if (last && last.payload === payload) return false;

    list.push({ at: today(), reason: reason || "自動", payload, summary: summarize(state) });
    return write(list);
  }

  /** One snapshot per calendar day, taken at boot. */
  function maybeDaily() {
    const list = read();
    const last = list[list.length - 1];
    if (last) {
      const a = new Date(last.at);
      const b = new Date();
      const sameDay =
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
      if (sameDay) return false;
    }
    return snapshot("自動");
  }

  /** Newest first. */
  function list() {
    return read().slice().reverse();
  }

  function restore(at) {
    const found = read().find((s) => s.at === at);
    if (!found) throw new Error("その控えが見つかりません");
    // Take one first so that restoring is itself undoable.
    snapshot("復元前");
    store.importJSON(found.payload);
  }

  function clear() {
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* already gone */ }
  }

  /* ---------------- off-device export nudge ---------------- */

  function lastExportAt() {
    const st = store.get();
    return (st.settings && st.settings.lastExportAt) || null;
  }

  function markExported() {
    store.update((s) => { s.settings.lastExportAt = today(); });
  }

  /** True once there is real data and no file has been written out in a while. */
  function exportDue() {
    const st = store.get();
    if ((st.products || []).length < REMIND_MIN_PRODUCTS) return false;
    const last = lastExportAt();
    if (!last) return true;
    const days = (Date.now() - new Date(last).getTime()) / 86400000;
    return !(days < REMIND_AFTER_DAYS);
  }

  function init() {
    maybeDaily();
    if (exportDue()) {
      // Late enough that it does not collide with the first paint.
      setTimeout(() => {
        KN.ui && KN.ui.toast("設定からバックアップを書き出しておくと安心です");
      }, 2500);
    }
  }

  KN.backup = {
    SNAP_KEY, KEEP,
    snapshot, maybeDaily, list, restore, clear,
    lastExportAt, markExported, exportDue,
    init,
  };
})();

/* ---- js/insights.js ---- */
/* =========================================================
   くらしノート — insights

   Reads the shopping data and says something useful about it. Everything
   here is arithmetic on the user's own records: no network, no key, works
   on a plane. That also means it never guesses — a figure shown here can
   be traced back to a price the user typed in.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { yen, formatDate } = KN.util;
  const store = KN.store;

  const STALE_DAYS = 90;
  const ONE_STOP_TOLERANCE = 0.05;   // within 5% of the best split is "close enough"

  const daysSince = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;

  /** Every price recorded for one product at one store, oldest first. */
  function history(product, storeId) {
    return product.prices
      .filter((pr) => pr.storeId === storeId)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
  }

  /* ---------------- individual checks ---------------- */

  /* The latest price against the one before it, at the same store. Anything
     else would compare two different shops and call it a change. */
  function priceMoves(products) {
    const out = [];
    products.forEach((p) => {
      store.currentPrices(p).forEach((cur) => {
        const h = history(p, cur.storeId);
        if (h.length < 2) return;
        const prev = h[h.length - 2];
        const delta = cur.price - prev.price;
        if (!delta) return;
        const st = store.getStore(cur.storeId);
        if (!st) return;
        const up = delta > 0;
        out.push({
          kind: "price-move",
          weight: 60 + Math.abs(delta) / Math.max(prev.price, 1) * 40,
          icon: up ? "📈" : "📉",
          title: `${p.name}が${up ? "値上がり" : "値下がり"}`,
          body: `${st.name}で ${yen(prev.price)} → ${yen(cur.price)}（${up ? "+" : ""}${yen(delta)}）`,
        });
      });
    });
    return out;
  }

  /* 「値段は高いが量あたりは安い」 という指摘はもう出ない。同じものを同じ
     大きさで買うのだから、比べるのは値段そのもの。入数で割るときも全店を
     同じ数で割るので、順番は変わらない。 */

  /* Is this trip worth splitting across shops, or is one stop good enough? */
  function tripRouting(items) {
    const priced = items
      .map((it) => ({ it, p: store.getProduct(it.productId) }))
      .filter((r) => r.p && store.bestPrice(r.p));
    if (priced.length < 2) return [];

    const cheapest = priced.reduce((sum, r) => sum + store.bestPrice(r.p).price * r.it.qty, 0);

    // What each store costs if you buy there whatever it stocks and pick up
    // the rest wherever it is cheapest — a total you could actually spend.
    const totals = store.sortedStores().map((st) => {
      let total = 0, here = 0;
      priced.forEach((r) => {
        const at = store.priceAt(r.p, st.id);
        const best = store.bestPrice(r.p);
        if (at) { total += at.price * r.it.qty; here += 1; }
        else { total += best.price * r.it.qty; }
      });
      return { st, total, here };
    }).filter((t) => t.here > 0).sort((a, b) => a.total - b.total);

    if (!totals.length) return [];
    const top = totals[0];
    const extra = top.total - cheapest;

    if (extra <= 0 || extra <= cheapest * ONE_STOP_TOLERANCE) {
      return [{
        kind: "one-stop",
        weight: 100,
        icon: "🛒",
        title: `今回は${top.st.name}だけで足ります`,
        body: extra <= 0
          ? `${priced.length}品を ${yen(top.total)} で買えます。店を回る必要はありません。`
          : `${priced.length}品を ${yen(top.total)}。店を分けても ${yen(extra)} しか変わりません。`,
      }];
    }
    return [{
      kind: "split",
      weight: 95,
      icon: "🧭",
      title: `店を分けると ${yen(extra)} 安くなります`,
      body: `${top.st.name}中心なら ${yen(top.total)}、それぞれ最安の店で買うと ${yen(cheapest)} です。`,
    }];
  }

  /* A price from last spring is a guess, not a price. */
  function stalePrices(products) {
    const out = [];
    products.forEach((p) => {
      const best = store.bestPrice(p);
      if (!best) return;
      const age = daysSince(best.date);
      if (!(age > STALE_DAYS)) return;
      out.push({
        kind: "stale",
        weight: 40 + Math.min(age / 10, 20),
        icon: "🕰️",
        title: `${p.name}の値段が古くなっています`,
        body: `最後に記録したのは ${formatDate(best.date)}。次に見かけたら確かめると合計が正確になります。`,
      });
    });
    return out;
  }

  /* ---------------- public ---------------- */

  /**
   * Findings for the items being shopped, strongest first.
   * @param {Array} items  the trip (or the whole active list when nothing is starred)
   */
  function forItems(items, limit = 3) {
    const products = [];
    const seen = new Set();
    items.forEach((it) => {
      if (seen.has(it.productId)) return;
      seen.add(it.productId);
      const p = store.getProduct(it.productId);
      if (p && p.prices.length) products.push(p);
    });
    if (!products.length) return [];

    const found = [
      ...tripRouting(items),
      ...priceMoves(products),
      ...stalePrices(products),
    ];

    // One finding per kind, so a single stale shelf cannot fill the card.
    const bestOfKind = new Map();
    found.forEach((f) => {
      const cur = bestOfKind.get(f.kind);
      if (!cur || f.weight > cur.weight) bestOfKind.set(f.kind, f);
    });

    return [...bestOfKind.values()].sort((a, b) => b.weight - a.weight).slice(0, limit);
  }

  KN.insights = { forItems, STALE_DAYS };
})();

/* ---- js/pull-refresh.js ---- */
/* =========================================================
   くらしノート — the edges of a scroll: pull to refresh, and the give
   at the bottom

   There is no server behind this app, so a refresh cannot fetch anything.
   What it can do is real, if small: write out any save still in flight,
   re-read the file from disk so a copy open elsewhere is picked up, repaint
   the screen, and ask the service worker whether a newer build has been
   deployed. The gesture is mostly there because reaching the top of a list
   and pulling is what a phone user does; this makes that mean something
   instead of nothing.

   The screens turn the browser's own overscroll off (see overscroll-behavior
   in base.css) because its bounce fought this gesture at the top. That left
   the bottom of a list stopping dead against nothing, so the same engine
   gives the bottom edge a band too — no chip, no action, just the give that
   tells a finger it has reached the end.

   Both edges are painted by one loop that eases what is on screen towards
   where the finger is, rather than writing the finger's position straight
   out. Touch points do not arrive evenly, and copying them frame for frame
   put every gap in the stream on the screen. Chasing them smooths the whole
   thing out — a few frames behind the finger, which nobody sees, and no
   steps, which everybody does.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, raw, haptic } = KN.util;

  /* The mark, drawn rather than borrowed from the icon set, because it has to
     do two different things.

     While you pull it is a redo mark: a ring with a gap, an arrowhead at the
     leading end that never quite closes the circle, and the whole thing turns
     as you go — one full revolution by the time it is armed. The ring is not
     just revealed, it is drawn: the stroke runs on from the gap and the head
     fades in as the last of it lands.

     Once you let go the arrowhead goes and a second arc takes over, chasing
     itself around the ring. Same circle, same weight, so it reads as the mark
     carrying on rather than a different thing appearing.

     Geometry, so the numbers are not mysterious: r=9 about (12,12). The arc
     runs clockwise from -60° to 240°, i.e. 300° of the circle, leaving the
     gap across the top. Its length is 2·π·9·(300/360) = 47.12, which is the
     dash pattern the drawing-on relies on. The head is a triangle centred on
     the arc's end and turned to its tangent there. */
  const MARK = raw(`
    <svg class="ptr-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path class="ptr-arc" d="M16.5 4.21A9 9 0 1 1 7.5 4.21"/>
      <path class="ptr-head" d="M10.1 2.71 7.3 6.86 5.1 3.05Z" fill="currentColor" stroke="none"/>
      <circle class="ptr-spin" cx="12" cy="12" r="9"/>
    </svg>
  `);

  const ARC_LEN = 47.12;

  const TRIGGER = 56;    // pull the chip this far down to arm the refresh
  const HOLD    = 52;    // where it parks while the refresh runs
  const MAX     = 96;    // it never stretches further than this
  const FOOT    = 76;    // and the band at the bottom never further than this
  const MIN_RUN = 550;   // keep the spinner up long enough to be read
  const SLOP    = 10;    // finger travel before we decide what this gesture is

  /* How hard the painted position is pulled towards the finger each frame,
     and towards home once the finger is gone. Low numbers on purpose: a
     little lag is invisible, whereas an uneven touch stream copied straight
     to the screen is not. */
  const FOLLOW  = 0.22;
  const SETTLE  = 0.13;

  let host = null;       // #screens
  let ptr = null;        // the chip
  let mark = null;       // the svg inside it
  let arc = null;        // the redo ring, drawn on as you pull
  let head = null;       // its arrowhead

  let screenEl = null;   // the screen being pulled
  let startY = 0, startX = 0;
  let target = 0;        // where the finger says the screen should be
  let shown = 0;         // where it actually is, chasing target
  let edge = null;       // "top" | "bottom" — which end this gesture belongs to
  let couldTop = false, couldBottom = false;
  let armed = false;     // the touch started somewhere an edge could give
  let engaged = false;   // it turned out to be a pull rather than a scroll
  let busy = false;
  let loop = 0;
  let bare = false;      // a band with no chip on it — the fling below
  let out = false;       // the fling is still on its way out, not yet coming back

  /* A flick that runs out of list stops against the boundary as if it had hit
     a wall, because the browser's own overscroll is off. Catching how fast it
     was going as it arrives lets the same band carry it a little past the end
     and bring it back — the give a finger gets, given to a throw as well. */
  const FLING_MIN  = 0.35;   // px/ms; below this it is a drift, not a throw
  const FLING_GAIN = 9;      // how much of the speed becomes travel
  const FLING_MAX  = 46;     // and how far that is ever allowed to reach
  const FLING_OUT  = 0.34;   // it goes out briskly and comes back gently
  let lastEl = null, lastTop = 0, lastAt = 0;

  function init() {
    host = document.getElementById("screens");
    if (!host) return;

    ptr = node(html`<div class="ptr"><span class="ptr-ring">${MARK}</span></div>`);
    mark = ptr.querySelector(".ptr-mark");
    arc = ptr.querySelector(".ptr-arc");
    head = ptr.querySelector(".ptr-head");
    // First child, so the screens paint over it. It only ever shows in the
    // gap a pull opens up above them.
    host.prepend(ptr);

    host.addEventListener("touchstart", onStart, { passive: true });
    host.addEventListener("touchmove", onMove, { passive: false });
    host.addEventListener("touchend", onEnd);
    host.addEventListener("touchcancel", onEnd);
    // scroll does not bubble; the capture phase is how one listener covers
    // every screen, including ones mounted later.
    host.addEventListener("scroll", onScroll, true);

    /* Switching apps mid-gesture can take the touch away without a touchend
       ever arriving, and the page is suspended before the band can spring
       back. On the way in it would then still be held open — a screen sitting
       an inch off the top with no way to put it back. Whatever was in flight
       when the app left is over; drop it and start square. */
    document.addEventListener("visibilitychange", clear);
    window.addEventListener("pageshow", clear);
  }

  /** Abandon any band, gesture or animation, and put the screen back. */
  function clear() {
    armed = engaged = out = bare = false;
    edge = null;
    if (loop) { cancelAnimationFrame(loop); loop = 0; }
    target = shown = 0;
    lastEl = null;
    if (ptr) {
      ptr.style.opacity = "0";
      ptr.style.transform = "";
    }
    // The refresh keeps running if it was mid-flight; only the motion stops.
    host.querySelectorAll(".screen").forEach((el) => {
      el.style.transform = "";
      el.style.willChange = "";
    });
    if (ptr) ptr.style.willChange = "";
  }

  /** Nothing should be pulled out from under a keyboard, a sheet or a swipe. */
  function blocked() {
    if (busy) return true;
    if (KN.reorder.isActive()) return true;
    if (document.documentElement.classList.contains("kb-open")) return true;
    if (document.querySelector(".sheet")) return true;
    if (document.querySelector(".item-wrap.is-open")) return true;
    return false;
  }

  const atTop = (el) => el.scrollTop <= 0;
  const atBottom = (el) => el.scrollHeight - el.clientHeight - el.scrollTop <= 1;

  function onStart(e) {
    armed = engaged = false;
    edge = null;
    if (e.touches.length !== 1 || blocked()) return;

    screenEl = host.querySelector(".screen.is-active");
    if (!screenEl) return;
    // Which ends have any give in them. Anywhere in the middle of a list, a
    // drag either way is just a scroll.
    couldTop = atTop(screenEl);
    couldBottom = atBottom(screenEl);
    if (!couldTop && !couldBottom) return;

    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    armed = true;
  }

  function onMove(e) {
    if (!armed) return;
    // A row lifted out of the list mid-press: that gesture is now a reorder.
    if (KN.reorder.isActive()) { armed = false; return; }
    const t = e.touches[0];
    const dy = t.clientY - startY;
    const dx = t.clientX - startX;

    if (!engaged) {
      // Give up on the sideways drag that deletes a row or stars it.
      if (Math.abs(dx) > SLOP) { armed = false; return; }
      if (Math.abs(dy) < SLOP || Math.abs(dy) < Math.abs(dx) * 1.5) return;
      // Down at the top, up at the bottom — anything else is a scroll, and
      // the scroller has to have it.
      if (dy > 0 && couldTop && atTop(screenEl)) edge = "top";
      else if (dy < 0 && couldBottom && atBottom(screenEl)) edge = "bottom";
      else { armed = false; return; }
      engaged = true;
      // A finger arriving over a flick's band takes it over from here.
      out = false;
      bare = false;
      begin();
    }

    // Taking the gesture means the scroller must not also act on it.
    e.preventDefault();
    // Rubber band: the first pixels come easily, the last ones barely move.
    target = edge === "top"
      ? MAX * (1 - Math.exp(-Math.max(0, dy) / MAX))
      : -FOOT * (1 - Math.exp(-Math.max(0, -dy) / FOOT));
  }

  function onEnd() {
    if (!engaged) { armed = false; return; }
    armed = engaged = false;
    if (edge === "top" && shown >= TRIGGER) run();
    else { target = 0; spin(); }
  }

  /* ---------------- carrying a flick past the end ---------------- */

  function onScroll(e) {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains("screen")) return;

    const now = performance.now();
    // Only consecutive samples of the same screen say anything about speed;
    // a long gap or a change of tab is a fresh start, not a fast one.
    const ok = el === lastEl && now - lastAt > 0 && now - lastAt < 120;
    const v = ok ? (el.scrollTop - lastTop) / (now - lastAt) : 0;
    lastEl = el; lastTop = el.scrollTop; lastAt = now;

    // A finger, a refresh, or a band already running owns the screen.
    if (engaged || armed || busy || loop) return;
    if (Math.abs(v) < FLING_MIN) return;
    if (v > 0 ? atBottom(el) : atTop(el)) fling(el, v);
  }

  function fling(el, v) {
    const dist = Math.min(FLING_MAX, Math.abs(v) * FLING_GAIN);
    if (dist < 4) return;
    screenEl = el;
    bare = true;              // no chip: a throw must never arm the refresh
    out = true;
    shown = 0;
    target = v > 0 ? -dist : dist;
    begin();
  }

  /* ---------------- the motion ---------------- */

  function begin() {
    ptr.style.willChange = "transform, opacity";
    if (screenEl) screenEl.style.willChange = "transform";
    spin();
  }

  function spin() {
    if (!loop) loop = requestAnimationFrame(tick);
  }

  function tick() {
    loop = 0;
    const k = engaged ? FOLLOW : (out ? FLING_OUT : SETTLE);
    shown += (target - shown) * k;

    // The flick's band turns round once it has nearly reached its furthest
    // point, rather than creeping the last pixel — out briskly, back gently.
    if (out && Math.abs(target - shown) < Math.abs(target) * 0.12) {
      out = false;
      target = 0;
    }
    // Close enough is home: without this the last hundredth of a pixel keeps
    // a frame running forever.
    if (!engaged && !out && Math.abs(target - shown) < 0.25) shown = target;

    paint();
    if (engaged || out || shown !== target) spin();
    else rest();
  }

  function rest() {
    ptr.style.willChange = "";
    bare = false;
    if (screenEl) {
      screenEl.style.willChange = "";
      if (shown === 0) screenEl.style.transform = "";
    }
  }

  function paint() {
    if (screenEl) screenEl.style.transform = `translate3d(0, ${shown.toFixed(2)}px, 0)`;

    // The chip belongs to a finger at the top edge only. The bottom band and
    // the band a flick leaves behind are bare give, with nothing to arm.
    if (shown <= 0 || bare) {
      ptr.style.opacity = "0";
      return;
    }
    ptr.style.transform = `translate3d(0, ${shown.toFixed(2)}px, 0)`;
    ptr.style.opacity = String(Math.min(1, shown / 26));
    if (busy) return;   // from here on the spinner has the mark

    // The ring draws itself on, the head lands at the end of it, and the
    // whole mark turns once by the time the pull is armed.
    const p = shown / TRIGGER;
    ptr.classList.toggle("is-ready", shown >= TRIGGER);
    arc.style.strokeDashoffset = (ARC_LEN * (1 - Math.min(1, p))).toFixed(2);
    head.style.opacity = String(Math.max(0, Math.min(1, (p - 0.72) / 0.28)));
    mark.style.transform = `rotate(${(Math.min(p, 1.2) * 300).toFixed(1)}deg)`;
  }

  function run() {
    busy = true;
    haptic();
    ptr.classList.add("is-busy");
    ptr.classList.remove("is-ready");
    // Hand the mark over to the spinner. Both of these were set inline on the
    // way down, and inline beats the `is-busy` rules that would hide them.
    mark.style.transform = "";
    head.style.opacity = "0";
    target = HOLD;
    spin();

    const started = Date.now();
    Promise.all([refreshData(), checkForNewBuild()])
      .catch(() => {})
      .then(() => {
        const left = Math.max(0, MIN_RUN - (Date.now() - started));
        setTimeout(() => {
          busy = false;
          ptr.classList.remove("is-busy");
          target = 0;
          spin();
        }, left);
      });
  }

  function refreshData() {
    return new Promise((resolve) => {
      try { KN.store.reload(); } catch (err) { console.warn("refresh failed", err); }
      resolve();
    });
  }

  /* The installed app can sit on the home screen for weeks. Asking the worker
     to look for a new build is the one thing here that reaches the network —
     and if it finds one, app.js reloads into it on its own. */
  function checkForNewBuild() {
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistration) {
      return Promise.resolve();
    }
    return navigator.serviceWorker.getRegistration()
      .then((reg) => (reg ? reg.update() : null))
      .catch(() => null);
  }

  KN.pullRefresh = { init };
})();

/* ---- js/notify.js ---- */
/* =========================================================
   くらしノート — 時刻のお知らせ

   What this can and cannot do, said plainly, because the difference matters
   to whoever relies on it:

   It CAN put a notification on the phone the moment a todo's time comes round
   while the app is running, and it CAN tell you on the way in about the ones
   whose time passed while you were away.

   It CANNOT wake the app to ring at 19:30 while the app is closed. That takes
   a push from a server — iOS 16.4 onwards will deliver Web Push to an
   installed PWA, but something has to send it, and this app has no server and
   no account; it is a folder of files on GitHub Pages and a copy of your data
   on your own phone. There is no local scheduled-notification API on iOS
   either (no Notification Triggers), so a timer in the page dies with the
   page. Anything claiming otherwise here would be a promise the app breaks
   silently, at the exact moment you were counting on it.

   So: an alarm while you are holding the phone, and a catch-up when you pick
   it up. The settings row says as much rather than saying 「通知」 and letting
   it be assumed.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const store = KN.store;

  const hasAPI = () => typeof window !== "undefined" && "Notification" in window;

  /** Only where a notification could actually be shown. */
  function supported() {
    if (!hasAPI()) return false;
    // iOS only permits this from an installed app; asking in a Safari tab
    // throws or silently does nothing.
    return typeof navigator !== "undefined" && "serviceWorker" in navigator;
  }

  const enabled = () => supported() && store.get().settings.todoNotify === true;

  /** Switched on in the app, but the phone is not letting anything through. */
  function blocked() {
    if (!enabled()) return false;
    return hasAPI() && Notification.permission !== "granted";
  }

  function enable() {
    if (!supported()) return Promise.resolve(false);
    const ask = Notification.requestPermission
      ? Notification.requestPermission()
      : Promise.resolve(Notification.permission);
    return Promise.resolve(ask)
      .then((res) => {
        if (res !== "granted") return false;
        store.update((s) => { s.settings.todoNotify = true; });
        /* Anything already past at the moment it is switched on is history,
           not news — announcing four things from this morning as the switch
           flips is the app shouting about its own settings screen. */
        store.markAnnounced(store.todosToAnnounce().map((t) => t.id));
        return true;
      })
      .catch(() => false);
  }

  function disable() {
    store.update((s) => { s.settings.todoNotify = false; });
  }

  /* ---------------- showing one ---------------- */

  /* iOS shows nothing for `new Notification()` in a standalone app; it wants
     the service worker's registration to do it. Desktop browsers take either,
     so the registration is tried first and the constructor is the fallback. */
  function show(title, body, tag) {
    const opts = {
      body,
      tag: tag || "kn-todo",
      icon: "icons/icon-192.png",
      badge: "icons/icon-192.png",
      lang: "ja",
      renotify: true,
      data: { screen: "todo" },
    };
    const viaSW = navigator.serviceWorker && navigator.serviceWorker.ready;
    if (viaSW) {
      return viaSW
        .then((reg) => reg.showNotification(title, opts))
        .catch(() => fallback(title, opts));
    }
    return Promise.resolve(fallback(title, opts));
  }

  function fallback(title, opts) {
    try { new Notification(title, opts); } catch (_) { /* nothing more to try */ }
  }

  /* ---------------- the round ---------------- */

  /**
   * Say whatever has come round since the last look, and remember saying it.
   *
   * One notification however many are due: four separate banners for 19:30 is
   * four things to dismiss for one moment in the day.
   */
  function tick() {
    if (!enabled() || blocked()) return Promise.resolve(0);
    const due = store.todosToAnnounce();
    if (!due.length) return Promise.resolve(0);

    const first = due[0];
    const title = due.length === 1
      ? `${first.time} ${first.title}`
      : `${first.time} ${first.title} ほか${due.length - 1}件`;
    const body = due.length === 1
      ? (first.memo || "やることの時刻です")
      : due.map((t) => `${t.time} ${t.title}`).join("\n");

    store.markAnnounced(due.map((t) => t.id));
    return show(title, body, "kn-todo-time").then(() => due.length, () => due.length);
  }

  /* ---------------- keeping watch ---------------- */

  let timer = null;

  function init() {
    if (!supported()) return;

    /* Once a minute is as fine as the clock the times are written in. It is
       also what makes the badge correct: 19:30 arriving has to change the
       number on the icon whether or not anyone is looking at the screen. */
    const beat = () => { tick(); if (KN.onMinute) KN.onMinute(); };
    if (timer) clearInterval(timer);
    timer = setInterval(beat, 30000);

    /* And on the way back in — this is the path that actually carries most of
       them, since the app is usually not running at 19:30. */
    const wake = () => { if (document.visibilityState !== "hidden") beat(); };
    document.addEventListener("visibilitychange", wake);
    window.addEventListener("pageshow", wake);
    window.addEventListener("focus", wake);
    wake();
  }

  KN.notify = { supported, enabled, blocked, enable, disable, tick, init };
})();

/* ---- js/product-sheet.js ---- */
/* =========================================================
   くらしノート — shared product / item detail sheet
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, perItemPrice, isCounted, formatSize, relativeDate, formatDate, UNITS, debounce, haptic } = KN.util;
  const store = KN.store;

  /**
   * Open the detail sheet for a product.
   * @param {string} productId
   * @param {object} [opts]
   * @param {string} [opts.itemId] when opened from the shopping list, shows qty/memo controls
   */
  function open(productId, { itemId } = {}) {
    const product = store.getProduct(productId);
    if (!product) return;

    const body = node(html`<div class="stack" style="gap:20px"></div>`);

    const pricesWrap = node(html`<div class="stack" style="gap:12px"></div>`);
    const rerenderPrices = () => renderPrices(pricesWrap, productId);

    const category = categoryField(productId);
    const mark = iconField(productId, () => {
      // The picture is on the sheet's own title too; keep the two agreeing.
      const head = sheetHandle && sheetHandle.el.querySelector(".sheet-mark");
      if (head) head.innerHTML = store.productMark(store.getProduct(productId));
    });
    body.append(nameField(productId, category.recheck, mark.recheck));
    if (itemId) body.append(itemSection(itemId));
    body.append(mark.el);
    body.append(category.el);
    body.append(sizeField(productId, rerenderPrices));
    body.append(pricesWrap);
    rerenderPrices();

    body.append(historySection(productId));
    body.append(dangerSection(productId, () => sheetHandle.close()));

    const foot = node(html`<button class="btn btn-primary btn-block">完了</button>`);

    const sheetHandle = KN.ui.sheet({
      title: product.name,
      titleMark: store.productMark(product),
      content: body,
      footer: foot,
    });

    foot.addEventListener("click", () => sheetHandle.close());
    return sheetHandle;
  }

  /* ---------------- fields ---------------- */

  function nameField(productId, onRecategorised, onRenamed) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <label class="field">
        <span class="field-label">商品名</span>
        <input class="input js-name" value="${p.name}" placeholder="商品名">
      </label>
    `);
    const input = wrap.querySelector(".js-name");

    const save = debounce(() => {
      const v = input.value.trim();
      if (!v) return;

      /* A rename is very often a correction. 「コンソメ」 came out as その他,
         so it gets renamed 「コンソメ(調味料)」 — and the new name now says
         plainly where it goes. Re-reading it costs nothing and saves a second
         trip to the picker.

         Two limits. A category picked by hand is never overruled: that was a
         decision, and this is a guess. And a guess that lands on その他 is
         thrown away rather than applied — a name we cannot place must not
         demote a category that is already right. */
      let moved = null;
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.name = v;
        if (rec.catManual) return;
        const guess = store.guessCategory(v);
        if (guess !== store.OTHER_CATEGORY && guess !== rec.categoryId) {
          rec.categoryId = guess;
          moved = guess;
        }
      });

      // The picture follows the name too, whether or not the category moved.
      onRenamed && onRenamed();

      if (moved) {
        onRecategorised && onRecategorised();
        KN.ui.toast(`「${store.getCategory(moved).name}」に移しました`);
        haptic();
      }
    }, 350);

    input.addEventListener("input", save);
    return wrap;
  }

  /* ---------------- the picture ---------------- */

  /* The guess reads the name and is usually right. Where it is wrong it is
     wrong in a way only the person who buys the thing can see — 「コンソメ」
     is a box to the app and a stock cube in the cupboard — so the picture can
