      onDropCross: (target) => {
        paintDropTarget(null);
        const todoId = dragging;
        if (!todoId) return;
        const t = store.getTodo(todoId);
        const to = target.drop();
        const patch = { due: to.due };
        // A day-shelf says nothing about which part of the day, so it leaves
        // that and any clock time alone; 朝 and 午後 and 夜 set the part and
        // drop the time, and 「いつか」 clears both.
        if ("part" in to) patch.part = to.part;
        else if (to.due === null) patch.part = null;
        if ("time" in to) patch.time = to.time;
        store.updateTodo(todoId, patch);
        haptic(14);
        if (t) {
          KN.ui.toast(target.none
            ? `「${t.title}」の日付をはずしました`
            : `「${t.title}」を${target.label}に`);
        }
      },
    });

    // reorder.js hands the drop nothing but the target, so the row being
    // carried is remembered here, at the one moment it is unambiguous.
    box.addEventListener("pointerdown", (e) => {
      const wrap = e.target.closest(".item-wrap");
      dragging = wrap ? wrap.dataset.todoId : null;
    });
  }

  let dragging = null;

  /** Which shelf is under this point, if any. */
  function groupUnder(clientY) {
    const sections = els.body.querySelectorAll(".todo-group");
    for (const sec of sections) {
      const r = sec.getBoundingClientRect();
      if (clientY >= r.top && clientY <= r.bottom) {
        return groups.find((x) => x.id === sec.dataset.group) || null;
      }
    }
    return null;
  }

  function paintDropTarget(id) {
    els.body.querySelectorAll(".todo-group").forEach((sec) => {
      sec.classList.toggle("is-drop-target", !!id && sec.dataset.group === id);
    });
  }

  /* Finished and put-away todos, dated, newest first — the same drawer, in the
     same words, as the shopping list's and the price screen's. */
  function archiveSection(closed, tiles) {
    const open = store.get().settings.showTodoArchive === true;

    const section = node(html`
      <section class="cat-group">
        <button class="done-head" aria-expanded="${String(open)}">
          ${icon("chevron")} アーカイブ <span class="cat-head-count">${closed.length}</span>
        </button>
        <div class="item-list js-done ${tiles ? "is-tiles" : ""}" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    if (open) {
      const box = section.querySelector(".js-done");
      closed.slice()
        .sort((a, b) => String(store.todoClosedAt(b) || "").localeCompare(String(store.todoClosedAt(a) || "")))
        .forEach((t) => box.append(todoRow(t, tiles, groups)));
    }

    section.querySelector(".done-head").addEventListener("click", () => {
      store.update((s) => { s.settings.showTodoArchive = !open; });
    });

    return section;
  }

  /** The ＋ the shell floats over this screen. */
  function dockButton() {
    const fab = node(html`
      <div class="quick-add">
        <button class="add-fab js-open-add" aria-label="やることを追加">${icon("plus")}</button>
      </div>
    `);
    fab.querySelector(".js-open-add").addEventListener("click", () => openSheet(null));
    return fab;
  }

  KN.screens = KN.screens || {};
  KN.screens.todo = { mount, render, dockButton };
})();

/* ---- js/screen-list.js ---- */
/* =========================================================
   くらしノート — shopping list screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, frag, icon, yen, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let categoryFilter = null;   // categoryId or null = all
  let query = "";              // folded, from the search bar

  /* ---------------- mount (static chrome) ---------------- */

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">買い物リスト</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            ${/* No 「まとめて削除」 on this bar any more. Having bought
                 something is not a reason to throw the record of it away, and
                 there is no moment in a shop where that is the thing you
                 reach for. What is bought drops into the archive below,
                 dated, and stays there.

                 The three that are here are the same three, in the same
                 order, on this screen and on 価格: くらべる・並べ方・さがす. */""}
            <button class="icon-btn js-compare" aria-label="お店をくらべる" title="お店をくらべる">
              ${icon("shopCompare")}
            </button>
            <button class="icon-btn js-layout"></button>
            <button class="icon-btn js-search-btn" aria-label="商品名で探す">${icon("search")}</button>
          </div>
        </header>

        <div class="search-wrap js-search-wrap" hidden>
          <div class="search-bar">
            ${icon("search")}
            <input class="search-input js-search" placeholder="リストの中を探す" aria-label="リストの中を探す"
                   autocomplete="off" spellcheck="false">
            <button class="icon-btn js-search-clear" aria-label="検索をクリア"
                    style="width:28px;height:28px" hidden>${icon("close")}</button>
          </div>
        </div>

        <div class="progress-wrap js-progress-wrap" hidden>
          <div class="progress"><div class="progress-bar js-progress" style="width:0%"></div></div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    els = {
      sub:        chrome.querySelector(".js-sub"),
      layout:     chrome.querySelector(".js-layout"),
      compare:    chrome.querySelector(".js-compare"),
      searchBtn:  chrome.querySelector(".js-search-btn"),
      searchWrap: chrome.querySelector(".js-search-wrap"),
      search:     chrome.querySelector(".js-search"),
      searchClear: chrome.querySelector(".js-search-clear"),
      progWrap:   chrome.querySelector(".js-progress-wrap"),
      progress:   chrome.querySelector(".js-progress"),
      filter:     chrome.querySelector(".js-filter"),
      body:       chrome.querySelector(".js-body"),
      topbar:     chrome.querySelector(".topbar"),
    };

    els.layout.addEventListener("click", KN.ui.toggleLayout);
    els.compare.addEventListener("click", () => KN.showScreen("compare"));
    KN.ui.wireSearch(els, () => render(), (q) => { query = q; });

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- the add sheet ---------------- */

  /* One form for everything a new line on the list needs: what it is, how
     many, and which aisle it belongs to. The name field still suggests as you
     type — tapping a suggestion is what turns 「ぎゅうにゅう」 into the 牛乳
     already on file, with its prices and its category, instead of a second
     product with the same name.

     It closes after each add. Staying open saved a tap, and cost the sight of
     the row that had just appeared — the sheet sat over the list it had
     changed. One add, one close; the ＋ is under the thumb for the next. */
  function openAddSheet() {
    haptic(10);

    let picked = null;        // an existing product chosen from the suggestions
    let catTouched = false;   // the category was set by hand, so stop guessing
    let fav = false;          // ★ — part of the trip being shopped now

    /* No 個数 here. It was a stepper that said 1 nearly every time, in a form
       whose whole job is to be over quickly; the quantity is a detail about a
       line that already exists, and the row's own sheet is where it belongs.
       The ★ took its place, because *that* is a decision made while writing
       the list — this trip or sometime — and going back to set it afterwards
       is the trip through the list the button was meant to save. */
    const body = node(html`
      <div class="stack" style="gap:18px">
        <div class="field">
          <span class="field-label">商品名</span>
          <input class="input js-name" placeholder="例：食器用洗剤"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-autocomplete="list">
          <div class="js-ac"></div>
          <span class="field-hint js-known" hidden></span>
        </div>

        <div class="field">
          <button type="button" class="icon-auto fav-toggle js-fav" aria-pressed="false">
            <span class="icon-pick-mark js-fav-mark">${icon("star")}</span>
            <span class="icon-pick-text">
              <span class="icon-pick-name">今回買う</span>
              <span class="icon-pick-sub js-fav-sub">★を付けると、今回の買い物としてまとまります</span>
            </span>
          </button>
        </div>

        <div class="field">
          <span class="field-label">カテゴリ</span>
          <div class="js-cat"></div>
        </div>

        <label class="field">
          <span class="field-label">メモ（任意）</span>
          <input class="input js-memo" placeholder="例：詰め替え用" autocomplete="off">
        </label>
      </div>
    `);

    const nameEl = body.querySelector(".js-name");
    const memoEl = body.querySelector(".js-memo");
    const acHost = body.querySelector(".js-ac");
    const known  = body.querySelector(".js-known");
    const favBtn = body.querySelector(".js-fav");
    const favSub = body.querySelector(".js-fav-sub");

    const foot = node(html`<button class="btn btn-primary btn-block js-add" disabled>リストに追加</button>`);
    const addBtn = foot;

    const handle = KN.ui.sheet({ title: "買うものを追加", content: body, footer: foot });

    const cat = KN.ui.categoryPicker(body.querySelector(".js-cat"), {
      selectedId: store.OTHER_CATEGORY,
      onSelect: () => { catTouched = true; },
    });

    favBtn.addEventListener("click", () => {
      fav = !fav;
      favBtn.classList.toggle("is-on", fav);
      favBtn.setAttribute("aria-pressed", String(fav));
      favSub.textContent = fav
        ? "今回の買い物としてまとまります"
        : "★を付けると、今回の買い物としてまとまります";
      haptic(10);
    });

    /* Everything the name field drives: the button, the suggestions, and —
       until the category is touched by hand — the guess underneath it. */
    function onName() {
      const typed = nameEl.value.trim();
      addBtn.disabled = !typed;
      // Typing on past a chosen suggestion means it is no longer that product.
      if (picked && KN.util.foldKana(picked.name) !== KN.util.foldKana(typed)) {
        picked = null;
        known.hidden = true;
      }
      if (!picked && !catTouched) cat.set(typed ? store.guessCategory(typed) : store.OTHER_CATEGORY);
      renderSuggestions(nameEl, acHost, typed, choose);
    }

    /* A suggestion tapped: from here the form is about that product, so its
       category comes along and the sheet says which one it landed on. */
    function choose(product) {
      picked = product;
      nameEl.value = product.name;
      addBtn.disabled = false;
      catTouched = false;
      cat.set(product.categoryId);
      const best = store.bestPrice(product);
      const st = best ? store.getStore(best.storeId) : null;
      known.hidden = false;
      known.textContent = best && st
        ? `登録済みの商品です・${st.name} ${yen(best.price)} が最安`
        : "登録済みの商品です";
      acHost.innerHTML = "";
      nameEl.focus();
    }

    nameEl.addEventListener("input", onName);
    nameEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      submit();
    });
    memoEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    addBtn.addEventListener("click", submit);

    function submit() {
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }

      const product = picked || store.findProductByName(name)
        || store.addProduct({ name, categoryId: cat.current });

      /* A category chosen by hand outranks the guess, and is remembered — the
         next 「コンソメ」 lands where this one did without being told again.
         Applied even when the product was just created with that category:
         the guess and the choice agreeing does not make it a guess. */
      if (catTouched) {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === product.id);
          if (rec) { rec.categoryId = cat.current; rec.catManual = true; }
        });
        store.learnCategory(product.name, cat.current);
      }

      const memo = memoEl.value.trim();
      const already = store.get().items.find((i) => i.productId === product.id && !i.checked);
      if (already) {
        // Already on the list: nothing to add, but the ★ and the memo are
        // still what was just said about it.
        store.update((s) => {
          const rec = s.items.find((i) => i.id === already.id);
          if (!rec) return;
          if (memo) rec.memo = memo;
          if (fav) rec.fav = true;
        });
        KN.ui.toast(`「${product.name}」はもうリストにあります`);
      } else {
        const rec = store.addItem(product.id, { memo });
        if (fav) store.update((s) => {
          const it = s.items.find((i) => i.id === rec.id);
          if (it) it.fav = true;
        });
        const c = store.getCategory(product.categoryId);
        KN.ui.toast(`${c.emoji} ${c.name} に「${product.name}」を追加しました`);
      }
      haptic(12);
      /* Closed, not cleared. Staying open was meant to save a tap on a long
         list written in one sitting, but it left the sheet covering the very
         list it had just changed — so every add ended with a look at a form
         instead of at the line that appeared. One add, one close, and the ＋
         is right there under the thumb for the next one. */
      handle.close();
    }

    // The sheet focuses its first control after its own animation; on a phone
    // it deliberately does not, so the keyboard does not fly up over it.
    setTimeout(() => { if (!("ontouchstart" in window)) nameEl.focus(); }, 340);
    return handle;
  }

  /* ---------------- suggestions ---------------- */

  /* Matched on the folded name, so a single 「え」 already surfaces
     「エマール」 — nobody switches to katakana to search their own list. */
  function renderSuggestions(input, host, typed, onPick) {
    const q = KN.util.foldKana(typed);
    if (!q) { host.innerHTML = ""; return; }

    const onList = new Set(store.get().items.filter((i) => !i.checked).map((i) => i.productId));
    const found = store.get().products
      .map((p) => ({ p, key: KN.util.foldKana(p.name) }))
      .filter((r) => r.key.includes(q))
      .sort((a, b) => {
        const aStarts = a.key.startsWith(q) ? 0 : 1;
        const bStarts = b.key.startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.p.name.localeCompare(b.p.name, "ja");
      })
      .slice(0, 6)
      .map((r) => r.p);

    if (!found.length) { host.innerHTML = ""; return; }

    /* Reuse the panel across keystrokes. Rebuilding it restarted the open
       animation on every character, which read as the list flickering. */
    let box = host.querySelector(".ac");
    if (!box) {
      box = node(html`<div class="ac" role="listbox"></div>`);
      host.append(box);
    } else {
      box.innerHTML = "";
    }

    found.forEach((p) => {
      const best = store.bestPrice(p);
      const bestStore = best ? store.getStore(best.storeId) : null;
      const row = node(html`
        <button type="button" class="ac-item" role="option">
          <span class="ac-emoji">${store.productMark(p)}</span>
          <span class="ac-main">
            <span class="ac-name">${p.name}</span>
            <span class="ac-sub">
              ${best && bestStore ? html`${bestStore.name} ${yen(best.price)} が最安` : "価格の記録なし"}
              ${onList.has(p.id) ? html` ・<b>リストにあります</b>` : ""}
            </span>
          </span>
        </button>
      `);
      // Keep the caret where it is; a suggestion is not somewhere to move to.
      row.addEventListener("mousedown", (e) => e.preventDefault());
      row.addEventListener("click", () => onPick(p));
      box.append(row);
    });
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const items = st.items;

    // Once anything is starred the header tracks that trip rather than the whole
    // list, so it agrees with the tab badge instead of quoting a second number.
    const scope = items.some((i) => i.fav) ? items.filter((i) => i.fav) : items;
    const done = scope.filter((i) => i.checked).length;
    const label = scope === items ? "" : "今回買うもの ";

    // 「N件中M件購入済み」rather than「N件・M件購入済み」: the section heading
    // below counts what is left, and two different numbers under the same
    // wording read as a contradiction.
    els.sub.textContent = items.length
      ? (scope.length ? `${label}${scope.length}件中 ${done}件購入済み` : "今回買うものは未選択です")
      : "リストは空です";

    els.progWrap.hidden = scope.length === 0;
    els.progress.style.width = scope.length ? `${(done / scope.length) * 100}%` : "0%";

    KN.ui.paintLayoutButton(els.layout);

    renderFilter(items);
    /* Searching narrows the rows, not the header: the counts above still
       describe the whole trip, because a search is a way of looking at the
       list rather than a change to it. */
    renderBody(query ? items.filter(matchesQuery) : items);
  }

  /** Name, memo, or category — whichever the query happens to be. */
  function matchesQuery(item) {
    const p = store.getProduct(item.productId);
    if (!p) return false;
    const cat = store.getCategory(p.categoryId);
    return KN.util.foldKana(p.name).includes(query)
      || KN.util.foldKana(item.memo || "").includes(query)
      || (!!cat && KN.util.foldKana(cat.name).includes(query));
  }

  function renderFilter(items) {
    const counts = new Map();
    items.filter((i) => !i.checked).forEach((i) => {
      const p = store.getProduct(i.productId);
      if (!p) return;
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });

    if (counts.size < 2) { categoryFilter = null; els.filter.innerHTML = ""; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const chips = [{ id: "", label: "すべて" }].concat(
      store.sortedCategories().filter((c) => counts.has(c.id)).map((c) => ({
        id: c.id, label: c.name, emoji: c.emoji, color: c.color, count: counts.get(c.id),
      })));

    KN.ui.chipRow(els.filter, chips, {
      activeId: categoryFilter || "",
      onPick: (id) => {
        categoryFilter = id && id !== categoryFilter ? id : null;
        haptic();
        render();
      },
    });
  }

  function renderBody(items) {
    els.body.innerHTML = "";

    if (!items.length) {
      // An empty search is not an empty list, and offering 「サンプルを入れて
      // 試す」 to someone who just typed a name would be answering the wrong
      // question entirely.
      els.body.append(query
        ? node(html`
            <p style="text-align:center;color:var(--c-text-3);padding:40px 16px">
              見つかりませんでした
            </p>`)
        : emptyState());
      return;
    }

    const active = items.filter((i) => !i.checked);
    const checked = items.filter((i) => i.checked);
    const trip = active.filter((i) => i.fav);

    if (!trip.length) {
      /* Nothing starred: just the list. A total and a 「今回は◯◯だけで足ります」
         underneath would be answering a question nobody asked — the whole list
         is a standing note of things to buy sometime, not a shopping trip, and
         adding up a year of sometime gives a number with no occasion. Both come
         back the moment something is starred, where they mean this trip. */
      const shown = appendGroups(active);
      if (!shown && categoryFilter) els.body.append(noneInCategory());
      if (checked.length) els.body.append(checkedSection(checked));
      return;
    }

    const rest = active.filter((i) => !i.fav);

    /* 今回買うもの gets a box of its own rather than a heading of its own. A
       heading is a line above a list, and a line above a list is easy to lose
       track of once you are three rows down; a panel the rows sit *inside*
       is unmistakable at any scroll position.

       No total at the foot of it. It could only ever be the total of the
       items whose price happens to be on file, which is not the total of the
       basket — and a number sitting under a list looks like the sum of that
       list. 「4品は値段が未登録」 next to it was an admission that the figure
       above was answering a different question. Each row still says what that
       one costs, which is a fact rather than an estimate. */
    const box = node(html`<section class="trip"></section>`);
    box.append(sectionHead("今回買うもの", trip.length, "trip"));
    const inner = node(html`<div class="trip-body"></div>`);
    const tripShown = appendGroups(trip, inner);
    if (!tripShown && categoryFilter) inner.append(noneInCategory());
    box.append(inner);
    els.body.append(box);
    els.body.append(insightsCard(trip));

    if (rest.length) {
      els.body.append(sectionHead("そのほか", rest.length, "rest"));
      appendGroups(rest);
    }

    if (checked.length) els.body.append(checkedSection(checked));
  }

  /** Renders category groups for the given items. Returns whether anything showed. */
  function appendGroups(list, host) {
    const into = host || els.body;
    const groups = new Map();
    list.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (!p) return;
      if (categoryFilter && p.categoryId !== categoryFilter) return;
      if (!groups.has(p.categoryId)) groups.set(p.categoryId, []);
      groups.get(p.categoryId).push({ item, product: p });
    });

    /* Tiles are one grid for the lot. A separate grid per category would give
       a category of one item a row of its own and two empty cells beside it —
       which is exactly the wasted space the layout is for. The order still
       runs category by category, and each tile wears its own colour, so the
       run is still visible; it just wraps instead of starting a new block. */
    if (KN.ui.isTiles()) {
      const grid = node(html`<div class="item-list is-tiles"></div>`);
      store.sortedCategories().forEach((cat) => {
        (groups.get(cat.id) || []).forEach(({ item, product }) => {
          grid.append(itemRow(item, product));
        });
      });
      if (grid.childElementCount) {
        const section = node(html`<section class="cat-group"></section>`);
        section.append(grid);
        into.append(section);
      }
      return groups.size > 0;
    }

    store.sortedCategories().forEach((cat) => {
      const entries = groups.get(cat.id);
      if (!entries || !entries.length) return;

      /* No heading. The category is written down the left edge of every row
         instead (see .item::before) — a word above each handful of rows was
         more furniture than the list could carry, and the colour says the
         same thing without taking a line. The grouping stays: it is what
         makes the colours run in blocks, and what a drag reorders within. */
      const group = node(html`
        <section class="cat-group" style="--cat:${cat.color || ""}">
          <div class="item-list"></div>
        </section>
      `);
      const listEl = group.querySelector(".item-list");
      entries.forEach(({ item, product }) => listEl.append(itemRow(item, product)));
      wireReorder(listEl);
      into.append(group);
    });

    return groups.size > 0;
  }

  /* Reordering is within a group, because a group is exactly the set of rows
     that are interchangeable: same category, same side of the「今回買うもの」
     line. Dragging a row into another category's group would have to silently
     recategorise it, which is not what picking it up looks like it means. */
  function wireReorder(listEl) {
    KN.reorder.attach(listEl, {
      item: ".item-wrap",
      onDrop: (from, to) => {
        const ids = Array.prototype.map.call(listEl.children, (w) => w.dataset.itemId);
        const [moved] = ids.splice(from, 1);
        ids.splice(to, 0, moved);

        // The group's order is its members' order within the whole list, so
        // the move writes them back into the same slots they already occupy —
        // everything not in this group stays exactly where it was.
        store.update((s) => {
          const inGroup = new Set(ids);
          const slots = [];
          s.items.forEach((it, i) => { if (inGroup.has(it.id)) slots.push(i); });
          const byId = new Map(s.items.map((it) => [it.id, it]));
          ids.forEach((id, k) => { s.items[slots[k]] = byId.get(id); });
        });
        KN.util.haptic(12);
      },
    });
  }

  function sectionHead(label, count, kind) {
    return node(html`
      <h2 class="trip-head trip-head-${kind}">
        ${kind === "trip" ? icon("star") : ""}
        <span>${label}</span>
        <span class="cat-head-count">${count}</span>
      </h2>
    `);
  }

  function noneInCategory() {
    return node(html`
      <p style="text-align:center;color:var(--c-text-3);padding:32px 16px">
        このカテゴリに未購入の商品はありません
      </p>
    `);
  }

  function itemRow(item, product) {
    const best = store.bestPrice(product);
    const bestStore = best ? store.getStore(best.storeId) : null;
    const tiles = KN.ui.isTiles();

    /* Both ways spring back and land as they go, the same as the price
       screen: right is ★, left is the archive. Tiles swipe too, on a shorter
       throw and with the icons alone — a third of a screen has no room for
       the wording. */
    const wrap = node(html`
      <article class="item-wrap ${tiles ? "is-tile-wrap" : ""}"
               data-item-id="${item.id}" style="--cat:${store.productColor(product)}">
        <div class="swipe-yes">
          ${icon("star")}<span>${item.fav ? "★をはずす" : "今回買う"}</span>
        </div>
        <div class="swipe-arch">
          <span>アーカイブ</span>${icon("download")}
        </div>
      </article>
    `);

    const row = tiles ? node(html`
      <div class="item is-tile ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
        <button class="item-body">
          <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
          <span class="item-name">${product.name}</span>
          ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          <span class="tile-price">${best ? yen(best.price * item.qty) : "—"}</span>
        </button>
      </div>
    `) : node(html`
      <div class="item ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="item-body">
          <span class="item-name-row">
            <span class="item-name">${product.name}</span>
            ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          </span>
          <span class="item-meta">
            ${/* When it was bought, on the rows that have been. An archive
                 of undated lines says only 「いつか買った」, which is not a
                 record of anything — and on a day of several trips the clock
                 time is what separates them. */""}
            ${item.checked && item.checkedAt
              ? html`<span class="item-when">${KN.util.formatStamp(item.checkedAt)}</span>` : ""}
            ${item.memo ? html`<span class="item-memo">${item.memo}</span>` : ""}
          </span>
        </button>
        <div class="item-price"></div>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
      </div>
    `);
    wrap.append(row);

    const priceBox = row.querySelector(".item-price");
    if (priceBox && best && bestStore) {
      priceBox.append(frag(html`
        <span class="item-price-amount">${yen(best.price * item.qty)}</span>
        <span class="item-price-store">🏆 ${bestStore.name}</span>
      `));
    } else if (priceBox) {
      priceBox.append(node(html`<span class="item-price-none">値段は未登録</span>`));
    }

    row.querySelector(".check").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) {
          rec.checked = !rec.checked;
          rec.checkedAt = rec.checked ? KN.util.today() : null;
        }
      });
      haptic(12);
    });

    row.querySelector(".fav").addEventListener("click", () => toggleFav(item.id));

    row.querySelector(".item-body").addEventListener("click", () => {
      KN.productSheet.open(product.id, { itemId: item.id });
    });

    KN.ui.swipeActions(wrap, row, {
      tiles,
      onRight: () => toggleFav(item.id),
      onLeft: () => archive(product),
    });
    return wrap;
  }

  /* The same one archive as the price screen's, not a second one: the product
     goes into the drawer at the bottom of 価格, and this row leaves the list —
     which is also what puts out the painted edge over there.

     It is also how a row leaves the list without being bought. There used to
     be a 「削除」 next to it, which only cleared the row and left the product
     sitting in the price list as though nothing had been decided about it;
     saying 「しばらく買わない」 once, in one place, is the honest version. */
  function archive(product) {
    haptic(12);
    const undo = store.setArchived(product.id, true);
    KN.ui.toast(`「${product.name}」をアーカイブしました`, {
      action: { label: "元に戻す", onClick: undo },
    });
  }

  /* ---------------- ★ ---------------- */

  /** ★ marks an item as part of the trip being shopped right now. */
  function toggleFav(itemId) {
    store.update((s) => {
      const rec = s.items.find((i) => i.id === itemId);
      if (rec) rec.fav = !rec.fav;
    });
    haptic(12);
  }

  /* 「購入済み」 became 「アーカイブ」, the same word the price screen's drawer
     uses. They are the same idea — done with, kept, dated, out of the way of
     what is still to do — and calling one of them something else made them
     look like two different mechanisms. Newest first: an archive is read from
     the most recent end. */
  function checkedSection(checked) {
    const st = store.get();
    const open = st.settings.showChecked !== false;

    const section = node(html`
      <section class="cat-group">
        <button class="done-head" aria-expanded="${String(open)}">
          ${icon("chevron")} アーカイブ <span class="cat-head-count">${checked.length}</span>
        </button>
        <div class="item-list js-done" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    const list = section.querySelector(".js-done");
    const newestFirst = checked.slice().sort((a, b) =>
      String(b.checkedAt || "").localeCompare(String(a.checkedAt || "")));
    newestFirst.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (p) list.append(itemRow(item, p));
    });

    section.querySelector(".done-head").addEventListener("click", () => {
      store.update((s) => { s.settings.showChecked = !open; });
    });

    return section;
  }

  /* Whatever the numbers happen to be worth saying out loud. Renders nothing
     at all when there is nothing to say, which is most of the time early on. */
  function insightsCard(items) {
    const found = KN.insights.forItems(items);
    if (!found.length) return document.createDocumentFragment();

    const card = node(html`
      <section class="insights">
        <h2 class="insights-head">${icon("sparkles")} 気づいたこと</h2>
        <div class="insights-list"></div>
      </section>
    `);
    const listEl = card.querySelector(".insights-list");
    found.forEach((f) => {
      listEl.append(node(html`
        <div class="insight">
          <span class="insight-ico">${f.icon}</span>
          <span class="insight-main">
            <span class="insight-title">${f.title}</span>
            <span class="insight-body">${f.body}</span>
          </span>
        </div>
      `));
    });
    return card;
  }

  function emptyState() {
    const wrap = node(html`
      <div class="empty">
        <div class="empty-art">🛒</div>
        <h2 class="empty-title">買うものを追加しましょう</h2>
        <p class="empty-text">
          下の欄に商品名を入れるだけ。カテゴリは自動で振り分けられ、
          お店ごとの値段を登録すると「どこが一番安いか」が分かります。
        </p>
        <button class="btn btn-soft js-sample" style="margin-top:8px">サンプルを入れて試す</button>
      </div>
    `);
    wrap.querySelector(".js-sample").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "サンプルを入れますか？",
        message: "3つのお店と7つの商品・価格が入ったサンプルデータを読み込みます。あとから設定画面で全部消せます。",
        okLabel: "入れる",
      });
      if (ok) { store.loadSample(); KN.ui.toast("サンプルを読み込みました"); }
    });
    return wrap;
  }

  /* The ＋ the shell floats over this screen. Adding something is the one
     thing done one-handed in a shop aisle, so it belongs at the bottom, in the
     middle, where a thumb already is.

     It used to be a text field at the top, with the suggestions opening upward
     over the list. That got you a name and nothing else: category and memo had
     to be fixed afterwards in the product sheet. One button and one form is
     fewer steps for anything beyond a bare name, and the same suggestions
     still turn a name into an existing product. */
  function dockButton() {
    const fab = node(html`
      <div class="quick-add">
        <button class="add-fab js-open-add" aria-label="買うものを追加">${icon("plus")}</button>
      </div>
    `);
    fab.querySelector(".js-open-add").addEventListener("click", openAddSheet);
    return fab;
  }

  KN.screens = KN.screens || {};
  KN.screens.list = { mount, render, dockButton };
})();

/* ---- js/screen-prices.js ---- */
/* =========================================================
   くらしノート — products & prices screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, perItemPrice, formatSize, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let query = "";
  let categoryFilter = null;

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">商品と価格</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            ${/* The ＋ is not up here any more — it is the same floating
                 button the list screen has, in the dock at the bottom
                 middle. Two screens that both add a thing should add it with
                 the same motion, and the corner of a top bar is the far end
                 of a phone from where the hand is.

                 What is here is the same three, in the same order, as on
                 リスト: くらべる・並べ方・さがす. */""}
            <button class="icon-btn js-compare" aria-label="お店をくらべる" title="お店をくらべる">
              ${icon("shopCompare")}
            </button>
            <button class="icon-btn js-layout"></button>
            <button class="icon-btn js-search-btn" aria-label="商品名で探す">${icon("search")}</button>
          </div>
        </header>

        ${/* Folded away until asked for. It used to sit open under the title on
              every visit, spending a row of the screen on a question asked
              once in a while. */""}
        <div class="search-wrap js-search-wrap" hidden>
          <div class="search-bar">
            ${icon("search")}
            <input class="search-input js-search" placeholder="商品名で探す" aria-label="商品名で探す"
                   autocomplete="off" spellcheck="false">
            <button class="icon-btn js-search-clear" aria-label="検索をクリア"
                    style="width:28px;height:28px" hidden>${icon("close")}</button>
          </div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    els = {
      sub:     chrome.querySelector(".js-sub"),
      compare: chrome.querySelector(".js-compare"),
      searchBtn: chrome.querySelector(".js-search-btn"),
      searchWrap: chrome.querySelector(".js-search-wrap"),
      search:  chrome.querySelector(".js-search"),
      searchClear: chrome.querySelector(".js-search-clear"),
      layout:  chrome.querySelector(".js-layout"),
      filter:  chrome.querySelector(".js-filter"),
      body:    chrome.querySelector(".js-body"),
      topbar:  chrome.querySelector(".topbar"),
    };

    KN.ui.wireSearch(els, () => renderBody(), (q) => { query = q; });
    els.compare.addEventListener("click", () => KN.showScreen("compare"));
    els.layout.addEventListener("click", KN.ui.toggleLayout);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  async function createProduct() {
    const name = await KN.ui.prompt({
      title: "商品を追加",
      label: "商品名",
      placeholder: "例：食器用洗剤",
      okLabel: "追加",
    });
    if (!name) return;

    const existing = store.findProductByName(name);
    if (existing) {
      KN.ui.toast("すでに登録されています");
      KN.productSheet.open(existing.id);
      return;
    }
    const p = store.addProduct({ name, categoryId: store.guessCategory(name) });
    haptic(10);
    KN.productSheet.open(p.id);
  }

  function render() {
    const st = store.get();
    els.sub.textContent = `${st.products.length}商品 ・ ${st.stores.length}店舗`;
    KN.ui.paintLayoutButton(els.layout);
    renderFilter();
    renderBody();
  }

  function renderFilter() {
    const counts = new Map();
    // Archived products are out of the way, so they are out of the counts too:
    // a chip saying 「調味料 8」 over a list of three is just wrong.
    store.get().products.filter((p) => !p.archived).forEach((p) => {
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });
    if (counts.size < 2) { categoryFilter = null; els.filter.innerHTML = ""; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const chips = [{ id: "", label: "すべて" }].concat(
      store.sortedCategories().filter((c) => counts.has(c.id)).map((c) => ({
        id: c.id, label: c.name, emoji: c.emoji, color: c.color, count: counts.get(c.id),
      })));

    KN.ui.chipRow(els.filter, chips, {
      activeId: categoryFilter || "",
      onPick: (id) => {
        categoryFilter = id && id !== categoryFilter ? id : null;
        haptic();
        renderFilter();
        renderBody();
      },
    });
  }

  function renderBody() {
    els.body.innerHTML = "";
    const all = store.get().products;

    if (!all.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">🏷️</div>
          <h2 class="empty-title">商品がまだありません</h2>
          <p class="empty-text">
            買い物リストに追加した商品はここに自動で並びます。
            お店ごとの値段を登録すると、いちばん安いお店が分かります。
          </p>
        </div>
      `));
      return;
    }

    /* Same order as the aisles: categories in the order they are set to, and
       within one, 五十音順. Folded first so かな and カナ and ｶﾅ sort as the
       same letters — 「ｷｭｳﾘ」 belongs next to 「きゅうり」, not off in a
       corner of the code chart. Names that start with a kanji land after the
       kana together, in a stable order: nothing here knows how 「牛乳」 is
       read, and guessing would be worse than being consistent. */
    const order = new Map(store.sortedCategories().map((c, i) => [c.id, i]));
    const rank = (p) => (order.has(p.categoryId) ? order.get(p.categoryId) : order.size);
    const shown = all
      .filter((p) => !categoryFilter || p.categoryId === categoryFilter)
      .filter((p) => !query || KN.util.foldKana(p.name).includes(query))
      .sort((a, b) => rank(a) - rank(b)
        || KN.util.foldKana(a.name).localeCompare(KN.util.foldKana(b.name), "ja"));

    const matched = shown.filter((p) => !p.archived);
    const archived = shown.filter((p) => p.archived);

    if (!matched.length && !archived.length) {
      els.body.append(node(html`
        <p style="text-align:center;color:var(--c-text-3);padding:40px 16px">
          「${query}」に一致する商品はありません
        </p>
      `));
      return;
    }

    if (matched.length) {
      const list = node(html`<div class="product-list ${KN.ui.isTiles() ? "is-tiles" : ""}"></div>`);
      matched.forEach((p) => list.append(productCard(p)));
      els.body.append(list);
    }

    if (archived.length) els.body.append(archiveSection(archived));
  }

  /* ---------------- archive ---------------- */

  /* Things bought once a year still have prices worth keeping, and they still
     get in the way of the ten things bought every week. Archived is neither
     deleted nor listed: the records stay, the card moves to the bottom, and
     the same swipe brings it back.

     Left open or shut as it was last time, except while searching — a name
     typed into the box is a question, and answering it with a closed drawer
     that happens to contain the answer would be a poor joke. */
  function archiveSection(list) {
    const open = query ? true : store.get().settings.showArchived === true;

    const section = node(html`
      <section class="archive ${open ? "is-open" : ""}">
        <button class="archive-head js-toggle" aria-expanded="${String(open)}">
          ${icon("chevron")}
          <span>アーカイブ</span>
          <span class="cat-head-count">${String(list.length)}</span>
        </button>
        <div class="archive-body js-body" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    if (open) {
      const box = node(html`<div class="product-list ${KN.ui.isTiles() ? "is-tiles" : ""}"></div>`);
      // Newest first, and each card says when — the same as the list screen's
      // archive. Products archived before there was a date to record keep
      // their place at the end and simply say nothing.
      list.slice()
        .sort((a, b) => String(b.archivedAt || "").localeCompare(String(a.archivedAt || "")))
        .forEach((p) => box.append(productCard(p)));
      section.querySelector(".js-body").append(box);
    }

    section.querySelector(".js-toggle").addEventListener("click", () => {
      haptic();
      store.update((s) => { s.settings.showArchived = !open; });
    });

    return section;
  }

  /** The item on the shopping list for this product, if it is on it. */
  const listedItem = (productId) => store.get().items.find((i) => i.productId === productId) || null;

  /* …and only while it is still something to buy. A row that has been ticked
     off is done: it stays on the list screen under 「購入済み」 until it is
     cleared, but it is no longer a thing to pick up, and the painted edge over
     here means exactly that. Leaving it painted told you to buy what was
     already in the basket. (The list screen has always read it this way —
     「今回買うもの」 counts only the unticked.) */
  const buying = (productId) => {
    const item = listedItem(productId);
    return item && !item.checked ? item : null;
  };

  function productCard(product) {
    const prices = store.currentPrices(product);
    const best = prices[0] || null;
    const bestStore = best ? store.getStore(best.storeId) : null;
    const size = formatSize(product.amount, product.unit);
    const up = best ? perItemPrice(best.price, product.amount, product.unit) : null;
    const listed = buying(product.id);
    const tiles = KN.ui.isTiles();

    /* Two layers, like the rows on the list screen: the panels underneath are
       what a swipe uncovers, the card on top is what moves. Right is the
       shopping list, left is the archive — opposite directions for opposite
       kinds of "put this somewhere else".

       Tiles swipe too, on a shorter throw. There is no room for the wording on
       a third of a screen, so the tile panels are the icons alone. */
    const wrap = node(html`
      <article class="product-wrap ${listed ? "is-there" : ""} ${tiles ? "is-tile-wrap" : ""}"
               style="--cat:${store.productColor(product)}">
        <div class="swipe-yes">
          ${listed ? icon("minus") : icon("plus")}<span>${listed ? "リストから外す" : "リストへ"}</span>
        </div>
        <div class="swipe-arch">
          <span>${product.archived ? "戻す" : "アーカイブ"}</span>${icon(product.archived ? "undo" : "download")}
        </div>
      </article>
    `);

    /* Being on the shopping list is shown by painting the card's left edge,
       not by a control. A checkbox here looked exactly like the list screen's
       「買った」 checkbox one tab over, and the two mean opposite things —
       so this one stopped being a button and became a mark. Putting it on
       or taking it off is the swipe's job. */
    const card = tiles ? node(html`
      <div class="product is-tile ${listed ? "is-listed" : ""}">
        <button class="product-main js-open">
          <span class="product-emoji" aria-hidden="true">${store.productMark(product)}</span>
          <span class="product-name">${product.name}</span>
          ${listed ? html`<span class="sr-only">買うものリストに入っています</span>` : ""}
          <span class="tile-price">${best ? yen(best.price) : "—"}</span>
          ${/* A price with no shop attached is half an answer — which shop it
                was is the whole reason the figure was written down. Under the
                figure rather than beside it: a third of a screen has no
                beside. */""}
          ${best && bestStore ? html`<span class="tile-store">🏆 ${bestStore.name}</span>` : ""}
          ${product.archived && product.archivedAt
            ? html`<span class="tile-when">${KN.util.formatStamp(product.archivedAt)}</span>` : ""}
        </button>
      </div>
    `) : node(html`
      <div class="product ${listed ? "is-listed" : ""}">
        <span class="product-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="product-main js-open">
          <span class="product-name">${product.name}</span>
          ${listed ? html`<span class="sr-only">買うものリストに入っています</span>` : ""}
          ${/* Only facts about the product itself. 「3店舗で比較中」 counted the
                app's own records rather than saying anything about the thing on
                the shelf, and 「値段は未登録」 repeated the — already sitting in
                the price column. What is left is the name, in the size of the
                thing the row is for. */""}
          ${size || up || (product.archived && product.archivedAt) ? html`
            <span class="product-meta">
              ${product.archived && product.archivedAt
                ? html`<span class="item-when">${KN.util.formatStamp(product.archivedAt)}</span>` : ""}
              ${size ? html`<span class="badge badge-cat">${size}</span>` : ""}
              ${up ? html`<span>${up.text}</span>` : ""}
            </span>
          ` : ""}
        </button>
        <span class="item-price">
          ${best && bestStore
            ? html`
                <span class="item-price-amount">${yen(best.price)}</span>
                <span class="item-price-store">🏆 ${bestStore.name}</span>
              `
            : html`<span class="item-price-none">—</span>`}
        </span>
      </div>
    `);
    wrap.append(card);

    card.querySelector(".js-open").addEventListener("click", () => KN.productSheet.open(product.id));
    KN.ui.swipeActions(wrap, card, {
      tiles,
      onRight: () => toggleListed(product),
      onLeft: () => toggleArchived(product),
    });
    return wrap;
  }

  /** Put this product on the shopping list, or take it off. */
  function toggleListed(product) {
    const item = listedItem(product.id);
    haptic(14);
    if (!item) {
      store.addItem(product.id);
      KN.ui.toast(`「${product.name}」をリストに追加しました`);
      return;
    }
    /* Already bought this trip. The swipe says 「リストへ」 because that is
       what the card looks like — unpainted — so it has to mean it: the tick
       comes off and the row goes back to being something to buy, rather than
       deleting a row the eye says is not there. */
    if (item.checked) {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) rec.checked = false;
      });
      KN.ui.toast(`「${product.name}」をまた買うものに戻しました`, {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => {
            const rec = s.items.find((i) => i.id === item.id);
            if (rec) rec.checked = true;
          }),
        },
      });
      return;
    }
    const at = store.get().items.indexOf(item);
    store.update((s) => { s.items = s.items.filter((i) => i.id !== item.id); });
    KN.ui.toast(`「${product.name}」をリストから外しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => {
          const next = s.items.slice();
          next.splice(Math.max(0, Math.min(at, next.length)), 0, item);
          s.items = next;
        }),
      },
    });
  }

  /** Put this product out of the way, or bring it back. */
  function toggleArchived(product) {
    const to = !product.archived;
    // Said out loud when it happens, because the row on the other tab
    // disappearing without a word would look like a bug.
    const wasListed = to && !!listedItem(product.id);
    haptic(14);
    const undo = store.setArchived(product.id, to);
    const said = to
      ? (wasListed ? `「${product.name}」をアーカイブし、リストから外しました`
                   : `「${product.name}」をアーカイブしました`)
      : `「${product.name}」を戻しました`;
    KN.ui.toast(said, { action: { label: "元に戻す", onClick: undo } });
  }

  /** The ＋ the shell floats over this screen — the list screen's, in kind. */
  function dockButton() {
    const fab = node(html`
      <div class="quick-add">
        <button class="add-fab js-new" aria-label="商品を追加">${icon("plus")}</button>
      </div>
    `);
    fab.querySelector(".js-new").addEventListener("click", createProduct);
    return fab;
  }

  KN.screens = KN.screens || {};
  KN.screens.prices = { mount, render, dockButton };
})();

/* =========================================================
   くらしノート — store comparison screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        ${/* No tab of its own any more — comparing shops is something done a
              few times while deciding where to go, not a place to live in. It
              opens from the shop button on リスト and 価格, and carries its
              own way back to whichever of them asked for it. */""}
        <header class="topbar">
          <div class="topbar-row">
            <button class="icon-btn js-back" aria-label="戻る" style="margin-left:-4px">
              ${icon("chevron", "flip-x")}
            </button>
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">お店くらべ</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
          </div>
        </header>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);
    els = {
      sub:    chrome.querySelector(".js-sub"),
      body:   chrome.querySelector(".js-body"),
      topbar: chrome.querySelector(".topbar"),
    };

    chrome.querySelector(".js-back").addEventListener("click", () => KN.backScreen());

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- computation ---------------- */

  /** Items still to buy (falls back to the whole list once everything is checked). */
  function targetItems() {
    const items = store.get().items;
    const active = items.filter((i) => !i.checked);
    return active.length ? active : items;
  }

  function analyse() {
    const entries = targetItems()
      .map((item) => ({ item, product: store.getProduct(item.productId) }))
      .filter((e) => e.product);

    // Only items with at least one recorded price can take part in a comparison.
    const priced = entries.filter((e) => store.bestPrice(e.product));
    const unpriced = entries.length - priced.length;

    // Cheapest achievable: every item bought at its own cheapest store.
    const combo = [];
    let comboTotal = 0;
    priced.forEach(({ item, product }) => {
      const best = store.bestPrice(product);
      const st = store.getStore(best.storeId);
      const line = best.price * item.qty;
      comboTotal += line;
      combo.push({ product, item, store: st, price: best.price, line });
    });
    combo.sort((a, b) => b.line - a.line);

    /* Per-store figures over the SAME basket, so the totals are comparable:
       buy what the store carries there, and anything it lacks at its own
       cheapest store. `anchored` is therefore a realistic trip total. */
    const rankings = store.sortedStores().map((st) => {
      let ownTotal = 0;
      let anchored = 0;
      let covered = 0;
      const missing = [];

      priced.forEach(({ item, product }) => {
        const here = store.priceAt(product, st.id);
        if (here) {
          ownTotal += here.price * item.qty;
          anchored += here.price * item.qty;
          covered += 1;
        } else {
          const best = store.bestPrice(product);
          anchored += best.price * item.qty;
          missing.push({ product, item, best });
        }
      });

      return {
        store: st,
        ownTotal,
        anchored,
        covered,
        missing,
        full: priced.length > 0 && covered === priced.length,
        ratio: priced.length ? covered / priced.length : 0,
      };
    }).filter((r) => r.covered > 0);

    rankings.sort((a, b) => a.anchored - b.anchored || b.covered - a.covered);

    // Cheapest store that carries the whole basket on its own, if one exists.
    const fullCover = rankings.filter((r) => r.full).sort((a, b) => a.ownTotal - b.ownTotal);
    const bestSingle = fullCover.length ? fullCover[0] : null;

    return {
      entries, priced, unpriced, rankings, combo, comboTotal, bestSingle,
      storeCount: new Set(combo.map((c) => c.store && c.store.id)).size,
    };
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const data = analyse();

    els.sub.textContent = data.entries.length
      ? `未購入 ${data.entries.length}品で比較`
      : "リストが空です";

    els.body.innerHTML = "";

    if (!data.entries.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">⚖️</div>
          <h2 class="empty-title">リストに商品を追加すると比べられます</h2>
          <p class="empty-text">
            買い物リストの商品それぞれに、お店ごとの値段を登録してください。
            合計でどのお店が安いかを自動で計算します。
          </p>
        </div>
      `));
      return;
    }

    if (!st.stores.length || !data.combo.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">🏪</div>
          <h2 class="empty-title">まだ値段の記録がありません</h2>
          <p class="empty-text">
            「商品と価格」から、お店ごとの値段を登録してみてください。
            2店舗以上あると、合計でどちらが安いかが分かります。
          </p>
        </div>
      `));
      return;
    }

    els.body.append(hero(data));
    els.body.append(rankingSection(data));
    els.body.append(comboSection(data));
  }

  function hero(data) {
    const saving = data.bestSingle ? data.bestSingle.ownTotal - data.comboTotal : 0;

    return node(html`
      <div class="compare-hero">
        <span class="hero-label">最安の組み合わせで買うと</span>
        <span class="hero-total">${yen(data.comboTotal)}</span>
        <span class="hero-note">
          ${data.combo.length}品を、それぞれいちばん安いお店で買った合計
          ${data.storeCount > 1 ? html`（${data.storeCount}店をまわった場合）` : ""}
          ${data.unpriced > 0 ? html`<br>※ ${data.unpriced}品は値段が未登録のため含みません` : ""}
        </span>
        ${saving > 0
          ? html`<span class="hero-save">${data.bestSingle.store.name}だけで買うより ${yen(saving)} おトク</span>`
          : ""}
      </div>
    `);
  }

  function rankingSection(data) {
    const section = node(html`
      <section class="section" style="padding-top:0">
        <h2 class="section-title">この店を中心に買うと</h2>
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6;margin:-4px 0 4px">
          同じ${data.priced.length}品を、その店にある物はその店で、ない物は最安の店で買った場合の合計です。
        </p>
        <div class="store-rank"></div>
      </section>
    `);
    const list = section.querySelector(".store-rank");

    data.rankings.forEach((r, idx) => {
      const card = node(html`
        <button class="rank-card ${idx === 0 ? "is-first" : ""}">
          <span class="rank-no">${idx + 1}</span>
          <span class="rank-main">
            <span class="rank-name">
              <span class="dot" style="background:${r.store.color}"></span>${r.store.name}
            </span>
            <span class="rank-cover">
              <span class="cover-bar"><span class="cover-fill" style="width:${String(Math.round(r.ratio * 100))}%"></span></span>
              ${r.full
                ? html`<b style="color:var(--c-primary)">全品そろう</b>`
                : html`${r.covered}/${data.priced.length}品`}
            </span>
          </span>
          <span class="rank-total">
            <span class="rank-amount">${yen(r.anchored)}</span>
            <span class="rank-sub">${r.full ? "この店だけで" : `${r.missing.length}品は他店で`}</span>
          </span>
        </button>
      `);
      card.addEventListener("click", () => openStoreDetail(r, data));
      list.append(card);
    });

    if (data.rankings.length < 2) {
      section.append(node(html`
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6">
          お店をもう1つ登録すると、合計金額を比べられるようになります。
        </p>
      `));
    }

    return section;
  }

  function openStoreDetail(rank, data) {
    const lines = data.priced
      .map(({ item, product }) => ({
        product, item,
        pr: store.priceAt(product, rank.store.id),
      }))
      .sort((a, b) => (a.pr ? 0 : 1) - (b.pr ? 0 : 1));

    const body = node(html`<div class="stack" style="gap:14px"></div>`);

    body.append(node(html`
      <div class="stack" style="gap:6px">
        <div class="spread">
          <span class="summary-label">この店で買える分</span>
          <span class="summary-total">${yen(rank.ownTotal)}</span>
        </div>
        ${rank.full
          ? html`<p style="font-size:12px;color:var(--c-text-2)">リストの品はすべてこの店でそろいます。</p>`
          : html`
              <div class="spread">
                <span class="summary-label">残り${rank.missing.length}品を最安店で買うと</span>
                <span style="font-weight:800">＋${yen(rank.anchored - rank.ownTotal)}</span>
              </div>
              <div class="divider" style="margin:4px 0"></div>
              <div class="spread">
                <span class="summary-label">合計</span>
                <span class="summary-total">${yen(rank.anchored)}</span>
              </div>
            `}
      </div>
    `));

    const list = node(html`<div class="combo-list"></div>`);
    lines.forEach(({ item, product, pr }) => {
      const best = store.bestPrice(product);
      const isCheapestHere = pr && best && pr.price <= best.price;
      const bestStore = best ? store.getStore(best.storeId) : null;
      list.append(node(html`
        <div class="combo-row">
          <span class="combo-name">${product.name}${item.qty > 1 ? html` <span style="color:var(--c-text-3)">×${item.qty}</span>` : ""}</span>
          ${pr
            ? html`
                ${isCheapestHere ? html`<span class="crown">🏆</span>` : ""}
                <span class="combo-price">${yen(pr.price * item.qty)}</span>
              `
            : html`
                <span class="combo-store" style="color:var(--c-text-3)">
                  取扱なし → ${bestStore ? bestStore.name : ""}
                </span>
                <span class="combo-price" style="color:var(--c-text-3)">${yen(best.price * item.qty)}</span>
              `}
        </div>
      `));
    });
    body.append(list);

    KN.ui.sheet({ title: rank.store.name, content: body });
  }

  function comboSection(data) {
    const section = node(html`
      <section class="section">
        <h2 class="section-title">商品ごとの最安店</h2>
        <div class="combo-list"></div>
      </section>
    `);
    const list = section.querySelector(".combo-list");

    data.combo.forEach(({ product, item, store: st, line }) => {
      const row = node(html`
        <button class="combo-row" style="text-align:left;width:100%">
          <span class="combo-name">${product.name}${item.qty > 1 ? html` <span style="color:var(--c-text-3)">×${item.qty}</span>` : ""}</span>
          <span class="combo-store">
            <span class="dot" style="background:${st.color};display:inline-block;margin-right:4px"></span>${st.name}
          </span>
          <span class="combo-price">${yen(line)}</span>
        </button>
      `);
      row.addEventListener("click", () => KN.productSheet.open(product.id, { itemId: item.id }));
      list.append(row);
    });

    return section;
  }

  KN.screens = KN.screens || {};
  KN.screens.compare = { mount, render };
})();

/* =========================================================
   くらしノート — settings screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, haptic, formatDate } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <h1 class="topbar-title">設定</h1>
          </div>
        </header>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);
    els = { body: chrome.querySelector(".js-body"), topbar: chrome.querySelector(".topbar") };

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  function render() {
    els.body.innerHTML = "";
    els.body.append(themeGroup());
    els.body.append(storesGroup());
    els.body.append(categoriesGroup());
    els.body.append(dataGroup());
    els.body.append(aboutBlock());
  }

  /* ---------------- theme ---------------- */

  function themeGroup() {
    const current = store.get().settings.theme || "auto";
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">表示</h2>
        <div class="seg">
          <button class="seg-btn" data-theme="auto"  aria-pressed="${String(current === "auto")}">自動</button>
          <button class="seg-btn" data-theme="light" aria-pressed="${String(current === "light")}">ライト</button>
          <button class="seg-btn" data-theme="dark"  aria-pressed="${String(current === "dark")}">ダーク</button>
        </div>
        <div class="rows js-badge-rows" hidden style="margin-top:12px">
          <button class="row js-badge">
            <span class="row-main">
              <span class="row-title">アイコンにも数を出す</span>
              <span class="row-sub js-badge-sub"></span>
            </span>
            <span class="row-value js-badge-state"></span>
          </button>
        </div>
        <div class="rows js-notify-rows" hidden style="margin-top:12px">
          <button class="row js-notify">
            <span class="row-main">
              <span class="row-title">やることの時刻を知らせる</span>
              <span class="row-sub js-notify-sub"></span>
            </span>
            <span class="row-value js-notify-state"></span>
          </button>
        </div>
      </section>
    `);

    wrap.querySelectorAll(".seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        store.update((s) => { s.settings.theme = theme; });
        KN.applyTheme(theme);
        haptic();
      });
    });

    /* Only where there is an icon to badge. In a browser tab the API is not
       there at all, and a switch that does nothing is worse than no switch. */
    const badge = KN.appBadge;
    if (badge && badge.supported()) {
      const rows = wrap.querySelector(".js-badge-rows");
      const state = wrap.querySelector(".js-badge-state");
      const sub = wrap.querySelector(".js-badge-sub");
      rows.hidden = false;

      /* An 「オン」 that is not on is the worst of the three states: the app
         says it is doing something the icon is not showing. iOS drops the
         badge permission on its own — a reset, a tap in 設定 → 通知 — and
         tells the page nothing, so the switch has to be able to say so. */
      const paint = () => {
        const on = badge.enabled();
        const blocked = on && badge.blocked && badge.blocked();
        state.textContent = blocked ? "許可が必要" : (on ? "オン" : "オフ");
        state.style.color = blocked ? "var(--c-danger)"
          : (on ? "var(--c-primary)" : "var(--c-text-3)");
        sub.textContent = blocked
          ? "端末の設定で、このアプリの通知を許可すると出るようになります"
          : (on ? "ホーム画面のアイコンに、今回買うものと、いま手をつけられるやることの数が出ます。時刻を決めたものは、その時刻から数に入ります"
                : "iPhone では、通知の許可を求められます（この設定は数を出すだけです）");
      };
      paint();

      wrap.querySelector(".js-badge").addEventListener("click", async () => {
        haptic();
        if (badge.enabled()) { badge.disable(); paint(); return; }
        const ok = await badge.enable();
        paint();
        if (!ok) {
          KN.ui.toast("端末の設定で通知が許可されていないため、出せませんでした");
        }
      });
    }

    /* 時刻のお知らせ。The sub-line says what it actually does, at both
       settings, because 「通知」 on its own would be read as 「19:30 に鳴る」 —
       and it does not ring while the app is closed. Saying that here is the
       difference between a feature and a thing that quietly lets you down. */
    const notify = KN.notify;
    if (notify && notify.supported()) {
      const rows = wrap.querySelector(".js-notify-rows");
      const state = wrap.querySelector(".js-notify-state");
      const sub = wrap.querySelector(".js-notify-sub");
      rows.hidden = false;

      const paint = () => {
        const on = notify.enabled();
        const blocked = on && notify.blocked();
        state.textContent = blocked ? "許可が必要" : (on ? "オン" : "オフ");
        state.style.color = blocked ? "var(--c-danger)"
          : (on ? "var(--c-primary)" : "var(--c-text-3)");
        sub.textContent = blocked
          ? "端末の設定で、このアプリの通知を許可すると出るようになります"
          : (on
              ? "時刻を決めたやることをお知らせします。アプリを閉じているあいだは鳴らず、次に開いたときにまとめて出ます"
              : "アプリを開いているときにお知らせし、閉じていたぶんは開いたときにまとめて出ます");
      };
      paint();

      wrap.querySelector(".js-notify").addEventListener("click", async () => {
        haptic();
        if (notify.enabled()) { notify.disable(); paint(); return; }
        const ok = await notify.enable();
        paint();
        if (!ok) KN.ui.toast("端末の設定で通知が許可されていないため、出せませんでした");
      });
    }

    return wrap;
  }

  /* ---------------- stores ---------------- */

  function storesGroup() {
    const stores = store.sortedStores();
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">お店 <span style="font-weight:600;color:var(--c-text-3)">${stores.length}件</span></h2>
        ${stores.length > 1
          ? html`<p class="section-hint">長押しすると持ち上がります。そのまま動かして並べ替えられます。</p>`
          : ""}
        <div class="stack js-rows" style="gap:8px"></div>
        <button class="btn btn-soft btn-sm js-add">${icon("plus")} お店を追加</button>
      </section>
    `);

    const rows = wrap.querySelector(".js-rows");
    if (!stores.length) {
      rows.append(node(html`
        <p style="font-size:13px;color:var(--c-text-3);line-height:1.6">
          お店を登録すると、商品ごとに値段を記録して比べられます。
        </p>
      `));
    }

    stores.forEach((st) => {
      const usage = store.get().products.reduce(
        (n, p) => n + p.prices.filter((pr) => pr.storeId === st.id).length, 0
      );
      const row = node(html`
        <div class="manage-row">
          <span class="dot" style="background:${st.color};width:14px;height:14px"></span>
          <span class="manage-name">${st.name}</span>
          <span style="font-size:11px;color:var(--c-text-3);flex:none">${usage}件の価格</span>
          <button class="icon-btn js-edit" aria-label="編集">${icon("edit")}</button>
          <button class="icon-btn is-danger js-del" aria-label="削除">${icon("trash")}</button>
        </div>
      `);

      row.querySelector(".js-edit").addEventListener("click", () => editStore(st));
      row.querySelector(".js-del").addEventListener("click", async () => {
        const ok = await KN.ui.confirm({
          title: "お店を削除しますか？",
          message: `「${st.name}」と、この店で登録した${usage}件の価格が削除されます。`,
          okLabel: "削除する",
          danger: true,
        });
        if (!ok) return;
        store.update((s) => {
          s.stores = s.stores.filter((x) => x.id !== st.id);
          s.products.forEach((p) => { p.prices = p.prices.filter((pr) => pr.storeId !== st.id); });
        });
        KN.ui.toast("削除しました");
      });

      rows.append(row);
    });

    KN.reorder.attach(rows, {
      item: ".manage-row",
      onDrop: (from, to) => KN.reorder.applyOrder(stores, from, to, (s) => s.stores),
    });

    wrap.querySelector(".js-add").addEventListener("click", async () => {
      const name = await KN.ui.prompt({ title: "お店を追加", label: "お店の名前", placeholder: "例：イオン 〇〇店" });
      if (!name) return;
      if (store.findStoreByName(name)) { KN.ui.toast("同じ名前のお店があります"); return; }
      store.addStore(name);
      KN.ui.toast("追加しました");
    });

    return wrap;
  }

  function editStore(st) {
    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">お店の名前</span>
          <input class="input js-name" value="${st.name}">
        </label>
        <div class="field">
          <span class="field-label">色</span>
          <div class="swatches js-swatches"></div>
        </div>
      </div>
    `);

    let color = st.color;
    const sw = body.querySelector(".js-swatches");
    function paint() {
      sw.innerHTML = "";
      store.STORE_COLORS.forEach((c) => {
        const b = node(html`<button type="button" class="swatch" style="background:${c}" aria-pressed="${String(c === color)}" aria-label="色"></button>`);
        b.addEventListener("click", () => { color = c; paint(); });
        sw.append(b);
      });
    }
    paint();

    const foot = node(html`<button class="btn btn-primary btn-block">保存</button>`);
    const h = KN.ui.sheet({ title: "お店の編集", content: body, footer: foot });

    foot.addEventListener("click", () => {
      const name = body.querySelector(".js-name").value.trim();
      store.update((s) => {
        const rec = s.stores.find((x) => x.id === st.id);
        if (rec) { if (name) rec.name = name; rec.color = color; }
      });
      h.close();
      KN.ui.toast("保存しました");
    });
  }

  /* ---------------- categories ---------------- */

  function categoriesGroup() {
    const cats = store.sortedCategories();
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">カテゴリ <span style="font-weight:600;color:var(--c-text-3)">${cats.length}件</span></h2>
        <p class="section-hint">長押しすると持ち上がります。そのまま動かして並べ替えられます。</p>
        <div class="stack js-rows" style="gap:8px"></div>
        <button class="btn btn-soft btn-sm js-add">${icon("plus")} カテゴリを追加</button>
      </section>
    `);

    const rows = wrap.querySelector(".js-rows");
    cats.forEach((c) => {
      const used = store.get().products.filter((p) => p.categoryId === c.id).length;
      const row = node(html`
        <div class="manage-row" style="--cat:${c.color || ""}">
          <span class="manage-swatch" style="background:${c.color || "transparent"}"></span>
          <span class="manage-emoji">${c.emoji}</span>

            ? ""
            : html`<button class="icon-btn is-danger js-del" aria-label="削除">${icon("trash")}</button>`}

      `);

      row.querySelector(".js-edit").addEventListener("click", () => editCategory(c));

      const del = row.querySelector(".js-del");
      if (del) {
        del.addEventListener("click", async () => {
          const ok = await KN.ui.confirm({
            title: "カテゴリを削除しますか？",
            message: used > 0
              ? `${used}件の商品は「その他」に移動します。`
              : "このカテゴリを削除します。",
            okLabel: "削除する",
            danger: true,
          });
          if (!ok) return;
          store.update((s) => {
            s.categories = s.categories.filter((x) => x.id !== c.id);
            s.products.forEach((p) => {
              if (p.categoryId === c.id) p.categoryId = store.OTHER_CATEGORY;
            });
          });
          KN.ui.toast("削除しました");
        });
      }

      rows.append(row);
    });

    KN.reorder.attach(rows, {
      item: ".manage-row",
      onDrop: (from, to) => KN.reorder.applyOrder(cats, from, to, (s) => s.categories),
    });

    wrap.querySelector(".js-add").addEventListener("click", () => editCategory(null));
    return wrap;
  }

  function editCategory(cat) {
    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">名前</span>
          <input class="input js-name" value="${cat ? cat.name : ""}" placeholder="例：おやつ">
        </label>
        <div class="field">
          <span class="field-label">絵文字（1文字）</span>
          <!-- No placeholder here. An emoji placeholder paints itself in its
               own colours whatever ::placeholder says, so 🍪 sat in the box
               looking exactly like a value someone had already typed. The
               example belongs outside the box, where nothing can be mistaken
               for the field's contents. -->
          <input class="input js-emoji" value="${cat ? cat.emoji : ""}" maxlength="4"
                 aria-label="絵文字" style="width:100px;text-align:center;font-size:24px">
          <span class="field-hint">例：🍪 🧺 🥫 ／ 空のままなら 🏷️ になります</span>
        </div>
        <div class="field">
          <span class="field-label">色（このカテゴリの品物の背景になります）</span>
          <div class="swatches js-swatches"></div>
        </div>
      </div>
    `);

    let color = (cat && cat.color) || store.CATEGORY_COLORS[0];
    const sw = body.querySelector(".js-swatches");
    function paintSwatches() {
      sw.innerHTML = "";
      store.CATEGORY_COLORS.forEach((c) => {
        const b = node(html`<button type="button" class="swatch" style="background:${c}"
                              aria-pressed="${String(c === color)}" aria-label="色"></button>`);
        b.addEventListener("click", () => { color = c; paintSwatches(); });
        sw.append(b);
      });
    }
    paintSwatches();

    const foot = node(html`<button class="btn btn-primary btn-block">${cat ? "保存" : "追加"}</button>`);
    const h = KN.ui.sheet({ title: cat ? "カテゴリの編集" : "カテゴリを追加", content: body, footer: foot });

    foot.addEventListener("click", () => {
      const name = body.querySelector(".js-name").value.trim();
      const emoji = body.querySelector(".js-emoji").value.trim() || "🏷️";
      if (!name) { KN.ui.toast("名前を入力してください"); return; }

      store.update((s) => {
        if (cat) {
          const rec = s.categories.find((x) => x.id === cat.id);
          if (rec) { rec.name = name; rec.emoji = emoji; rec.color = color; }
        } else {
          s.categories.push({
            id: KN.util.uid("c"), name, emoji, color,
            order: Math.max(-1, ...s.categories.map((x) => x.order ?? 0)) + 1,
          });
        }
      });
      h.close();
      KN.ui.toast(cat ? "保存しました" : "追加しました");
    });
  }

  /* ---------------- data ---------------- */

  function exportSub(st) {
    const last = KN.backup.lastExportAt();
    const size = `${st.products.length}商品・${st.stores.length}店舗`;
    if (!last) return `${size}をJSONで書き出します`;
    return `${size}／前回 ${formatDate(last)}`;
  }

  /** Several snapshots can land on one day (削除前, 復元前…), so the clock
      time is what actually tells them apart when recovering from a slip. */
  function snapStamp(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${formatDate(iso)} ${hh}:${mm}`;
  }

  function learnedSub() {
    const n = store.learnedList().length;
    return n
      ? `${n}件。カテゴリを手で選ぶたびに増えます`
      : "商品のカテゴリを手で選ぶと、次から同じ名前をそこに入れます";
  }

  /* What the app has been taught, and a way to take it back. Guessing on the
     user's behalf is only reasonable if they can see what it decided. */
  function openLearned() {
    const rules = store.learnedList();
    if (!rules.length) {
      KN.ui.toast("まだ何も覚えていません");
      return;
    }

    const body = node(html`
      <div class="stack">
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6;margin:0 0 8px">
          商品のカテゴリを手で選ぶと、その名前を覚えます。次から同じ名前や、
          それを含む名前は、はじめからそのカテゴリに入ります。
        </p>
        <div class="stack js-rules" style="gap:8px"></div>
        <button class="btn btn-soft btn-sm js-forget-all" style="margin-top:4px">すべて忘れる</button>
      </div>
    `);

    let handle = null;
    const rows = body.querySelector(".js-rules");

    function paint() {
      rows.innerHTML = "";
      const list = store.learnedList();
      if (!list.length) { handle && handle.close(); return; }
      list.forEach((r) => {
        const row = node(html`
          <div class="manage-row" style="--cat:${(r.category && r.category.color) || ""}">
            <span class="manage-swatch" style="background:${(r.category && r.category.color) || "transparent"}"></span>
            <span class="manage-name">${r.label}</span>

          </div>
        `);
        row.querySelector(".js-forget").addEventListener("click", () => {
          store.forgetCategory(r.key);
          KN.ui.toast(`「${r.label}」を忘れました`);
          paint();
        });
        rows.append(row);
      });
    }
    paint();

    body.querySelector(".js-forget-all").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "覚えた振り分けを全部忘れますか？",
        message: "商品そのものは消えません。カテゴリの自動判定が、はじめの状態に戻ります。",

    return `${snaps.length}件・最新 ${snapStamp(snaps[0].at)}`;

  function openSnapshots() {
    const snaps = KN.backup.list();
    if (!snaps.length) {
      KN.ui.toast("まだ控えがありません");
      return;

    const body = node(html`
