   the list look alike again, whereas an edge is visible from anywhere in it.
   The wash is the one the old total card wore — same idea, same colour. */
.trip {
  margin: var(--sp-2) var(--sp-4) var(--sp-4);
  /* Barely any gutter of its own: the rows inside are the point, and every
     pixel spent framing them is a pixel off a product name. */
  padding: var(--sp-2) var(--sp-1);
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--c-primary-soft), color-mix(in srgb, var(--c-accent-soft) 70%, transparent));
  border: 1px solid var(--c-border);
}
/* The rows are already inside something padded; their own gutter would put
   them in a column of their own, narrower than the panel for no reason. */
.trip .item-list { padding: 0; }
.trip .trip-head { padding: var(--sp-1) var(--sp-2) var(--sp-3); }
.trip .cat-group:last-of-type { margin-bottom: var(--sp-1); }

/* Still used by the compare screen's own totals, which are totals of a basket
   whose prices are all known — that is what makes them safe to add up. */
.summary-label { font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-2); }
.summary-total { font-size: var(--fs-2xl); font-weight: 800; color: var(--c-text); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* ================= PRICES SCREEN ================= */

.search-wrap { padding: 0 var(--sp-4) var(--sp-3); }

.search-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  background: var(--c-surface-2);
  border-radius: var(--r-md);
  padding: 0 var(--sp-3);
  height: 46px;
}
.search-bar svg { width: 18px; height: 18px; color: var(--c-text-3); flex: none; stroke-width: 2.2; }
/* 16px is the floor: below it iOS zooms the page in on focus and the
   layout lurches. Every text field in the app sits at or above it. */
.search-input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: var(--fs-lg); height: 100%; }

.product-list { padding: 0 var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }

.product-wrap {
  position: relative;
  border-radius: var(--r-md);
  overflow: hidden;
}

/* ---- the archive itself ---- */

.archive { margin: var(--sp-5) var(--sp-4) 0; }

.archive-head {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: var(--sp-2) 0;
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--c-text-3);
}
/* The chevron points right when the drawer is shut and down when it is
   open — the icon is drawn pointing right, so shut is its resting angle. */
.archive-head svg {
  width: 16px; height: 16px;
  stroke-width: 2.6;
  flex: none;
  transition: transform .18s var(--ease);
}
.archive.is-open .archive-head svg { transform: rotate(90deg); }
.archive-body { padding-top: var(--sp-2); }
/* Already put away — said the same way the shopping list says 「買った」:
   the colour has done its job, so the card goes quiet and neutral and the name
   is ruled through. Two screens, one meaning, one look. */
.archive .product {
  opacity: .55;
  background: var(--c-surface-2);
  border-color: var(--c-border);
  box-shadow: none;
}
.archive .product-name { text-decoration: line-through; color: var(--c-text-2); }
.archive .product-emoji { filter: grayscale(1); }
.archive .product::before { opacity: .4; }
.archive .item-price-amount,
.archive .tile-price { color: var(--c-text-2); }
.archive .product-list { padding: 0; }
.product {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  text-align: left;
  background: color-mix(in srgb, var(--cat, transparent) var(--cat-fill), var(--c-surface));
  border: 1px solid color-mix(in srgb, var(--cat, transparent) var(--cat-line), var(--c-border));
  border-radius: var(--r-md);
  /* Room down the left for the painted edge below. Kept on every card,
     listed or not, so nothing shifts sideways when one is added. */
  padding: var(--sp-3) var(--sp-3) var(--sp-3) 14px;
  box-shadow: var(--shadow-1);
  transition: background .14s var(--ease),
              transform .52s cubic-bezier(.16, .84, .24, 1);
  /* Vertical stays with the screen so it can still scroll; horizontal comes
     to the swipe handler — the buttons inside included. */
  touch-action: pan-y;
  /* A swipe must not start selecting the price it happens to begin on. */
  user-select: none;
  -webkit-user-select: none;
}
.product button { touch-action: pan-y; }
.product-wrap.is-swiping .product { will-change: transform; }
@media (hover: hover) {
  .product:hover { background: var(--c-surface-2); }
}

/* On the shopping list: the left edge of the card is painted. Deliberately a
   mark and not a control — a checkbox here read as the list screen's 「買った」
   box, which is one tab away and means the opposite. A stripe cannot be
   pressed, so it can only be telling you something. */
.product.is-listed::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
  /* The category's own colour, the same edge the list screen paints on every
     row. There it says which aisle; here it says which aisle *and* that this
     one is on the list, because only the listed cards get an edge at all. */
  background: var(--cat, var(--c-primary));
  /* Follows the card's own corners on the left, square against the content. */
  border-radius: var(--r-md) 0 0 var(--r-md);
}

.product-emoji {
  flex: none;
  width: 42px; height: 42px;
  border-radius: var(--r-md);
  background: var(--c-surface-2);
  display: grid;
  place-items: center;
  font-size: 21px;
}

/* Also a <button> — the part of the card that opens the product. */
.product-main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 3px;
  text-align: left;
  border: none; background: none; padding: 0;
}
.product-name { font-size: var(--fs-lg); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-sm); color: var(--c-text-2); }

/* price rows inside sheet */
.price-list { display: flex; flex-direction: column; gap: var(--sp-2); }

.price-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--c-surface-2);
  border: 1.5px solid transparent;
  transition: background .16s var(--ease);
}

.price-row.is-best {
  background: var(--c-accent-soft);
  border-color: color-mix(in srgb, var(--c-accent) 35%, transparent);
}

/* The row opens the record; the bin deletes it. Two jobs, two targets — the
   same split the shopping list uses between its body and its star. */
.price-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  text-align: left;
  transition: transform .12s;
}
.price-main:active { transform: scale(.985); }
.price-chevron { flex: none; color: var(--c-text-3); display: flex; }
.price-chevron svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.price-store-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-2); }
.price-store { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.price-figures { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.price-amount { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.is-best .price-amount { color: var(--c-accent-ink); }
.price-unit { font-size: var(--fs-xs); color: var(--c-text-2); font-weight: 600; }
.price-date { font-size: var(--fs-xs); color: var(--c-text-3); }

.crown { font-size: 13px; flex: none; }

/* one store's price, in full */
.field-hint { font-size: var(--fs-xs); color: var(--c-text-3); line-height: 1.5; }

.cmp { font-size: var(--fs-md); color: var(--c-text-2); line-height: 1.6; }
.cmp b { color: var(--c-text); }
.cmp .cmp-good { color: var(--c-primary); font-weight: 700; }
.cmp .cmp-bad  { color: var(--c-accent-ink); }

.log-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  background: var(--c-surface-2);
}
.log-row.is-current { background: var(--c-primary-soft); }
.log-date  { flex: none; width: 56px; font-size: var(--fs-sm); color: var(--c-text-2); }
.log-price { flex: none; width: 74px; font-weight: 800; font-variant-numeric: tabular-nums; }
.log-unit  { flex: 1; min-width: 0; font-size: var(--fs-xs); color: var(--c-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-tag   { flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--c-primary-ink); }

/* history sparkline */
.spark { display: block; width: 100%; height: 48px; }
.spark-line { fill: none; stroke: var(--c-primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark-area { fill: color-mix(in srgb, var(--c-primary) 14%, transparent); stroke: none; }
.spark-dot { fill: var(--c-primary); }

/* ================= COMPARE SCREEN ================= */

.compare-hero {
  margin: 0 var(--sp-4) var(--sp-4);
  padding: var(--sp-5);
  border-radius: var(--r-lg);
  background: linear-gradient(140deg, var(--c-primary), var(--c-primary-2));
  color: #fff;
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.hero-label { font-size: var(--fs-sm); font-weight: 700; opacity: .88; }
.hero-total { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.hero-note { font-size: var(--fs-sm); opacity: .9; line-height: 1.5; }

.hero-save {
  margin-top: var(--sp-2);
  align-self: flex-start;
  background: rgba(255,255,255,.2);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 800;
}

.store-rank { padding: 0 var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }

.rank-card {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  text-align: left;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-1);
  transition: background .14s var(--ease);
}
@media (hover: hover) {
  .rank-card:hover { background: var(--c-surface-2); }
}

.rank-card.is-first {
  border-color: color-mix(in srgb, var(--c-accent) 45%, transparent);
  background: linear-gradient(120deg, var(--c-accent-soft), var(--c-surface) 70%);
}

.rank-no {
  flex: none;
  width: 28px; height: 28px;
  border-radius: var(--r-full);
  background: var(--c-surface-2);
  color: var(--c-text-2);
  display: grid;
  place-items: center;
  font-size: var(--fs-sm);
  font-weight: 800;
}
.is-first .rank-no { background: var(--c-accent); color: #fff; }

.rank-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rank-name { font-weight: 700; display: flex; align-items: center; gap: var(--sp-2); }
.rank-cover { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--c-text-2); }

.cover-bar {
  flex: 1;
  max-width: 96px;
  height: 4px;
  background: var(--c-surface-3);
  border-radius: var(--r-full);
  overflow: hidden;
}
/* A span is inline by default, where height/width percentages do not apply. */
.cover-fill {
  display: block;
  height: 100%;
  background: var(--c-primary);
  border-radius: var(--r-full);
  transition: width .4s var(--ease-out);
}

.rank-total { flex: none; text-align: right; }
.rank-amount { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.rank-sub { font-size: var(--fs-xs); color: var(--c-text-3); }

/* best-combo breakdown */
.combo-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.combo-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
}
.combo-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo-store { font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-2); flex: none; }
.combo-price { font-weight: 800; font-variant-numeric: tabular-nums; flex: none; min-width: 62px; text-align: right; }

/* ================= SETTINGS SCREEN ================= */

.settings-group { padding: 0 var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-5); }

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  background: var(--c-surface-2);
  padding: 3px;
  border-radius: var(--r-md);
}

.seg-btn {
  padding: 8px;
  min-height: 40px;
  border-radius: 9px;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--c-text-2);
  transition: background .16s var(--ease), color .16s var(--ease);
}
.seg-btn[aria-pressed="true"] { background: var(--c-surface); color: var(--c-text); box-shadow: var(--shadow-1); }

.about {
  padding: var(--sp-6) var(--sp-4) var(--sp-4);
  text-align: center;
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  line-height: 1.7;
}

/* sortable manage rows */
.manage-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); }
.manage-emoji { font-size: 19px; flex: none; width: 28px; text-align: center; }

/* The colour the category paints its rows with, shown where it is chosen. */
.manage-swatch {
  flex: none;
  width: 6px;
  align-self: stretch;
  min-height: 26px;
  border-radius: var(--r-full);
  margin-right: -2px;
}
.manage-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* store color swatches */
.swatches { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.swatch {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  border: 3px solid transparent;
  transition: transform .14s var(--ease), border-color .14s;
}
@media (hover: hover) {
  .swatch:hover { transform: scale(1.1); }
}
.swatch[aria-pressed="true"] { border-color: var(--c-text); transform: scale(1.1); }


/* ---------------- calculator strip ---------------- */

/* What the sum comes to, live, while the number pad is up. The operators are
   on the pad itself (keypad.js); this is only the answer. */
.calc-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 22px;
}

.calc-out {
  flex: 1;
  min-width: 0;
  text-align: right;

<div class="app" id="app">
  <main class="screens" id="screens">
    <section class="screen"           id="screen-todo"     data-screen="todo"     role="tabpanel" aria-label="やること" hidden></section>
    <section class="screen is-active" id="screen-list"     data-screen="list"     role="tabpanel" aria-label="買い物リスト"></section>
    <section class="screen"           id="screen-prices"   data-screen="prices"   role="tabpanel" aria-label="商品と価格" hidden></section>
    <section class="screen"           id="screen-compare"  data-screen="compare"  role="tabpanel" aria-label="お店くらべ" hidden></section>
    <section class="screen"           id="screen-settings" data-screen="settings" role="tabpanel" aria-label="設定" hidden></section>
  </main>

  <!-- The add bar lives here, outside the scrolling screens. It used to be a
       sticky element inside the list, and iOS painted the text caret way above
       the field it belonged to. A plain flex child at the bottom of the shell
       has no sticky offset for the caret to disagree with. -->
  <div class="dock" id="dock" hidden></div>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="メインナビゲーション"></nav>
</div>

<!-- Shown only when a phone is held sideways. See the portrait-only block in
     base.css for why an app that asks for portrait in its manifest still
     needs this. -->
<div class="rotate-note">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <path d="M10.4 18.8h3.2"/>
  </svg>
  <b>縦向きでお使いください</b>
  <span>画面を縦に戻すと続きから使えます</span>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script>
/* ---- js/util.js ---- */
/* =========================================================
   くらしノート — utilities
   ========================================================= */
(function () {
  "use strict";

  const KN = (window.KN = window.KN || {});

  /* ---------- safe HTML templating ---------- */

  class Raw {
    constructor(s) { this.value = String(s); }
    toString() { return this.value; }
  }

  function raw(s) { return new Raw(s); }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function interp(v) {
    if (v == null || v === false || v === true) return "";
    if (v instanceof Raw) return v.value;
    if (Array.isArray(v)) return v.map(interp).join("");
    return escapeHtml(v);
  }

  /** Tagged template that escapes interpolated values unless wrapped in raw(). */
  function html(strings, ...values) {
    let out = "";
    for (let i = 0; i < strings.length; i++) {
      out += strings[i];
      if (i < values.length) out += interp(values[i]);
    }
    return raw(out);
  }

  /** Build a single element from a template result. Extra roots would be
   *  silently dropped, so surface that as a loud mistake instead. */
  function node(h) {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(h).trim();
    if (tpl.content.childElementCount > 1) {
      console.error(
        "node() received %d root elements — only the first is kept. Use frag().",
        tpl.content.childElementCount, tpl.content.firstElementChild
      );
    }
    return tpl.content.firstElementChild;
  }

  /** Build a document fragment (multiple roots) from a template result. */
  function frag(h) {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(h);
    return tpl.content;
  }

  /* ---------- ids & misc ---------- */

  function uid(prefix) {
    const rnd = (crypto && crypto.randomUUID)
      ? crypto.randomUUID().slice(0, 8)
      : Math.random().toString(36).slice(2, 10);
    return (prefix ? prefix + "-" : "") + Date.now().toString(36) + rnd;
  }

  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  /* ---------- numbers & money ---------- */

  /** ¥1,280 — rounded to whole yen. */
  function yen(n) {
    if (!isFinite(n)) return "—";
    return "¥" + Math.round(n).toLocaleString("ja-JP");
  }

  /** Keeps one decimal for small values (unit prices like ¥0.6). */
  function yenFine(n) {
    if (!isFinite(n)) return "—";
    if (Math.abs(n) >= 100) return yen(n);
    const r = Math.round(n * 10) / 10;
    return "¥" + r.toLocaleString("ja-JP", { maximumFractionDigits: 1 });
  }

  function parseNum(v) {
    const n = parseFloat(String(v).replace(/[^\d.\-]/g, ""));
    return isFinite(n) ? n : NaN;
  }

  /* ---------- dates ---------- */

  /* Folds text down to one comparable form so searching does not depend on
     which kana the shopper happened to reach for. 「え」finds「エマール」,
     half-width ﾏ finds マ, and case stops mattering for latin names. */
  function foldKana(s) {
    return String(s || "")
      .normalize("NFKC")            // ﾏ → マ, Ａ → A, ㍑ → リットル
      .toLowerCase()
      // Katakana to hiragana. Long vowel marks and small kana come along
      // unchanged, so ロール and ろーる still meet.
      .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/\s+/g, "");
  }

  function today() { return new Date().toISOString(); }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const now = new Date();
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()}/${md}`;
  }

  /** 「8/12 14:05」 — the date, plus the clock time it happened at.
      Several things get archived on one day, and the order they went in is
      most of what tells them apart afterwards. A stored value that is only a
      day (older records, or a due date) has no hour to show, so it stays a
      plain date rather than pretending to be midnight. */
  function formatStamp(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const date = formatDate(iso);
    if (!/\d{1,2}:\d{2}/.test(String(iso))) return date;
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${date} ${hh}:${mm}`;
  }

  /* ---------- a time of day ----------

     Stored as 「19:30」 — local, no date, no zone, because it belongs to
     whatever day the todo is for and moves with it when the day does. A
     repeating 「毎週火曜 19:30」 keeps its half past seven whichever Tuesday
     it lands on. */

  const isTime = (v) => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v || ""));

  /** 「19:30」 → 夜. The three parts of the day, read off the clock, so a time
      and a 朝/午後/夜 never have to be kept in step by hand. */
  function partOfTime(hhmm) {
    if (!isTime(hhmm)) return null;
    const h = Number(String(hhmm).slice(0, 2));
    if (h < 12) return "am";
    if (h < 18) return "pm";
    return "night";
  }

  /** 「19:30」 as it is written on a row. Kept 24-hour: 「19:30」 is one glance
      and 「午後7時30分」 is a sentence. */
  const formatTime = (hhmm) => (isTime(hhmm) ? String(hhmm) : "");

  /** The clock right now, in the same 「19:30」 shape, so 「もう過ぎたか」 is a
      string comparison rather than two Date objects and a timezone. */
  function nowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  /* ---------- a day, without a time ----------

     A due date is a day, not an instant: 「金曜まで」 means the whole of
     Friday wherever you are standing. Stored as 「2026-08-14」 — local, no
     zone, no hour — so it cannot slide a day backwards the way a UTC
     timestamp does for anyone east of Greenwich. */

  const pad2 = (n) => (n < 10 ? "0" + n : String(n));

  /** The local day of a Date, as 「YYYY-MM-DD」. */
  function dayKey(d) {
    const x = d instanceof Date ? d : new Date(d);
    if (isNaN(x.getTime())) return "";
    return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
  }

  const todayKey = () => dayKey(new Date());

  /** A day key back into a Date at local midnight. */
  function dayDate(key) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ""));
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  /** Days from today to this day: negative is past, 0 is today. */
  function daysUntil(key) {
    const d = dayDate(key);
    if (!d) return null;
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((d.getTime() - start.getTime()) / 86400000);
  }

  /** Shift a day key by n days. */
  function shiftDay(key, n) {
    const d = dayDate(key);
    if (!d) return "";
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }

  /** Same date n months on, clamped to the month's last day — 1/31 monthly is
   *  2/28, not 3/3. */
  function shiftMonth(key, n) {
    const d = dayDate(key);
    if (!d) return "";
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return dayKey(d);
  }

  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
  const weekdayJa = (key) => { const d = dayDate(key); return d ? WEEKDAYS[d.getDay()] : ""; };
  const dayOfWeek = (key) => { const d = dayDate(key); return d ? d.getDay() : null; };

  /* ---------- 第◯◯曜日 ----------

     「第2火曜」 and 「最終金曜」 are how a bin day or a rent day is actually
     said, and they are not the same as a date: the second Tuesday moves every
     month. nth is 1..5, or -1 for 「最終」. */

  /** The nth weekday of a given month, or "" when that month has no such day. */
  function nthWeekdayOf(year, monthIndex, nth, weekday) {
    if (nth === -1) {
      const last = new Date(year, monthIndex + 1, 0);
      last.setDate(last.getDate() - ((last.getDay() - weekday + 7) % 7));
      return dayKey(last);
    }
    const first = new Date(year, monthIndex, 1);
    const forward = (weekday - first.getDay() + 7) % 7;
    const d = new Date(year, monthIndex, 1 + forward + (nth - 1) * 7);
    return d.getMonth() === monthIndex ? dayKey(d) : "";
  }

  /** Which 「第◯」 this day is in its own month, and whether it is the last one. */
  function weekdayNth(key) {
    const d = dayDate(key);
    if (!d) return null;
    const nth = Math.floor((d.getDate() - 1) / 7) + 1;
    const last = d.getDate() + 7 > new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return { nth, last, weekday: d.getDay() };
  }

  /* Near days by name, the rest by number. 「明日」 is read faster than a date
     and needs no arithmetic; 「9/2(火)」 needs no calendar. */
  function formatDay(key) {
    const d = dayDate(key);
    if (!d) return "";
    const n = daysUntil(key);
    if (n === 0) return "今日";
    if (n === 1) return "明日";
    if (n === 2) return "明後日";
    if (n === -1) return "昨日";
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    const wd = `(${WEEKDAYS[d.getDay()]})`;
    return d.getFullYear() === new Date().getFullYear() ? md + wd : `${d.getFullYear()}/${md}${wd}`;
  }

  function relativeDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days <= 0) return "今日";
    if (days === 1) return "昨日";
    if (days < 7) return `${days}日前`;
    if (days < 30) return `${Math.floor(days / 7)}週間前`;
    return formatDate(iso);
  }

  /* ---------- price per item ---------- */

  /* Counted units first: those are the ones the price gets divided by.
     Volume and weight are kept because writing 「500ml」 on a product is
     useful as a note to self, but nobody shops by the 100ml — a bottle of
     detergent is one bottle whatever it holds. */
  const COUNTED_UNITS = ["個", "袋", "本", "枚", "ロール", "パック"];
  const UNITS = [...COUNTED_UNITS, "ml", "L", "g", "kg"];

  const isCounted = (unit) => COUNTED_UNITS.indexOf(unit) >= 0;

  /**
   * Price of one of them. Only counted units divide: 「10個 ¥298」 is
   * ¥29.8 each, while 「500ml ¥298」 is just ¥298 — there is nothing to
   * split. Returns null when the price is already the price of one, so a
   * caller can simply skip the line.
   */
  function perItemPrice(price, amount, unit) {
    if (!isFinite(price) || !isCounted(unit)) return null;
    if (!isFinite(amount) || amount < 2) return null;
    const per1 = price / amount;
    return { text: `1${unit}あたり ${yenFine(per1)}`, value: per1, label: unit, count: amount };
  }

  /** "500ml" / "3個" — human readable size of a product. */
  function formatSize(amount, unit) {
    if (!isFinite(amount) || amount <= 0 || !unit) return "";
    const n = Math.round(amount * 100) / 100;
    return `${n.toLocaleString("ja-JP")}${unit}`;
  }

  /* ---------- icons (inline SVG) ---------- */

  const ICON_PATHS = {
    list:      '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="3.5" cy="18" r="1.5"/>',
    // The previous tag started at 20.6,13.4 but ended at 20.6,15.4, so `Z`
    // drew a stray 2px segment that showed as a notch on the right corner.
    // This one is a closed outline, symmetric about the 45° diagonal.
    tag:       '<path d="M11.6 2.6H4.4A1.8 1.8 0 0 0 2.6 4.4v7.2a1.8 1.8 0 0 0 .53 1.27l8 8a1.8 1.8 0 0 0 2.54 0l7.2-7.2a1.8 1.8 0 0 0 0-2.54l-8-8A1.8 1.8 0 0 0 11.6 2.6Z"/><circle cx="7.2" cy="7.2" r="1.5"/>',
    // A storefront, because the tab this sits on is labelled お店. The old
    // balance scale meant "compare" but read as neither a shop nor a working
    // scale — its beam tilted while the pans hung level.
    shop:      '<path d="M3.2 9.2 5.1 3.8h13.8l1.9 5.4"/><path d="M2.6 9.2h18.8"/><path d="M4.6 9.2v11.4M19.4 9.2v11.4"/><path d="M2.8 20.6h18.4"/><path d="M9.6 20.6v-6.2h4.8v6.2"/>',
    // A real cog: eight square teeth on a circular body, generated so the
    // pitch is exact. The previous one was drawn from linked arcs, which
    // read as a wavy blob rather than a gear and clipped at the right edge.
    gear:      '<path d="M9.75 4.64L10.25 2.05A10.1 10.1 0 0 1 13.75 2.05L14.25 4.64A7.7 7.7 0 0 1 15.61 5.2L17.79 3.73A10.1 10.1 0 0 1 20.27 6.21L18.8 8.39A7.7 7.7 0 0 1 19.36 9.75L21.95 10.25A10.1 10.1 0 0 1 21.95 13.75L19.36 14.25A7.7 7.7 0 0 1 18.8 15.61L20.27 17.79A10.1 10.1 0 0 1 17.79 20.27L15.61 18.8A7.7 7.7 0 0 1 14.25 19.36L13.75 21.95A10.1 10.1 0 0 1 10.25 21.95L9.75 19.36A7.7 7.7 0 0 1 8.39 18.8L6.21 20.27A10.1 10.1 0 0 1 3.73 17.79L5.2 15.61A7.7 7.7 0 0 1 4.64 14.25L2.05 13.75A10.1 10.1 0 0 1 2.05 10.25L4.64 9.75A7.7 7.7 0 0 1 5.2 8.39L3.73 6.21A10.1 10.1 0 0 1 6.21 3.73L8.39 5.2A7.7 7.7 0 0 1 9.75 4.64Z"/><circle cx="12" cy="12" r="3.1"/>',
    // Five even points, generated rather than eyeballed. Filled via CSS when on.
    star:      '<path d="M12 2.6L14.26 8.89L20.94 9.1L15.66 13.19L17.53 19.6L12 15.85L6.47 19.6L8.34 13.19L3.06 9.1L9.74 8.89Z"/>',
    plus:      '<path d="M12 5v14M5 12h14"/>',
    check:     '<path d="M20 6 9 17l-5-5"/>',
    search:    '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    close:     '<path d="M18 6 6 18M6 6l12 12"/>',
    chevron:   '<path d="m9 18 6-6-6-6"/>',
    trash:     '<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    edit:      '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    store:     '<path d="M3 9 4.5 4h15L21 9M3 9h18M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>',
    minus:     '<path d="M5 12h14"/>',
    download:  '<path d="M12 3v12M7 11l5 5 5-5M4 21h16"/>',
    upload:    '<path d="M12 21V9M7 13l5-5 5 5M4 3h16"/>',
    sparkles:  '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/>',
    undo:      '<path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.3-9.3L3 7"/>',
    // Delete-left. A plain ✕ on that key reads as "close", which is the one
    // thing it must not be mistaken for while a pad is open.
    backspace: '<path d="M20.4 4.6H9.7a2 2 0 0 0-1.55.74L2.9 12l5.25 6.66a2 2 0 0 0 1.55.74h10.7a2 2 0 0 0 2-2V6.6a2 2 0 0 0-2-2Z"/><path d="M12.4 9.6l5 4.8M17.4 9.6l-5 4.8"/>',
    cart:      '<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.77L21 8H6"/>',
    // The two layouts, drawn as what they are: stacked rows, and a 3×3 of
    // squares. Each button shows the layout it switches *to*.
    rows:      '<rect x="3" y="4.5" width="18" height="4.4" rx="1.4"/><rect x="3" y="15.1" width="18" height="4.4" rx="1.4"/>',
    tiles:     '<rect x="3" y="3" width="7.4" height="7.4" rx="1.6"/><rect x="13.6" y="3" width="7.4" height="7.4" rx="1.6"/><rect x="3" y="13.6" width="7.4" height="7.4" rx="1.6"/><rect x="13.6" y="13.6" width="7.4" height="7.4" rx="1.6"/>',
    /* The shop, with the thing it is for drawn on it: two bars of different
       heights. Without the mark it is just a shop, and the button does not
       open a shop — it opens a comparison between them. */
    shopCompare: '<path d="M3.4 8.6 5 4.2h14L20.6 8.6"/><path d="M2.8 8.6h18.4"/><path d="M4.6 8.6v11.2h14.8V8.6"/><path d="M9 17.4v-3.6M12 17.4v-5.8M15 17.4v-2.2"/>',
    /* A list with things ticked off it. Deliberately not the shopping list's
       icon — the two tabs sit side by side and must not read as one. */
    checklist: '<path d="M3.2 6.4 4.9 8.1 8 5"/><path d="M3.2 12.4 4.9 14.1 8 11"/><path d="M3.2 18.4 4.9 20.1 8 17"/><path d="M11 6.6h9.8M11 12.6h9.8M11 18.6h6.4"/>',
    calendar:  '<rect x="3" y="5" width="18" height="16" rx="2.4"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    repeat:    '<path d="M4 9.4V8a3 3 0 0 1 3-3h11"/><path d="m15 2 3 3-3 3"/><path d="M20 14.6V16a3 3 0 0 1-3 3H6"/><path d="m9 22-3-3 3-3"/>',
    flag:      '<path d="M5 21V4"/><path d="M5 4.6h11.6l-2 3.6 2 3.6H5"/>',
  };

  /** Inline stroke icon. */
  function icon(name, cls) {
    const p = ICON_PATHS[name] || "";
    return raw(
      `<svg class="${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
      `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`
    );
  }

  /* ---------- arithmetic in a text field ---------- */

  /* iOS gives a numeric keypad and no operator keys, and there is no way to ask
     it for a calculator. So the field takes an expression and this works it
     out: 「198+250」、「128*3」、「980/2」. Written out rather than handed to
     eval — a shopping note has no business running code, and the grammar here
     is four operators and a number, which is a dozen lines. */
  const FULLWIDTH = "０１２３４５６７８９．＋－×÷／";
  const ASCII     = "0123456789.+-*/ /";

  function normalizeExpr(v) {
    return String(v == null ? "" : v)
      .replace(/[０-９．＋－×÷／]/g, (c) => ASCII[FULLWIDTH.indexOf(c)])
      .replace(/[×✕✖]/g, "*")
      .replace(/÷/g, "/")
      .replace(/[−–—ー]/g, "-")
      .replace(/[\s,、¥￥円]/g, "");
  }

  /** True when this looks like a sum rather than a plain number. */
  function isExpression(v) {
    const s = normalizeExpr(v);
    return /\d[+\-*/]/.test(s) || s.indexOf("%") >= 0;
  }

  /* A discount is written on the shelf as 「398円 −12%」, and that is how it is
     written here: the price, then the rate, with the % at the end. Keeping it
     in the text rather than in a hidden mode means the field still shows the
     whole story and ⌫ takes it apart a character at a time. The answer drops
     the fraction of a yen, the way the till does. */
  const DISCOUNT = /^(.+?)([+-])(\d+(?:\.\d+)?)%$/;

  /**
   * Evaluate `1+2*3`, `398-12%` and friends. Returns null for anything that is
   * not a complete, well-formed sum — a trailing operator, or a % with no rate
   * behind it yet, is not an error while you are still typing, it just has no
   * answer yet.
   */
  function calc(v) {
    const src = normalizeExpr(v);
    const off = src.match(DISCOUNT);
    if (off) {
      const base = plainCalc(off[1]);
      if (base == null) return null;
      const rate = parseFloat(off[3]) / 100;
      const out = base * (off[2] === "-" ? 1 - rate : 1 + rate);
      return isFinite(out) ? Math.floor(out) : null;
    }
    return plainCalc(src);
  }

  function plainCalc(src) {
    if (!src || !/^[\d.+\-*/]+$/.test(src)) return null;

    const tokens = src.match(/\d+(?:\.\d+)?|\.\d+|[+\-*/]/g);
    if (!tokens) return null;

    const nums = [], ops = [];
    let wantNumber = true;
    for (const t of tokens) {
      const isOp = /^[+\-*/]$/.test(t);
      if (isOp === wantNumber) return null;   // two in a row, either way
      if (isOp) ops.push(t);
      else nums.push(parseFloat(t));
      wantNumber = isOp;
    }
    if (wantNumber) return null;              // ends on an operator

    for (let i = 0; i < ops.length; ) {
      if (ops[i] === "*" || ops[i] === "/") {
        const r = ops[i] === "*" ? nums[i] * nums[i + 1] : nums[i] / nums[i + 1];
        nums.splice(i, 2, r);
        ops.splice(i, 1);
      } else i++;
    }
    let out = nums[0];
    for (let i = 0; i < ops.length; i++) {
      out = ops[i] === "+" ? out + nums[i + 1] : out - nums[i + 1];
    }
    return isFinite(out) ? out : null;
  }

  /* ---------- feedback ---------- */

  function haptic(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms || 8); } catch (_) {} }
  }

  KN.util = {
    raw, html, node, frag, escapeHtml,
    uid, clamp, debounce,
    yen, yenFine, parseNum,

    perItemPrice, formatSize, UNITS, COUNTED_UNITS, isCounted,
    calc, isExpression,
    icon, haptic,
  };
})();

/* =========================================================
   くらしノート — drawn product icons

   Every product mark in the app is drawn here. Emoji were the starting point
   and they were good at food and bad at everything else: there is no 洗剤
   emoji, so 洗剤・柔軟剤・漂白剤・シャンプー・ボディソープ・化粧水 all landed
   on 🧴, and トイレットペーパー・ティッシュ・キッチンペーパー all landed on
   🧻. Six things, one picture. Drawing them fixed that corner and left the
   list half emoji and half vector, which looked exactly like what it was.

   So the whole set is drawn now. It costs nothing at runtime — the shapes ship
   inside the app and need no network — and it is no longer limited to what
   Apple happens to have shipped a glyph for: 洗濯洗剤 can be a different
   picture from 食器用洗剤 because someone drew both.

   How they are built
   ------------------
   Everything sits on the same 24×24 grid, in flat fills with no strokes, and
   keeps its ink inside roughly x,y ∈ [2, 22] so a row of them lines up.
   Silhouette carries the meaning at 19px; colour only separates things that
   genuinely are the same shape (a softener jug really does look like a
   detergent jug). Most icons are one call to a shared silhouette below —
   bottle, jug, tube, can, carton, bowl, bag, box, round — which is what keeps
   seventy-odd of them consistent with each other and short enough to read.

  function find(name) {
    const n = KN.util.foldKana(String(name || ""));
    if (!n) return "";
    for (const [key, icon] of FLAT) if (n.includes(key)) return ICONS[icon];
    return "";
  }

  /** Nothing matched the name: a plain package, painted in whatever colour the
   *  category uses, so the row still belongs to a group by sight. */
  const fallback = (tint) => S(`
    <rect x="3.4" y="5.6" width="17.2" height="14.4" rx="2" fill="${tint || "#b9c3be"}"/>
    <rect x="3.4" y="5.6" width="17.2" height="4.2" rx="2" fill="#000000" opacity=".17"/>
    <rect x="10.9" y="9.8" width="2.2" height="10.2" fill="#000000" opacity=".13"/>
  `);

  /* ---------------- choosing one by hand ---------------- */

  /* The guess is right most of the time, and wrong in ways only the owner of
     the cupboard can see: 「コンソメ」 is a box to this table and a stock cube
     to the person buying it. So the picture can be set by hand — and for that
     every icon needs a name to be listed under. The first keyword is it: it
     is the plainest word for the thing, which is why it was written first. */
  const LABELS = { package: "むじるしの箱" };
  KEYS.forEach(([key, words]) => { if (!LABELS[key]) LABELS[key] = words[0]; });

  /** Every icon, in the order KEYS groups them. */
  const ORDER = KEYS.map(([key]) => key)
    .concat(Object.keys(ICONS).filter((k) => !KEYS.some(([key]) => key === k)));

  const list = () => ORDER.map((key) => ({ key, label: LABELS[key] || key, svg: ICONS[key] }));

  /** The icon a key names, or "" for a key that is not one. */
  const byKey = (key) => (key && ICONS[key]) || "";

  /** The longest run of characters two strings share. */
  function sharedRun(a, b) {
    let best = 0, end = 0;
    const row = new Array(b.length + 1).fill(0);
    for (let i = 1; i <= a.length; i++) {
      let prev = 0;
      for (let j = 1; j <= b.length; j++) {
        const cur = row[j];
        row[j] = a[i - 1] === b[j - 1] ? prev + 1 : 0;
        if (row[j] > best) { best = row[j]; end = i; }
        prev = cur;
      }
    }
    return a.slice(end - best, end);
  }

  const KANJI = /[㐀-鿿]/;

  /* How much a shared run is worth saying out loud. Two kana together mean
     almost nothing — 「こんそめ」 and 「べーこん」 share こん, and one is not a
     hint about the other — while two kanji usually name a thing: 洗剤 shared
     between 食器用洗剤 and 洗濯洗剤 is the whole point. So kana need three,
     kanji need two. */
  const runIsWorthIt = (run) => run.length >= 3 || (run.length >= 2 && KANJI.test(run));

  /**
   * Icons this name might mean, best first.
   *
   * Three tiers, and the reason there are three: an exact hit is what `find`
   * already picks and belongs at the top; a name that is *part* of a keyword
   * (「トイレ」 against 「トイレットペーパー」) is nearly as good; and after
   * that, sharing a run of characters is worth offering — 「食器用洗剤」 and
   * 「洗濯洗剤」 share 洗剤, which is exactly the pair a guess is most likely
   * to get the wrong way round.
   */
  function suggest(name, limit) {
    const n = KN.util.foldKana(String(name || ""));
    if (!n) return [];
    const score = new Map();
    const bump = (key, v) => { if ((score.get(key) || 0) < v) score.set(key, v); };

    KEYS.forEach(([key, words]) => {
      words.forEach((w) => {
        const k = KN.util.foldKana(w);
        if (!k) return;
        if (n.includes(k)) bump(key, 2000 + k.length * 10);
        else if (n.length >= 2 && k.includes(n)) bump(key, 1000 + n.length * 10);
        else {
          const run = sharedRun(n, k);
          if (runIsWorthIt(run)) bump(key, run.length * 10 + (KANJI.test(run) ? 5 : 0));
        }
      });
    });

    return [...score.entries()]
      .sort((a, b) => b[1] - a[1] || ORDER.indexOf(a[0]) - ORDER.indexOf(b[0]))
      .slice(0, limit || 8)
      .map(([key]) => key);
  }

  /** Icons whose name or keywords contain the query. */
  function search(query) {
    const q = KN.util.foldKana(String(query || ""));
    if (!q) return list();
    return list().filter(({ key, label }) => {
      if (KN.util.foldKana(label).includes(q)) return true;
      const entry = KEYS.find(([k]) => k === key);
      return !!entry && entry[1].some((w) => KN.util.foldKana(w).includes(q));
    });
  }

  KN.productIcons = { find, fallback, ICONS, list, byKey, suggest, search, LABELS };
})();

/* =========================================================
   くらしノート — state, persistence, selectors
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { uid, today } = KN.util;

  const KEY = "kaimono-note-v2";
  const LEGACY_KEY = "kaimono-note-v1";
  const SCHEMA = 2;

  /* ---------------- defaults ---------------- */

  /* Each category carries a colour. It tints the rows of everything in it, so
     a glance down the list groups itself without reading a word. Mid-tone
     hues on purpose: they are mixed into the card surface at a low percentage,
     and a colour that is already pale has nothing left to give in light mode
     while a dark one goes muddy against the dark surface. */
  const CATEGORY_COLORS = [
    "#5ea55a", "#d4695f", "#d79a4a", "#5b9bd5", "#4fb3c4",
    "#9b7ede", "#48b39a", "#e07fa8", "#8d968f", "#c2853f", "#7a8fd4",
  ];

  const DEFAULT_CATEGORIES = [
    { id: "c-veg",    name: "野菜・くだもの", emoji: "🥬", color: "#5ea55a" },
    { id: "c-meat",   name: "肉・魚",         emoji: "🐟", color: "#d4695f" },
    { id: "c-food",   name: "食品",           emoji: "🍞", color: "#d79a4a" },
    { id: "c-cold",   name: "冷蔵・冷凍",     emoji: "🧊", color: "#5b9bd5" },
    { id: "c-drink",  name: "飲みもの",       emoji: "🥤", color: "#4fb3c4" },
    { id: "c-daily",  name: "日用品",         emoji: "🧴", color: "#9b7ede" },
    { id: "c-clean",  name: "掃除・洗剤",     emoji: "🧻", color: "#48b39a" },
    { id: "c-health", name: "薬・衛生",       emoji: "💊", color: "#e07fa8" },
    { id: "c-other",  name: "その他",         emoji: "📦", color: "#8d968f" },
  ];

  const STORE_COLORS = [
    "#3b82f6", "#f59e0b", "#10b981", "#ef4444",
    "#8b5cf6", "#ec4899", "#14b8a6", "#f97316",
    "#6366f1", "#84cc16",
  ];

  const OTHER_CATEGORY = "c-other";

  function emptyState() {
    return {
      schema: SCHEMA,
      categories: DEFAULT_CATEGORIES.map((c, i) => ({ ...c, order: i })),
      stores: [],
      products: [],
      items: [],
      // やること。買い物とは別の暮らしの用事で、値段も店も持たない代わりに
      // 日付と繰り返しを持つ。
      todos: [],
      // Corrections the user has made by hand: folded product name → category.
      learned: {},
      // layout: "rows" | "tiles" — one setting for both lists, because a
      // person who wants square tiles wants them on the screen they are
      // looking at, not on one of the two.
      settings: { theme: "auto", showChecked: true, layout: "rows" },
    };
  }

  /* ---------------- persistence ---------------- */

  let migratedOnLoad = false;
  let state = load();
  const listeners = new Set();

  function load() {
    try {
      const rawV2 = localStorage.getItem(KEY);
      if (rawV2) return reconcile(JSON.parse(rawV2));

      const rawV1 = localStorage.getItem(LEGACY_KEY);
      if (rawV1) {
        migratedOnLoad = true;
        return migrateV1(JSON.parse(rawV1));
      }
    } catch (err) {
      console.warn("state load failed, starting fresh", err);
    }
    return emptyState();
  }

  /** Fill in anything a older/partial save is missing so the app never crashes. */
  function reconcile(s) {
    const base = emptyState();
    const out = { ...base, ...s };
    out.settings = { ...base.settings, ...(s.settings || {}) };
    out.categories = Array.isArray(s.categories) && s.categories.length ? s.categories : base.categories;
    out.stores   = Array.isArray(s.stores)   ? s.stores   : [];
    out.products = Array.isArray(s.products) ? s.products : [];
    out.items    = Array.isArray(s.items)    ? s.items    : [];
    out.todos    = Array.isArray(s.todos)    ? s.todos    : [];
    out.learned  = (s.learned && typeof s.learned === "object" && !Array.isArray(s.learned)) ? s.learned : {};
    // Each entry keeps the name as it was typed as well as the folded key it is
    // matched on, so 設定 can show 「コンソメ」 rather than 「こんそめ」.
    Object.keys(out.learned).forEach((k) => {
      const v = out.learned[k];
      if (typeof v === "string") out.learned[k] = { category: v, label: k };
      else if (!v || !v.category) delete out.learned[k];
    });

    out.categories.forEach((c, i) => {
      if (typeof c.order !== "number") c.order = i;
      // Lists saved before categories had colours, and any the user made by
      // hand, get one off the palette rather than none.
      if (!c.color) c.color = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
    });
    out.products.forEach((p) => {
      if (!Array.isArray(p.prices)) p.prices = [];
      if (!p.categoryId || !out.categories.some((c) => c.id === p.categoryId)) {
        p.categoryId = OTHER_CATEGORY;
      }
    });
    // Drop items whose product vanished.
    out.items = out.items.filter((i) => out.products.some((p) => p.id === i.productId));
    // Lists saved before favourites existed carry no flag; absent means off.
    out.items.forEach((i) => { i.fav = i.fav === true; });

    /* Todos, filled in rather than trusted: this list is also what an imported
       backup lands in, and a half-written todo would take the screen down. A
       due date is either a 「YYYY-MM-DD」 day or nothing at all — anything
       else (an old ISO timestamp, a typo) is dropped rather than shown as
       「Invalid Date」. */
    out.todos = out.todos.filter((t) => t && typeof t === "object").map((t, i) => ({
      id: t.id || uid("t"),
      title: String(t.title || "").trim(),
      due: /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : null,
      repeat: ["daily", "weekly", "monthly"].includes(t.repeat) ? t.repeat : null,
      // 毎週 on named days, and 毎月 on a 「第2火曜」 rather than a date.
      repeatDays: cleanDays(t.repeatDays),
      repeatNth: cleanNth(t.repeatNth),
      // 毎朝 / 毎晩、または時刻そのもの。どちらか一方だけを持ちます——両方ある
      // と食い違えるので。日のなかの並びは todoPart() が時刻から読みます。
      part: cleanPart(t.part),
      time: KN.util.isTime(t.time) ? t.time : null,
      // 「YYYY-MM-DD HH:MM」 of the occurrence already announced, if any.
      notifiedFor: typeof t.notifiedFor === "string" ? t.notifiedFor : null,
      memo: typeof t.memo === "string" ? t.memo : "",
      flagged: t.flagged === true,
      done: t.done === true,
      doneAt: t.doneAt || null,
      archived: t.archived === true,
      archivedAt: t.archivedAt || null,
      createdAt: t.createdAt || today(),
      order: typeof t.order === "number" ? t.order : i,
    })).filter((t) => t.title).map(fixBookend);

    out.schema = SCHEMA;
    return out;
  }

  /* 朝・午後・夜のほかに、日の両端に立つ二つ。「毎朝」と「毎晩」は、その日の
     どこかではなく、その日の *はじめ* と *おわり* — 起きてすること、寝る前に
     すること。だから同じ日のほかの用事は、この二つに挟まれて並びます。

     「毎」と名乗る以上くり返しなので、選べば毎日になります。そこを別々の欄に
     しておくと「毎朝だが一度きり」が作れてしまい、それは言葉と食い違います。 */
  /* Function declarations, not consts: reconcile() runs while this module is
     still being evaluated (`let state = load()` below the definitions), so a
     `const` down here would still be in its dead zone and every load would
     throw — quietly, into load()'s catch, and come back as an empty app. */
  function isBookendPart(p) { return p === "dawn" || p === "dusk"; }

  /* Only the two ends are stored any more. 朝・午後・夜 were a way of saying
     roughly when in the day something belonged, and a written clock time says
     it better; anything saved under the old names is dropped on load, because
     nothing shows it and nothing can set it. A *time* still reads as one of
     them for sorting (todoPart below) — that is arithmetic, not a stored
     choice. */
  function cleanPart(v) { return isBookendPart(v) ? v : null; }

  /** Hold a 毎朝／毎晩 to what it says: every day, on a day, at no clock time. */
  function fixBookend(t) {
    if (!isBookendPart(t.part)) return t;
    t.repeat = "daily";
    t.repeatDays = [];
    t.repeatNth = null;
    t.time = null;
    if (!t.due) t.due = KN.util.todayKey();
    return t;
  }

  /** 0..6, no repeats, in week order — anything else is not a set of days. */
  function cleanDays(v) {
    if (!Array.isArray(v)) return [];
    const out = [...new Set(v.map((n) => Number(n)).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))];
    return out.sort((a, b) => a - b);
  }

  /** 「第◯◯曜日」: nth is 1..5 or -1 for 最終. */
  function cleanNth(v) {
    if (!v || typeof v !== "object") return null;
    const nth = Number(v.nth), weekday = Number(v.weekday);
    if (!Number.isInteger(weekday) || weekday < 0 || weekday > 6) return null;
    if (!(nth === -1 || (Number.isInteger(nth) && nth >= 1 && nth <= 5))) return null;
    return { nth, weekday };
  }

  /** v1 stored store names inline on each price; lift them into real store records. */
  function migrateV1(old) {
    const s = emptyState();
    const storeByName = new Map();
    const catByName = new Map(s.categories.map((c) => [c.name, c.id]));

    function storeIdFor(name) {
      const key = String(name).trim();
      if (!key) return null;
      if (storeByName.has(key)) return storeByName.get(key);
      const rec = {
        id: uid("s"),
        name: key,
        color: STORE_COLORS[storeByName.size % STORE_COLORS.length],
        order: storeByName.size,
      };
      s.stores.push(rec);
      storeByName.set(key, rec.id);
      return rec.id;
    }

    function categoryIdFor(name) {
      const key = String(name || "").trim();
      if (!key) return OTHER_CATEGORY;
      if (catByName.has(key)) return catByName.get(key);
      const rec = { id: uid("c"), name: key, emoji: "🏷️", order: s.categories.length };
      s.categories.push(rec);
      catByName.set(key, rec.id);
      return rec.id;
    }

    (old.products || []).forEach((p) => {
      s.products.push({
        id: p.id || uid("p"),
        name: p.name,
        categoryId: categoryIdFor(p.category),
        amount: null,
        unit: "",
        note: "",
        prices: (p.prices || []).map((pr) => ({
          id: pr.id || uid("pr"),
          storeId: storeIdFor(pr.store),
          price: Number(pr.price) || 0,
          amount: null,
          date: pr.date || today(),
        })).filter((pr) => pr.storeId),
      });
    });

    (old.listItems || []).forEach((i) => {
      if (!s.products.some((p) => p.id === i.productId)) return;
      s.items.push({
        id: i.id || uid("i"),
        productId: i.productId,
        qty: Number(i.qty) || 1,
        memo: i.memo || "",
        checked: !!i.checked,
        addedAt: i.addedAt || today(),
      });

  function persist() {

      } catch (err) {
        console.error("save failed", err);

      }

  }

  function emit() {
    listeners.forEach((fn) => fn(state));
  }

  /** Apply a mutation, persist, and notify. */

    persist();

                  "加湿器", "テレビ", "パソコン", "スマホ", "充電", "ケーブル", "リモコン", "炊飯器", "トースター"]],
  ];

  /** Best-guess category id for a product name; falls back to その他.
   *  The longest matching keyword wins rather than the first category listed,
   *  so 「牛乳」beats 「牛」and 「化粧水」beats 「水」. */
  /* Corrections, longest key first — same rule as everything else here, so a
     learned 「コンソメ」 also catches 「味の素 コンソメ」. Entries pointing at a
     category that has since been deleted are skipped rather than dropped: the
     category might come back, and silently forgetting is worse than ignoring. */
  function learnedPairs() {
    return Object.entries(state.learned || {})
      .filter(([, v]) => v && state.categories.some((c) => c.id === v.category))
      .map(([key, v]) => [key, v.category])
      .sort((a, b) => b[0].length - a[0].length);
  }

  /** Everything learned, for showing in 設定. */
  function learnedList() {
    return Object.entries(state.learned || {}).map(([key, v]) => ({
      key,
      label: (v && v.label) || key,
      categoryId: v && v.category,
      category: state.categories.find((c) => c.id === (v && v.category)) || null,
    }));
  }

  /** Remember that this product belongs in this category, for next time. */
  function learnCategory(name, categoryId) {
    const label = String(name || "").trim();
    const key = KN.util.foldKana(label);
    if (!key || !categoryId) return;
    update((s) => {
      if (!s.learned) s.learned = {};
      s.learned[key] = { category: categoryId, label };
    });
  }

  function forgetCategory(key) {
    update((s) => { if (s.learned) delete s.learned[key]; });
  }

  function forgetAllCategories() {
    update((s) => { s.learned = {}; });
  }

  /**
   * Best-guess category id for a product name; falls back to その他.
   *
   * Three sources, in order of how much they know:
   *
   *  1. What the user corrected by hand. If they once moved 「コンソメ」 into
   *     調味料, that is not a guess any more, and nothing below may overrule it.
   *  2. The categories' own names. 「コンソメ(調味料)」 says where it goes, and
   *     this is what makes renaming work for someone who threw the built-in
   *     categories away and wrote their own — the keyword table below is keyed
   *     to the default ids and knows nothing about a category called 調味料.
   *  3. The built-in keyword table.
   *
   * Within each source the longest match wins rather than the first listed, so
   * 「牛乳」 beats 「牛」 and 「化粧水」 beats 「水」.
   */
  function guessCategory(name) {
    const raw = String(name || "");
    if (!raw.trim()) return OTHER_CATEGORY;
    const folded = KN.util.foldKana(raw);

    for (const [key, id] of learnedPairs()) {
      if (folded.includes(key)) return id;
    }

    let namedId = null, namedLen = 0;
    state.categories.forEach((c) => {
      const key = KN.util.foldKana(c.name);
      // One character is too little to go on — a category called 「肉」 would
      // claim 「肉まん」 and everything else that happens to contain it.
      if (key.length >= 2 && key.length > namedLen && folded.includes(key)) {
        namedId = c.id;
        namedLen = key.length;
      }
    });
    if (namedId) return namedId;

    let bestId = OTHER_CATEGORY;
    let bestLen = 0;
    for (const [catId, words] of CATEGORY_HINTS) {
      // A category the user deleted must not shadow a still-valid match.
      if (!state.categories.some((c) => c.id === catId)) continue;
      for (const w of words) {
        if (w.length > bestLen && raw.includes(w)) {
          bestId = catId;
          bestLen = w.length;
        }
      }
    }
    return bestId;
  }

  /** The colour a product's rows are tinted with — its category's. */
  function productColor(product) {
    if (!product) return "";
    return getCategory(product.categoryId).color || "";
  }

  /**
   * The picture beside a product — always a drawn one (see product-icons.js).
   *
   * Three tries, each less specific than the last. The name first. Then the
   * category's name, because a category is a thing with a picture too: once
   * 「コンソメ」 is known to be 調味料, a salt cellar says far more than a
   * blank carton did. Only when neither says anything does it fall back to a
   * plain package, painted in the category's colour so the row still belongs
   * to a group by sight.
   * @returns raw HTML, ready to drop into an html`` template
   */
  function productMark(product) {
    if (!product) return "";
    // Chosen by hand: nothing else gets to argue with it.
    const own = KN.productIcons.byKey(product.icon);
    return own ? KN.util.raw(own) : autoMark(product);
  }

  /** What the picture would be if nobody had chosen one. */
  function autoMark(product) {
    if (!product) return "";
    const cat = getCategory(product.categoryId);
    return KN.util.raw(
      KN.productIcons.find(product.name)
      || (cat && KN.productIcons.find(cat.name))
      || KN.productIcons.fallback(productColor(product))
    );
  }

  function findProductByName(name) {
    const n = String(name).trim().toLowerCase();
    return state.products.find((p) => p.name.trim().toLowerCase() === n) || null;
  }

  function findStoreByName(name) {
    const n = String(name).trim().toLowerCase();
    return state.stores.find((s) => s.name.trim().toLowerCase() === n) || null;
  }

  /**
   * Latest recorded price per store for a product, cheapest first.
   * Older entries for the same store are treated as history, not offers.
   */
  function currentPrices(product) {
    if (!product) return [];
    const latest = new Map();
    [...product.prices]
      .sort((a, b) => new Date(a.date) - new Date(b.date))
      .forEach((pr) => latest.set(pr.storeId, pr));
    return [...latest.values()]
      .filter((pr) => getStore(pr.storeId))
      .sort((a, b) => a.price - b.price);
  }

  function bestPrice(product) {
    const list = currentPrices(product);
    return list.length ? list[0] : null;
  }

  /** Price of `product` at `storeId` right now, or null. */
  function priceAt(product, storeId) {
    return currentPrices(product).find((pr) => pr.storeId === storeId) || null;
  }

  /* ---------------- mutations ---------------- */

  function addStore(name, color) {
    const clean = String(name).trim();
    if (!clean) return null;
    const existing = findStoreByName(clean);
    if (existing) return existing;
    const rec = {
      id: uid("s"),
      name: clean,
      color: color || STORE_COLORS[state.stores.length % STORE_COLORS.length],
      order: state.stores.length,
    };
    update((s) => { s.stores.push(rec); });
    return rec;
  }

  function addProduct({ name, categoryId, amount, unit, note }) {
    const clean = String(name).trim();
    if (!clean) return null;
    const existing = findProductByName(clean);
    if (existing) return existing;
    const rec = {
      id: uid("p"),
      name: clean,
      categoryId: categoryId || OTHER_CATEGORY,
      amount: isFinite(amount) && amount > 0 ? amount : null,
      unit: unit || "",
      note: note || "",
      prices: [],
    };
    update((s) => { s.products.push(rec); });
    return rec;
  }

  /* ---------------- やること ----------------

     A todo is a much smaller thing than a product: a line of text, and at most
     a day it is wanted by. Everything else here exists because of that day —
     what is overdue, what repeats, what the icon should count. */

  function addTodo({ title, due = null, part = null, time = null, repeat = null, repeatDays = [],
                     repeatNth = null, memo = "", flagged = false } = {}) {
    const name = String(title || "").trim();
    if (!name) return null;
    const at = KN.util.isTime(time) ? time : null;
    const rec = {
      id: uid("t"),
      title: name,
      due: /^\d{4}-\d{2}-\d{2}$/.test(due) ? due : null,
      repeat: ["daily", "weekly", "monthly"].includes(repeat) ? repeat : null,
      repeatDays: cleanDays(repeatDays),
      repeatNth: cleanNth(repeatNth),
      part: at ? null : cleanPart(part),
      time: at,
      notifiedFor: null,
      memo: String(memo || ""),
      flagged: !!flagged,
      done: false,
      doneAt: null,
      archived: false,
      archivedAt: null,
      createdAt: today(),
      order: 0,
    };
    fixBookend(rec);
    update((s) => {
      s.todos.forEach((t) => { t.order = (t.order || 0) + 1; });
      s.todos.unshift(rec);
    });
    return rec;
  }

  function getTodo(id) { return get().todos.find((t) => t.id === id) || null; }

  function updateTodo(id, patch) {
    update((s) => {
      const t = s.todos.find((x) => x.id === id);
      if (!t) return;
      if ("title" in patch) t.title = String(patch.title || "").trim() || t.title;
      if ("due" in patch) t.due = /^\d{4}-\d{2}-\d{2}$/.test(patch.due) ? patch.due : null;
      if ("repeat" in patch) {
        t.repeat = ["daily", "weekly", "monthly"].includes(patch.repeat) ? patch.repeat : null;
      }
      /* 時刻と 朝/午後/夜 は、どちらか一方だけ。決めたほうが残り、もう一方は
         降ります——「19:30」と「朝」を両方持たせると、どちらが本当かを毎回
         決めなおすことになるので。あとから来た指定が勝ちます。 */
      if ("time" in patch) {
        t.time = KN.util.isTime(patch.time) ? patch.time : null;
        if (t.time) t.part = null;
      }
      if ("part" in patch) {
        t.part = cleanPart(patch.part);
        if (t.part && !("time" in patch)) t.time = null;
      }
      if (!t.due) { t.part = null; t.time = null; }
      fixBookend(t);
      if ("repeatDays" in patch) t.repeatDays = cleanDays(patch.repeatDays);
      if ("repeatNth" in patch) t.repeatNth = cleanNth(patch.repeatNth);
      if ("memo" in patch) t.memo = String(patch.memo || "");
      if ("flagged" in patch) t.flagged = !!patch.flagged;
    });
  }

  /** @returns {() => void} puts it back, in its place. */
  function removeTodo(id) {
    const at = get().todos.findIndex((t) => t.id === id);
    if (at < 0) return () => {};
    const snapshot = { ...get().todos[at] };
    update((s) => { s.todos = s.todos.filter((t) => t.id !== id); });
    return () => update((s) => {
      const next = s.todos.slice();
      next.splice(Math.min(at, next.length), 0, snapshot);
      s.todos = next;
    });
  }

  /** The day after this one for a repeating todo, counted from the due date. */
  function nextDue(todo) {
    const U = KN.util;
    const from = todo.due || U.todayKey();

    /* Counted from the due date, then walked forward past any dates already
       gone: ticking off a bin day three weeks late should set the next one to
       the coming week, not to a date still in the past. */
    let next = from;
    const step = () => {
      if (todo.repeat === "daily") { next = U.shiftDay(next, 1); return; }

      if (todo.repeat === "weekly") {
        const days = todo.repeatDays || [];
        // 「毎週 火・金」 is two bin days a week, not one every seven — so the
        // next one is the next named day, which may be two days away.
        if (days.length) {
          for (let i = 1; i <= 7; i++) {
            const cand = U.shiftDay(next, i);
            if (days.includes(U.dayOfWeek(cand))) { next = cand; return; }
          }
        }
        next = U.shiftDay(next, 7);
        return;
      }

      /* 「第2火曜」 is not a date: it moves every month, so the next one is
         worked out in the next month rather than added to this one. A month
         with no fifth Tuesday is skipped rather than rounded. */
      const nth = todo.repeatNth;
      if (nth) {
        const d = U.dayDate(next) || new Date();
        for (let m = 1; m <= 12; m++) {
          const probe = new Date(d.getFullYear(), d.getMonth() + m, 1);
          const key = U.nthWeekdayOf(probe.getFullYear(), probe.getMonth(), nth.nth, nth.weekday);
          if (key && key > next) { next = key; return; }
        }
      }
      next = U.shiftMonth(next, 1);
    };

    step();
    let guard = 0;
    while (U.daysUntil(next) < 0 && guard++ < 500) step();
    return next;
  }

  /** The first day on or after `from` that the repeat rule actually falls on. */
  function snapToRule(todo, from) {
    const U = KN.util;
    if (!from) return from;
    if (todo.repeat === "weekly" && (todo.repeatDays || []).length) {
      for (let i = 0; i <= 7; i++) {
        const cand = U.shiftDay(from, i);
        if (todo.repeatDays.includes(U.dayOfWeek(cand))) return cand;
      }
    }
    if (todo.repeat === "monthly" && todo.repeatNth) {
      const d = U.dayDate(from) || new Date();
      for (let m = 0; m <= 12; m++) {
        const probe = new Date(d.getFullYear(), d.getMonth() + m, 1);
        const key = U.nthWeekdayOf(probe.getFullYear(), probe.getMonth(),
          todo.repeatNth.nth, todo.repeatNth.weekday);
        if (key && key >= from) return key;
      }
    }
    return from;
  }

  /**
   * Tick a todo off, or put it back.
   *
   * A repeating one is never finished: ticking it moves it to its next day and
   * leaves it on the list, which is the whole point of 「毎週」. Undo has to
   * know which of the two happened, so it is handed back rather than guessed.
   *
   * @returns {{repeated: boolean, due: string|null, undo: () => void}}
   */
  function toggleTodo(id) {
    const before = getTodo(id);
    if (!before) return { repeated: false, due: null, undo: () => {} };
    const was = { done: before.done, doneAt: before.doneAt, due: before.due };
    const repeating = !before.done && !!before.repeat;
    const due = repeating ? nextDue(before) : before.due;

    update((s) => {
      const t = s.todos.find((x) => x.id === id);
      if (!t) return;
      if (repeating) {
        t.due = due;
        t.done = false;
        t.doneAt = null;
      } else {
        t.done = !t.done;
        t.doneAt = t.done ? today() : null;
        // Un-ticking is 「まだだった」, which also means it is back on the list.
        if (!t.done) { t.archived = false; t.archivedAt = null; }
      }
    });

    return {
      repeated: repeating,
      due: repeating ? due : null,
      undo: () => update((s) => {
        const t = s.todos.find((x) => x.id === id);
        if (!t) return;
        t.done = was.done;
        t.doneAt = was.doneAt;
        t.due = was.due;
      }),
    };
  }

  /* Overdue first, then by day, then by hand-order. Undated ones come last:
     they are things to do, not things due, and a list that mixed them in
     would bury the ones with a day on them. */
  /* 毎朝 at one end of the day and 毎晩 at the other, with everything else
     between them — and inside that middle, whatever carries a clock sorts by
     it. The am/pm/night keys are never stored: they are what a *time* reads
     as, so 08:00 lands ahead of 14:30 ahead of 21:00 without a second field.
     「いつでも」 sits ahead of all of them: it is not early, it is unplaced,
     and unplaced things go where nothing is competing for the slot. */
  const PART_ORDER = { dawn: 0, am: 2, pm: 3, night: 4, dusk: 5 };
  const NO_PART_ORDER = 1;

  /** 朝 / 午後 / 夜 — from the clock when there is one, otherwise from what was
      chosen by hand. Which shelf a todo lands on is read from here, so a
      「19:30」 files itself under 夜 without anyone having said 夜. */
  const todoPart = (t) => (t && t.time ? KN.util.partOfTime(t.time) : (t && t.part) || null);

  function sortedTodos() {
    const rank = (t) => (t.due ? KN.util.daysUntil(t.due) : Number.MAX_SAFE_INTEGER);
    // Within a day, 朝 before 午後 before 夜 — the order the day happens in.
    // Something with no part is not 「早い」, it is 「いつでも」, so it sits first
    // where nothing competes with it.
    const part = (t) => { const p = todoPart(t); return p ? PART_ORDER[p] : NO_PART_ORDER; };
    /* And within one part of a day, the clock decides. A row that says 19:30
       sits above one that says 21:00 whatever order they were typed in — that
       is what writing a time down was for. The ones with no time keep their
       hand-order and follow, since 「いつでも」 cannot be early. */
    const at = (t) => (t.time ? 0 : 1);
    return get().todos.slice().sort((a, b) =>
      rank(a) - rank(b)
      || part(a) - part(b)
      || at(a) - at(b)
      || String(a.time || "").localeCompare(String(b.time || ""))
      || (b.flagged === true) - (a.flagged === true)
      || (a.order || 0) - (b.order || 0));
  }

  /* Put away without doing it. 「もうやらない」 and 「やった」 are different
     things about the same line, so they are different flags — but they end in
     the same drawer, because what both mean to the list is 「片づいた」. */
  function archiveTodo(id, on) {
    const before = getTodo(id);
    if (!before) return () => {};
    const was = { archived: !!before.archived, archivedAt: before.archivedAt || null };
    update((s) => {
      const t = s.todos.find((x) => x.id === id);
      if (!t) return;
      t.archived = !!on;
      t.archivedAt = on ? today() : null;
    });
    return () => update((s) => {
      const t = s.todos.find((x) => x.id === id);
      if (!t) return;
      t.archived = was.archived;
      t.archivedAt = was.archivedAt;
    });
  }

  /** Still on the list: neither done nor put away. */
  const openTodos = () => get().todos.filter((t) => !t.done && !t.archived);

  /** Done or put away — the drawer at the bottom. */
  const closedTodos = () => get().todos.filter((t) => t.done || t.archived);

  /** The day a closed todo was closed, whichever way it closed. */
  const todoClosedAt = (t) => t.doneAt || t.archivedAt || null;

  /**
   * Not done, not put away, and wanted *now* — the badge.
   *
   * A time on a todo is a statement about when it starts being your problem.
   * 「19:30 に薬」 is not something the icon should be nagging about over
   * breakfast: a 1 sitting there all day for a thing that cannot be done yet
   * is the kind of number you learn to stop reading. So a timed todo joins the
   * count when its clock comes round, and yesterday's stays counted whatever
   * time it said — being late is not a thing that waits for an hour.
   */
  function todosDue() {
    const now = KN.util.nowTime();
    return openTodos().filter((t) => {
      if (!t.due) return false;
      const n = KN.util.daysUntil(t.due);
      if (n < 0) return true;
      if (n > 0) return false;
      return !t.time || t.time <= now;
    });
  }

  /** Today's timed todos whose time has not come round yet — waiting, not due. */
  function todosWaiting() {
    const now = KN.util.nowTime();
    return openTodos().filter((t) =>
      t.due && t.time && KN.util.daysUntil(t.due) === 0 && t.time > now);
  }

  /* ---- 「もう言った」 ----

     A todo is announced once per occurrence, and an occurrence is the day and
     the time it was for. Storing that pair rather than a flag means a repeating
     todo announces itself again next Tuesday, and moving 19:30 to 20:00 makes
     it a new thing to say — without anyone having to remember to clear a flag.
     Written into the record so a closed app does not forget and repeat itself
     on the way back in. */
  const occurrenceOf = (t) => (t.due && t.time ? `${t.due} ${t.time}` : null);

  /** Timed todos whose time has come and which have not been announced yet. */
  function todosToAnnounce() {
    const now = KN.util.nowTime();
    return openTodos().filter((t) => {
      if (!t.due || !t.time) return false;
      if (KN.util.daysUntil(t.due) !== 0) return false;   // 今日のぶんだけ
      if (t.time > now) return false;
      return t.notifiedFor !== occurrenceOf(t);
    });
  }

  /** Remember that these were announced, so they are not announced twice. */
  function markAnnounced(ids) {
    const want = new Set(ids);
    if (!want.size) return;
    update((s) => {
      s.todos.forEach((t) => {
        if (want.has(t.id)) t.notifiedFor = occurrenceOf(t);
      });
    });
  }

  function addItem(productId, { qty = 1, memo = "" } = {}) {
    const rec = {
      id: uid("i"),
      productId,
      qty: Math.max(1, Math.round(qty) || 1),
      memo,
      checked: false,
      // Marks the item as part of the trip being shopped right now.
      fav: false,
      addedAt: today(),
    };
    update((s) => {
      s.items.unshift(rec);
      // Putting something on the list is using it again, so it comes back out
      // of the archive. Otherwise it would sit on the list and be missing
      // from the price screen at the same time.
      const prod = s.products.find((x) => x.id === productId);
      if (prod && prod.archived) prod.archived = false;
    });
    return rec;
  }

  /**
   * Put a product away, or bring it back.
   *
   * Archived means "not in play", and that has to be true on both screens at
   * once: the card leaves the price list's main run, and the product also
   * comes off the shopping list, because something being bought today is not
   * something put away. (The reverse already holds — addItem un-archives.)
   *
   * @returns {() => void} undoes exactly this call, list rows and all.
   */
  function setArchived(productId, on) {
    const prev = getProduct(productId);
    const was = !!(prev && prev.archived);
    // The day it went in, so the drawer reads as a record of when rather than
    // an undated heap. Restored exactly on undo — an undone archiving never
    // happened, and should not leave a date behind saying it did.
    const wasAt = (prev && prev.archivedAt) || null;
    // Kept with their positions so an undo puts the rows back where they were,
    // not at the top of the list.
    const dropped = [];
    get().items.forEach((it, i) => { if (it.productId === productId) dropped.push({ at: i, item: it }); });

    update((s) => {
      const p = s.products.find((x) => x.id === productId);
      if (p) { p.archived = on; p.archivedAt = on ? today() : null; }
      if (on) s.items = s.items.filter((i) => i.productId !== productId);
    });

    return () => update((s) => {
      const p = s.products.find((x) => x.id === productId);
      if (p) { p.archived = was; p.archivedAt = wasAt; }
      if (!on) return;
      const next = s.items.slice();
      // Ascending, so each splice lands in the slot the one before it made.
      dropped.forEach(({ at, item }) => next.splice(Math.min(at, next.length), 0, item));
      s.items = next;
    });
  }

  function addPrice(productId, { storeId, price, amount, date }) {
    const rec = {
      id: uid("pr"),
      storeId,
      price: Number(price),
      amount: isFinite(amount) && amount > 0 ? amount : null,
      date: date || today(),
    };
    update((s) => {
      const p = s.products.find((x) => x.id === productId);
      if (p) p.prices.push(rec);
    });
    return rec;
  }

  /* ---------------- import / export ---------------- */

  function exportJSON() {
    return JSON.stringify({ ...state, exportedAt: today(), app: "kaimono-note" }, null, 2);
  }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== "object") throw new Error("形式が正しくありません");
    const next = parsed.schema >= 2 ? reconcile(parsed) : migrateV1(parsed);
    update((s) => {
      s.schema = SCHEMA;
      s.categories = next.categories;
      s.stores = next.stores;

/* ---- js/ui.js ---- */
/* =========================================================
   くらしノート — UI primitives (sheet, toast, dialogs)
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, haptic } = KN.util;

  const sheetRoot = () => document.getElementById("sheet-root");
  const toastRoot = () => document.getElementById("toast-root");

  const openSheets = [];

  /* ---------------- bottom sheet ---------------- */

  /**
   * Open a modal sheet.
   * @param {object} opts
   * @param {string} opts.title
   * @param {Node|DocumentFragment} opts.content
   * @param {Node} [opts.footer]
   * @param {Function} [opts.onClose]
   * @returns {{close: Function, el: HTMLElement}}
   */
  function sheet({ title, titleMark, content, footer, onClose }) {
    const backdrop = node(html`<div class="sheet-backdrop"></div>`);
    const el = node(html`
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${title || ""}">
        <div class="sheet-handle"></div>
        <header class="sheet-head">
          <h2 class="sheet-title">${titleMark ? html`<span class="sheet-mark">${titleMark}</span>` : ""}${title || ""}</h2>
          <button class="icon-btn js-close" aria-label="閉じる">${icon("close")}</button>
        </header>
        <div class="sheet-body"></div>
      </div>
    `);

    el.querySelector(".sheet-body").append(content);
    if (footer) {
      const foot = node(html`<div class="sheet-foot"></div>`);
      foot.append(footer);
      el.append(foot);
    }

    /* Each sheet opened over another gets its own storey. Without this every
       sheet sits at the same z-index and the new sheet's backdrop lands
       *under* the old sheet — so the one underneath stays sharp and bright and
       you end up reading two forms at once through the frosted glass. */
    const depth = openSheets.length;
    backdrop.style.zIndex = String(100 + depth * 2);
    el.style.zIndex = String(101 + depth * 2);

    sheetRoot().append(backdrop, el);
    document.body.style.overflow = "hidden";

    // Next frame so the transition runs.
    requestAnimationFrame(() => {
      backdrop.classList.add("is-open");
      el.classList.add("is-open");
    });

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      backdrop.classList.remove("is-open");
      el.classList.remove("is-open");
      // The pad belongs to a field in this sheet; it has no business outliving it.
      KN.keypad && KN.keypad.close();
      /* Nor does the caret. A field removed while still focused is never
         blurred on WebKit, so the app goes on believing a keyboard is up —
         which is what left the tab bar hidden after a sheet was closed.
         Say goodbye while the field is still there to hear it. */
      if (el.contains(document.activeElement)) document.activeElement.blur();
      KN.remeasure && KN.remeasure();
      const idx = openSheets.indexOf(handle);
      if (idx >= 0) openSheets.splice(idx, 1);
      if (!openSheets.length) document.body.style.overflow = "";
      setTimeout(() => { backdrop.remove(); el.remove(); }, 300);
      onClose && onClose();
    }

    backdrop.addEventListener("click", close);
    el.querySelector(".js-close").addEventListener("click", close);

    /* Capping the sheet at the visible height (see --vvh) keeps it on screen,
       but the field you tapped can end up below the fold of the sheet's own
       scroller — which is exactly what happens entering a price near the
       bottom of a long product. Bring it back into view once the keyboard has
       finished arriving; it takes a few hundred milliseconds, and the sheet is
       still resizing the whole time, so this checks back rather than trusting
       one moment of it. */
    const scrollFieldIntoView = (field) => {
      const scroller = el.querySelector(".sheet-body");
      if (!scroller) return;
      const f = field.getBoundingClientRect();
