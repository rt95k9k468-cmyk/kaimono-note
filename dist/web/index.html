  const SNAP_KEY = "kaimono-note-snapshots";
  const KEEP = 7;
  const REMIND_AFTER_DAYS = 30;
  const REMIND_MIN_PRODUCTS = 5;

  function read() {
    try {
      const list = JSON.parse(localStorage.getItem(SNAP_KEY) || "[]");
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  }

  function write(list) {
    // Snapshots must never crowd out the live shopping data. If the quota is
    // full, drop the oldest and retry instead of letting the write throw.
    let keep = list.slice(-KEEP);
    while (keep.length) {
      try {
        localStorage.setItem(SNAP_KEY, JSON.stringify(keep));
        return true;
      } catch (err) {
        keep = keep.slice(1);
      }
    }
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* nothing left to do */ }
    return false;
  }

  function summarize(state) {
    return {
      products: (state.products || []).length,
      stores: (state.stores || []).length,
      items: (state.items || []).length,
    };
  }

  function isEmpty(state) {
    const s = summarize(state);
    return !s.products && !s.stores && !s.items;
  }

  /** Store the current state. Returns false when there was nothing worth keeping. */
  function snapshot(reason) {
    const state = store.get();
    if (isEmpty(state)) return false;

    const list = read();
    const payload = JSON.stringify(state);

    // Skip an identical repeat, otherwise simply opening the app on quiet days
    // would push the genuinely different older snapshots out of the window.
    const last = list[list.length - 1];
    if (last && last.payload === payload) return false;

    list.push({ at: today(), reason: reason || "自動", payload, summary: summarize(state) });
    return write(list);
  }

  /** One snapshot per calendar day, taken at boot. */
  function maybeDaily() {
    const list = read();
    const last = list[list.length - 1];
    if (last) {
      const a = new Date(last.at);
      const b = new Date();
      const sameDay =
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
      if (sameDay) return false;
    }
    return snapshot("自動");
  }

  /** Newest first. */
  function list() {
    return read().slice().reverse();
  }

  function restore(at) {
    const found = read().find((s) => s.at === at);
    if (!found) throw new Error("その控えが見つかりません");
    // Take one first so that restoring is itself undoable.
    snapshot("復元前");
    store.importJSON(found.payload);
  }

  function clear() {
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* already gone */ }
  }

  /* ---------------- off-device export nudge ---------------- */

  function lastExportAt() {
    const st = store.get();
    return (st.settings && st.settings.lastExportAt) || null;
  }

  function markExported() {
    store.update((s) => { s.settings.lastExportAt = today(); });
  }

  /** True once there is real data and no file has been written out in a while. */
  function exportDue() {
    const st = store.get();
    if ((st.products || []).length < REMIND_MIN_PRODUCTS) return false;
    const last = lastExportAt();
    if (!last) return true;
    const days = (Date.now() - new Date(last).getTime()) / 86400000;
    return !(days < REMIND_AFTER_DAYS);
  }

  function init() {
    maybeDaily();
    if (exportDue()) {
      // Late enough that it does not collide with the first paint.
      setTimeout(() => {
        KN.ui && KN.ui.toast("設定からバックアップを書き出しておくと安心です");
      }, 2500);
    }
  }

  KN.backup = {
    SNAP_KEY, KEEP,
    snapshot, maybeDaily, list, restore, clear,
    lastExportAt, markExported, exportDue,
    init,
  };
})();

/* ---- js/insights.js ---- */
/* =========================================================
   かいものノート — insights

   Reads the shopping data and says something useful about it. Everything
   here is arithmetic on the user's own records: no network, no key, works
   on a plane. That also means it never guesses — a figure shown here can
   be traced back to a price the user typed in.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { yen, formatDate } = KN.util;
  const store = KN.store;

  const STALE_DAYS = 90;
  const ONE_STOP_TOLERANCE = 0.05;   // within 5% of the best split is "close enough"

  const daysSince = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;

  /** Every price recorded for one product at one store, oldest first. */
  function history(product, storeId) {
    return product.prices
      .filter((pr) => pr.storeId === storeId)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
  }

  /* ---------------- individual checks ---------------- */

  /* The latest price against the one before it, at the same store. Anything
     else would compare two different shops and call it a change. */
  function priceMoves(products) {
    const out = [];
    products.forEach((p) => {
      store.currentPrices(p).forEach((cur) => {
        const h = history(p, cur.storeId);
        if (h.length < 2) return;
        const prev = h[h.length - 2];
        const delta = cur.price - prev.price;
        if (!delta) return;
        const st = store.getStore(cur.storeId);
        if (!st) return;
        const up = delta > 0;
        out.push({
          kind: "price-move",
          weight: 60 + Math.abs(delta) / Math.max(prev.price, 1) * 40,
          icon: up ? "📈" : "📉",
          title: `${p.name}が${up ? "値上がり" : "値下がり"}`,
          body: `${st.name}で ${yen(prev.price)} → ${yen(cur.price)}（${up ? "+" : ""}${yen(delta)}）`,
        });
      });
    });
    return out;
  }

  /* 「値段は高いが量あたりは安い」 という指摘はもう出ない。同じものを同じ
     大きさで買うのだから、比べるのは値段そのもの。入数で割るときも全店を
     同じ数で割るので、順番は変わらない。 */

  /* Is this trip worth splitting across shops, or is one stop good enough? */
  function tripRouting(items) {
    const priced = items
      .map((it) => ({ it, p: store.getProduct(it.productId) }))
      .filter((r) => r.p && store.bestPrice(r.p));
    if (priced.length < 2) return [];

    const cheapest = priced.reduce((sum, r) => sum + store.bestPrice(r.p).price * r.it.qty, 0);

    // What each store costs if you buy there whatever it stocks and pick up
    // the rest wherever it is cheapest — a total you could actually spend.
    const totals = store.sortedStores().map((st) => {
      let total = 0, here = 0;
      priced.forEach((r) => {
        const at = store.priceAt(r.p, st.id);
        const best = store.bestPrice(r.p);
        if (at) { total += at.price * r.it.qty; here += 1; }
        else { total += best.price * r.it.qty; }
      });
      return { st, total, here };
    }).filter((t) => t.here > 0).sort((a, b) => a.total - b.total);

    if (!totals.length) return [];
    const top = totals[0];
    const extra = top.total - cheapest;

    if (extra <= 0 || extra <= cheapest * ONE_STOP_TOLERANCE) {
      return [{
        kind: "one-stop",
        weight: 100,
        icon: "🛒",
        title: `今回は${top.st.name}だけで足ります`,
        body: extra <= 0
          ? `${priced.length}品を ${yen(top.total)} で買えます。店を回る必要はありません。`
          : `${priced.length}品を ${yen(top.total)}。店を分けても ${yen(extra)} しか変わりません。`,
      }];
    }
    return [{
      kind: "split",
      weight: 95,
      icon: "🧭",
      title: `店を分けると ${yen(extra)} 安くなります`,
      body: `${top.st.name}中心なら ${yen(top.total)}、それぞれ最安の店で買うと ${yen(cheapest)} です。`,
    }];
  }

  /* A price from last spring is a guess, not a price. */
  function stalePrices(products) {
    const out = [];
    products.forEach((p) => {
      const best = store.bestPrice(p);
      if (!best) return;
      const age = daysSince(best.date);
      if (!(age > STALE_DAYS)) return;
      out.push({
        kind: "stale",
        weight: 40 + Math.min(age / 10, 20),
        icon: "🕰️",
        title: `${p.name}の値段が古くなっています`,
        body: `最後に記録したのは ${formatDate(best.date)}。次に見かけたら確かめると合計が正確になります。`,
      });
    });
    return out;
  }

  /* ---------------- public ---------------- */

  /**
   * Findings for the items being shopped, strongest first.
   * @param {Array} items  the trip (or the whole active list when nothing is starred)
   */
  function forItems(items, limit = 3) {
    const products = [];
    const seen = new Set();
    items.forEach((it) => {
      if (seen.has(it.productId)) return;
      seen.add(it.productId);
      const p = store.getProduct(it.productId);
      if (p && p.prices.length) products.push(p);
    });
    if (!products.length) return [];

    const found = [
      ...tripRouting(items),
      ...priceMoves(products),
      ...stalePrices(products),
    ];

    // One finding per kind, so a single stale shelf cannot fill the card.
    const bestOfKind = new Map();
    found.forEach((f) => {
      const cur = bestOfKind.get(f.kind);
      if (!cur || f.weight > cur.weight) bestOfKind.set(f.kind, f);
    });

    return [...bestOfKind.values()].sort((a, b) => b.weight - a.weight).slice(0, limit);
  }

  KN.insights = { forItems, STALE_DAYS };
})();

/* ---- js/pull-refresh.js ---- */
/* =========================================================
   かいものノート — the edges of a scroll: pull to refresh, and the give
   at the bottom

   There is no server behind this app, so a refresh cannot fetch anything.
   What it can do is real, if small: write out any save still in flight,
   re-read the file from disk so a copy open elsewhere is picked up, repaint
   the screen, and ask the service worker whether a newer build has been
   deployed. The gesture is mostly there because reaching the top of a list
   and pulling is what a phone user does; this makes that mean something
   instead of nothing.

   The screens turn the browser's own overscroll off (see overscroll-behavior
   in base.css) because its bounce fought this gesture at the top. That left
   the bottom of a list stopping dead against nothing, so the same engine
   gives the bottom edge a band too — no chip, no action, just the give that
   tells a finger it has reached the end.

   Both edges are painted by one loop that eases what is on screen towards
   where the finger is, rather than writing the finger's position straight
   out. Touch points do not arrive evenly, and copying them frame for frame
   put every gap in the stream on the screen. Chasing them smooths the whole
   thing out — a few frames behind the finger, which nobody sees, and no
   steps, which everybody does.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, raw, haptic } = KN.util;

  /* The mark, drawn rather than borrowed from the icon set, because it has to
     do two different things.

     While you pull it is a redo mark: a ring with a gap, an arrowhead at the
     leading end that never quite closes the circle, and the whole thing turns
     as you go — one full revolution by the time it is armed. The ring is not
     just revealed, it is drawn: the stroke runs on from the gap and the head
     fades in as the last of it lands.

     Once you let go the arrowhead goes and a second arc takes over, chasing
     itself around the ring. Same circle, same weight, so it reads as the mark
     carrying on rather than a different thing appearing.

     Geometry, so the numbers are not mysterious: r=9 about (12,12). The arc
     runs clockwise from -60° to 240°, i.e. 300° of the circle, leaving the
     gap across the top. Its length is 2·π·9·(300/360) = 47.12, which is the
     dash pattern the drawing-on relies on. The head is a triangle centred on
     the arc's end and turned to its tangent there. */
  const MARK = raw(`
    <svg class="ptr-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path class="ptr-arc" d="M16.5 4.21A9 9 0 1 1 7.5 4.21"/>
      <path class="ptr-head" d="M10.1 2.71 7.3 6.86 5.1 3.05Z" fill="currentColor" stroke="none"/>
      <circle class="ptr-spin" cx="12" cy="12" r="9"/>
    </svg>
  `);

  const ARC_LEN = 47.12;

  const TRIGGER = 56;    // pull the chip this far down to arm the refresh
  const HOLD    = 52;    // where it parks while the refresh runs
  const MAX     = 96;    // it never stretches further than this
  const FOOT    = 76;    // and the band at the bottom never further than this
  const MIN_RUN = 550;   // keep the spinner up long enough to be read
  const SLOP    = 10;    // finger travel before we decide what this gesture is

  /* How hard the painted position is pulled towards the finger each frame,
     and towards home once the finger is gone. Low numbers on purpose: a
     little lag is invisible, whereas an uneven touch stream copied straight
     to the screen is not. */
  const FOLLOW  = 0.22;
  const SETTLE  = 0.13;

  let host = null;       // #screens
  let ptr = null;        // the chip
  let mark = null;       // the svg inside it
  let arc = null;        // the redo ring, drawn on as you pull
  let head = null;       // its arrowhead

  let screenEl = null;   // the screen being pulled
  let startY = 0, startX = 0;
  let target = 0;        // where the finger says the screen should be
  let shown = 0;         // where it actually is, chasing target
  let edge = null;       // "top" | "bottom" — which end this gesture belongs to
  let couldTop = false, couldBottom = false;
  let armed = false;     // the touch started somewhere an edge could give
  let engaged = false;   // it turned out to be a pull rather than a scroll
  let busy = false;
  let loop = 0;
  let bare = false;      // a band with no chip on it — the fling below
  let out = false;       // the fling is still on its way out, not yet coming back

  /* A flick that runs out of list stops against the boundary as if it had hit
     a wall, because the browser's own overscroll is off. Catching how fast it
     was going as it arrives lets the same band carry it a little past the end
     and bring it back — the give a finger gets, given to a throw as well. */
  const FLING_MIN  = 0.35;   // px/ms; below this it is a drift, not a throw
  const FLING_GAIN = 9;      // how much of the speed becomes travel
  const FLING_MAX  = 46;     // and how far that is ever allowed to reach
  const FLING_OUT  = 0.34;   // it goes out briskly and comes back gently
  let lastEl = null, lastTop = 0, lastAt = 0;

  function init() {
    host = document.getElementById("screens");
    if (!host) return;

    ptr = node(html`<div class="ptr"><span class="ptr-ring">${MARK}</span></div>`);
    mark = ptr.querySelector(".ptr-mark");
    arc = ptr.querySelector(".ptr-arc");
    head = ptr.querySelector(".ptr-head");
    // First child, so the screens paint over it. It only ever shows in the
    // gap a pull opens up above them.
    host.prepend(ptr);

    host.addEventListener("touchstart", onStart, { passive: true });
    host.addEventListener("touchmove", onMove, { passive: false });
    host.addEventListener("touchend", onEnd);
    host.addEventListener("touchcancel", onEnd);
    // scroll does not bubble; the capture phase is how one listener covers
    // every screen, including ones mounted later.
    host.addEventListener("scroll", onScroll, true);

    /* Switching apps mid-gesture can take the touch away without a touchend
       ever arriving, and the page is suspended before the band can spring
       back. On the way in it would then still be held open — a screen sitting
       an inch off the top with no way to put it back. Whatever was in flight
       when the app left is over; drop it and start square. */
    document.addEventListener("visibilitychange", clear);
    window.addEventListener("pageshow", clear);
  }

  /** Abandon any band, gesture or animation, and put the screen back. */
  function clear() {
    armed = engaged = out = bare = false;
    edge = null;
    if (loop) { cancelAnimationFrame(loop); loop = 0; }
    target = shown = 0;
    lastEl = null;
    if (ptr) {
      ptr.style.opacity = "0";
      ptr.style.transform = "";
    }
    // The refresh keeps running if it was mid-flight; only the motion stops.
    host.querySelectorAll(".screen").forEach((el) => {
      el.style.transform = "";
      el.style.willChange = "";
    });
    if (ptr) ptr.style.willChange = "";
  }

  /** Nothing should be pulled out from under a keyboard, a sheet or a swipe. */
  function blocked() {
    if (busy) return true;
    if (KN.reorder.isActive()) return true;
    if (document.documentElement.classList.contains("kb-open")) return true;
    if (document.querySelector(".sheet")) return true;
    if (document.querySelector(".item-wrap.is-open")) return true;
    return false;
  }

  const atTop = (el) => el.scrollTop <= 0;
  const atBottom = (el) => el.scrollHeight - el.clientHeight - el.scrollTop <= 1;

  function onStart(e) {
    armed = engaged = false;
    edge = null;
    if (e.touches.length !== 1 || blocked()) return;

    screenEl = host.querySelector(".screen.is-active");
    if (!screenEl) return;
    // Which ends have any give in them. Anywhere in the middle of a list, a
    // drag either way is just a scroll.
    couldTop = atTop(screenEl);
    couldBottom = atBottom(screenEl);
    if (!couldTop && !couldBottom) return;

    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    armed = true;
  }

  function onMove(e) {
    if (!armed) return;
    // A row lifted out of the list mid-press: that gesture is now a reorder.
    if (KN.reorder.isActive()) { armed = false; return; }
    const t = e.touches[0];
    const dy = t.clientY - startY;
    const dx = t.clientX - startX;

    if (!engaged) {
      // Give up on the sideways drag that deletes a row or stars it.
      if (Math.abs(dx) > SLOP) { armed = false; return; }
      if (Math.abs(dy) < SLOP || Math.abs(dy) < Math.abs(dx) * 1.5) return;
      // Down at the top, up at the bottom — anything else is a scroll, and
      // the scroller has to have it.
      if (dy > 0 && couldTop && atTop(screenEl)) edge = "top";
      else if (dy < 0 && couldBottom && atBottom(screenEl)) edge = "bottom";
      else { armed = false; return; }
      engaged = true;
      // A finger arriving over a flick's band takes it over from here.
      out = false;
      bare = false;
      begin();
    }

    // Taking the gesture means the scroller must not also act on it.
    e.preventDefault();
    // Rubber band: the first pixels come easily, the last ones barely move.
    target = edge === "top"
      ? MAX * (1 - Math.exp(-Math.max(0, dy) / MAX))
      : -FOOT * (1 - Math.exp(-Math.max(0, -dy) / FOOT));
  }

  function onEnd() {
    if (!engaged) { armed = false; return; }
    armed = engaged = false;
    if (edge === "top" && shown >= TRIGGER) run();
    else { target = 0; spin(); }
  }

  /* ---------------- carrying a flick past the end ---------------- */

  function onScroll(e) {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains("screen")) return;

    const now = performance.now();
    // Only consecutive samples of the same screen say anything about speed;
    // a long gap or a change of tab is a fresh start, not a fast one.
    const ok = el === lastEl && now - lastAt > 0 && now - lastAt < 120;
    const v = ok ? (el.scrollTop - lastTop) / (now - lastAt) : 0;
    lastEl = el; lastTop = el.scrollTop; lastAt = now;

    // A finger, a refresh, or a band already running owns the screen.
    if (engaged || armed || busy || loop) return;
    if (Math.abs(v) < FLING_MIN) return;
    if (v > 0 ? atBottom(el) : atTop(el)) fling(el, v);
  }

  function fling(el, v) {
    const dist = Math.min(FLING_MAX, Math.abs(v) * FLING_GAIN);
    if (dist < 4) return;
    screenEl = el;
    bare = true;              // no chip: a throw must never arm the refresh
    out = true;
    shown = 0;
    target = v > 0 ? -dist : dist;
    begin();
  }

  /* ---------------- the motion ---------------- */

  function begin() {
    ptr.style.willChange = "transform, opacity";
    if (screenEl) screenEl.style.willChange = "transform";
    spin();
  }

  function spin() {
    if (!loop) loop = requestAnimationFrame(tick);
  }

  function tick() {
    loop = 0;
    const k = engaged ? FOLLOW : (out ? FLING_OUT : SETTLE);
    shown += (target - shown) * k;

    // The flick's band turns round once it has nearly reached its furthest
    // point, rather than creeping the last pixel — out briskly, back gently.
    if (out && Math.abs(target - shown) < Math.abs(target) * 0.12) {
      out = false;
      target = 0;
    }
    // Close enough is home: without this the last hundredth of a pixel keeps
    // a frame running forever.
    if (!engaged && !out && Math.abs(target - shown) < 0.25) shown = target;

    paint();
    if (engaged || out || shown !== target) spin();
    else rest();
  }

  function rest() {
    ptr.style.willChange = "";
    bare = false;
    if (screenEl) {
      screenEl.style.willChange = "";
      if (shown === 0) screenEl.style.transform = "";
    }
  }

  function paint() {
    if (screenEl) screenEl.style.transform = `translate3d(0, ${shown.toFixed(2)}px, 0)`;

    // The chip belongs to a finger at the top edge only. The bottom band and
    // the band a flick leaves behind are bare give, with nothing to arm.
    if (shown <= 0 || bare) {
      ptr.style.opacity = "0";
      return;
    }
    ptr.style.transform = `translate3d(0, ${shown.toFixed(2)}px, 0)`;
    ptr.style.opacity = String(Math.min(1, shown / 26));
    if (busy) return;   // from here on the spinner has the mark

    // The ring draws itself on, the head lands at the end of it, and the
    // whole mark turns once by the time the pull is armed.
    const p = shown / TRIGGER;
    ptr.classList.toggle("is-ready", shown >= TRIGGER);
    arc.style.strokeDashoffset = (ARC_LEN * (1 - Math.min(1, p))).toFixed(2);
    head.style.opacity = String(Math.max(0, Math.min(1, (p - 0.72) / 0.28)));
    mark.style.transform = `rotate(${(Math.min(p, 1.2) * 300).toFixed(1)}deg)`;
  }

  function run() {
    busy = true;
    haptic();
    ptr.classList.add("is-busy");
    ptr.classList.remove("is-ready");
    // Hand the mark over to the spinner. Both of these were set inline on the
    // way down, and inline beats the `is-busy` rules that would hide them.
    mark.style.transform = "";
    head.style.opacity = "0";
    target = HOLD;
    spin();

    const started = Date.now();
    Promise.all([refreshData(), checkForNewBuild()])
      .catch(() => {})
      .then(() => {
        const left = Math.max(0, MIN_RUN - (Date.now() - started));
        setTimeout(() => {
          busy = false;
          ptr.classList.remove("is-busy");
          target = 0;
          spin();
        }, left);
      });
  }

  function refreshData() {
    return new Promise((resolve) => {
      try { KN.store.reload(); } catch (err) { console.warn("refresh failed", err); }
      resolve();
    });
  }

  /* The installed app can sit on the home screen for weeks. Asking the worker
     to look for a new build is the one thing here that reaches the network —
     and if it finds one, app.js reloads into it on its own. */
  function checkForNewBuild() {
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistration) {
      return Promise.resolve();
    }
    return navigator.serviceWorker.getRegistration()
      .then((reg) => (reg ? reg.update() : null))
      .catch(() => null);
  }

  KN.pullRefresh = { init };
})();

/* ---- js/product-sheet.js ---- */
/* =========================================================
   かいものノート — shared product / item detail sheet
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, perItemPrice, isCounted, formatSize, relativeDate, formatDate, UNITS, debounce, haptic } = KN.util;
  const store = KN.store;

  /**
   * Open the detail sheet for a product.
   * @param {string} productId
   * @param {object} [opts]
   * @param {string} [opts.itemId] when opened from the shopping list, shows qty/memo controls
   */
  function open(productId, { itemId } = {}) {
    const product = store.getProduct(productId);
    if (!product) return;

    const body = node(html`<div class="stack" style="gap:20px"></div>`);

    const pricesWrap = node(html`<div class="stack" style="gap:12px"></div>`);
    const rerenderPrices = () => renderPrices(pricesWrap, productId);

    const category = categoryField(productId);
    const mark = iconField(productId, () => {
      // The picture is on the sheet's own title too; keep the two agreeing.
      const head = sheetHandle && sheetHandle.el.querySelector(".sheet-mark");
      if (head) head.innerHTML = store.productMark(store.getProduct(productId));
    });
    body.append(nameField(productId, category.recheck, mark.recheck));
    if (itemId) body.append(itemSection(itemId));
    body.append(mark.el);
    body.append(category.el);
    body.append(sizeField(productId, rerenderPrices));
    body.append(pricesWrap);
    rerenderPrices();

    body.append(historySection(productId));
    body.append(dangerSection(productId, () => sheetHandle.close()));

    const foot = node(html`<button class="btn btn-primary btn-block">完了</button>`);

    const sheetHandle = KN.ui.sheet({
      title: product.name,
      titleMark: store.productMark(product),
      content: body,
      footer: foot,
    });

    foot.addEventListener("click", () => sheetHandle.close());
    return sheetHandle;
  }

  /* ---------------- fields ---------------- */

  function nameField(productId, onRecategorised, onRenamed) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <label class="field">
        <span class="field-label">商品名</span>
        <input class="input js-name" value="${p.name}" placeholder="商品名">
      </label>
    `);
    const input = wrap.querySelector(".js-name");

    const save = debounce(() => {
      const v = input.value.trim();
      if (!v) return;

      /* A rename is very often a correction. 「コンソメ」 came out as その他,
         so it gets renamed 「コンソメ(調味料)」 — and the new name now says
         plainly where it goes. Re-reading it costs nothing and saves a second
         trip to the picker.

         Two limits. A category picked by hand is never overruled: that was a
         decision, and this is a guess. And a guess that lands on その他 is
         thrown away rather than applied — a name we cannot place must not
         demote a category that is already right. */
      let moved = null;
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.name = v;
        if (rec.catManual) return;
        const guess = store.guessCategory(v);
        if (guess !== store.OTHER_CATEGORY && guess !== rec.categoryId) {
          rec.categoryId = guess;
          moved = guess;
        }
      });

      // The picture follows the name too, whether or not the category moved.
      onRenamed && onRenamed();

      if (moved) {
        onRecategorised && onRecategorised();
        KN.ui.toast(`「${store.getCategory(moved).name}」に移しました`);
        haptic();
      }
    }, 350);

    input.addEventListener("input", save);
    return wrap;
  }

  /* ---------------- the picture ---------------- */

  /* The guess reads the name and is usually right. Where it is wrong it is
     wrong in a way only the person who buys the thing can see — 「コンソメ」
     is a box to the app and a stock cube in the cupboard — so the picture can
     be set by hand, and once set nothing overrules it. */
  function iconField(productId, onChanged) {
    const wrap = node(html`
      <div class="field">
        <span class="field-label">アイコン</span>
        <button type="button" class="icon-pick js-pick">
          <span class="icon-pick-mark js-mark"></span>
          <span class="icon-pick-text">
            <span class="icon-pick-name js-lbl"></span>
            <span class="icon-pick-sub js-sub"></span>
          </span>
          <span class="price-chevron">${icon("chevron")}</span>
        </button>
      </div>
    `);

    function paint() {
      const p = store.getProduct(productId);
      if (!p) return;
      const own = KN.productIcons.byKey(p.icon);
      wrap.querySelector(".js-mark").innerHTML = store.productMark(p);
      wrap.querySelector(".js-lbl").textContent =
        own ? (KN.productIcons.LABELS[p.icon] || p.icon) : "おまかせ";
      wrap.querySelector(".js-sub").textContent =
        own ? "自分で選んだ絵です" : "名前とカテゴリから選んでいます";
    }
    paint();

    wrap.querySelector(".js-pick").addEventListener("click", () => {
      openIconPicker(productId, () => { paint(); onChanged && onChanged(); });
    });

    return { el: wrap, recheck: paint };
  }

  /* 「もしかして」 first, then everything. The guess already had its go at the
     name; what is useful here is the *near* misses — the pictures the name
     brushes against without landing on, which is where the right one usually
     is. Below that the whole set, because sometimes the right picture has
     nothing to do with the name at all. */
  function openIconPicker(productId, onChanged) {
    const body = node(html`
      <div class="stack" style="gap:14px">
        <input class="input js-q" placeholder="絵をさがす（例：洗剤）"
               autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="絵をさがす">
        <div class="stack js-grids" style="gap:14px"></div>
      </div>
    `);
    const grids = body.querySelector(".js-grids");
    const q = body.querySelector(".js-q");

    const handle = KN.ui.sheet({ title: "アイコンを選ぶ", content: body });

    function choose(key) {
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (rec) rec.icon = key || null;
      });
      haptic(12);
      onChanged && onChanged();
      handle.close();
    }

    function grid(items) {
      const current = store.getProduct(productId).icon || "";
      const g = node(html`<div class="icon-grid"></div>`);
      items.forEach(({ key, label, svg }) => {
        const cell = node(html`
          <button type="button" class="icon-cell ${key === current ? "is-on" : ""}"
                  data-key="${key}" aria-pressed="${String(key === current)}">
            <span class="icon-cell-mark">${KN.util.raw(svg)}</span>
            <span class="icon-cell-label">${label}</span>
          </button>
        `);
        cell.addEventListener("click", () => choose(key));
        g.append(cell);
      });
      return g;
    }

    const heading = (text) => node(html`<span class="field-label">${text}</span>`);

    function paint() {
      const rec = store.getProduct(productId);
      if (!rec) return;
      grids.innerHTML = "";
      const query = q.value.trim();

      if (query) {
        const hits = KN.productIcons.search(query);
        if (!hits.length) {
          grids.append(node(html`
            <p style="color:var(--c-text-3);font-size:13px;padding:8px 0">
              「${query}」に合う絵はありません
            </p>
          `));
          return;
        }
        grids.append(grid(hits));
        return;
      }

      /* Back to the guess. Shown with the picture it would land on, so it is
         a choice between two pictures rather than a choice with the lights
         off. */
      const auto = node(html`
        <button type="button" class="icon-auto js-auto ${rec.icon ? "" : "is-on"}"
                aria-pressed="${String(!rec.icon)}">
          <span class="icon-pick-mark">${store.autoMark(rec)}</span>
          <span class="icon-pick-text">
            <span class="icon-pick-name">おまかせにする</span>
            <span class="icon-pick-sub">名前とカテゴリから選びます</span>
          </span>
        </button>
      `);
      auto.addEventListener("click", () => choose(null));
      grids.append(auto);

      const maybe = KN.productIcons.suggest(rec.name, 8);
      if (maybe.length) {
        grids.append(heading("もしかして"));
        grids.append(grid(KN.productIcons.list().filter((x) => maybe.includes(x.key))
          .sort((a, b) => maybe.indexOf(a.key) - maybe.indexOf(b.key))));
      }

      grids.append(heading("ぜんぶ"));
      grids.append(grid(KN.productIcons.list()));
    }

    q.addEventListener("input", debounce(paint, 160));
    paint();
    return handle;
  }

  function itemSection(itemId) {
    const item = store.get().items.find((i) => i.id === itemId);
    if (!item) return document.createDocumentFragment();

    const wrap = node(html`
      <div class="stack" style="gap:12px">
        <div class="field">
          <span class="field-label">数量</span>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="icon-btn js-minus" aria-label="減らす" style="background:var(--c-surface-2)">${icon("minus")}</button>
            <span class="js-qty mono-num" style="font-size:22px;font-weight:800;min-width:44px;text-align:center">${item.qty}</span>
            <button class="icon-btn js-plus" aria-label="増やす" style="background:var(--c-surface-2)">${icon("plus")}</button>
            <button class="btn btn-soft btn-sm js-remove" style="margin-left:auto">リストから外す</button>
          </div>
        </div>
        <label class="field">
          <span class="field-label">メモ</span>
          <input class="input js-memo" value="${item.memo || ""}" placeholder="例：詰め替え用・特売のとき">
        </label>
      </div>
    `);

    const qtyEl = wrap.querySelector(".js-qty");
    function setQty(delta) {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.qty = Math.max(1, rec.qty + delta);
      });
      const rec = store.get().items.find((i) => i.id === itemId);
      qtyEl.textContent = rec ? rec.qty : 1;
      haptic();
    }
    wrap.querySelector(".js-minus").addEventListener("click", () => setQty(-1));
    wrap.querySelector(".js-plus").addEventListener("click", () => setQty(1));

    const memo = wrap.querySelector(".js-memo");
    memo.addEventListener("input", debounce(() => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.memo = memo.value;
      });
    }, 350));

    wrap.querySelector(".js-remove").addEventListener("click", () => {
      const snapshot = store.get().items.find((i) => i.id === itemId);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== itemId); });
      KN.ui.toast("リストから外しました", {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => { s.items.unshift(snapshot); }),
        },
      });
      const sheetEl = wrap.closest(".sheet");
      if (sheetEl) sheetEl.querySelector(".js-close").click();
    });

    return wrap;
  }

  function categoryField(productId) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">カテゴリ</span>
        <div class="js-picker"></div>
      </div>
    `);

    const picker = KN.ui.categoryPicker(wrap.querySelector(".js-picker"), {
      selectedId: p.categoryId,
      onSelect: (categoryId) => {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === productId);
          if (!rec) return;
          rec.categoryId = categoryId;
          // Chosen by hand. Nothing guessed from the name may move it again.
          rec.catManual = true;
        });

        /* And remember it. Being told 「コンソメ is 調味料」 once should be
           enough — the next 「コンソメ」 typed into the list goes straight
           there, and so does 「味の素 コンソメ」. Shown in 設定 so it is not a
           machine quietly making decisions nobody can see or undo. */
        const rec = store.getProduct(productId);
        const known = store.learnedList().some((l) => l.key === KN.util.foldKana(rec.name) && l.categoryId === categoryId);
        store.learnCategory(rec.name, categoryId);
        if (!known) {
          KN.ui.toast(`「${rec.name}」は${store.getCategory(categoryId).name}、と覚えました`);
        }
      },
    });

    // Called after a rename moved the category out from under the picker.
    const recheck = () => picker.set(store.getProduct(productId).categoryId);
    return { el: wrap, recheck };
  }

  function sizeField(productId, onChanged) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">内容量・入数</span>
        <div class="input-group">
          <input class="input js-amount" style="flex:1" type="text" inputmode="none"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 value="${p.amount != null ? p.amount : ""}" placeholder="500">
          <select class="select js-unit" style="flex:0 0 110px">
            <option value="">単位なし</option>
            ${UNITS.map((u) => html`<option value="${u}" ${p.unit === u ? KN.util.raw("selected") : ""}>${u}</option>`)}
          </select>
        </div>
        <span class="field-hint js-size-hint"></span>
      </div>
    `);

    const amountEl = wrap.querySelector(".js-amount");
    const unitEl = wrap.querySelector(".js-unit");
    const hintEl = wrap.querySelector(".js-size-hint");

    /* 「10個」なら 1個あたりに割る。「500ml」は割らない — そう書いてあると
       見分けがつくというだけで、値段は 1本ぶんの値段のまま。 */
    function paintHint() {
      hintEl.textContent = isCounted(unitEl.value)
        ? `この数で割って、1${unitEl.value}あたりの値段も出します`
        : "値段は 1つぶんとして比べます。ここは目印として書いておくだけです";
    }

    function save() {
      const amount = KN.util.calc(amountEl.value);
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.amount = isFinite(amount) && amount > 0 ? amount : null;
        rec.unit = unitEl.value;
      });
      paintHint();
      onChanged && onChanged();
    }

    KN.keypad.bind(amountEl);
    amountEl.addEventListener("input", debounce(save, 400));
    unitEl.addEventListener("change", save);
    paintHint();
    return wrap;
  }

  /* ---------------- prices ---------------- */

  function renderPrices(container, productId) {
    container.innerHTML = "";
    container.classList.add("js-prices-host");

    const p = store.getProduct(productId);
    const prices = store.currentPrices(p);
    const best = prices[0] || null;

    const section = node(html`
      <div class="stack js-prices" style="gap:10px">
        <span class="field-label">お店ごとの値段</span>
      </div>
    `);

    if (!prices.length) {
      section.append(node(html`
        <p style="color:var(--c-text-3);font-size:13px;line-height:1.6">
          まだ登録がありません。下のフォームからお店と値段を追加すると、いちばん安いお店が分かります。
        </p>
      `));
    } else {
      const list = node(html`<div class="price-list"></div>`);
      prices.forEach((pr) => {
        const st = store.getStore(pr.storeId);
        const up = perItemPrice(pr.price, p.amount, p.unit);
        const isBest = best && pr.id === best.id && prices.length > 1;

        const row = node(html`
          <div class="price-row ${isBest ? "is-best" : ""}">
            <button class="price-main js-open" aria-label="${st.name} の値段をくわしく見る">
              <span class="dot" style="background:${st.color}"></span>
              <span class="price-store-wrap">
                <span class="price-store">${st.name}</span>
                ${isBest ? html`<span class="crown">🏆</span>` : ""}
              </span>
              <span class="price-figures">
                <span class="price-amount">${yen(pr.price)}</span>
                ${up ? html`<span class="price-unit">${up.text}</span>` : ""}
                <span class="price-date">${relativeDate(pr.date)}</span>
              </span>
              <span class="price-chevron">${icon("chevron")}</span>
            </button>
            <button class="icon-btn is-danger js-del" aria-label="この価格を削除">${icon("trash")}</button>
          </div>
        `);

        row.querySelector(".js-open").addEventListener("click", () => {
          openPriceDetail(productId, pr.id, () => renderPrices(container, productId));
        });

        row.querySelector(".js-del").addEventListener("click", () => {
          store.update((s) => {
            const rec = s.products.find((x) => x.id === productId);
            if (rec) rec.prices = rec.prices.filter((x) => x.id !== pr.id);
          });
          renderPrices(container, productId);
          KN.ui.toast("価格を削除しました", {
            action: {
              label: "元に戻す",
              onClick: () => {
                store.update((s) => {
                  const rec = s.products.find((x) => x.id === productId);
                  if (rec) rec.prices.push(pr);
                });
                renderPrices(container, productId);
              },
            },
          });
        });

        list.append(row);
      });
      section.append(list);
    }

    section.append(addPriceForm(productId, () => renderPrices(container, productId)));
    container.append(section);
  }

  /* ---------------- one store's price, in full ---------------- */

  /* The row in 「お店ごとの値段」 shows what fits on a line: the price, the
     price of one, how long ago. Everything else about that record — the day
     it was seen, how far off the cheapest it is, what it used to cost there
     — needs a page of its own, and this is it. Also the only place any of it
     can be corrected: until now a wrong price could only be deleted and
     typed again. */
  function openPriceDetail(productId, priceId, onChanged) {
    const p = store.getProduct(productId);
    const pr = p && p.prices.find((x) => x.id === priceId);
    if (!pr) return;
    const st = store.getStore(pr.storeId);
    if (!st) return;

    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">値段</span>
          <input class="input js-price" type="text" autocomplete="off" value="${String(pr.price)}">
        </label>

        <label class="field">
          <span class="field-label">記録した日</span>
          <input class="input js-date" type="date" value="${isoToDay(pr.date)}">
        </label>

        <div class="field">
          <span class="field-label">くらべる</span>
          <div class="card js-compare" style="padding:12px"></div>
        </div>

        <div class="field js-log-wrap"></div>

        <button class="btn btn-danger btn-block js-del">${icon("trash")} この記録を削除</button>
      </div>
    `);

    const priceEl = body.querySelector(".js-price");
    const dateEl  = body.querySelector(".js-date");
    KN.keypad.bind(priceEl);

    const handle = KN.ui.sheet({
      title: st.name,
      titleMark: KN.util.raw(`<span class="dot" style="background:${st.color};width:14px;height:14px"></span>`),
      content: body,
      footer: node(html`<button class="btn btn-primary btn-block js-done">完了</button>`),
    });
    handle.el.querySelector(".js-done").addEventListener("click", () => handle.close());

    function save() {
      const price = KN.util.calc(priceEl.value);
      store.update((s) => {
        const prod = s.products.find((x) => x.id === productId);
        const rec = prod && prod.prices.find((x) => x.id === priceId);
        if (!rec) return;
        if (isFinite(price) && price >= 0) rec.price = price;
        const day = dateEl.value;
        if (day) rec.date = dayToIso(day, rec.date);
      });
      paint();
      onChanged && onChanged();
    }

    priceEl.addEventListener("input", debounce(save, 400));
    dateEl.addEventListener("change", save);

    function paint() {
      paintCompare(body.querySelector(".js-compare"), productId, priceId);
      paintLog(body.querySelector(".js-log-wrap"), productId, pr.storeId, priceId, () => {
        paint();
        onChanged && onChanged();
      });
    }
    paint();

    body.querySelector(".js-del").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "この記録を削除しますか？",
        message: `${st.name} の ${yen(pr.price)} を消します。`,
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      store.update((s) => {
        const prod = s.products.find((x) => x.id === productId);
        if (prod) prod.prices = prod.prices.filter((x) => x.id !== priceId);
      });
      handle.close();
      onChanged && onChanged();
      KN.ui.toast("削除しました");
    });

    return handle;
  }

  /* How this record stands against the others. The comparison is on the price
     as it is — what you actually hand over at the till — because the same
     thing in the same size is what gets bought week after week. When it is
     sold by the pack the price of one is shown underneath, but it never
     changes which shop is cheapest: every shop is divided by the same count. */
  function paintCompare(host, productId, priceId) {
    const p = store.getProduct(productId);
    const pr = p.prices.find((x) => x.id === priceId);
    const others = store.currentPrices(p);
    const mine = others.find((x) => x.id === priceId);
    const cheapest = others[0] || null;

    const rows = [];
    if (mine && cheapest && others.length > 1) {
      const diff = pr.price - cheapest.price;
      rows.push(diff === 0
        ? html`<span class="cmp-good">いちばん安い値段です</span>`
        : html`<span>いちばん安い ${store.getStore(cheapest.storeId).name} より
                 <b class="cmp-bad">${yen(diff)} 高い</b></span>`);
    }

    const up = perItemPrice(pr.price, p.amount, p.unit);
    if (up) {
      rows.push(html`<span>${formatSize(p.amount, p.unit)}入りなので <b>${up.text}</b></span>`);
    } else if (isCounted(p.unit)) {
      rows.push(html`<span style="color:var(--c-text-3)">入数を入れると、1${p.unit}あたりの値段も出ます</span>`);
    }

    host.innerHTML = "";
    host.append(node(html`
      <div class="stack cmp" style="gap:6px">${rows.length ? rows : html`<span style="color:var(--c-text-3)">ほかのお店の値段がまだありません</span>`}</div>
    `));
  }

  /** Every price ever recorded at this shop for this product. */
  function paintLog(host, productId, storeId, currentId, onChanged) {
    const p = store.getProduct(productId);
    const log = p.prices
      .filter((x) => x.storeId === storeId)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    host.innerHTML = "";
    if (log.length < 2) return;

    host.append(node(html`<span class="field-label">このお店での記録（${String(log.length)}件）</span>`));
    const list = node(html`<div class="stack" style="gap:6px"></div>`);
    log.forEach((x) => {
      const up = perItemPrice(x.price, p.amount, p.unit);
      const row = node(html`
        <div class="log-row ${x.id === currentId ? "is-current" : ""}">
          <span class="log-date">${formatDate(x.date)}</span>
          <span class="log-price">${yen(x.price)}</span>
          <span class="log-unit">${up ? up.text : ""}</span>
          ${x.id === currentId
            ? html`<span class="log-tag">いま見ている</span>`
            : html`<button class="icon-btn is-danger js-drop" aria-label="この記録を削除">${icon("close")}</button>`}
        </div>
      `);
      const drop = row.querySelector(".js-drop");
      if (drop) {
        drop.addEventListener("click", () => {
          store.update((s) => {
            const prod = s.products.find((y) => y.id === productId);
            if (prod) prod.prices = prod.prices.filter((y) => y.id !== x.id);
          });
          onChanged && onChanged();
        });
      }
      list.append(row);
    });
    host.append(list);
  }

  /** ISO timestamp → the YYYY-MM-DD an <input type="date"> wants. */
  function isoToDay(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  /** YYYY-MM-DD back to a timestamp, keeping the original time of day. */
  function dayToIso(day, previousIso) {
    const [y, m, d] = day.split("-").map(Number);
    const prev = new Date(previousIso);
    const out = new Date(isNaN(prev.getTime()) ? Date.now() : prev.getTime());
    out.setFullYear(y, m - 1, d);
    return out.toISOString();
  }

  /* The price field takes a sum, not just a number, and the pad supplies the
     operators the system keypad does not have. This is the readout for it:
     what the sum comes to, live, right above the pad. */
  function wireCalculator(form) {
    const strip = form.querySelector(".js-calc");
    const out = form.querySelector(".js-calc-out");
    const fields = [form.querySelector(".js-price")].filter(Boolean);
    let last = fields[0];

    function paint() {
      const v = last && last.value;
      const n = KN.util.calc(v);
      if (KN.util.isExpression(v) && n != null) {
        out.textContent = `= ${yen(n)}`;
        out.classList.remove("is-idle");
      } else if (KN.util.isExpression(v)) {
        out.textContent = "…";
        out.classList.add("is-idle");
      } else {
        out.textContent = "＋ − × ÷ と「税」「割引」で計算できます";
        out.classList.add("is-idle");
      }
    }

    /* The readout sits under the field, which is exactly where the sheet's
       own scroller runs out — opening the pad on the last field in a long
       product left the running total below the fold, so the sum was being
       worked out somewhere the user could not see. Bring it up as the pad
       arrives, and again once the sheet has finished resizing around it. */
    const revealStrip = () => [180, 400, 680].forEach((ms) => setTimeout(() => {
      if (!strip.hidden) strip.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, ms));

    fields.forEach((f) => {
      KN.keypad.bind(f, {
        onOpen: () => { last = f; strip.hidden = false; paint(); revealStrip(); },
        onCommit: () => { strip.hidden = true; },
      });
      f.addEventListener("input", () => { last = f; paint(); });
      f.addEventListener("blur", () => setTimeout(() => {
        if (!KN.keypad.isOpen()) strip.hidden = true;
      }, 120));
    });

    paint();
  }

  function addPriceForm(productId, onAdded) {
    const p = store.getProduct(productId);
    const hasStores = store.get().stores.length > 0;

    const form = node(html`
      <form class="stack" style="gap:10px;padding:12px;border:1.5px dashed var(--c-border-2);border-radius:12px">
        <span class="field-label">値段を追加</span>
        <div class="js-stores"></div>
        <div class="input-group">
          <!-- Text, not number: a number field throws away「198+250」 the moment
               it is typed, and that sum is the whole point of the row of
               operators below. inputmode still asks for the numeric keypad. -->
          <input class="input js-price" type="text"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 placeholder="値段" style="flex:1.2" required>
          <button class="btn btn-primary js-add" type="submit" style="flex:0 0 auto">追加</button>
        </div>
        <div class="calc-row js-calc" hidden>
          <span class="calc-out js-calc-out" aria-live="polite"></span>
        </div>
        ${perItemPrice(1, p.amount, p.unit)
          ? html`<p class="js-hint" style="font-size:11px;color:var(--c-text-3);margin:0">
                   ${formatSize(p.amount, p.unit)}入りとして、1${p.unit}あたりの値段も出します
                 </p>`
          : ""}
      </form>
    `);

    let selectedStore = null;
    KN.ui.storePicker(form.querySelector(".js-stores"), {
      selectedId: null,
      onSelect: (id) => { selectedStore = id; },
    });

    wireCalculator(form);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const priceEl = form.querySelector(".js-price");
      // 「198+250」 is stored as 448. calc() returns null for a plain number,
      // so a straight price still goes through parseNum as before.
      const price = KN.util.calc(priceEl.value);

      if (!hasStores && !selectedStore) {
        KN.ui.toast("先に「＋ お店を追加」でお店を登録してください");
        return;
      }
      if (!selectedStore) { KN.ui.toast("お店を選んでください"); return; }
      if (!isFinite(price) || price < 0) { KN.ui.toast("値段を入力してください"); return; }

      store.addPrice(productId, { storeId: selectedStore, price });
      haptic(12);
      priceEl.value = "";
      onAdded();
    });

    return form;
  }

  /* ---------------- history ---------------- */

  function historySection(productId) {
    const p = store.getProduct(productId);
    if (!p.prices || p.prices.length < 3) return document.createDocumentFragment();

    const sorted = [...p.prices].sort((a, b) => new Date(a.date) - new Date(b.date));
    const values = sorted.map((x) => x.price);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const span = max - min || 1;

    const W = 300, H = 48, PAD = 4;
    const pts = sorted.map((pr, i) => {
      const x = sorted.length === 1 ? W / 2 : (i / (sorted.length - 1)) * (W - PAD * 2) + PAD;
      const y = H - PAD - ((pr.price - min) / span) * (H - PAD * 2);
      return [x, y];
    });

    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;

    return node(html`
      <div class="field">
        <span class="field-label">値段の記録（${sorted.length}件）</span>
        <div class="card" style="padding:12px">
          <svg class="spark" viewBox="0 0 ${String(W)} ${String(H)}" preserveAspectRatio="none" aria-hidden="true">
            <path class="spark-area" d="${area}"></path>
            <path class="spark-line" d="${line}"></path>
          </svg>
          <div class="spread" style="margin-top:6px">
            <span style="font-size:11px;color:var(--c-text-3)">いちばん安いとき ${yen(min)}</span>
            <span style="font-size:11px;color:var(--c-text-3)">高いとき ${yen(max)}</span>
          </div>
        </div>
      </div>
    `);
  }

  /* ---------------- danger ---------------- */

  function dangerSection(productId, closeSheet) {
    const btn = node(html`
      <button class="btn btn-danger btn-block">${icon("trash")} この商品を削除</button>
    `);
    btn.addEventListener("click", async () => {
      const p = store.getProduct(productId);
      const ok = await KN.ui.confirm({
        title: "商品を削除しますか？",
        message: `「${p.name}」の価格記録と、買い物リストの項目もまとめて削除されます。`,
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      store.update((s) => {
        s.products = s.products.filter((x) => x.id !== productId);
        s.items = s.items.filter((i) => i.productId !== productId);
      });
      KN.ui.toast("削除しました");
      closeSheet();
    });
    return btn;
  }

  KN.productSheet = { open };
})();

/* ---- js/screen-list.js ---- */
/* =========================================================
   かいものノート — shopping list screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, frag, icon, yen, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let categoryFilter = null;   // categoryId or null = all

  /* ---------------- mount (static chrome) ---------------- */

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">買い物リスト</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-layout"></button>
            <button class="icon-btn js-clear" aria-label="購入済みをまとめて削除" title="購入済みをまとめて削除">
              ${icon("trash")}
            </button>
          </div>
        </header>

        <div class="progress-wrap js-progress-wrap" hidden>
          <div class="progress"><div class="progress-bar js-progress" style="width:0%"></div></div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    /* The add button sits in the shell's dock, not in this screen. Adding
       something is the one thing done one-handed in a shop aisle, so it
       belongs at the bottom, in the middle, where a thumb already is.

       It used to be a text field here, with the suggestions opening upward
       over the list. That got you a name and nothing else: quantity and
       category had to be fixed afterwards in the product sheet. One button
       and one form is fewer steps for anything beyond a bare name, and the
       same suggestions still turn a name into an existing product. */
    const dock = document.getElementById("dock");
    dock.innerHTML = "";
    dock.append(node(html`
      <div class="quick-add">
        <button class="add-fab js-open-add" aria-label="買うものを追加">${icon("plus")}</button>
      </div>
    `));

    els = {
      sub:        chrome.querySelector(".js-sub"),
      clear:      chrome.querySelector(".js-clear"),
      layout:     chrome.querySelector(".js-layout"),
      addFab:     dock.querySelector(".js-open-add"),
      progWrap:   chrome.querySelector(".js-progress-wrap"),
      progress:   chrome.querySelector(".js-progress"),
      filter:     chrome.querySelector(".js-filter"),
      body:       chrome.querySelector(".js-body"),
      topbar:     chrome.querySelector(".topbar"),
    };

    els.addFab.addEventListener("click", openAddSheet);

    els.clear.addEventListener("click", clearChecked);
    els.layout.addEventListener("click", KN.ui.toggleLayout);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- the add sheet ---------------- */

  /* One form for everything a new line on the list needs: what it is, how
     many, and which aisle it belongs to. The name field still suggests as you
     type — tapping a suggestion is what turns 「ぎゅうにゅう」 into the 牛乳
     already on file, with its prices and its category, instead of a second
     product with the same name.

     It closes after each add. Staying open saved a tap, and cost the sight of
     the row that had just appeared — the sheet sat over the list it had
     changed. One add, one close; the ＋ is under the thumb for the next. */
  function openAddSheet() {
    haptic(10);

    let picked = null;        // an existing product chosen from the suggestions
    let catTouched = false;   // the category was set by hand, so stop guessing
    let fav = false;          // ★ — part of the trip being shopped now

    /* No 個数 here. It was a stepper that said 1 nearly every time, in a form
       whose whole job is to be over quickly; the quantity is a detail about a
       line that already exists, and the row's own sheet is where it belongs.
       The ★ took its place, because *that* is a decision made while writing
       the list — this trip or sometime — and going back to set it afterwards
       is the trip through the list the button was meant to save. */
    const body = node(html`
      <div class="stack" style="gap:18px">
        <div class="field">
          <span class="field-label">商品名</span>
          <input class="input js-name" placeholder="例：食器用洗剤"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-autocomplete="list">
          <div class="js-ac"></div>
          <span class="field-hint js-known" hidden></span>
        </div>

        <div class="field">
          <button type="button" class="icon-auto fav-toggle js-fav" aria-pressed="false">
            <span class="icon-pick-mark js-fav-mark">${icon("star")}</span>
            <span class="icon-pick-text">
              <span class="icon-pick-name">今回買う</span>
              <span class="icon-pick-sub js-fav-sub">★を付けると、今回の買い物としてまとまります</span>
            </span>
          </button>
        </div>

        <div class="field">
          <span class="field-label">カテゴリ</span>
          <div class="js-cat"></div>
        </div>

        <label class="field">
          <span class="field-label">メモ（任意）</span>
          <input class="input js-memo" placeholder="例：詰め替え用" autocomplete="off">
        </label>
      </div>
    `);

    const nameEl = body.querySelector(".js-name");
    const memoEl = body.querySelector(".js-memo");
    const acHost = body.querySelector(".js-ac");
    const known  = body.querySelector(".js-known");
    const favBtn = body.querySelector(".js-fav");
    const favSub = body.querySelector(".js-fav-sub");

    const foot = node(html`<button class="btn btn-primary btn-block js-add" disabled>リストに追加</button>`);
    const addBtn = foot;

    const handle = KN.ui.sheet({ title: "買うものを追加", content: body, footer: foot });

    const cat = KN.ui.categoryPicker(body.querySelector(".js-cat"), {
      selectedId: store.OTHER_CATEGORY,
      onSelect: () => { catTouched = true; },
    });

    favBtn.addEventListener("click", () => {
      fav = !fav;
      favBtn.classList.toggle("is-on", fav);
      favBtn.setAttribute("aria-pressed", String(fav));
      favSub.textContent = fav
        ? "今回の買い物としてまとまります"
        : "★を付けると、今回の買い物としてまとまります";
      haptic(10);
    });

    /* Everything the name field drives: the button, the suggestions, and —
       until the category is touched by hand — the guess underneath it. */
    function onName() {
      const typed = nameEl.value.trim();
      addBtn.disabled = !typed;
      // Typing on past a chosen suggestion means it is no longer that product.
      if (picked && KN.util.foldKana(picked.name) !== KN.util.foldKana(typed)) {
        picked = null;
        known.hidden = true;
      }
      if (!picked && !catTouched) cat.set(typed ? store.guessCategory(typed) : store.OTHER_CATEGORY);
      renderSuggestions(nameEl, acHost, typed, choose);
    }

    /* A suggestion tapped: from here the form is about that product, so its
       category comes along and the sheet says which one it landed on. */
    function choose(product) {
      picked = product;
      nameEl.value = product.name;
      addBtn.disabled = false;
      catTouched = false;
      cat.set(product.categoryId);
      const best = store.bestPrice(product);
      const st = best ? store.getStore(best.storeId) : null;
      known.hidden = false;
      known.textContent = best && st
        ? `登録済みの商品です・${st.name} ${yen(best.price)} が最安`
        : "登録済みの商品です";
      acHost.innerHTML = "";
      nameEl.focus();
    }

    nameEl.addEventListener("input", onName);
    nameEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      submit();
    });
    memoEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    addBtn.addEventListener("click", submit);

    function submit() {
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }

      const product = picked || store.findProductByName(name)
        || store.addProduct({ name, categoryId: cat.current });

      /* A category chosen by hand outranks the guess, and is remembered — the
         next 「コンソメ」 lands where this one did without being told again.
         Applied even when the product was just created with that category:
         the guess and the choice agreeing does not make it a guess. */
      if (catTouched) {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === product.id);
          if (rec) { rec.categoryId = cat.current; rec.catManual = true; }
        });
        store.learnCategory(product.name, cat.current);
      }

      const memo = memoEl.value.trim();
      const already = store.get().items.find((i) => i.productId === product.id && !i.checked);
      if (already) {
        // Already on the list: nothing to add, but the ★ and the memo are
        // still what was just said about it.
        store.update((s) => {
          const rec = s.items.find((i) => i.id === already.id);
          if (!rec) return;
          if (memo) rec.memo = memo;
          if (fav) rec.fav = true;
        });
        KN.ui.toast(`「${product.name}」はもうリストにあります`);
      } else {
        const rec = store.addItem(product.id, { memo });
        if (fav) store.update((s) => {
          const it = s.items.find((i) => i.id === rec.id);
          if (it) it.fav = true;
        });
        const c = store.getCategory(product.categoryId);
        KN.ui.toast(`${c.emoji} ${c.name} に「${product.name}」を追加しました`);
      }
      haptic(12);
      /* Closed, not cleared. Staying open was meant to save a tap on a long
         list written in one sitting, but it left the sheet covering the very
         list it had just changed — so every add ended with a look at a form
         instead of at the line that appeared. One add, one close, and the ＋
         is right there under the thumb for the next one. */
      handle.close();
    }

    // The sheet focuses its first control after its own animation; on a phone
    // it deliberately does not, so the keyboard does not fly up over it.
    setTimeout(() => { if (!("ontouchstart" in window)) nameEl.focus(); }, 340);
    return handle;
  }

  /* ---------------- suggestions ---------------- */

  /* Matched on the folded name, so a single 「え」 already surfaces
     「エマール」 — nobody switches to katakana to search their own list. */
  function renderSuggestions(input, host, typed, onPick) {
    const q = KN.util.foldKana(typed);
    if (!q) { host.innerHTML = ""; return; }

    const onList = new Set(store.get().items.filter((i) => !i.checked).map((i) => i.productId));
    const found = store.get().products
      .map((p) => ({ p, key: KN.util.foldKana(p.name) }))
      .filter((r) => r.key.includes(q))
      .sort((a, b) => {
        const aStarts = a.key.startsWith(q) ? 0 : 1;
        const bStarts = b.key.startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.p.name.localeCompare(b.p.name, "ja");
      })
      .slice(0, 6)
      .map((r) => r.p);

    if (!found.length) { host.innerHTML = ""; return; }

    /* Reuse the panel across keystrokes. Rebuilding it restarted the open
       animation on every character, which read as the list flickering. */
    let box = host.querySelector(".ac");
    if (!box) {
      box = node(html`<div class="ac" role="listbox"></div>`);
      host.append(box);
    } else {
      box.innerHTML = "";
    }

    found.forEach((p) => {
      const best = store.bestPrice(p);
      const bestStore = best ? store.getStore(best.storeId) : null;
      const row = node(html`
        <button type="button" class="ac-item" role="option">
          <span class="ac-emoji">${store.productMark(p)}</span>
          <span class="ac-main">
            <span class="ac-name">${p.name}</span>
            <span class="ac-sub">
              ${best && bestStore ? html`${bestStore.name} ${yen(best.price)} が最安` : "価格の記録なし"}
              ${onList.has(p.id) ? html` ・<b>リストにあります</b>` : ""}
            </span>
          </span>
        </button>
      `);
      // Keep the caret where it is; a suggestion is not somewhere to move to.
      row.addEventListener("mousedown", (e) => e.preventDefault());
      row.addEventListener("click", () => onPick(p));
      box.append(row);
    });
  }

  /* ---------------- clear checked ---------------- */

  async function clearChecked() {
    const checked = store.get().items.filter((i) => i.checked);
    if (!checked.length) { KN.ui.toast("購入済みの商品はありません"); return; }

    const ok = await KN.ui.confirm({
      title: "購入済みを削除",
      message: `${checked.length}件の購入済み商品をリストから消します。商品と価格の記録は残ります。`,
      okLabel: "削除する",
      danger: true,
    });
    if (!ok) return;

    store.update((s) => { s.items = s.items.filter((i) => !i.checked); });
    KN.ui.toast(`${checked.length}件を削除しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => { s.items = [...checked, ...s.items]; }),
      },
    });
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const items = st.items;

    // Once anything is starred the header tracks that trip rather than the whole
    // list, so it agrees with the tab badge instead of quoting a second number.
    const scope = items.some((i) => i.fav) ? items.filter((i) => i.fav) : items;
    const done = scope.filter((i) => i.checked).length;
    const label = scope === items ? "" : "今回買うもの ";

    // 「N件中M件購入済み」rather than「N件・M件購入済み」: the section heading
    // below counts what is left, and two different numbers under the same
    // wording read as a contradiction.
    els.sub.textContent = items.length
      ? (scope.length ? `${label}${scope.length}件中 ${done}件購入済み` : "今回買うものは未選択です")
      : "リストは空です";

    els.progWrap.hidden = scope.length === 0;
    els.progress.style.width = scope.length ? `${(done / scope.length) * 100}%` : "0%";

    KN.ui.paintLayoutButton(els.layout);

    renderFilter(items);
    renderBody(items);
  }

  function renderFilter(items) {
    const counts = new Map();
    items.filter((i) => !i.checked).forEach((i) => {
      const p = store.getProduct(i.productId);
      if (!p) return;
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });

    if (counts.size < 2) { categoryFilter = null; els.filter.innerHTML = ""; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const chips = [{ id: "", label: "すべて" }].concat(
      store.sortedCategories().filter((c) => counts.has(c.id)).map((c) => ({
        id: c.id, label: c.name, emoji: c.emoji, color: c.color, count: counts.get(c.id),
      })));

    KN.ui.chipRow(els.filter, chips, {
      activeId: categoryFilter || "",
      onPick: (id) => {
        categoryFilter = id && id !== categoryFilter ? id : null;
        haptic();
        render();
      },
    });
  }

  function renderBody(items) {
    els.body.innerHTML = "";

    if (!items.length) {
      els.body.append(emptyState());
      return;
    }

    const active = items.filter((i) => !i.checked);
    const checked = items.filter((i) => i.checked);
    const trip = active.filter((i) => i.fav);

    if (!trip.length) {
      /* Nothing starred: just the list. A total and a 「今回は◯◯だけで足ります」
         underneath would be answering a question nobody asked — the whole list
         is a standing note of things to buy sometime, not a shopping trip, and
         adding up a year of sometime gives a number with no occasion. Both come
         back the moment something is starred, where they mean this trip. */
      const shown = appendGroups(active);
      if (!shown && categoryFilter) els.body.append(noneInCategory());
      if (checked.length) els.body.append(checkedSection(checked));
      return;
    }

    const rest = active.filter((i) => !i.fav);

    /* 今回買うもの gets a box of its own rather than a heading of its own. A
       heading is a line above a list, and a line above a list is easy to lose
       track of once you are three rows down; a panel the rows sit *inside*
       is unmistakable at any scroll position.

       No total at the foot of it. It could only ever be the total of the
       items whose price happens to be on file, which is not the total of the
       basket — and a number sitting under a list looks like the sum of that
       list. 「4品は値段が未登録」 next to it was an admission that the figure
       above was answering a different question. Each row still says what that
       one costs, which is a fact rather than an estimate. */
    const box = node(html`<section class="trip"></section>`);
    box.append(sectionHead("今回買うもの", trip.length, "trip"));
    const inner = node(html`<div class="trip-body"></div>`);
    const tripShown = appendGroups(trip, inner);
    if (!tripShown && categoryFilter) inner.append(noneInCategory());
    box.append(inner);
    els.body.append(box);
    els.body.append(insightsCard(trip));

    if (rest.length) {
      els.body.append(sectionHead("そのほか", rest.length, "rest"));
      appendGroups(rest);
    }

    if (checked.length) els.body.append(checkedSection(checked));
  }

  /** Renders category groups for the given items. Returns whether anything showed. */
  function appendGroups(list, host) {
    const into = host || els.body;
    const groups = new Map();
    list.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (!p) return;
      if (categoryFilter && p.categoryId !== categoryFilter) return;
      if (!groups.has(p.categoryId)) groups.set(p.categoryId, []);
      groups.get(p.categoryId).push({ item, product: p });
    });

    /* Tiles are one grid for the lot. A separate grid per category would give
       a category of one item a row of its own and two empty cells beside it —
       which is exactly the wasted space the layout is for. The order still
       runs category by category, and each tile wears its own colour, so the
       run is still visible; it just wraps instead of starting a new block. */
    if (KN.ui.isTiles()) {
      const grid = node(html`<div class="item-list is-tiles"></div>`);
      store.sortedCategories().forEach((cat) => {
        (groups.get(cat.id) || []).forEach(({ item, product }) => {
          grid.append(itemRow(item, product));
        });
      });
      if (grid.childElementCount) {
        const section = node(html`<section class="cat-group"></section>`);
        section.append(grid);
        into.append(section);
      }
      return groups.size > 0;
    }

    store.sortedCategories().forEach((cat) => {
      const entries = groups.get(cat.id);
      if (!entries || !entries.length) return;

      /* No heading. The category is written down the left edge of every row
         instead (see .item::before) — a word above each handful of rows was
         more furniture than the list could carry, and the colour says the
         same thing without taking a line. The grouping stays: it is what
         makes the colours run in blocks, and what a drag reorders within. */
      const group = node(html`
        <section class="cat-group" style="--cat:${cat.color || ""}">
          <div class="item-list"></div>
        </section>
      `);
      const listEl = group.querySelector(".item-list");
      entries.forEach(({ item, product }) => listEl.append(itemRow(item, product)));
      wireReorder(listEl);
      into.append(group);
    });

    return groups.size > 0;
  }

  /* Reordering is within a group, because a group is exactly the set of rows
     that are interchangeable: same category, same side of the「今回買うもの」
     line. Dragging a row into another category's group would have to silently
     recategorise it, which is not what picking it up looks like it means. */
  function wireReorder(listEl) {
    KN.reorder.attach(listEl, {
      item: ".item-wrap",
      onDrop: (from, to) => {
        const ids = Array.prototype.map.call(listEl.children, (w) => w.dataset.itemId);
        const [moved] = ids.splice(from, 1);
        ids.splice(to, 0, moved);

        // The group's order is its members' order within the whole list, so
        // the move writes them back into the same slots they already occupy —
        // everything not in this group stays exactly where it was.
        store.update((s) => {
          const inGroup = new Set(ids);
          const slots = [];
          s.items.forEach((it, i) => { if (inGroup.has(it.id)) slots.push(i); });
          const byId = new Map(s.items.map((it) => [it.id, it]));
          ids.forEach((id, k) => { s.items[slots[k]] = byId.get(id); });
        });
        KN.util.haptic(12);
      },
    });
  }

  function sectionHead(label, count, kind) {
    return node(html`
      <h2 class="trip-head trip-head-${kind}">
        ${kind === "trip" ? icon("star") : ""}
        <span>${label}</span>
        <span class="cat-head-count">${count}</span>
      </h2>
    `);
  }

  function noneInCategory() {
    return node(html`
      <p style="text-align:center;color:var(--c-text-3);padding:32px 16px">
        このカテゴリに未購入の商品はありません
      </p>
    `);
  }

  function itemRow(item, product) {
    const best = store.bestPrice(product);
    const bestStore = best ? store.getStore(best.storeId) : null;
    const tiles = KN.ui.isTiles();

    /* Both ways spring back and land as they go, the same as the price
       screen: right is ★, left is the archive. Tiles swipe too, on a shorter
       throw and with the icons alone — a third of a screen has no room for
       the wording. */
    const wrap = node(html`
      <article class="item-wrap ${tiles ? "is-tile-wrap" : ""}"
               data-item-id="${item.id}" style="--cat:${store.productColor(product)}">
        <div class="swipe-yes">
          ${icon("star")}<span>${item.fav ? "★をはずす" : "今回買う"}</span>
        </div>
        <div class="swipe-arch">
          <span>アーカイブ</span>${icon("download")}
        </div>
      </article>
    `);

    const row = tiles ? node(html`
      <div class="item is-tile ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
        <button class="item-body">
          <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
          <span class="item-name">${product.name}</span>
          ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          <span class="tile-price">${best ? yen(best.price * item.qty) : "—"}</span>
        </button>
      </div>
    `) : node(html`
      <div class="item ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="item-body">
          <span class="item-name-row">
            <span class="item-name">${product.name}</span>
            ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          </span>
          <span class="item-meta">
            ${item.memo ? html`<span class="item-memo">${item.memo}</span>` : ""}
          </span>
        </button>
        <div class="item-price"></div>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
      </div>
    `);
    wrap.append(row);

    const priceBox = row.querySelector(".item-price");
    if (priceBox && best && bestStore) {
      priceBox.append(frag(html`
        <span class="item-price-amount">${yen(best.price * item.qty)}</span>
        <span class="item-price-store">🏆 ${bestStore.name}</span>
      `));
    } else if (priceBox) {
      priceBox.append(node(html`<span class="item-price-none">値段は未登録</span>`));
    }

    row.querySelector(".check").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) {
          rec.checked = !rec.checked;
          rec.checkedAt = rec.checked ? KN.util.today() : null;
        }
      });
      haptic(12);
    });

    row.querySelector(".fav").addEventListener("click", () => toggleFav(item.id));

    row.querySelector(".item-body").addEventListener("click", () => {
      KN.productSheet.open(product.id, { itemId: item.id });
    });

    KN.ui.swipeActions(wrap, row, {
      tiles,
