    return navigator.serviceWorker.getRegistration()
      .then((reg) => (reg ? reg.update() : null))
      .catch(() => null);
  }

  KN.pullRefresh = { init };
})();

/* ---- js/product-sheet.js ---- */
/* =========================================================
   かいものノート — shared product / item detail sheet
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, perItemPrice, isCounted, formatSize, relativeDate, formatDate, UNITS, debounce, haptic } = KN.util;
  const store = KN.store;

  /**
   * Open the detail sheet for a product.
   * @param {string} productId
   * @param {object} [opts]
   * @param {string} [opts.itemId] when opened from the shopping list, shows qty/memo controls
   */
  function open(productId, { itemId } = {}) {
    const product = store.getProduct(productId);
    if (!product) return;

    const body = node(html`<div class="stack" style="gap:20px"></div>`);

    const pricesWrap = node(html`<div class="stack" style="gap:12px"></div>`);
    const rerenderPrices = () => renderPrices(pricesWrap, productId);

    const category = categoryField(productId);
    body.append(nameField(productId, category.recheck));
    if (itemId) body.append(itemSection(itemId));
    body.append(category.el);
    body.append(sizeField(productId, rerenderPrices));
    body.append(pricesWrap);
    rerenderPrices();

    body.append(historySection(productId));
    body.append(dangerSection(productId, () => sheetHandle.close()));

    const foot = node(html`<button class="btn btn-primary btn-block">完了</button>`);

    const sheetHandle = KN.ui.sheet({
      title: product.name,
      titleMark: store.productMark(product),
      content: body,
      footer: foot,
    });

    foot.addEventListener("click", () => sheetHandle.close());
    return sheetHandle;
  }

  /* ---------------- fields ---------------- */

  function nameField(productId, onRecategorised) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <label class="field">
        <span class="field-label">商品名</span>
        <input class="input js-name" value="${p.name}" placeholder="商品名">
      </label>
    `);
    const input = wrap.querySelector(".js-name");

    const save = debounce(() => {
      const v = input.value.trim();
      if (!v) return;

      /* A rename is very often a correction. 「コンソメ」 came out as その他,
         so it gets renamed 「コンソメ(調味料)」 — and the new name now says
         plainly where it goes. Re-reading it costs nothing and saves a second
         trip to the picker.

         Two limits. A category picked by hand is never overruled: that was a
         decision, and this is a guess. And a guess that lands on その他 is
         thrown away rather than applied — a name we cannot place must not
         demote a category that is already right. */
      let moved = null;
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.name = v;
        if (rec.catManual) return;
        const guess = store.guessCategory(v);
        if (guess !== store.OTHER_CATEGORY && guess !== rec.categoryId) {
          rec.categoryId = guess;
          moved = guess;
        }
      });

      if (moved) {
        onRecategorised && onRecategorised();
        KN.ui.toast(`「${store.getCategory(moved).name}」に移しました`);
        haptic();
      }
    }, 350);

    input.addEventListener("input", save);
    return wrap;
  }

  function itemSection(itemId) {
    const item = store.get().items.find((i) => i.id === itemId);
    if (!item) return document.createDocumentFragment();

    const wrap = node(html`
      <div class="stack" style="gap:12px">
        <div class="field">
          <span class="field-label">数量</span>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="icon-btn js-minus" aria-label="減らす" style="background:var(--c-surface-2)">${icon("minus")}</button>
            <span class="js-qty mono-num" style="font-size:22px;font-weight:800;min-width:44px;text-align:center">${item.qty}</span>
            <button class="icon-btn js-plus" aria-label="増やす" style="background:var(--c-surface-2)">${icon("plus")}</button>
            <button class="btn btn-soft btn-sm js-remove" style="margin-left:auto">リストから外す</button>
          </div>
        </div>
        <label class="field">
          <span class="field-label">メモ</span>
          <input class="input js-memo" value="${item.memo || ""}" placeholder="例：詰め替え用・特売のとき">
        </label>
      </div>
    `);

    const qtyEl = wrap.querySelector(".js-qty");
    function setQty(delta) {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.qty = Math.max(1, rec.qty + delta);
      });
      const rec = store.get().items.find((i) => i.id === itemId);
      qtyEl.textContent = rec ? rec.qty : 1;
      haptic();
    }
    wrap.querySelector(".js-minus").addEventListener("click", () => setQty(-1));
    wrap.querySelector(".js-plus").addEventListener("click", () => setQty(1));

    const memo = wrap.querySelector(".js-memo");
    memo.addEventListener("input", debounce(() => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.memo = memo.value;
      });
    }, 350));

    wrap.querySelector(".js-remove").addEventListener("click", () => {
      const snapshot = store.get().items.find((i) => i.id === itemId);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== itemId); });
      KN.ui.toast("リストから外しました", {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => { s.items.unshift(snapshot); }),
        },
      });
      const sheetEl = wrap.closest(".sheet");
      if (sheetEl) sheetEl.querySelector(".js-close").click();
    });

    return wrap;
  }

  function categoryField(productId) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">カテゴリ</span>
        <div class="js-picker"></div>
      </div>
    `);

    const picker = KN.ui.categoryPicker(wrap.querySelector(".js-picker"), {
      selectedId: p.categoryId,
      onSelect: (categoryId) => {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === productId);
          if (!rec) return;
          rec.categoryId = categoryId;
          // Chosen by hand. Nothing guessed from the name may move it again.
          rec.catManual = true;
        });

        /* And remember it. Being told 「コンソメ is 調味料」 once should be
           enough — the next 「コンソメ」 typed into the list goes straight
           there, and so does 「味の素 コンソメ」. Shown in 設定 so it is not a
           machine quietly making decisions nobody can see or undo. */
        const rec = store.getProduct(productId);
        const known = store.learnedList().some((l) => l.key === KN.util.foldKana(rec.name) && l.categoryId === categoryId);
        store.learnCategory(rec.name, categoryId);
        if (!known) {
          KN.ui.toast(`「${rec.name}」は${store.getCategory(categoryId).name}、と覚えました`);
        }
      },
    });

    // Called after a rename moved the category out from under the picker.
    const recheck = () => picker.set(store.getProduct(productId).categoryId);
    return { el: wrap, recheck };
  }

  function sizeField(productId, onChanged) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">内容量・入数</span>
        <div class="input-group">
          <input class="input js-amount" style="flex:1" type="text" inputmode="none"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 value="${p.amount != null ? p.amount : ""}" placeholder="500">
          <select class="select js-unit" style="flex:0 0 110px">
            <option value="">単位なし</option>
            ${UNITS.map((u) => html`<option value="${u}" ${p.unit === u ? KN.util.raw("selected") : ""}>${u}</option>`)}
          </select>
        </div>
        <span class="field-hint js-size-hint"></span>
      </div>
    `);

    const amountEl = wrap.querySelector(".js-amount");
    const unitEl = wrap.querySelector(".js-unit");
    const hintEl = wrap.querySelector(".js-size-hint");

    /* 「10個」なら 1個あたりに割る。「500ml」は割らない — そう書いてあると
       見分けがつくというだけで、値段は 1本ぶんの値段のまま。 */
    function paintHint() {
      hintEl.textContent = isCounted(unitEl.value)
        ? `この数で割って、1${unitEl.value}あたりの値段も出します`
        : "値段は 1つぶんとして比べます。ここは目印として書いておくだけです";
    }

    function save() {
      const amount = KN.util.calc(amountEl.value);
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.amount = isFinite(amount) && amount > 0 ? amount : null;
        rec.unit = unitEl.value;
      });
      paintHint();
      onChanged && onChanged();
    }

    KN.keypad.bind(amountEl);
    amountEl.addEventListener("input", debounce(save, 400));
    unitEl.addEventListener("change", save);
    paintHint();
    return wrap;
  }

  /* ---------------- prices ---------------- */

  function renderPrices(container, productId) {
    container.innerHTML = "";
    container.classList.add("js-prices-host");

    const p = store.getProduct(productId);
    const prices = store.currentPrices(p);
    const best = prices[0] || null;

    const section = node(html`
      <div class="stack js-prices" style="gap:10px">
        <span class="field-label">お店ごとの値段</span>
      </div>
    `);

    if (!prices.length) {
      section.append(node(html`
        <p style="color:var(--c-text-3);font-size:13px;line-height:1.6">
          まだ登録がありません。下のフォームからお店と値段を追加すると、いちばん安いお店が分かります。
        </p>
      `));
    } else {
      const list = node(html`<div class="price-list"></div>`);
      prices.forEach((pr) => {
        const st = store.getStore(pr.storeId);
        const up = perItemPrice(pr.price, p.amount, p.unit);
        const isBest = best && pr.id === best.id && prices.length > 1;

        const row = node(html`
          <div class="price-row ${isBest ? "is-best" : ""}">
            <button class="price-main js-open" aria-label="${st.name} の値段をくわしく見る">
              <span class="dot" style="background:${st.color}"></span>
              <span class="price-store-wrap">
                <span class="price-store">${st.name}</span>
                ${isBest ? html`<span class="crown">🏆</span>` : ""}
              </span>
              <span class="price-figures">
                <span class="price-amount">${yen(pr.price)}</span>
                ${up ? html`<span class="price-unit">${up.text}</span>` : ""}
                <span class="price-date">${relativeDate(pr.date)}</span>
              </span>
              <span class="price-chevron">${icon("chevron")}</span>
            </button>
            <button class="icon-btn is-danger js-del" aria-label="この価格を削除">${icon("trash")}</button>
          </div>
        `);

        row.querySelector(".js-open").addEventListener("click", () => {
          openPriceDetail(productId, pr.id, () => renderPrices(container, productId));
        });

        row.querySelector(".js-del").addEventListener("click", () => {
          store.update((s) => {
            const rec = s.products.find((x) => x.id === productId);
            if (rec) rec.prices = rec.prices.filter((x) => x.id !== pr.id);
          });
          renderPrices(container, productId);
          KN.ui.toast("価格を削除しました", {
            action: {
              label: "元に戻す",
              onClick: () => {
                store.update((s) => {
                  const rec = s.products.find((x) => x.id === productId);
                  if (rec) rec.prices.push(pr);
                });
                renderPrices(container, productId);
              },
            },
          });
        });

        list.append(row);
      });
      section.append(list);
    }

    section.append(addPriceForm(productId, () => renderPrices(container, productId)));
    container.append(section);
  }

  /* ---------------- one store's price, in full ---------------- */

  /* The row in 「お店ごとの値段」 shows what fits on a line: the price, the
     price of one, how long ago. Everything else about that record — the day
     it was seen, how far off the cheapest it is, what it used to cost there
     — needs a page of its own, and this is it. Also the only place any of it
     can be corrected: until now a wrong price could only be deleted and
     typed again. */
  function openPriceDetail(productId, priceId, onChanged) {
    const p = store.getProduct(productId);
    const pr = p && p.prices.find((x) => x.id === priceId);
    if (!pr) return;
    const st = store.getStore(pr.storeId);
    if (!st) return;

    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">値段</span>
          <input class="input js-price" type="text" autocomplete="off" value="${String(pr.price)}">
        </label>

        <label class="field">
          <span class="field-label">記録した日</span>
          <input class="input js-date" type="date" value="${isoToDay(pr.date)}">
        </label>

        <div class="field">
          <span class="field-label">くらべる</span>
          <div class="card js-compare" style="padding:12px"></div>
        </div>

        <div class="field js-log-wrap"></div>

        <button class="btn btn-danger btn-block js-del">${icon("trash")} この記録を削除</button>
      </div>
    `);

    const priceEl = body.querySelector(".js-price");
    const dateEl  = body.querySelector(".js-date");
    KN.keypad.bind(priceEl);

    const handle = KN.ui.sheet({
      title: st.name,
      titleMark: KN.util.raw(`<span class="dot" style="background:${st.color};width:14px;height:14px"></span>`),
      content: body,
      footer: node(html`<button class="btn btn-primary btn-block js-done">完了</button>`),
    });
    handle.el.querySelector(".js-done").addEventListener("click", () => handle.close());

    function save() {
      const price = KN.util.calc(priceEl.value);
      store.update((s) => {
        const prod = s.products.find((x) => x.id === productId);
        const rec = prod && prod.prices.find((x) => x.id === priceId);
        if (!rec) return;
        if (isFinite(price) && price >= 0) rec.price = price;
        const day = dateEl.value;
        if (day) rec.date = dayToIso(day, rec.date);
      });
      paint();
      onChanged && onChanged();
    }

    priceEl.addEventListener("input", debounce(save, 400));
    dateEl.addEventListener("change", save);

    function paint() {
      paintCompare(body.querySelector(".js-compare"), productId, priceId);
      paintLog(body.querySelector(".js-log-wrap"), productId, pr.storeId, priceId, () => {
        paint();
        onChanged && onChanged();
      });
    }
    paint();

    body.querySelector(".js-del").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "この記録を削除しますか？",
        message: `${st.name} の ${yen(pr.price)} を消します。`,
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      store.update((s) => {
        const prod = s.products.find((x) => x.id === productId);
        if (prod) prod.prices = prod.prices.filter((x) => x.id !== priceId);
      });
      handle.close();
      onChanged && onChanged();
      KN.ui.toast("削除しました");
    });

    return handle;
  }

  /* How this record stands against the others. The comparison is on the price
     as it is — what you actually hand over at the till — because the same
     thing in the same size is what gets bought week after week. When it is
     sold by the pack the price of one is shown underneath, but it never
     changes which shop is cheapest: every shop is divided by the same count. */
  function paintCompare(host, productId, priceId) {
    const p = store.getProduct(productId);
    const pr = p.prices.find((x) => x.id === priceId);
    const others = store.currentPrices(p);
    const mine = others.find((x) => x.id === priceId);
    const cheapest = others[0] || null;

    const rows = [];
    if (mine && cheapest && others.length > 1) {
      const diff = pr.price - cheapest.price;
      rows.push(diff === 0
        ? html`<span class="cmp-good">いちばん安い値段です</span>`
        : html`<span>いちばん安い ${store.getStore(cheapest.storeId).name} より
                 <b class="cmp-bad">${yen(diff)} 高い</b></span>`);
    }

    const up = perItemPrice(pr.price, p.amount, p.unit);
    if (up) {
      rows.push(html`<span>${formatSize(p.amount, p.unit)}入りなので <b>${up.text}</b></span>`);
    } else if (isCounted(p.unit)) {
      rows.push(html`<span style="color:var(--c-text-3)">入数を入れると、1${p.unit}あたりの値段も出ます</span>`);
    }

    host.innerHTML = "";
    host.append(node(html`
      <div class="stack cmp" style="gap:6px">${rows.length ? rows : html`<span style="color:var(--c-text-3)">ほかのお店の値段がまだありません</span>`}</div>
    `));
  }

  /** Every price ever recorded at this shop for this product. */
  function paintLog(host, productId, storeId, currentId, onChanged) {
    const p = store.getProduct(productId);
    const log = p.prices
      .filter((x) => x.storeId === storeId)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    host.innerHTML = "";
    if (log.length < 2) return;

    host.append(node(html`<span class="field-label">このお店での記録（${String(log.length)}件）</span>`));
    const list = node(html`<div class="stack" style="gap:6px"></div>`);
    log.forEach((x) => {
      const up = perItemPrice(x.price, p.amount, p.unit);
      const row = node(html`
        <div class="log-row ${x.id === currentId ? "is-current" : ""}">
          <span class="log-date">${formatDate(x.date)}</span>
          <span class="log-price">${yen(x.price)}</span>
          <span class="log-unit">${up ? up.text : ""}</span>
          ${x.id === currentId
            ? html`<span class="log-tag">いま見ている</span>`
            : html`<button class="icon-btn is-danger js-drop" aria-label="この記録を削除">${icon("close")}</button>`}
        </div>
      `);
      const drop = row.querySelector(".js-drop");
      if (drop) {
        drop.addEventListener("click", () => {
          store.update((s) => {
            const prod = s.products.find((y) => y.id === productId);
            if (prod) prod.prices = prod.prices.filter((y) => y.id !== x.id);
          });
          onChanged && onChanged();
        });
      }
      list.append(row);
    });
    host.append(list);
  }

  /** ISO timestamp → the YYYY-MM-DD an <input type="date"> wants. */
  function isoToDay(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  /** YYYY-MM-DD back to a timestamp, keeping the original time of day. */
  function dayToIso(day, previousIso) {
    const [y, m, d] = day.split("-").map(Number);
    const prev = new Date(previousIso);
    const out = new Date(isNaN(prev.getTime()) ? Date.now() : prev.getTime());
    out.setFullYear(y, m - 1, d);
    return out.toISOString();
  }

  /* The price field takes a sum, not just a number, and the pad supplies the
     operators the system keypad does not have. This is the readout for it:
     what the sum comes to, live, right above the pad. */
  function wireCalculator(form) {
    const strip = form.querySelector(".js-calc");
    const out = form.querySelector(".js-calc-out");
    const fields = [form.querySelector(".js-price")].filter(Boolean);
    let last = fields[0];

    function paint() {
      const v = last && last.value;
      const n = KN.util.calc(v);
      if (KN.util.isExpression(v) && n != null) {
        out.textContent = `= ${yen(n)}`;
        out.classList.remove("is-idle");
      } else if (KN.util.isExpression(v)) {
        out.textContent = "…";
        out.classList.add("is-idle");
      } else {
        out.textContent = "＋ − × ÷ と「税」「割引」で計算できます";
        out.classList.add("is-idle");
      }
    }

    /* The readout sits under the field, which is exactly where the sheet's
       own scroller runs out — opening the pad on the last field in a long
       product left the running total below the fold, so the sum was being
       worked out somewhere the user could not see. Bring it up as the pad
       arrives, and again once the sheet has finished resizing around it. */
    const revealStrip = () => [180, 400, 680].forEach((ms) => setTimeout(() => {
      if (!strip.hidden) strip.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, ms));

    fields.forEach((f) => {
      KN.keypad.bind(f, {
        onOpen: () => { last = f; strip.hidden = false; paint(); revealStrip(); },
        onCommit: () => { strip.hidden = true; },
      });
      f.addEventListener("input", () => { last = f; paint(); });
      f.addEventListener("blur", () => setTimeout(() => {
        if (!KN.keypad.isOpen()) strip.hidden = true;
      }, 120));
    });

    paint();
  }

  function addPriceForm(productId, onAdded) {
    const p = store.getProduct(productId);
    const hasStores = store.get().stores.length > 0;

    const form = node(html`
      <form class="stack" style="gap:10px;padding:12px;border:1.5px dashed var(--c-border-2);border-radius:12px">
        <span class="field-label">値段を追加</span>
        <div class="js-stores"></div>
        <div class="input-group">
          <!-- Text, not number: a number field throws away「198+250」 the moment
               it is typed, and that sum is the whole point of the row of
               operators below. inputmode still asks for the numeric keypad. -->
          <input class="input js-price" type="text"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 placeholder="値段" style="flex:1.2" required>
          <button class="btn btn-primary js-add" type="submit" style="flex:0 0 auto">追加</button>
        </div>
        <div class="calc-row js-calc" hidden>
          <span class="calc-out js-calc-out" aria-live="polite"></span>
        </div>
        ${perItemPrice(1, p.amount, p.unit)
          ? html`<p class="js-hint" style="font-size:11px;color:var(--c-text-3);margin:0">
                   ${formatSize(p.amount, p.unit)}入りとして、1${p.unit}あたりの値段も出します
                 </p>`
          : ""}
      </form>
    `);

    let selectedStore = null;
    KN.ui.storePicker(form.querySelector(".js-stores"), {
      selectedId: null,
      onSelect: (id) => { selectedStore = id; },
    });

    wireCalculator(form);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const priceEl = form.querySelector(".js-price");
      // 「198+250」 is stored as 448. calc() returns null for a plain number,
      // so a straight price still goes through parseNum as before.
      const price = KN.util.calc(priceEl.value);

      if (!hasStores && !selectedStore) {
        KN.ui.toast("先に「＋ お店を追加」でお店を登録してください");
        return;
      }
      if (!selectedStore) { KN.ui.toast("お店を選んでください"); return; }
      if (!isFinite(price) || price < 0) { KN.ui.toast("値段を入力してください"); return; }

      store.addPrice(productId, { storeId: selectedStore, price });
      haptic(12);
      priceEl.value = "";
      onAdded();
    });

    return form;
  }

  /* ---------------- history ---------------- */

  function historySection(productId) {
    const p = store.getProduct(productId);
    if (!p.prices || p.prices.length < 3) return document.createDocumentFragment();

    const sorted = [...p.prices].sort((a, b) => new Date(a.date) - new Date(b.date));
    const values = sorted.map((x) => x.price);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const span = max - min || 1;

    const W = 300, H = 48, PAD = 4;
    const pts = sorted.map((pr, i) => {
      const x = sorted.length === 1 ? W / 2 : (i / (sorted.length - 1)) * (W - PAD * 2) + PAD;
      const y = H - PAD - ((pr.price - min) / span) * (H - PAD * 2);
      return [x, y];
    });

    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;

    return node(html`
      <div class="field">
        <span class="field-label">値段の記録（${sorted.length}件）</span>
        <div class="card" style="padding:12px">
          <svg class="spark" viewBox="0 0 ${String(W)} ${String(H)}" preserveAspectRatio="none" aria-hidden="true">
            <path class="spark-area" d="${area}"></path>
            <path class="spark-line" d="${line}"></path>
          </svg>
          <div class="spread" style="margin-top:6px">
            <span style="font-size:11px;color:var(--c-text-3)">いちばん安いとき ${yen(min)}</span>
            <span style="font-size:11px;color:var(--c-text-3)">高いとき ${yen(max)}</span>
          </div>
        </div>
      </div>
    `);
  }

  /* ---------------- danger ---------------- */

  function dangerSection(productId, closeSheet) {
    const btn = node(html`
      <button class="btn btn-danger btn-block">${icon("trash")} この商品を削除</button>
    `);
    btn.addEventListener("click", async () => {
      const p = store.getProduct(productId);
      const ok = await KN.ui.confirm({
        title: "商品を削除しますか？",
        message: `「${p.name}」の価格記録と、買い物リストの項目もまとめて削除されます。`,
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      store.update((s) => {
        s.products = s.products.filter((x) => x.id !== productId);
        s.items = s.items.filter((i) => i.productId !== productId);
      });
      KN.ui.toast("削除しました");
      closeSheet();
    });
    return btn;
  }

  KN.productSheet = { open };
})();

/* ---- js/screen-list.js ---- */
/* =========================================================
   かいものノート — shopping list screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, frag, icon, yen, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let categoryFilter = null;   // categoryId or null = all
  let openWrap = null;         // the one row currently swiped open, if any

  /* ---------------- mount (static chrome) ---------------- */

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">買い物リスト</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-clear" aria-label="購入済みをまとめて削除" title="購入済みをまとめて削除">
              ${icon("trash")}
            </button>
          </div>
        </header>

        <div class="progress-wrap js-progress-wrap" hidden>
          <div class="progress"><div class="progress-bar js-progress" style="width:0%"></div></div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    /* The add button sits in the shell's dock, not in this screen. Adding
       something is the one thing done one-handed in a shop aisle, so it
       belongs at the bottom, in the middle, where a thumb already is.

       It used to be a text field here, with the suggestions opening upward
       over the list. That got you a name and nothing else: quantity and
       category had to be fixed afterwards in the product sheet. One button
       and one form is fewer steps for anything beyond a bare name, and the
       same suggestions still turn a name into an existing product. */
    const dock = document.getElementById("dock");
    dock.innerHTML = "";
    dock.append(node(html`
      <div class="quick-add">
        <button class="add-fab js-open-add" aria-label="買うものを追加">${icon("plus")}</button>
      </div>
    `));

    els = {
      sub:        chrome.querySelector(".js-sub"),
      clear:      chrome.querySelector(".js-clear"),
      addFab:     dock.querySelector(".js-open-add"),
      progWrap:   chrome.querySelector(".js-progress-wrap"),
      progress:   chrome.querySelector(".js-progress"),
      filter:     chrome.querySelector(".js-filter"),
      body:       chrome.querySelector(".js-body"),
      topbar:     chrome.querySelector(".topbar"),
    };

    els.addFab.addEventListener("click", openAddSheet);

    els.clear.addEventListener("click", clearChecked);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- the add sheet ---------------- */

  /* One form for everything a new line on the list needs: what it is, how
     many, and which aisle it belongs to. The name field still suggests as you
     type — tapping a suggestion is what turns 「ぎゅうにゅう」 into the 牛乳
     already on file, with its prices and its category, instead of a second
     product with the same name.

     It stays open after each add. A shopping list is written in one sitting,
     and closing the sheet only to press ＋ again is the kind of ceremony that
     makes a list feel like paperwork. */
  function openAddSheet() {
    haptic(10);

    let picked = null;        // an existing product chosen from the suggestions
    let catTouched = false;   // the category was set by hand, so stop guessing
    let qty = 1;

    const body = node(html`
      <div class="stack" style="gap:18px">
        <div class="field">
          <span class="field-label">商品名</span>
          <input class="input js-name" placeholder="例：食器用洗剤"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-autocomplete="list">
          <div class="js-ac"></div>
          <span class="field-hint js-known" hidden></span>
        </div>

        <div class="field">
          <span class="field-label">個数</span>
          <div class="stepper">
            <button type="button" class="stepper-btn js-minus" aria-label="1つ減らす">${icon("minus")}</button>
            <span class="stepper-value js-qty" aria-live="polite">1</span>
            <button type="button" class="stepper-btn js-plus" aria-label="1つ増やす">${icon("plus")}</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">カテゴリ</span>
          <div class="js-cat"></div>
        </div>

        <label class="field">
          <span class="field-label">メモ（任意）</span>
          <input class="input js-memo" placeholder="例：詰め替え用" autocomplete="off">
        </label>
      </div>
    `);

    const nameEl = body.querySelector(".js-name");
    const memoEl = body.querySelector(".js-memo");
    const qtyEl  = body.querySelector(".js-qty");
    const acHost = body.querySelector(".js-ac");
    const known  = body.querySelector(".js-known");

    const foot = node(html`<button class="btn btn-primary btn-block js-add" disabled>リストに追加</button>`);
    const addBtn = foot;

    const handle = KN.ui.sheet({ title: "買うものを追加", content: body, footer: foot });

    const cat = KN.ui.categoryPicker(body.querySelector(".js-cat"), {
      selectedId: store.OTHER_CATEGORY,
      onSelect: () => { catTouched = true; },
    });

    const paintQty = () => { qtyEl.textContent = String(qty); };
    body.querySelector(".js-minus").addEventListener("click", () => {
      if (qty <= 1) { haptic(20); return; }
      qty -= 1; paintQty(); haptic();
    });
    body.querySelector(".js-plus").addEventListener("click", () => {
      qty += 1; paintQty(); haptic();
    });

    /* Everything the name field drives: the button, the suggestions, and —
       until the category is touched by hand — the guess underneath it. */
    function onName() {
      const typed = nameEl.value.trim();
      addBtn.disabled = !typed;
      // Typing on past a chosen suggestion means it is no longer that product.
      if (picked && KN.util.foldKana(picked.name) !== KN.util.foldKana(typed)) {
        picked = null;
        known.hidden = true;
      }
      if (!picked && !catTouched) cat.set(typed ? store.guessCategory(typed) : store.OTHER_CATEGORY);
      renderSuggestions(nameEl, acHost, typed, choose);
    }

    /* A suggestion tapped: from here the form is about that product, so its
       category comes along and the sheet says which one it landed on. */
    function choose(product) {
      picked = product;
      nameEl.value = product.name;
      addBtn.disabled = false;
      catTouched = false;
      cat.set(product.categoryId);
      const best = store.bestPrice(product);
      const st = best ? store.getStore(best.storeId) : null;
      known.hidden = false;
      known.textContent = best && st
        ? `登録済みの商品です・${st.name} ${yen(best.price)} が最安`
        : "登録済みの商品です";
      acHost.innerHTML = "";
      nameEl.focus();
    }

    nameEl.addEventListener("input", onName);
    nameEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      submit();
    });
    memoEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    addBtn.addEventListener("click", submit);

    function submit() {
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }

      const product = picked || store.findProductByName(name)
        || store.addProduct({ name, categoryId: cat.current });

      /* A category chosen by hand outranks the guess, and is remembered — the
         next 「コンソメ」 lands where this one did without being told again.
         Applied even when the product was just created with that category:
         the guess and the choice agreeing does not make it a guess. */
      if (catTouched) {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === product.id);
          if (rec) { rec.categoryId = cat.current; rec.catManual = true; }
        });
        store.learnCategory(product.name, cat.current);
      }

      const memo = memoEl.value.trim();
      const already = store.get().items.find((i) => i.productId === product.id && !i.checked);
      if (already) {
        store.update((s) => {
          const rec = s.items.find((i) => i.id === already.id);
          if (!rec) return;
          rec.qty += qty;
          if (memo) rec.memo = memo;
        });
        const now = store.get().items.find((i) => i.id === already.id);
        KN.ui.toast(`${product.name} を ${now ? now.qty : already.qty} 個にしました`);
      } else {
        store.addItem(product.id, { qty, memo });
        const c = store.getCategory(product.categoryId);
        KN.ui.toast(`${c.emoji} ${c.name} に「${product.name}」を追加しました`);
      }
      haptic(12);
      reset();
    }

    /* Cleared and ready for the next one, rather than closed. */
    function reset() {
      picked = null;
      catTouched = false;
      qty = 1;
      paintQty();
      nameEl.value = "";
      memoEl.value = "";
      known.hidden = true;
      addBtn.disabled = true;
      acHost.innerHTML = "";
      cat.set(store.OTHER_CATEGORY);
      nameEl.focus();
    }

    // The sheet focuses its first control after its own animation; on a phone
    // it deliberately does not, so the keyboard does not fly up over it.
    setTimeout(() => { if (!("ontouchstart" in window)) nameEl.focus(); }, 340);
    return handle;
  }

  /* ---------------- suggestions ---------------- */

  /* Matched on the folded name, so a single 「え」 already surfaces
     「エマール」 — nobody switches to katakana to search their own list. */
  function renderSuggestions(input, host, typed, onPick) {
    const q = KN.util.foldKana(typed);
    if (!q) { host.innerHTML = ""; return; }

    const onList = new Set(store.get().items.filter((i) => !i.checked).map((i) => i.productId));
    const found = store.get().products
      .map((p) => ({ p, key: KN.util.foldKana(p.name) }))
      .filter((r) => r.key.includes(q))
      .sort((a, b) => {
        const aStarts = a.key.startsWith(q) ? 0 : 1;
        const bStarts = b.key.startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.p.name.localeCompare(b.p.name, "ja");
      })
      .slice(0, 6)
      .map((r) => r.p);

    if (!found.length) { host.innerHTML = ""; return; }

    /* Reuse the panel across keystrokes. Rebuilding it restarted the open
       animation on every character, which read as the list flickering. */
    let box = host.querySelector(".ac");
    if (!box) {
      box = node(html`<div class="ac" role="listbox"></div>`);
      host.append(box);
    } else {
      box.innerHTML = "";
    }

    found.forEach((p) => {
      const best = store.bestPrice(p);
      const bestStore = best ? store.getStore(best.storeId) : null;
      const row = node(html`
        <button type="button" class="ac-item" role="option">
          <span class="ac-emoji">${store.productMark(p)}</span>
          <span class="ac-main">
            <span class="ac-name">${p.name}</span>
            <span class="ac-sub">
              ${best && bestStore ? html`${bestStore.name} ${yen(best.price)} が最安` : "価格の記録なし"}
              ${onList.has(p.id) ? html` ・<b>リストにあります</b>` : ""}
            </span>
          </span>
        </button>
      `);
      // Keep the caret where it is; a suggestion is not somewhere to move to.
      row.addEventListener("mousedown", (e) => e.preventDefault());
      row.addEventListener("click", () => onPick(p));
      box.append(row);
    });
  }

  /* ---------------- clear checked ---------------- */

  async function clearChecked() {
    const checked = store.get().items.filter((i) => i.checked);
    if (!checked.length) { KN.ui.toast("購入済みの商品はありません"); return; }

    const ok = await KN.ui.confirm({
      title: "購入済みを削除",
      message: `${checked.length}件の購入済み商品をリストから消します。商品と価格の記録は残ります。`,
      okLabel: "削除する",
      danger: true,
    });
    if (!ok) return;

    store.update((s) => { s.items = s.items.filter((i) => !i.checked); });
    KN.ui.toast(`${checked.length}件を削除しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => { s.items = [...checked, ...s.items]; }),
      },
    });
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const items = st.items;

    // Once anything is starred the header tracks that trip rather than the whole
    // list, so it agrees with the tab badge instead of quoting a second number.
    const scope = items.some((i) => i.fav) ? items.filter((i) => i.fav) : items;
    const done = scope.filter((i) => i.checked).length;
    const label = scope === items ? "" : "今回買うもの ";

    // 「N件中M件購入済み」rather than「N件・M件購入済み」: the section heading
    // below counts what is left, and two different numbers under the same
    // wording read as a contradiction.
    els.sub.textContent = items.length
      ? (scope.length ? `${label}${scope.length}件中 ${done}件購入済み` : "今回買うものは未選択です")
      : "リストは空です";

    els.progWrap.hidden = scope.length === 0;
    els.progress.style.width = scope.length ? `${(done / scope.length) * 100}%` : "0%";

    renderFilter(items);
    renderBody(items);
  }

  function renderFilter(items) {
    const counts = new Map();
    items.filter((i) => !i.checked).forEach((i) => {
      const p = store.getProduct(i.productId);
      if (!p) return;
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });

    if (counts.size < 2) { categoryFilter = null; els.filter.innerHTML = ""; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const chips = [{ id: "", label: "すべて" }].concat(
      store.sortedCategories().filter((c) => counts.has(c.id)).map((c) => ({
        id: c.id, label: c.name, emoji: c.emoji, color: c.color, count: counts.get(c.id),
      })));

    KN.ui.chipRow(els.filter, chips, {
      activeId: categoryFilter || "",
      onPick: (id) => {
        categoryFilter = id && id !== categoryFilter ? id : null;
        haptic();
        render();
      },
    });
  }

  function renderBody(items) {
    // Rows are rebuilt from scratch, so any remembered open row is now detached.
    openWrap = null;
    els.body.innerHTML = "";

    if (!items.length) {
      els.body.append(emptyState());
      return;
    }

    const active = items.filter((i) => !i.checked);
    const checked = items.filter((i) => i.checked);
    const trip = active.filter((i) => i.fav);

    if (!trip.length) {
      // Nothing starred yet: one plain list with one total, as before. Splitting
      // the screen the moment favourites exist as a concept would leave anyone
      // not using them staring at an empty「今回買うもの」and a — total.
      const shown = appendGroups(active);
      if (!shown && categoryFilter) els.body.append(noneInCategory());
      if (checked.length) els.body.append(checkedSection(checked));
      els.body.append(summaryCard(active));
      els.body.append(insightsCard(active));
      return;
    }

    const rest = active.filter((i) => !i.fav);

    els.body.append(sectionHead("今回買うもの", trip.length, "trip"));
    const tripShown = appendGroups(trip);
    if (!tripShown && categoryFilter) els.body.append(noneInCategory());
    // The total belongs to the trip, so it sits directly under it — everything
    // below this line is explicitly not being bought today.
    els.body.append(summaryCard(trip, { trip: true }));
    els.body.append(insightsCard(trip));

    if (rest.length) {
      els.body.append(sectionHead("そのほか", rest.length, "rest"));
      appendGroups(rest);
    }

    if (checked.length) els.body.append(checkedSection(checked));
  }

  /** Renders category groups for the given items. Returns whether anything showed. */
  function appendGroups(list) {
    const groups = new Map();
    list.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (!p) return;
      if (categoryFilter && p.categoryId !== categoryFilter) return;
      if (!groups.has(p.categoryId)) groups.set(p.categoryId, []);
      groups.get(p.categoryId).push({ item, product: p });
    });

    store.sortedCategories().forEach((cat) => {
      const entries = groups.get(cat.id);
      if (!entries || !entries.length) return;

      const group = node(html`
        <section class="cat-group" style="--cat:${cat.color || ""}">
          <h2 class="cat-head">
            <span class="cat-head-emoji">${cat.emoji}</span>${cat.name}
            <span class="cat-head-count">${entries.length}</span>
          </h2>
          <div class="item-list"></div>
        </section>
      `);
      const listEl = group.querySelector(".item-list");
      entries.forEach(({ item, product }) => listEl.append(itemRow(item, product)));
      wireReorder(listEl);
      els.body.append(group);
    });

    return groups.size > 0;
  }

  /* Reordering is within a group, because a group is exactly the set of rows
     that are interchangeable: same category, same side of the「今回買うもの」
     line. Dragging a row into another category's group would have to silently
     recategorise it, which is not what picking it up looks like it means. */
  function wireReorder(listEl) {
    KN.reorder.attach(listEl, {
      item: ".item-wrap",
      // A row already swiped open is mid-gesture; picking it up on top of that
      // would leave the delete panel hanging in the air.
      blocked: () => !!openWrap,
      onDrop: (from, to) => {
        const ids = Array.prototype.map.call(listEl.children, (w) => w.dataset.itemId);
        const [moved] = ids.splice(from, 1);
        ids.splice(to, 0, moved);

        // The group's order is its members' order within the whole list, so
        // the move writes them back into the same slots they already occupy —
        // everything not in this group stays exactly where it was.
        store.update((s) => {
          const inGroup = new Set(ids);
          const slots = [];
          s.items.forEach((it, i) => { if (inGroup.has(it.id)) slots.push(i); });
          const byId = new Map(s.items.map((it) => [it.id, it]));
          ids.forEach((id, k) => { s.items[slots[k]] = byId.get(id); });
        });
        KN.util.haptic(12);
      },
    });
  }

  function sectionHead(label, count, kind) {
    return node(html`
      <h2 class="trip-head trip-head-${kind}">
        ${kind === "trip" ? icon("star") : ""}
        <span>${label}</span>
        <span class="cat-head-count">${count}</span>
      </h2>
    `);
  }

  function noneInCategory() {
    return node(html`
      <p style="text-align:center;color:var(--c-text-3);padding:32px 16px">
        このカテゴリに未購入の商品はありません
      </p>
    `);
  }

  function itemRow(item, product) {
    const best = store.bestPrice(product);
    const bestStore = best ? store.getStore(best.storeId) : null;

    const wrap = node(html`
      <article class="item-wrap" data-item-id="${item.id}" style="--cat:${store.productColor(product)}">
        <div class="item-actions">
          <button class="item-del" tabindex="-1" aria-label="${product.name} をリストから削除">削除</button>
        </div>
        <div class="item-star">
          ${icon("star")}<span>${item.fav ? "★をはずす" : "今回買う"}</span>
        </div>
      </article>
    `);

    const row = node(html`
      <div class="item ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="item-body">
          <span class="item-name-row">
            <span class="item-name">${product.name}</span>
            ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          </span>
          <span class="item-meta">
            ${item.memo ? html`<span class="item-memo">${item.memo}</span>` : ""}
          </span>
        </button>
        <div class="item-price"></div>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
      </div>
    `);
    wrap.append(row);

    const priceBox = row.querySelector(".item-price");
    if (best && bestStore) {
      priceBox.append(frag(html`
        <span class="item-price-amount">${yen(best.price * item.qty)}</span>
        <span class="item-price-store">🏆 ${bestStore.name}</span>
      `));
    } else {
      priceBox.append(node(html`<span class="item-price-none">値段は未登録</span>`));
    }

    row.querySelector(".check").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) {
          rec.checked = !rec.checked;
          rec.checkedAt = rec.checked ? KN.util.today() : null;
        }
      });
      haptic(12);
    });

    row.querySelector(".fav").addEventListener("click", () => toggleFav(item.id));

    row.querySelector(".item-body").addEventListener("click", () => {
      KN.productSheet.open(product.id, { itemId: item.id });
    });

    wrap.querySelector(".item-del").addEventListener("click", () => {
      const removed = store.get().items.find((i) => i.id === item.id);
      const at = store.get().items.indexOf(removed);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== item.id); });
      haptic(12);
      // Deleting straight from a swipe is the platform convention, so the safety
      // net is an undo rather than a dialog standing between every removal.
      KN.ui.toast(`「${product.name}」を削除しました`, {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => {
            const next = s.items.slice();
            next.splice(Math.max(0, Math.min(at, next.length)), 0, removed);
            s.items = next;
          }),
        },
      });
    });

    attachSwipe(wrap, row, item);
    return wrap;
  }

  /* ---------------- swipe: left to delete, right to star ---------------- */

  /** ★ marks an item as part of the trip being shopped right now. */
  function toggleFav(itemId) {
    store.update((s) => {
      const rec = s.items.find((i) => i.id === itemId);
      if (rec) rec.fav = !rec.fav;
    });
    haptic(12);
  }

  // Only one row may sit open; a second one opening closes the first.
  function closeOpenRow() {
    if (openWrap) {
      openWrap.classList.remove("is-open");
      holdPanelDuringClose(openWrap);
    }
    openWrap = null;
  }

  /* The row slides back over 0.22s. Hiding the panel the instant the class goes
     would leave a bare strip of background trailing the row for that moment, so
     keep it on screen until the row has finished covering it again. */
  function holdPanelDuringClose(wrap) {
    const row = wrap.querySelector(".item");
    if (!row) return;
    wrap.classList.add("is-closing");
    const done = () => wrap.classList.remove("is-closing");
    row.addEventListener("transitionend", done, { once: true });
    // A transition that never runs (already at rest) would otherwise strand it.
    // Comfortably longer than the slide, or the panel vanishes mid-flight.
    setTimeout(done, 900);
  }

  function attachSwipe(wrap, row, item) {
    const REVEAL = 88;      // width of the delete panel
    const SLOP = 14;        // travel before a drag counts as a drag and not a tap
    const DOMINANCE = 1.6;  // how much horizontal has to beat vertical by
    const STAR = 68;        // how far right before the ★ is armed
    const STAR_MAX = 104;   // and how far it will stretch at all
    let startX = 0, startY = 0, dx = 0;
    let dragging = false, decided = false, pointerId = null, swallowClick = false;
    let pendingDx = null, rafId = 0;
    // "del" reveals the delete panel and stays open; "star" springs straight
    // back and toggles ★ — same gesture as the price screen's list swipe.
    let mode = "del";
    let starArmed = false;

    // Pointer moves arrive faster than the screen refreshes. Painting once per
    // frame instead of once per event keeps the row gliding rather than
    // stuttering under a quick finger.
    const paint = () => {
      rafId = 0;
      if (pendingDx === null) return;
      row.style.transform = `translate3d(${pendingDx}px, 0, 0)`;
    };
    const schedule = (v) => {
      pendingDx = v;
      if (!rafId) rafId = requestAnimationFrame(paint);
    };

    // touch-action keeps the list scrollable up to the moment a swipe is
    // recognised; from then on the browser has to be told to stop, or the list
    // scrolls under the finger while the row slides sideways.
    row.addEventListener("touchmove", (e) => {
      if (dragging) e.preventDefault();
    }, { passive: false });

    row.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = false;
      decided = false;
      // Deliberately touches no styles: a press that never becomes a swipe
      // should leave the row exactly as it was.
    });

    row.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pointerId) return;
      // Held still long enough to lift the row out of the list — from here the
      // gesture belongs to the reorder, not to the delete swipe.
      if (KN.reorder.isActive()) return;
      const mx = e.clientX - startX;
      const my = e.clientY - startY;

      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
        decided = true;
        // Has to be a clearly sideways movement, not a drifting scroll. A
        // diagonal belongs to the list, which stays scrollable throughout.
        const isOpen = wrap.classList.contains("is-open");
        dragging = Math.abs(mx) >= SLOP && Math.abs(mx) > Math.abs(my) * DOMINANCE;
        if (!dragging) return;
        // Rightwards on an open row still means "put it back"; on a closed one
        // it is the ★.
        mode = (mx > 0 && !isOpen) ? "star" : "del";
        row.setPointerCapture(pointerId);
        row.style.transition = "none";
        wrap.classList.add("is-swiping", mode === "star" ? "is-starring" : "is-deleting");
        if (openWrap && openWrap !== wrap) closeOpenRow();
      }
      if (!dragging) return;

      if (mode === "star") {
        // Past the trigger the row only creeps, so the finger feels the edge.
        dx = mx <= STAR ? mx : STAR + (mx - STAR) * 0.32;
        dx = Math.min(STAR_MAX, Math.max(0, dx));
        const now = dx >= STAR;
        if (now !== starArmed) {
          starArmed = now;
          wrap.classList.toggle("is-armed", now);
          if (now) haptic(10);
        }
        schedule(dx);
        return;
      }

      const base = wrap.classList.contains("is-open") ? -REVEAL : 0;
      // Bounded by the panel at both ends. Going further left than the panel is
      // wide opened a strip of bare background beyond it — very visible on a
      // second swipe of an already-open row — and going right of 0 would show
      // the same on the other side.
      dx = Math.min(0, Math.max(-REVEAL, base + mx));
      schedule(dx);
    });

    const finish = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      if (!dragging) return;

      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      pendingDx = null;
      row.style.transition = "";
      row.style.transform = "";

      if (mode === "star") {
        const fired = starArmed;
        starArmed = false;
        dragging = false;
        swallowClick = true;
        // Let the row glide home before the store change rebuilds the list;
        // toggling on the spot would swap it out mid-flight.
        setTimeout(() => {
          wrap.classList.remove("is-swiping", "is-starring", "is-armed");
          if (fired) toggleFav(item.id);
        }, 200);
        return;
      }

      wrap.classList.remove("is-swiping", "is-deleting");
      const open = dx < -REVEAL / 2;
      wrap.classList.toggle("is-open", open);
      if (!open) holdPanelDuringClose(wrap);
      openWrap = open ? wrap : (openWrap === wrap ? null : openWrap);
      dragging = false;
      // A pointer sequence still emits a click afterwards. Left alone it would
      // press whatever the finger lifted over, and — because the row is open by
      // then — immediately close the row the swipe just opened.
      swallowClick = true;
    };
    row.addEventListener("pointerup", finish);
    row.addEventListener("pointercancel", finish);

    row.addEventListener("click", (e) => {
      if (swallowClick) {
        swallowClick = false;
        e.stopPropagation();
        e.preventDefault();
        return;
      }
      // With the delete panel showing, a tap on the row means "put it back".
      if (wrap.classList.contains("is-open")) {
        e.stopPropagation();
        e.preventDefault();
        closeOpenRow();
      }
    }, true);
  }

  function checkedSection(checked) {
    const st = store.get();
    const open = st.settings.showChecked !== false;

    const section = node(html`
      <section class="cat-group">
        <button class="done-head" aria-expanded="${String(open)}">
          ${icon("chevron")} 購入済み <span class="cat-head-count">${checked.length}</span>
        </button>
        <div class="item-list js-done" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    const list = section.querySelector(".js-done");
    checked.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (p) list.append(itemRow(item, p));
    });

    section.querySelector(".done-head").addEventListener("click", () => {
      store.update((s) => { s.settings.showChecked = !open; });
    });

    return section;
  }

  function summaryCard(active, { trip = false } = {}) {
    let total = 0;
    let unknown = 0;

    active.forEach((item) => {
      const p = store.getProduct(item.productId);
      const best = p && store.bestPrice(p);
      if (best) total += best.price * item.qty;
      else unknown += 1;
    });

    if (!active.length) return document.createDocumentFragment();

    const scope = trip ? "今回買うもの" : "未購入";
    return node(html`
      <div class="list-summary">
        <div class="summary-row">
          <span class="summary-label">最安値で買うと</span>
          <span class="summary-total">${total > 0 ? yen(total) : "—"}</span>
        </div>
        <p class="summary-note">
          ${unknown > 0
            ? html`${unknown}品は値段が未登録です。商品をタップして登録すると合計に反映されます。`
            : html`${scope} ${active.length}品を、それぞれいちばん安いお店で買った場合の合計です。`}
        </p>
      </div>
    `);
  }

  /* Whatever the numbers happen to be worth saying out loud. Renders nothing
     at all when there is nothing to say, which is most of the time early on. */
  function insightsCard(items) {
    const found = KN.insights.forItems(items);
    if (!found.length) return document.createDocumentFragment();

    const card = node(html`
      <section class="insights">
        <h2 class="insights-head">${icon("sparkles")} 気づいたこと</h2>
        <div class="insights-list"></div>
      </section>
    `);
    const listEl = card.querySelector(".insights-list");
    found.forEach((f) => {
      listEl.append(node(html`
        <div class="insight">
          <span class="insight-ico">${f.icon}</span>
          <span class="insight-main">
            <span class="insight-title">${f.title}</span>
            <span class="insight-body">${f.body}</span>
          </span>
        </div>
      `));
    });
    return card;
  }

  function emptyState() {
    const wrap = node(html`
      <div class="empty">
        <div class="empty-art">🛒</div>
        <h2 class="empty-title">買うものを追加しましょう</h2>
        <p class="empty-text">
          下の欄に商品名を入れるだけ。カテゴリは自動で振り分けられ、
          お店ごとの値段を登録すると「どこが一番安いか」が分かります。
        </p>
        <button class="btn btn-soft js-sample" style="margin-top:8px">サンプルを入れて試す</button>
      </div>
    `);
    wrap.querySelector(".js-sample").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "サンプルを入れますか？",
        message: "3つのお店と7つの商品・価格が入ったサンプルデータを読み込みます。あとから設定画面で全部消せます。",
        okLabel: "入れる",
      });
      if (ok) { store.loadSample(); KN.ui.toast("サンプルを読み込みました"); }
    });
    return wrap;
  }

  KN.screens = KN.screens || {};
  KN.screens.list = { mount, render };
})();

/* =========================================================
   かいものノート — products & prices screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, perItemPrice, formatSize, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let query = "";
  let categoryFilter = null;

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">商品と価格</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-new" aria-label="商品を追加" title="商品を追加"
                    style="background:var(--c-primary);color:#fff">${icon("plus")}</button>
          </div>
        </header>

        <div class="search-wrap">
          <div class="search-bar">
            ${icon("search")}
            <input class="search-input js-search" placeholder="商品名で探す" aria-label="商品名で探す"
                   autocomplete="off" spellcheck="false">
            <button class="icon-btn js-clear" aria-label="検索をクリア" style="width:28px;height:28px" hidden>
              ${icon("close")}
            </button>
          </div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    els = {
      sub:     chrome.querySelector(".js-sub"),
      search:  chrome.querySelector(".js-search"),
      clear:   chrome.querySelector(".js-clear"),
      newBtn:  chrome.querySelector(".js-new"),
      filter:  chrome.querySelector(".js-filter"),
      body:    chrome.querySelector(".js-body"),
      topbar:  chrome.querySelector(".topbar"),
    };

    els.search.addEventListener("input", () => {
      // Folded so this behaves like the list screen's suggestions:
      // 「え」finds「エマール」.
      query = KN.util.foldKana(els.search.value);
      els.clear.hidden = !query;
      renderBody();
    });

    els.clear.addEventListener("click", () => {
      query = "";
      els.search.value = "";
      els.clear.hidden = true;
      renderBody();
    });

    els.newBtn.addEventListener("click", createProduct);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  async function createProduct() {
    const name = await KN.ui.prompt({
      title: "商品を追加",
      label: "商品名",
      placeholder: "例：食器用洗剤",
      okLabel: "追加",
    });
    if (!name) return;

    const existing = store.findProductByName(name);
    if (existing) {
      KN.ui.toast("すでに登録されています");
      KN.productSheet.open(existing.id);
      return;
    }
    const p = store.addProduct({ name, categoryId: store.guessCategory(name) });
    haptic(10);
    KN.productSheet.open(p.id);
  }

  function render() {
    const st = store.get();
    els.sub.textContent = `${st.products.length}商品 ・ ${st.stores.length}店舗`;
    renderFilter();
    renderBody();
  }

  function renderFilter() {
    const counts = new Map();
    store.get().products.forEach((p) => {
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });
    if (counts.size < 2) { categoryFilter = null; els.filter.innerHTML = ""; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const chips = [{ id: "", label: "すべて" }].concat(
      store.sortedCategories().filter((c) => counts.has(c.id)).map((c) => ({
        id: c.id, label: c.name, emoji: c.emoji, color: c.color, count: counts.get(c.id),
      })));

    KN.ui.chipRow(els.filter, chips, {
      activeId: categoryFilter || "",
      onPick: (id) => {
        categoryFilter = id && id !== categoryFilter ? id : null;
        haptic();
        renderFilter();
        renderBody();
      },
    });
  }

  function renderBody() {
    els.body.innerHTML = "";
    const all = store.get().products;

    if (!all.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">🏷️</div>
          <h2 class="empty-title">商品がまだありません</h2>
          <p class="empty-text">
            買い物リストに追加した商品はここに自動で並びます。
            お店ごとの値段を登録すると、いちばん安いお店が分かります。
          </p>
        </div>
      `));
      return;
    }

    const matched = all
      .filter((p) => !categoryFilter || p.categoryId === categoryFilter)
      .filter((p) => !query || KN.util.foldKana(p.name).includes(query))
      .sort((a, b) => a.name.localeCompare(b.name, "ja"));

    if (!matched.length) {
      els.body.append(node(html`
        <p style="text-align:center;color:var(--c-text-3);padding:40px 16px">
          「${query}」に一致する商品はありません
        </p>
      `));
      return;
    }

    const list = node(html`<div class="product-list"></div>`);
    matched.forEach((p) => list.append(productCard(p)));
    els.body.append(list);
  }

  /** The item on the shopping list for this product, if it is on it. */
  const listedItem = (productId) => store.get().items.find((i) => i.productId === productId) || null;

  function productCard(product) {
    const prices = store.currentPrices(product);
    const best = prices[0] || null;
    const bestStore = best ? store.getStore(best.storeId) : null;
    const size = formatSize(product.amount, product.unit);
    const up = best ? perItemPrice(best.price, product.amount, product.unit) : null;
    const listed = listedItem(product.id);

    /* Two layers, like the rows on the list screen: the panel underneath is
       what the swipe uncovers, the card on top is what moves. */
    const wrap = node(html`
      <article class="product-wrap ${listed ? "is-there" : ""}" style="--cat:${store.productColor(product)}">
        <div class="product-hint">
          ${listed ? icon("minus") : icon("plus")}<span>${listed ? "リストから外す" : "リストへ"}</span>
        </div>
      </article>
    `);

    /* Being on the shopping list is shown by painting the card's left edge,
       not by a control. A checkbox here looked exactly like the list screen's
       「買った」 checkbox one tab over, and the two mean opposite things —
       so this one stopped being a button and became a mark. Putting it on
       or taking it off is the swipe's job. */
    const card = node(html`
      <div class="product ${listed ? "is-listed" : ""}">
        <span class="product-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="product-main js-open">
          <span class="product-name">${product.name}</span>
          ${listed ? html`<span class="sr-only">買うものリストに入っています</span>` : ""}
          <span class="product-meta">
            ${size ? html`<span class="badge badge-cat">${size}</span>` : ""}
            ${prices.length
              ? html`<span>${prices.length}店舗で比較中</span>`
              : html`<span style="color:var(--c-text-3)">値段は未登録</span>`}
            ${up ? html`<span style="color:var(--c-text-3)">${up.text}</span>` : ""}
          </span>
        </button>
        <span class="item-price">
          ${best && bestStore
            ? html`
                <span class="item-price-amount">${yen(best.price)}</span>
                <span class="item-price-store">🏆 ${bestStore.name}</span>
              `
            : html`<span class="item-price-none">—</span>`}
        </span>
      </div>
    `);
    wrap.append(card);

    card.querySelector(".js-open").addEventListener("click", () => KN.productSheet.open(product.id));
    attachListSwipe(wrap, card, product);
    return wrap;
  }

  /** Put this product on the shopping list, or take it off. */
  function toggleListed(product) {
    const item = listedItem(product.id);
    haptic(14);
    if (!item) {
      store.addItem(product.id);
      KN.ui.toast(`「${product.name}」をリストに追加しました`);
      return;
    }
    const at = store.get().items.indexOf(item);
    store.update((s) => { s.items = s.items.filter((i) => i.id !== item.id); });
    KN.ui.toast(`「${product.name}」をリストから外しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => {
          const next = s.items.slice();
          next.splice(Math.max(0, Math.min(at, next.length)), 0, item);
          s.items = next;
        }),
      },
    });
  }

  /* ---------------- swipe right to put it on the list, or take it off ---------------- */

  /* Rightwards, and it springs straight back — nothing stays open, because
     there is no second step to confirm. The pull is deliberately heavy past
     the trigger so the card tells you when it has gone far enough. The same
     swipe undoes itself: on a product already on the list it takes it off,
     which is what the panel underneath says it will do. */
  function attachListSwipe(wrap, card, product) {
    const TRIGGER = 68;
    const MAX = 104;
    const SLOP = 14;
    const DOMINANCE = 1.6;
    let startX = 0, startY = 0, dx = 0;
    let dragging = false, decided = false, pointerId = null, swallowClick = false;
    let armed = false, pending = null, rafId = 0;

    const paint = () => {
      rafId = 0;
      if (pending === null) return;
      card.style.transform = `translate3d(${pending}px, 0, 0)`;
    };
    const schedule = (v) => {
      pending = v;
      if (!rafId) rafId = requestAnimationFrame(paint);
    };

    card.addEventListener("touchmove", (e) => { if (dragging) e.preventDefault(); }, { passive: false });

    card.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = false;
      decided = false;
      armed = false;
    });

    card.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pointerId) return;
      const mx = e.clientX - startX;
      const my = e.clientY - startY;

      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
        decided = true;
        dragging = mx >= SLOP && mx > Math.abs(my) * DOMINANCE;
        if (!dragging) return;
        card.setPointerCapture(pointerId);
        card.style.transition = "none";
        wrap.classList.add("is-swiping");
      }
      if (!dragging) return;

      // Past the trigger the card only creeps, so the finger feels the edge.
      dx = mx <= TRIGGER ? mx : TRIGGER + (mx - TRIGGER) * 0.32;
      dx = Math.min(MAX, dx);
      const nowArmed = dx >= TRIGGER;
      if (nowArmed !== armed) {
        armed = nowArmed;
        wrap.classList.toggle("is-armed", armed);
        if (armed) haptic(10);
      }
      schedule(dx);
    });

    const finish = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      if (!dragging) return;

      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      pending = null;
      card.style.transition = "";
      card.style.transform = "";
      const fired = armed;
      dragging = false;
      armed = false;
      swallowClick = true;
      // Let the card glide home before the store change rebuilds the list;
      // committing on the spot would swap it out mid-flight.
      setTimeout(() => {
        wrap.classList.remove("is-swiping", "is-armed");
        if (fired) toggleListed(product);
      }, 200);
    };
    card.addEventListener("pointerup", finish);
    card.addEventListener("pointercancel", finish);

    // A pointer sequence still fires a click afterwards; left alone it would
    // open the product sheet at the end of every swipe.
    card.addEventListener("click", (e) => {
      if (!swallowClick) return;
      swallowClick = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  }

  KN.screens = KN.screens || {};
  KN.screens.prices = { mount, render };
})();
