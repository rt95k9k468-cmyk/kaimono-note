/* =========================================================
   かいものノート — shopping list screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, frag, icon, yen, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let categoryFilter = null;   // categoryId or null = all
  let acIndex = -1;            // active autocomplete row
  let acMatches = [];
  let openWrap = null;         // the one row currently swiped open, if any

  /* ---------------- mount (static chrome) ---------------- */

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">買い物リスト</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-clear" aria-label="購入済みをまとめて削除" title="購入済みをまとめて削除">
              ${icon("trash")}
            </button>
          </div>
        </header>

        <div class="progress-wrap js-progress-wrap" hidden>
          <div class="progress"><div class="progress-bar js-progress" style="width:0%"></div></div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>

        <!-- Last in the stack, and pinned to the bottom by CSS. Adding an item
             is the one thing done one-handed while walking a shop aisle, and
             the top of a large phone is out of a thumb's reach. -->
        <div class="quick-add">
          <form class="quick-add-bar js-form">
            ${icon("cart")}
            <input class="quick-add-input js-input" placeholder="商品を追加（例：食器用洗剤）"
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   aria-label="商品を追加" aria-autocomplete="list">
            <button class="quick-add-btn js-add" type="submit" aria-label="追加" disabled>${icon("plus")}</button>
          </form>
          <div class="js-ac"></div>
        </div>
      </div>
    `);

    root.append(chrome);

    els = {
      sub:        chrome.querySelector(".js-sub"),
      clear:      chrome.querySelector(".js-clear"),
      form:       chrome.querySelector(".js-form"),
      input:      chrome.querySelector(".js-input"),
      addBtn:     chrome.querySelector(".js-add"),
      ac:         chrome.querySelector(".js-ac"),
      progWrap:   chrome.querySelector(".js-progress-wrap"),
      progress:   chrome.querySelector(".js-progress"),
      filter:     chrome.querySelector(".js-filter"),
      body:       chrome.querySelector(".js-body"),
      topbar:     chrome.querySelector(".topbar"),
    };

    wireQuickAdd();
    wireKeyboardDismiss();

    els.clear.addEventListener("click", clearChecked);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- dismissing the keyboard ---------------- */

  /* On a phone the keyboard covers half the screen and, left to itself, stays
     up until something else takes focus. Two ways out, both of which people
     already expect: touch anywhere that is not the add bar, or flick the list
     downwards the way the keyboard would go.

     A touch cannot be seen while it is on the keyboard itself — that belongs to
     the OS, not the page — so the downward flick is read from the list area. */
  function wireKeyboardDismiss() {
    const typing = () => document.activeElement === els.input;
    const inAddBar = (t) => !!(t && t.closest && t.closest(".quick-add"));

    document.addEventListener("pointerdown", (e) => {
      if (!typing() || inAddBar(e.target)) return;
      els.input.blur();
    }, true);

    let downY = null;
    root.addEventListener("pointerdown", (e) => {
      downY = inAddBar(e.target) ? null : e.clientY;
    }, true);
    root.addEventListener("pointermove", (e) => {
      if (downY === null || !typing()) return;
      if (e.clientY - downY > 40) {   // a deliberate downward flick
        els.input.blur();
        downY = null;
      }
    }, true);
    root.addEventListener("pointerup", () => { downY = null; }, true);
  }

  /* ---------------- quick add + autocomplete ---------------- */

  function wireQuickAdd() {
    const { input, form, addBtn, ac } = els;

    input.addEventListener("input", () => {
      addBtn.disabled = !input.value.trim();
      renderAutocomplete();
    });

    input.addEventListener("keydown", (e) => {
      if (!acMatches.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        acIndex = (acIndex + 1) % acMatches.length;
        paintActive();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        acIndex = acIndex <= 0 ? acMatches.length - 1 : acIndex - 1;
        paintActive();
      } else if (e.key === "Escape") {
        closeAutocomplete();
      }
    });

    input.addEventListener("blur", () => setTimeout(closeAutocomplete, 140));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const picked = acIndex >= 0 ? acMatches[acIndex] : null;
      if (picked && picked.product) {
        addExisting(picked.product);
      } else {
        addByName(input.value);
      }
    });
  }

  function renderAutocomplete() {
    const typed = els.input.value.trim();
    const q = KN.util.foldKana(typed);
    els.ac.innerHTML = "";
    acIndex = -1;
    acMatches = [];
    if (!q) return;

    const onList = new Set(store.get().items.map((i) => i.productId));
    // Matched on the folded name, so a single「え」already surfaces
    // 「エマール」— nobody switches to katakana just to search their own list.
    const found = store.get().products
      .map((p) => ({ p, key: KN.util.foldKana(p.name) }))
      .filter((r) => r.key.includes(q))
      .sort((a, b) => {
        const aStarts = a.key.startsWith(q) ? 0 : 1;
        const bStarts = b.key.startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.p.name.localeCompare(b.p.name, "ja");
      })
      .slice(0, 6)
      .map((r) => r.p);

    // Against what was actually typed, not the folded form — this decides
    // whether we are looking at an existing product or offering a new one.
    const exact = store.findProductByName(typed);
    acMatches = found.map((p) => ({ product: p }));
    if (!exact) acMatches.push({ product: null, name: typed });
    if (!acMatches.length) return;

    const box = node(html`<div class="ac" role="listbox"></div>`);

    acMatches.forEach((m, idx) => {
      let row;
      if (m.product) {
        const cat = store.getCategory(m.product.categoryId);
        const best = store.bestPrice(m.product);
        const bestStore = best ? store.getStore(best.storeId) : null;
        row = node(html`
          <button type="button" class="ac-item" role="option" data-idx="${String(idx)}">
            <span class="ac-emoji">${cat.emoji}</span>
            <span class="ac-main">
              <span class="ac-name">${m.product.name}</span>
              <span class="ac-sub">
                ${best && bestStore ? html`${bestStore.name} ${yen(best.price)} が最安` : "価格の記録なし"}
                ${onList.has(m.product.id) ? html` ・<b>リストにあります</b>` : ""}
              </span>
            </span>
          </button>
        `);
      } else {
        row = node(html`
          <button type="button" class="ac-item" role="option" data-idx="${String(idx)}">
            <span class="ac-emoji">✨</span>
            <span class="ac-main">
              <span class="ac-name ac-new">「${m.name}」を新しく追加</span>
              <span class="ac-sub">カテゴリは自動で振り分けます</span>
            </span>
          </button>
        `);
      }

      row.addEventListener("mousedown", (e) => e.preventDefault());
      row.addEventListener("click", () => {
        if (m.product) addExisting(m.product);
        else addByName(m.name);
      });
      box.append(row);
    });

    els.ac.append(box);
  }

  function paintActive() {
    els.ac.querySelectorAll(".ac-item").forEach((r, i) => {
      r.classList.toggle("is-active", i === acIndex);
    });
  }

  function closeAutocomplete() {
    els.ac.innerHTML = "";
    acIndex = -1;
    acMatches = [];
  }

  function resetInput() {
    els.input.value = "";
    els.addBtn.disabled = true;
    closeAutocomplete();
    els.input.focus();
  }

  function addExisting(product) {
    const already = store.get().items.find((i) => i.productId === product.id && !i.checked);
    if (already) {
      // `already` points at the live record, so read the new quantity back
      // after the update rather than adding one to a value that already moved.
      store.update((s) => {
        const rec = s.items.find((i) => i.id === already.id);
        if (rec) rec.qty += 1;
      });
      const updated = store.get().items.find((i) => i.id === already.id);
      KN.ui.toast(`${product.name} を ${updated ? updated.qty : already.qty} 個にしました`);
    } else {
      store.addItem(product.id);
    }
    haptic(10);
    resetInput();
  }

  function addByName(rawName) {
    const name = String(rawName).trim();
    if (!name) return;

    const existing = store.findProductByName(name);
    if (existing) { addExisting(existing); return; }

    const product = store.addProduct({ name, categoryId: store.guessCategory(name) });
    store.addItem(product.id);
    haptic(10);
    resetInput();

    const cat = store.getCategory(product.categoryId);
    KN.ui.toast(`${cat.emoji} ${cat.name} に追加しました`, {
      action: {
        label: "編集",
        onClick: () => {
          const item = store.get().items.find((i) => i.productId === product.id);
          KN.productSheet.open(product.id, { itemId: item && item.id });
        },
      },
    });
  }

  /* ---------------- clear checked ---------------- */

  async function clearChecked() {
    const checked = store.get().items.filter((i) => i.checked);
    if (!checked.length) { KN.ui.toast("購入済みの商品はありません"); return; }

    const ok = await KN.ui.confirm({
      title: "購入済みを削除",
      message: `${checked.length}件の購入済み商品をリストから消します。商品と価格の記録は残ります。`,
      okLabel: "削除する",
      danger: true,
    });
    if (!ok) return;

    store.update((s) => { s.items = s.items.filter((i) => !i.checked); });
    KN.ui.toast(`${checked.length}件を削除しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => { s.items = [...checked, ...s.items]; }),
      },
    });
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const items = st.items;

    // Once anything is starred the header tracks that trip rather than the whole
    // list, so it agrees with the tab badge instead of quoting a second number.
    const scope = items.some((i) => i.fav) ? items.filter((i) => i.fav) : items;
    const done = scope.filter((i) => i.checked).length;
    const label = scope === items ? "" : "今回買うもの ";

    // 「N件中M件購入済み」rather than「N件・M件購入済み」: the section heading
    // below counts what is left, and two different numbers under the same
    // wording read as a contradiction.
    els.sub.textContent = items.length
      ? (scope.length ? `${label}${scope.length}件中 ${done}件購入済み` : "今回買うものは未選択です")
      : "リストは空です";

    els.progWrap.hidden = scope.length === 0;
    els.progress.style.width = scope.length ? `${(done / scope.length) * 100}%` : "0%";

    renderFilter(items);
    renderBody(items);
  }

  function renderFilter(items) {
    els.filter.innerHTML = "";
    const counts = new Map();
    items.filter((i) => !i.checked).forEach((i) => {
      const p = store.getProduct(i.productId);
      if (!p) return;
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });

    if (counts.size < 2) { categoryFilter = null; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const row = node(html`<div class="chip-row"></div>`);

    const all = node(html`
      <button type="button" class="chip" aria-pressed="${String(!categoryFilter)}">すべて</button>
    `);
    all.addEventListener("click", () => { categoryFilter = null; render(); });
    row.append(all);

    store.sortedCategories()
      .filter((c) => counts.has(c.id))
      .forEach((c) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(categoryFilter === c.id)}">
            <span class="chip-emoji">${c.emoji}</span>${c.name}
            <span class="chip-count">${counts.get(c.id)}</span>
          </button>
        `);
        chip.addEventListener("click", () => {
          categoryFilter = categoryFilter === c.id ? null : c.id;
          haptic();
          render();
        });
        row.append(chip);
      });

    els.filter.append(row);
  }

  function renderBody(items) {
    // Rows are rebuilt from scratch, so any remembered open row is now detached.
    openWrap = null;
    els.body.innerHTML = "";

    if (!items.length) {
      els.body.append(emptyState());
      return;
    }

    const active = items.filter((i) => !i.checked);
    const checked = items.filter((i) => i.checked);
    const trip = active.filter((i) => i.fav);

    if (!trip.length) {
      // Nothing starred yet: one plain list with one total, as before. Splitting
      // the screen the moment favourites exist as a concept would leave anyone
      // not using them staring at an empty「今回買うもの」and a — total.
      const shown = appendGroups(active);
      if (!shown && categoryFilter) els.body.append(noneInCategory());
      if (checked.length) els.body.append(checkedSection(checked));
      els.body.append(summaryCard(active));
      els.body.append(insightsCard(active));
      return;
    }

    const rest = active.filter((i) => !i.fav);

    els.body.append(sectionHead("今回買うもの", trip.length, "trip"));
    const tripShown = appendGroups(trip);
    if (!tripShown && categoryFilter) els.body.append(noneInCategory());
    // The total belongs to the trip, so it sits directly under it — everything
    // below this line is explicitly not being bought today.
    els.body.append(summaryCard(trip, { trip: true }));
    els.body.append(insightsCard(trip));

    if (rest.length) {
      els.body.append(sectionHead("そのほか", rest.length, "rest"));
      appendGroups(rest);
    }

    if (checked.length) els.body.append(checkedSection(checked));
  }

  /** Renders category groups for the given items. Returns whether anything showed. */
  function appendGroups(list) {
    const groups = new Map();
    list.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (!p) return;
      if (categoryFilter && p.categoryId !== categoryFilter) return;
      if (!groups.has(p.categoryId)) groups.set(p.categoryId, []);
      groups.get(p.categoryId).push({ item, product: p });
    });

    store.sortedCategories().forEach((cat) => {
      const entries = groups.get(cat.id);
      if (!entries || !entries.length) return;

      const group = node(html`
        <section class="cat-group">
          <h2 class="cat-head">
            <span class="cat-head-emoji">${cat.emoji}</span>${cat.name}
            <span class="cat-head-count">${entries.length}</span>
          </h2>
          <div class="item-list"></div>
        </section>
      `);
      const listEl = group.querySelector(".item-list");
      entries.forEach(({ item, product }) => listEl.append(itemRow(item, product)));
      els.body.append(group);
    });

    return groups.size > 0;
  }

  function sectionHead(label, count, kind) {
    return node(html`
      <h2 class="trip-head trip-head-${kind}">
        ${kind === "trip" ? icon("star") : ""}
        <span>${label}</span>
        <span class="cat-head-count">${count}</span>
      </h2>
    `);
  }

  function noneInCategory() {
    return node(html`
      <p style="text-align:center;color:var(--c-text-3);padding:32px 16px">
        このカテゴリに未購入の商品はありません
      </p>
    `);
  }

  function itemRow(item, product) {
    const best = store.bestPrice(product);
    const bestStore = best ? store.getStore(best.storeId) : null;

    const wrap = node(html`
      <article class="item-wrap">
        <div class="item-actions">
          <button class="item-del" tabindex="-1" aria-label="${product.name} をリストから削除">削除</button>
        </div>
      </article>
    `);

    const row = node(html`
      <div class="item ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <button class="item-body">
          <span class="item-name-row">
            <span class="item-name">${product.name}</span>
            ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          </span>
          <span class="item-meta">
            ${item.memo ? html`<span class="item-memo">${item.memo}</span>` : ""}
          </span>
        </button>
        <div class="item-price"></div>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
      </div>
    `);
    wrap.append(row);

    const priceBox = row.querySelector(".item-price");
    if (best && bestStore) {
      priceBox.append(frag(html`
        <span class="item-price-amount">${yen(best.price * item.qty)}</span>
        <span class="item-price-store">🏆 ${bestStore.name}</span>
      `));
    } else {
      priceBox.append(node(html`<span class="item-price-none">値段は未登録</span>`));
    }

    row.querySelector(".check").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) {
          rec.checked = !rec.checked;
          rec.checkedAt = rec.checked ? KN.util.today() : null;
        }
      });
      haptic(12);
    });

    row.querySelector(".fav").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) rec.fav = !rec.fav;
      });
      haptic(12);
    });

    row.querySelector(".item-body").addEventListener("click", () => {
      KN.productSheet.open(product.id, { itemId: item.id });
    });

    wrap.querySelector(".item-del").addEventListener("click", () => {
      const removed = store.get().items.find((i) => i.id === item.id);
      const at = store.get().items.indexOf(removed);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== item.id); });
      haptic(12);
      // Deleting straight from a swipe is the platform convention, so the safety
      // net is an undo rather than a dialog standing between every removal.
      KN.ui.toast(`「${product.name}」を削除しました`, {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => {
            const next = s.items.slice();
            next.splice(Math.max(0, Math.min(at, next.length)), 0, removed);
            s.items = next;
          }),
        },
      });
    });

    attachSwipe(wrap, row);
    return wrap;
  }

  /* ---------------- swipe to reveal delete ---------------- */

  // Only one row may sit open; a second one opening closes the first.
  function closeOpenRow() {
    if (openWrap) {
      openWrap.classList.remove("is-open");
      holdPanelDuringClose(openWrap);
    }
    openWrap = null;
  }

  /* The row slides back over 0.22s. Hiding the panel the instant the class goes
     would leave a bare strip of background trailing the row for that moment, so
     keep it on screen until the row has finished covering it again. */
  function holdPanelDuringClose(wrap) {
    const row = wrap.querySelector(".item");
    if (!row) return;
    wrap.classList.add("is-closing");
    const done = () => wrap.classList.remove("is-closing");
    row.addEventListener("transitionend", done, { once: true });
    // A transition that never runs (already at rest) would otherwise strand it.
    // Comfortably longer than the slide, or the panel vanishes mid-flight.
    setTimeout(done, 900);
  }

  function attachSwipe(wrap, row) {
    const REVEAL = 88;      // width of the delete panel
    const SLOP = 14;        // travel before a drag counts as a drag and not a tap
    const DOMINANCE = 1.6;  // how much horizontal has to beat vertical by
    let startX = 0, startY = 0, dx = 0;
    let dragging = false, decided = false, pointerId = null, swallowClick = false;
    let pendingDx = null, rafId = 0;

    // Pointer moves arrive faster than the screen refreshes. Painting once per
    // frame instead of once per event keeps the row gliding rather than
    // stuttering under a quick finger.
    const paint = () => {
      rafId = 0;
      if (pendingDx === null) return;
      row.style.transform = `translate3d(${pendingDx}px, 0, 0)`;
    };
    const schedule = (v) => {
      pendingDx = v;
      if (!rafId) rafId = requestAnimationFrame(paint);
    };

    // touch-action keeps the list scrollable up to the moment a swipe is
    // recognised; from then on the browser has to be told to stop, or the list
    // scrolls under the finger while the row slides sideways.
    row.addEventListener("touchmove", (e) => {
      if (dragging) e.preventDefault();
    }, { passive: false });

    row.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = false;
      decided = false;
      // Deliberately touches no styles: a press that never becomes a swipe
      // should leave the row exactly as it was.
    });

    row.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pointerId) return;
      const mx = e.clientX - startX;
      const my = e.clientY - startY;

      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
        decided = true;
        // Has to be a clearly sideways movement, not a drifting scroll. A
        // diagonal belongs to the list, which stays scrollable throughout.
        // Rightwards only counts on an open row, where it means "put it back";
        // on a closed row there is nothing to the right to reach for.
        const isOpen = wrap.classList.contains("is-open");
        dragging = Math.abs(mx) >= SLOP
          && Math.abs(mx) > Math.abs(my) * DOMINANCE
          && (isOpen || mx < 0);
        if (!dragging) return;
        row.setPointerCapture(pointerId);
        row.style.transition = "none";
        wrap.classList.add("is-swiping");
        if (openWrap && openWrap !== wrap) closeOpenRow();
      }
      if (!dragging) return;

      const base = wrap.classList.contains("is-open") ? -REVEAL : 0;
      // Bounded by the panel at both ends. Going further left than the panel is
      // wide opened a strip of bare background beyond it — very visible on a
      // second swipe of an already-open row — and going right of 0 would show
      // the same on the other side.
      dx = Math.min(0, Math.max(-REVEAL, base + mx));
      schedule(dx);
    });

    const finish = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      if (!dragging) return;

      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      pendingDx = null;
      row.style.transition = "";
      row.style.transform = "";
      wrap.classList.remove("is-swiping");
      const open = dx < -REVEAL / 2;
      wrap.classList.toggle("is-open", open);
      if (!open) holdPanelDuringClose(wrap);
      openWrap = open ? wrap : (openWrap === wrap ? null : openWrap);
      dragging = false;
      // A pointer sequence still emits a click afterwards. Left alone it would
      // press whatever the finger lifted over, and — because the row is open by
      // then — immediately close the row the swipe just opened.
      swallowClick = true;
    };
    row.addEventListener("pointerup", finish);
    row.addEventListener("pointercancel", finish);

    row.addEventListener("click", (e) => {
      if (swallowClick) {
        swallowClick = false;
        e.stopPropagation();
        e.preventDefault();
        return;
      }
      // With the delete panel showing, a tap on the row means "put it back".
      if (wrap.classList.contains("is-open")) {
        e.stopPropagation();
        e.preventDefault();
        closeOpenRow();
      }
    }, true);
  }

  function checkedSection(checked) {
    const st = store.get();
    const open = st.settings.showChecked !== false;

    const section = node(html`
      <section class="cat-group">
        <button class="done-head" aria-expanded="${String(open)}">
          ${icon("chevron")} 購入済み <span class="cat-head-count">${checked.length}</span>
        </button>
        <div class="item-list js-done" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    const list = section.querySelector(".js-done");
    checked.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (p) list.append(itemRow(item, p));
    });

    section.querySelector(".done-head").addEventListener("click", () => {
      store.update((s) => { s.settings.showChecked = !open; });
    });

    return section;
  }

  function summaryCard(active, { trip = false } = {}) {
    let total = 0;
    let unknown = 0;

    active.forEach((item) => {
      const p = store.getProduct(item.productId);
      const best = p && store.bestPrice(p);
      if (best) total += best.price * item.qty;
      else unknown += 1;
    });

    if (!active.length) return document.createDocumentFragment();

    const scope = trip ? "今回買うもの" : "未購入";
    return node(html`
      <div class="list-summary">
        <div class="summary-row">
          <span class="summary-label">最安値で買うと</span>
          <span class="summary-total">${total > 0 ? yen(total) : "—"}</span>
        </div>
        <p class="summary-note">
          ${unknown > 0
            ? html`${unknown}品は値段が未登録です。商品をタップして登録すると合計に反映されます。`
            : html`${scope} ${active.length}品を、それぞれいちばん安いお店で買った場合の合計です。`}
        </p>
      </div>
    `);
  }

  /* Whatever the numbers happen to be worth saying out loud. Renders nothing
     at all when there is nothing to say, which is most of the time early on. */
  function insightsCard(items) {
    const found = KN.insights.forItems(items);
    if (!found.length) return document.createDocumentFragment();

    const card = node(html`
      <section class="insights">
        <h2 class="insights-head">${icon("sparkles")} 気づいたこと</h2>
        <div class="insights-list"></div>
      </section>
    `);
    const listEl = card.querySelector(".insights-list");
    found.forEach((f) => {
      listEl.append(node(html`
        <div class="insight">
          <span class="insight-ico">${f.icon}</span>
          <span class="insight-main">
            <span class="insight-title">${f.title}</span>
            <span class="insight-body">${f.body}</span>
          </span>
        </div>
      `));
    });
    return card;
  }

  function emptyState() {
    const wrap = node(html`
      <div class="empty">
        <div class="empty-art">🛒</div>
        <h2 class="empty-title">買うものを追加しましょう</h2>
        <p class="empty-text">
          下の欄に商品名を入れるだけ。カテゴリは自動で振り分けられ、
          お店ごとの値段を登録すると「どこが一番安いか」が分かります。
        </p>
        <button class="btn btn-soft js-sample" style="margin-top:8px">サンプルを入れて試す</button>
      </div>
    `);
    wrap.querySelector(".js-sample").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "サンプルを入れますか？",
        message: "3つのお店と7つの商品・価格が入ったサンプルデータを読み込みます。あとから設定画面で全部消せます。",
        okLabel: "入れる",
      });
      if (ok) { store.loadSample(); KN.ui.toast("サンプルを読み込みました"); }
    });
    return wrap;
  }

  KN.screens = KN.screens || {};
  KN.screens.list = { mount, render };
})();

/* =========================================================
   かいものノート — products & prices screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, unitPrice, formatSize, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let query = "";
  let categoryFilter = null;

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">商品と価格</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-new" aria-label="商品を追加" title="商品を追加"
                    style="background:var(--c-primary);color:#fff">${icon("plus")}</button>
          </div>
        </header>

        <div class="search-wrap">
          <div class="search-bar">
            ${icon("search")}
            <input class="search-input js-search" placeholder="商品名で探す" aria-label="商品名で探す"
                   autocomplete="off" spellcheck="false">
            <button class="icon-btn js-clear" aria-label="検索をクリア" style="width:28px;height:28px" hidden>
              ${icon("close")}
            </button>
          </div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    els = {
      sub:     chrome.querySelector(".js-sub"),
      search:  chrome.querySelector(".js-search"),
      clear:   chrome.querySelector(".js-clear"),
      newBtn:  chrome.querySelector(".js-new"),
      filter:  chrome.querySelector(".js-filter"),
      body:    chrome.querySelector(".js-body"),
      topbar:  chrome.querySelector(".topbar"),
    };

    els.search.addEventListener("input", () => {
      // Folded so this behaves like the list screen's suggestions:
      // 「え」finds「エマール」.
      query = KN.util.foldKana(els.search.value);
      els.clear.hidden = !query;
      renderBody();
    });

    els.clear.addEventListener("click", () => {
      query = "";
      els.search.value = "";
      els.clear.hidden = true;
      renderBody();
    });

    els.newBtn.addEventListener("click", createProduct);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  async function createProduct() {
    const name = await KN.ui.prompt({
      title: "商品を追加",
      label: "商品名",
      placeholder: "例：食器用洗剤",
      okLabel: "追加",
    });
    if (!name) return;

    const existing = store.findProductByName(name);
    if (existing) {
      KN.ui.toast("すでに登録されています");
      KN.productSheet.open(existing.id);
      return;
    }
    const p = store.addProduct({ name, categoryId: store.guessCategory(name) });
    haptic(10);
    KN.productSheet.open(p.id);
  }

  function render() {
    const st = store.get();
    els.sub.textContent = `${st.products.length}商品 ・ ${st.stores.length}店舗`;
    renderFilter();
    renderBody();
  }

  function renderFilter() {
    els.filter.innerHTML = "";
    const counts = new Map();
    store.get().products.forEach((p) => {
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });
    if (counts.size < 2) { categoryFilter = null; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const row = node(html`<div class="chip-row"></div>`);
    const all = node(html`<button type="button" class="chip" aria-pressed="${String(!categoryFilter)}">すべて</button>`);
    all.addEventListener("click", () => { categoryFilter = null; renderFilter(); renderBody(); });
    row.append(all);

    store.sortedCategories().filter((c) => counts.has(c.id)).forEach((c) => {
      const chip = node(html`
        <button type="button" class="chip" aria-pressed="${String(categoryFilter === c.id)}">
          <span class="chip-emoji">${c.emoji}</span>${c.name}
          <span class="chip-count">${counts.get(c.id)}</span>
        </button>
      `);
      chip.addEventListener("click", () => {
        categoryFilter = categoryFilter === c.id ? null : c.id;
        haptic();
        renderFilter();
        renderBody();
      });
      row.append(chip);
    });

    els.filter.append(row);
  }

  function renderBody() {
    els.body.innerHTML = "";
    const all = store.get().products;

    if (!all.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">🏷️</div>
          <h2 class="empty-title">商品がまだありません</h2>
          <p class="empty-text">
            買い物リストに追加した商品はここに自動で並びます。
            お店ごとの値段を登録すると、いちばん安いお店が分かります。
          </p>
        </div>
      `));
      return;
    }

    const matched = all
      .filter((p) => !categoryFilter || p.categoryId === categoryFilter)
      .filter((p) => !query || KN.util.foldKana(p.name).includes(query))
      .sort((a, b) => a.name.localeCompare(b.name, "ja"));

    if (!matched.length) {
      els.body.append(node(html`
        <p style="text-align:center;color:var(--c-text-3);padding:40px 16px">
          「${query}」に一致する商品はありません
        </p>
      `));
      return;
    }

    const list = node(html`<div class="product-list"></div>`);
    matched.forEach((p) => list.append(productCard(p)));
    els.body.append(list);
  }

  function productCard(product) {
    const cat = store.getCategory(product.categoryId);
    const prices = store.currentPrices(product);
    const best = prices[0] || null;
    const bestStore = best ? store.getStore(best.storeId) : null;
    const size = formatSize(product.amount, product.unit);
    const up = best ? unitPrice(best.price, best.amount || product.amount, product.unit) : null;

    const card = node(html`
      <button class="product">
        <span class="product-emoji">${cat.emoji}</span>
        <span class="product-main">
          <span class="product-name">${product.name}</span>
          <span class="product-meta">
            ${size ? html`<span class="badge badge-cat">${size}</span>` : ""}
            ${prices.length
              ? html`<span>${prices.length}店舗で比較中</span>`
              : html`<span style="color:var(--c-text-3)">値段は未登録</span>`}
            ${up ? html`<span style="color:var(--c-text-3)">${up.text}</span>` : ""}
          </span>
        </span>
        <span class="item-price">
          ${best && bestStore
            ? html`
                <span class="item-price-amount">${yen(best.price)}</span>
                <span class="item-price-store">🏆 ${bestStore.name}</span>
              `
            : html`<span class="item-price-none">—</span>`}
        </span>
      </button>
    `);

    card.addEventListener("click", () => KN.productSheet.open(product.id));
    return card;
  }

  KN.screens = KN.screens || {};
  KN.screens.prices = { mount, render };
})();

/* ---- js/screen-compare.js ---- */
/* =========================================================
   かいものノート — store comparison screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">お店くらべ</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
          </div>
        </header>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);
    els = {
      sub:    chrome.querySelector(".js-sub"),
      body:   chrome.querySelector(".js-body"),
      topbar: chrome.querySelector(".topbar"),
    };

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- computation ---------------- */

  /** Items still to buy (falls back to the whole list once everything is checked). */
  function targetItems() {
    const items = store.get().items;
    const active = items.filter((i) => !i.checked);
    return active.length ? active : items;
  }

  function analyse() {
    const entries = targetItems()
      .map((item) => ({ item, product: store.getProduct(item.productId) }))
      .filter((e) => e.product);

    // Only items with at least one recorded price can take part in a comparison.
    const priced = entries.filter((e) => store.bestPrice(e.product));
    const unpriced = entries.length - priced.length;

    // Cheapest achievable: every item bought at its own cheapest store.
    const combo = [];
    let comboTotal = 0;
    priced.forEach(({ item, product }) => {
      const best = store.bestPrice(product);
      const st = store.getStore(best.storeId);
      const line = best.price * item.qty;
      comboTotal += line;
      combo.push({ product, item, store: st, price: best.price, line });
    });
    combo.sort((a, b) => b.line - a.line);

    /* Per-store figures over the SAME basket, so the totals are comparable:
       buy what the store carries there, and anything it lacks at its own
       cheapest store. `anchored` is therefore a realistic trip total. */
    const rankings = store.sortedStores().map((st) => {
      let ownTotal = 0;
      let anchored = 0;
      let covered = 0;
      const missing = [];

      priced.forEach(({ item, product }) => {
        const here = store.priceAt(product, st.id);
        if (here) {
          ownTotal += here.price * item.qty;
          anchored += here.price * item.qty;
          covered += 1;
        } else {
          const best = store.bestPrice(product);
          anchored += best.price * item.qty;
          missing.push({ product, item, best });
        }
      });

      return {
        store: st,
        ownTotal,
        anchored,
        covered,
        missing,
        full: priced.length > 0 && covered === priced.length,
        ratio: priced.length ? covered / priced.length : 0,
      };
    }).filter((r) => r.covered > 0);

    rankings.sort((a, b) => a.anchored - b.anchored || b.covered - a.covered);

    // Cheapest store that carries the whole basket on its own, if one exists.
    const fullCover = rankings.filter((r) => r.full).sort((a, b) => a.ownTotal - b.ownTotal);
    const bestSingle = fullCover.length ? fullCover[0] : null;

    return {
      entries, priced, unpriced, rankings, combo, comboTotal, bestSingle,
      storeCount: new Set(combo.map((c) => c.store && c.store.id)).size,
    };
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const data = analyse();

    els.sub.textContent = data.entries.length
      ? `未購入 ${data.entries.length}品で比較`
      : "リストが空です";

    els.body.innerHTML = "";

    if (!data.entries.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">⚖️</div>
          <h2 class="empty-title">リストに商品を追加すると比べられます</h2>
          <p class="empty-text">
            買い物リストの商品それぞれに、お店ごとの値段を登録してください。
            合計でどのお店が安いかを自動で計算します。
          </p>
        </div>
      `));
      return;
    }

    if (!st.stores.length || !data.combo.length) {
      els.body.append(node(html`
        <div class="empty">
          <div class="empty-art">🏪</div>
          <h2 class="empty-title">まだ値段の記録がありません</h2>
          <p class="empty-text">
            「商品と価格」から、お店ごとの値段を登録してみてください。
            2店舗以上あると、合計でどちらが安いかが分かります。
          </p>
        </div>
      `));
      return;
    }

    els.body.append(hero(data));
    els.body.append(rankingSection(data));
    els.body.append(comboSection(data));
  }

  function hero(data) {
    const saving = data.bestSingle ? data.bestSingle.ownTotal - data.comboTotal : 0;

    return node(html`
      <div class="compare-hero">
        <span class="hero-label">最安の組み合わせで買うと</span>
        <span class="hero-total">${yen(data.comboTotal)}</span>
        <span class="hero-note">
          ${data.combo.length}品を、それぞれいちばん安いお店で買った合計
          ${data.storeCount > 1 ? html`（${data.storeCount}店をまわった場合）` : ""}
          ${data.unpriced > 0 ? html`<br>※ ${data.unpriced}品は値段が未登録のため含みません` : ""}
        </span>
        ${saving > 0
          ? html`<span class="hero-save">${data.bestSingle.store.name}だけで買うより ${yen(saving)} おトク</span>`
          : ""}
      </div>
    `);
  }

  function rankingSection(data) {
    const section = node(html`
      <section class="section" style="padding-top:0">
        <h2 class="section-title">この店を中心に買うと</h2>
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6;margin:-4px 0 4px">
          同じ${data.priced.length}品を、その店にある物はその店で、ない物は最安の店で買った場合の合計です。
        </p>
        <div class="store-rank"></div>
      </section>
    `);
    const list = section.querySelector(".store-rank");

    data.rankings.forEach((r, idx) => {
      const card = node(html`
        <button class="rank-card ${idx === 0 ? "is-first" : ""}">
          <span class="rank-no">${idx + 1}</span>
          <span class="rank-main">
            <span class="rank-name">
              <span class="dot" style="background:${r.store.color}"></span>${r.store.name}
            </span>
            <span class="rank-cover">
              <span class="cover-bar"><span class="cover-fill" style="width:${String(Math.round(r.ratio * 100))}%"></span></span>
              ${r.full
                ? html`<b style="color:var(--c-primary)">全品そろう</b>`
                : html`${r.covered}/${data.priced.length}品`}
            </span>
          </span>
          <span class="rank-total">
            <span class="rank-amount">${yen(r.anchored)}</span>
            <span class="rank-sub">${r.full ? "この店だけで" : `${r.missing.length}品は他店で`}</span>
          </span>
        </button>
      `);
      card.addEventListener("click", () => openStoreDetail(r, data));
      list.append(card);
    });

    if (data.rankings.length < 2) {
      section.append(node(html`
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6">
          お店をもう1つ登録すると、合計金額を比べられるようになります。
        </p>
      `));
    }

    return section;
  }

  function openStoreDetail(rank, data) {
    const lines = data.priced
      .map(({ item, product }) => ({
        product, item,
        pr: store.priceAt(product, rank.store.id),
      }))
      .sort((a, b) => (a.pr ? 0 : 1) - (b.pr ? 0 : 1));

    const body = node(html`<div class="stack" style="gap:14px"></div>`);

    body.append(node(html`
      <div class="stack" style="gap:6px">
        <div class="spread">
          <span class="summary-label">この店で買える分</span>
          <span class="summary-total">${yen(rank.ownTotal)}</span>
        </div>
        ${rank.full
          ? html`<p style="font-size:12px;color:var(--c-text-2)">リストの品はすべてこの店でそろいます。</p>`
          : html`
              <div class="spread">
                <span class="summary-label">残り${rank.missing.length}品を最安店で買うと</span>
                <span style="font-weight:800">＋${yen(rank.anchored - rank.ownTotal)}</span>
              </div>
              <div class="divider" style="margin:4px 0"></div>
              <div class="spread">
                <span class="summary-label">合計</span>
                <span class="summary-total">${yen(rank.anchored)}</span>
              </div>
            `}
      </div>
    `));

    const list = node(html`<div class="combo-list"></div>`);
    lines.forEach(({ item, product, pr }) => {
      const best = store.bestPrice(product);
      const isCheapestHere = pr && best && pr.price <= best.price;
      const bestStore = best ? store.getStore(best.storeId) : null;
      list.append(node(html`
        <div class="combo-row">
          <span class="combo-name">${product.name}${item.qty > 1 ? html` <span style="color:var(--c-text-3)">×${item.qty}</span>` : ""}</span>
          ${pr
            ? html`
                ${isCheapestHere ? html`<span class="crown">🏆</span>` : ""}
                <span class="combo-price">${yen(pr.price * item.qty)}</span>
              `
            : html`
                <span class="combo-store" style="color:var(--c-text-3)">
                  取扱なし → ${bestStore ? bestStore.name : ""}
                </span>
                <span class="combo-price" style="color:var(--c-text-3)">${yen(best.price * item.qty)}</span>
              `}
        </div>
      `));
    });
    body.append(list);

    KN.ui.sheet({ title: rank.store.name, content: body });
  }

  function comboSection(data) {
    const section = node(html`
      <section class="section">
        <h2 class="section-title">商品ごとの最安店</h2>
        <div class="combo-list"></div>
      </section>
    `);
    const list = section.querySelector(".combo-list");

    data.combo.forEach(({ product, item, store: st, line }) => {
      const row = node(html`
        <button class="combo-row" style="text-align:left;width:100%">
          <span class="combo-name">${product.name}${item.qty > 1 ? html` <span style="color:var(--c-text-3)">×${item.qty}</span>` : ""}</span>
          <span class="combo-store">
            <span class="dot" style="background:${st.color};display:inline-block;margin-right:4px"></span>${st.name}
          </span>
          <span class="combo-price">${yen(line)}</span>
        </button>
      `);
      row.addEventListener("click", () => KN.productSheet.open(product.id, { itemId: item.id }));
      list.append(row);
    });

    return section;
  }

  KN.screens = KN.screens || {};
  KN.screens.compare = { mount, render };
})();

(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, haptic, formatDate } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};

  function mount(el) {

    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <h1 class="topbar-title">設定</h1>
          </div>
        </header>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);
    els = { body: chrome.querySelector(".js-body"), topbar: chrome.querySelector(".topbar") };

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  function render() {
    els.body.innerHTML = "";
    els.body.append(themeGroup());
    els.body.append(storesGroup());
    els.body.append(categoriesGroup());
    els.body.append(dataGroup());
    els.body.append(aboutBlock());
  }

  /* ---------------- theme ---------------- */

  function themeGroup() {
    const current = store.get().settings.theme || "auto";
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">表示</h2>
        <div class="seg">
          <button class="seg-btn" data-theme="auto"  aria-pressed="${String(current === "auto")}">自動</button>
          <button class="seg-btn" data-theme="light" aria-pressed="${String(current === "light")}">ライト</button>
          <button class="seg-btn" data-theme="dark"  aria-pressed="${String(current === "dark")}">ダーク</button>
        </div>
      </section>
    `);

    wrap.querySelectorAll(".seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        store.update((s) => { s.settings.theme = theme; });
        KN.applyTheme(theme);
        haptic();
      });
    });
    return wrap;
  }

  /* ---------------- stores ---------------- */

  function storesGroup() {
    const stores = store.sortedStores();
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">お店 <span style="font-weight:600;color:var(--c-text-3)">${stores.length}件</span></h2>
        <div class="stack js-rows" style="gap:8px"></div>
        <button class="btn btn-soft btn-sm js-add">${icon("plus")} お店を追加</button>
      </section>
    `);

    const rows = wrap.querySelector(".js-rows");
    if (!stores.length) {
      rows.append(node(html`
        <p style="font-size:13px;color:var(--c-text-3);line-height:1.6">
          お店を登録すると、商品ごとに値段を記録して比べられます。
        </p>
      `));
    }

    stores.forEach((st) => {
      const usage = store.get().products.reduce(
        (n, p) => n + p.prices.filter((pr) => pr.storeId === st.id).length, 0
      );
      const row = node(html`
        <div class="manage-row">
          <span class="dot" style="background:${st.color};width:14px;height:14px"></span>
          <span class="manage-name">${st.name}</span>
          <span style="font-size:11px;color:var(--c-text-3);flex:none">${usage}件の価格</span>
          <button class="icon-btn js-edit" aria-label="編集">${icon("edit")}</button>
          <button class="icon-btn is-danger js-del" aria-label="削除">${icon("trash")}</button>
        </div>
      `);

      row.querySelector(".js-edit").addEventListener("click", () => editStore(st));
      row.querySelector(".js-del").addEventListener("click", async () => {
        const ok = await KN.ui.confirm({
          title: "お店を削除しますか？",
          message: `「${st.name}」と、この店で登録した${usage}件の価格が削除されます。`,
          okLabel: "削除する",
          danger: true,
        });
        if (!ok) return;
        store.update((s) => {
          s.stores = s.stores.filter((x) => x.id !== st.id);
          s.products.forEach((p) => { p.prices = p.prices.filter((pr) => pr.storeId !== st.id); });
        });
        KN.ui.toast("削除しました");
      });

      rows.append(row);
    });

    wrap.querySelector(".js-add").addEventListener("click", async () => {
      const name = await KN.ui.prompt({ title: "お店を追加", label: "お店の名前", placeholder: "例：イオン 〇〇店" });
      if (!name) return;
      if (store.findStoreByName(name)) { KN.ui.toast("同じ名前のお店があります"); return; }
      store.addStore(name);
      KN.ui.toast("追加しました");
    });

    return wrap;
  }

  function editStore(st) {
    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">お店の名前</span>
          <input class="input js-name" value="${st.name}">
        </label>
        <div class="field">
          <span class="field-label">色</span>
          <div class="swatches js-swatches"></div>
        </div>
      </div>
    `);

    let color = st.color;
    const sw = body.querySelector(".js-swatches");
    function paint() {
      sw.innerHTML = "";
      store.STORE_COLORS.forEach((c) => {
        const b = node(html`<button type="button" class="swatch" style="background:${c}" aria-pressed="${String(c === color)}" aria-label="色"></button>`);
        b.addEventListener("click", () => { color = c; paint(); });
        sw.append(b);
      });
    }
    paint();

    const foot = node(html`<button class="btn btn-primary btn-block">保存</button>`);
    const h = KN.ui.sheet({ title: "お店の編集", content: body, footer: foot });

    foot.addEventListener("click", () => {
      const name = body.querySelector(".js-name").value.trim();
      store.update((s) => {
        const rec = s.stores.find((x) => x.id === st.id);
        if (rec) { if (name) rec.name = name; rec.color = color; }
      });
      h.close();
      KN.ui.toast("保存しました");
    });
  }

  /* ---------------- categories ---------------- */

  function categoriesGroup() {
    const cats = store.sortedCategories();
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">カテゴリ <span style="font-weight:600;color:var(--c-text-3)">${cats.length}件</span></h2>
        <div class="stack js-rows" style="gap:8px"></div>
        <button class="btn btn-soft btn-sm js-add">${icon("plus")} カテゴリを追加</button>
      </section>
    `);

    const rows = wrap.querySelector(".js-rows");
    cats.forEach((c, idx) => {
      const used = store.get().products.filter((p) => p.categoryId === c.id).length;
      const row = node(html`
        <div class="manage-row">
          <span class="manage-emoji">${c.emoji}</span>
          <span class="manage-name">${c.name}</span>
          <span style="font-size:11px;color:var(--c-text-3);flex:none">${used}商品</span>
          <button class="icon-btn js-up" aria-label="上へ" ${idx === 0 ? KN.util.raw("disabled") : ""}
                  style="${idx === 0 ? "opacity:.3" : ""}">${icon("chevron", "rot-up")}</button>
          <button class="icon-btn js-edit" aria-label="編集">${icon("edit")}</button>
          ${c.id === store.OTHER_CATEGORY
            ? ""
            : html`<button class="icon-btn is-danger js-del" aria-label="削除">${icon("trash")}</button>`}
        </div>
      `);

      row.querySelector(".js-up").style.transform = "rotate(-90deg)";

      row.querySelector(".js-up").addEventListener("click", () => {
        if (idx === 0) return;
        const prev = cats[idx - 1];
        store.update((s) => {
          const a = s.categories.find((x) => x.id === c.id);
          const b = s.categories.find((x) => x.id === prev.id);
          if (a && b) { const t = a.order; a.order = b.order; b.order = t; }
        });
      });

      row.querySelector(".js-edit").addEventListener("click", () => editCategory(c));

      const del = row.querySelector(".js-del");
      if (del) {
        del.addEventListener("click", async () => {
          const ok = await KN.ui.confirm({
            title: "カテゴリを削除しますか？",
            message: used > 0
              ? `${used}件の商品は「その他」に移動します。`
              : "このカテゴリを削除します。",
            okLabel: "削除する",
            danger: true,
          });
          if (!ok) return;
          store.update((s) => {
            s.categories = s.categories.filter((x) => x.id !== c.id);
            s.products.forEach((p) => {
              if (p.categoryId === c.id) p.categoryId = store.OTHER_CATEGORY;
            });
          });
          KN.ui.toast("削除しました");
        });
      }

      rows.append(row);
    });

    wrap.querySelector(".js-add").addEventListener("click", () => editCategory(null));
    return wrap;
  }

  function editCategory(cat) {
    const body = node(html`
      <div class="stack" style="gap:18px">
        <label class="field">
          <span class="field-label">名前</span>
          <input class="input js-name" value="${cat ? cat.name : ""}" placeholder="例：おやつ">
        </label>
        <label class="field">
          <span class="field-label">絵文字（1文字）</span>
          <input class="input js-emoji" value="${cat ? cat.emoji : ""}" placeholder="🍪" maxlength="4" style="width:100px;text-align:center;font-size:24px">
        </label>
      </div>
    `);

    const foot = node(html`<button class="btn btn-primary btn-block">${cat ? "保存" : "追加"}</button>`);
    const h = KN.ui.sheet({ title: cat ? "カテゴリの編集" : "カテゴリを追加", content: body, footer: foot });

    foot.addEventListener("click", () => {
      const name = body.querySelector(".js-name").value.trim();
      const emoji = body.querySelector(".js-emoji").value.trim() || "🏷️";
      if (!name) { KN.ui.toast("名前を入力してください"); return; }

      store.update((s) => {
        if (cat) {
          const rec = s.categories.find((x) => x.id === cat.id);
          if (rec) { rec.name = name; rec.emoji = emoji; }
        } else {
          s.categories.push({
            id: KN.util.uid("c"), name, emoji,
            order: Math.max(-1, ...s.categories.map((x) => x.order ?? 0)) + 1,
          });
        }
      });
      h.close();
      KN.ui.toast(cat ? "保存しました" : "追加しました");
    });
  }

  /* ---------------- data ---------------- */

  function exportSub(st) {
    const last = KN.backup.lastExportAt();
    const size = `${st.products.length}商品・${st.stores.length}店舗`;
    if (!last) return `${size}をJSONで書き出します`;
    return `${size}／前回 ${formatDate(last)}`;
  }

  /** Several snapshots can land on one day (削除前, 復元前…), so the clock
      time is what actually tells them apart when recovering from a slip. */
  function snapStamp(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${formatDate(iso)} ${hh}:${mm}`;
  }

  function snapshotSub() {
    const snaps = KN.backup.list();
    if (!snaps.length) return "アプリ内に自動保存された控えはまだありません";
    return `${snaps.length}件・最新 ${snapStamp(snaps[0].at)}`;
  }

  /** Pick one of the app's own rolling snapshots and roll back to it. */
  function openSnapshots() {
    const snaps = KN.backup.list();
    if (!snaps.length) {
      KN.ui.toast("まだ控えがありません");
      return;
    }

    const body = node(html`
      <div class="stack">
        <p style="font-size:12px;color:var(--c-text-3);line-height:1.6;margin:0 0 8px">
          アプリが自動で残している控えです。この端末の中にだけ保存されるため、
          機種変更や端末の紛失には備えられません。そなえるには「バックアップを保存」で
          ファイルを書き出してください。
        </p>
        <div class="rows js-snaps"></div>
      </div>
    `);

    let sheetHandle = null;
    const rows = body.querySelector(".js-snaps");
    snaps.forEach((s) => {
      const row = node(html`
        <button class="row">
          <span class="row-main">
            <span class="row-title">${snapStamp(s.at)}（${s.reason}）</span>
            <span class="row-sub">${s.summary.products}商品・${s.summary.stores}店舗・リスト${s.summary.items}件</span>
          </span>
          <span class="row-chevron">${icon("chevron")}</span>
        </button>
      `);
      row.addEventListener("click", async () => {
        const ok = await KN.ui.confirm({
          title: "この時点に戻しますか？",
          message: "いまのデータは置き換わります。戻す直前の状態も控えに残すので、やり直せます。",
          okLabel: "戻す",
          danger: true,
        });
        if (!ok) return;
        try {
          KN.backup.restore(s.at);
          KN.ui.toast(`${snapStamp(s.at)} の状態に戻しました`);
          if (sheetHandle) sheetHandle.close();
        } catch (err) {
          console.error(err);
          KN.ui.toast("戻せませんでした");
        }
      });
      rows.append(row);
    });

    sheetHandle = KN.ui.sheet({ title: "自動バックアップ", content: body });
  }

  function dataGroup() {
    const st = store.get();
    const wrap = node(html`
      <section class="settings-group">
        <h2 class="section-title">データ</h2>
        <div class="rows">
          <button class="row js-export">
            <span class="row-main">
              <span class="row-title">バックアップを保存</span>
              <span class="row-sub">${exportSub(st)}</span>
            </span>
            <span class="row-chevron">${icon("download")}</span>
          </button>
          <button class="row js-import">
            <span class="row-main">
              <span class="row-title">バックアップから復元</span>
              <span class="row-sub">書き出したJSONを読み込みます</span>
            </span>
            <span class="row-chevron">${icon("upload")}</span>
          </button>
          <button class="row js-snapshots">
            <span class="row-main">
              <span class="row-title">自動バックアップから戻す</span>
              <span class="row-sub">${snapshotSub()}</span>
            </span>
            <span class="row-chevron">${icon("upload")}</span>
          </button>
          <button class="row js-sample">
            <span class="row-main">
              <span class="row-title">サンプルデータを入れる</span>
              <span class="row-sub">お試し用のお店と商品を読み込みます</span>
            </span>
            <span class="row-chevron">${icon("sparkles")}</span>
          </button>
          <button class="row js-reset">
            <span class="row-main">
              <span class="row-title" style="color:var(--c-danger)">すべて削除</span>
              <span class="row-sub">リスト・商品・価格・お店をすべて消します</span>
            </span>
            <span class="row-chevron">${icon("trash")}</span>
          </button>
        </div>
        <input type="file" accept="application/json,.json" class="js-file" hidden>
      </section>
    `);

    wrap.querySelector(".js-export").addEventListener("click", () => {
      const blob = new Blob([store.exportJSON()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d = new Date();
      const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      a.href = url;
      a.download = `kaimono-note-${stamp}.json`;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      KN.backup.markExported();
      KN.ui.toast("バックアップを保存しました");
    });

    wrap.querySelector(".js-snapshots").addEventListener("click", openSnapshots);

    const file = wrap.querySelector(".js-file");
    wrap.querySelector(".js-import").addEventListener("click", () => file.click());
    file.addEventListener("change", async () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const ok = await KN.ui.confirm({
        title: "復元しますか？",
        message: "いまのデータはすべて置き換わります。直前の状態は自動バックアップに残ります。",
        okLabel: "復元する",
        danger: true,
      });
      file.value = "";
      if (!ok) return;
      try {
        KN.backup.snapshot("復元前");
        store.importJSON(await f.text());
        KN.ui.toast("復元しました");
      } catch (err) {
        console.error(err);
        KN.ui.toast("読み込めませんでした（ファイル形式を確認してください）");
      }
    });

    wrap.querySelector(".js-sample").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "サンプルを入れますか？",
        message: "いまのデータはすべて置き換わります。",
        okLabel: "入れる",
        danger: true,
      });
      if (!ok) return;
      KN.backup.snapshot("サンプル読込前");
      store.loadSample();
      KN.ui.toast("サンプルを読み込みました");
    });

    wrap.querySelector(".js-reset").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "すべて削除しますか？",
        message: "買い物リスト・商品・価格・お店の記録がすべて消えます。直前の状態は自動バックアップに残るので、あとから戻せます。",
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      KN.backup.snapshot("削除前");
      store.reset();
      KN.ui.toast("すべて削除しました");
    });

    return wrap;
  }

  function aboutBlock() {
    return node(html`
      <div class="about">
        <div style="font-size:28px;margin-bottom:4px">🛒</div>
        <div style="font-weight:700;color:var(--c-text-2)">かいものノート</div>

  KN.screens = KN.screens || {};
  KN.screens.settings = { mount, render };
})();

/* ---- js/app.js ---- */
/* =========================================================
   かいものノート — app shell: tabs, routing, theme, PWA
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, haptic } = KN.util;
  const store = KN.store;

  const TABS = [
    { id: "list",     label: "リスト",   icon: "list"  },
    { id: "prices",   label: "価格",     icon: "tag"   },
    { id: "compare",  label: "お店",     icon: "shop"  },
    { id: "settings", label: "設定",     icon: "gear"  },
  ];

  let active = "list";
  const mounted = new Set();

  /* ---------------- theme ---------------- */

  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
    else root.removeAttribute("data-theme");
  }
  KN.applyTheme = applyTheme;

  /* ---------------- tabs ---------------- */

  function buildTabs() {
    const bar = document.getElementById("tabbar");
    bar.innerHTML = "";

    TABS.forEach((t) => {
      const btn = node(html`
        <button class="tab" role="tab" data-tab="${t.id}"
                aria-selected="${String(t.id === active)}"
                aria-controls="screen-${t.id}">
          <span class="tab-ico">${icon(t.icon)}</span>
          <span>${t.label}</span>
        </button>
      `);
      btn.addEventListener("click", () => show(t.id));
      bar.append(btn);
    });
  }

  function paintTabs() {
    document.querySelectorAll(".tab").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.tab === active));
    });

    // The badge counts what is left to buy on this trip, and the star is what
    // puts something on the trip. Nothing starred means nothing planned, so no
    // badge — falling back to the whole list here would report a backlog the
    // user never said they were buying.
    const listTab = document.querySelector('.tab[data-tab="list"]');
    if (!listTab) return;
    const pending = store.get().items.filter((i) => i.fav && !i.checked).length;
    const existing = listTab.querySelector(".tab-badge");
    if (pending > 0) {
      const text = pending > 99 ? "99+" : String(pending);
      if (existing) existing.textContent = text;
      else listTab.append(node(html`<span class="tab-badge">${text}</span>`));
    } else if (existing) {
      existing.remove();
    }
  }

  function show(id) {
    if (!KN.screens[id]) return;
    active = id;

    document.querySelectorAll(".screen").forEach((s) => {
      const on = s.dataset.screen === id;
      s.classList.toggle("is-active", on);
      s.hidden = !on;
    });

    ensureMounted(id);
    KN.screens[id].render();
    paintTabs();
    haptic();

    if (location.hash.slice(1) !== id) {
      history.replaceState(null, "", "#" + id);
    }
  }

  function ensureMounted(id) {
    if (mounted.has(id)) return;
    KN.screens[id].mount(document.getElementById("screen-" + id));
    mounted.add(id);
  }

  /* ---------------- boot ---------------- */

  function boot() {
    applyTheme(store.get().settings.theme || "auto");
    buildTabs();

    const fromHash = location.hash.slice(1);
    show(KN.screens[fromHash] ? fromHash : "list");

    // Re-render whichever screen is visible whenever state changes.
    store.subscribe(() => {
      if (KN.screens[active]) KN.screens[active].render();
      paintTabs();
    });

    window.addEventListener("hashchange", () => {
      const id = location.hash.slice(1);
      if (KN.screens[id] && id !== active) show(id);
    });

    // Keep two tabs of the same app in sync.
    window.addEventListener("storage", (e) => {
      if (e.key === store.KEY) location.reload();
    });

    requestPersistentStorage();
    trackKeyboard();
    KN.backup.init();
    registerServiceWorker();
  }

  /* The soft keyboard shrinks the visual viewport but leaves the layout
     viewport alone, so the bottom-docked add bar would end up behind it.
     Publishing the covered height as --kb lets the bar ride above the
     keyboard, and the tab bar steps aside while typing — nobody switches
     tabs mid-word, and hiding it means the bar's offset is simply --kb. */
  function trackKeyboard() {
    const vv = window.visualViewport;
    if (!vv) return;   // Without it the bar stays at the bottom, as before.
    const root = document.documentElement;

    const apply = () => {
      const covered = window.innerHeight - vv.height - vv.offsetTop;
      // Browser chrome sliding in and out moves this by a few dozen pixels;
      // only a keyboard takes this much of the screen.
      const kb = covered > 120 ? Math.round(covered) : 0;
      root.style.setProperty("--kb", kb + "px");
      root.classList.toggle("kb-open", kb > 0);

      // iOS shoves the document upwards to reveal the focused field before the
      // shell has had a chance to shrink out of the keyboard's way. Once it
      // has, the page has nowhere left to go, so put it back — otherwise that
      // borrowed scroll stays behind and the whole app looks shifted up.
      if (window.scrollY || window.pageYOffset) window.scrollTo(0, 0);
    };

    vv.addEventListener("resize", apply);
    vv.addEventListener("scroll", apply);
    // The shove can also land a frame or two after the viewport settles.
    window.addEventListener("focusin", () => setTimeout(apply, 300));
    apply();
  }

  /* Shopping history lives only in localStorage, which browsers are free to
     evict under storage pressure or after a long idle stretch — months of
     price records would go with it. Asking for persistent storage exempts the
     app from that sweep; installed PWAs are usually granted it silently. */
  function requestPersistentStorage() {
    if (!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted()
      .then((already) => (already ? true : navigator.storage.persist()))
      .catch(() => { /* not fatal — the app works either way */ });
  }

  function registerServiceWorker() {
    // The single-file build has no sw.js alongside it to register.
    if (window.KN_STANDALONE) return;
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;

    // A new worker calls skipWaiting() and takes over while this page is still
    // running the previous build's scripts. Reload once so the new code is
    // actually the code in use — otherwise the app sits a version behind until
    // it happens to be launched again, which on a home-screen app resumed from
    // the switcher may not be for days.
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      if (isBusy()) {
        // Don't pull the page out from under someone mid-entry; wait until
        // they put the app away.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") location.reload();
        }, { once: true });
        return;
      }
      location.reload();
    });

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // An installed app can stay open for days, so look for a new build
        // every time it comes back to the foreground rather than only at boot.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
      }).catch((err) => {
        console.warn("service worker registration failed", err);
      });
    });
  }

  /** True while the user is part-way through something a reload would lose. */
  function isBusy() {
    if (document.querySelector(".sheet")) return true;
    const el = document.activeElement;
    return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.value);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
