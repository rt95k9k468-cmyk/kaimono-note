    const scrollFieldIntoView = (field) => {
      const scroller = el.querySelector(".sheet-body");
      if (!scroller) return;
      const f = field.getBoundingClientRect();
      const s = scroller.getBoundingClientRect();
      if (f.top >= s.top + 4 && f.bottom <= s.bottom - 4) return;   // already visible
      field.scrollIntoView({ block: "center", behavior: "smooth" });
    };

    el.addEventListener("focusin", (e) => {
      const field = e.target.closest("input, textarea, select");
      if (!field) return;
      [140, 340, 620].forEach((ms) => setTimeout(() => {
        if (document.activeElement === field) scrollFieldIntoView(field);
      }, ms));
    });

    // Drag-down-to-dismiss, only while the sheet is anchored to the bottom
    // (above 640px it becomes a centred dialog with a different transform).
    const isBottomSheet = () => window.matchMedia("(max-width: 639px)").matches;
    let startY = null;
    const head = el.querySelector(".sheet-head");
    const handleBar = el.querySelector(".sheet-handle");
    [head, handleBar].forEach((zone) => {
      zone.addEventListener("touchstart", (e) => {
        startY = isBottomSheet() ? e.touches[0].clientY : null;
      }, { passive: true });
      zone.addEventListener("touchmove", (e) => {
        if (startY == null) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0) el.style.transform = `translate(-50%, ${dy}px)`;
      }, { passive: true });
      zone.addEventListener("touchend", (e) => {
        if (startY == null) return;
        const dy = (e.changedTouches[0] || {}).clientY - startY;
        el.style.transform = "";
        if (dy > 90) close();
        startY = null;
      });
    });

    const handle = { close, el };
    openSheets.push(handle);

    // Focus the first meaningful control.
    setTimeout(() => {
      const target = el.querySelector("input, textarea, select, button:not(.js-close)");
      if (target && !("ontouchstart" in window)) target.focus();
    }, 320);

    return handle;
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openSheets.length) {
      openSheets[openSheets.length - 1].close();
    }
  });

  /* ---------------- toast ---------------- */

  let toastTimer = null;

  function toast(message, { action, duration = 3600 } = {}) {
    const root = toastRoot();
    root.innerHTML = "";
    clearTimeout(toastTimer);

    const el = node(html`
      <div class="toast">
        <span class="toast-msg">${message}</span>
        ${action ? html`<button class="toast-action">${action.label}</button>` : ""}
      </div>
    `);

    if (action) {
      el.querySelector(".toast-action").addEventListener("click", () => {
        action.onClick();
        dismiss();
      });
    }

    function dismiss() {
      clearTimeout(toastTimer);
      el.classList.add("is-out");
      setTimeout(() => el.remove(), 220);
    }

    root.append(el);
    toastTimer = setTimeout(dismiss, duration);
    return { dismiss };
  }

  /* ---------------- confirm ---------------- */

  function confirm({ title, message, okLabel = "OK", cancelLabel = "キャンセル", danger = false }) {
    return new Promise((resolve) => {
      let settled = false;
      const body = node(html`<div class="stack" style="gap:8px"><p style="color:var(--c-text-2);line-height:1.6">${message || ""}</p></div>`);
      const foot = node(html`
        <div style="display:flex;gap:8px;width:100%">
          <button class="btn btn-soft js-cancel" style="flex:1">${cancelLabel}</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"} js-ok" style="flex:1">${okLabel}</button>
        </div>
      `);

      const h = sheet({
        title, content: body, footer: foot,
        onClose: () => { if (!settled) { settled = true; resolve(false); } },
      });

      foot.querySelector(".js-cancel").addEventListener("click", () => h.close());
      foot.querySelector(".js-ok").addEventListener("click", () => {
        settled = true;
        resolve(true);
        h.close();
      });
    });
  }

  /* ---------------- prompt ---------------- */

  function prompt({ title, label, value = "", placeholder = "", okLabel = "保存", inputMode }) {
    return new Promise((resolve) => {
      let settled = false;
      const body = node(html`
        <label class="field">
          ${label ? html`<span class="field-label">${label}</span>` : ""}
          <input class="input js-input" value="${value}" placeholder="${placeholder}"
                 ${inputMode ? KN.util.raw(`inputmode="${inputMode}"`) : ""}>
        </label>
      `);
      const foot = node(html`
        <div style="display:flex;gap:8px;width:100%">
          <button class="btn btn-soft js-cancel" style="flex:1">キャンセル</button>
          <button class="btn btn-primary js-ok" style="flex:1">${okLabel}</button>
        </div>
      `);

      const h = sheet({
        title, content: body, footer: foot,
        onClose: () => { if (!settled) { settled = true; resolve(null); } },
      });

      const input = body.querySelector(".js-input");
      function submit() {
        settled = true;
        resolve(input.value.trim());
        h.close();
      }
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      foot.querySelector(".js-ok").addEventListener("click", submit);
      foot.querySelector(".js-cancel").addEventListener("click", () => h.close());
    });
  }

  /* ---------------- store picker ---------------- */

  /** Chips of known stores + inline "new store" field. Resolves to a storeId. */
  function storePicker(container, { selectedId, onSelect }) {
    const stores = KN.store.sortedStores();
    let current = selectedId || (stores[0] && stores[0].id) || null;

    function render() {
      container.innerHTML = "";
      const wrap = node(html`<div class="chip-wrap"></div>`);
      stores.forEach((s) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(s.id === current)}">
            <span class="dot" style="background:${s.color}"></span>${s.name}
          </button>
        `);
        chip.addEventListener("click", () => {
          current = s.id;
          onSelect(current);
          render();
        });
        wrap.append(chip);
      });

      const addChip = node(html`<button type="button" class="chip">＋ お店を追加</button>`);
      addChip.addEventListener("click", async () => {
        const name = await prompt({ title: "お店を追加", label: "お店の名前", placeholder: "例：イオン 〇〇店" });
        if (!name) return;
        const rec = KN.store.addStore(name);
        stores.length = 0;
        KN.store.sortedStores().forEach((s) => stores.push(s));
        current = rec.id;
        onSelect(current);
        render();
      });
      wrap.append(addChip);
      container.append(wrap);
    }

    render();
    if (current) onSelect(current);
    return { get current() { return current; } };
  }

  /* ---------------- category picker ---------------- */

  function categoryPicker(container, { selectedId, onSelect }) {
    let current = selectedId || KN.store.OTHER_CATEGORY;

    function render() {
      container.innerHTML = "";
      const wrap = node(html`<div class="chip-wrap"></div>`);
      KN.store.sortedCategories().forEach((c) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(c.id === current)}">
            <span class="chip-emoji">${c.emoji}</span>${c.name}
          </button>
        `);
        chip.addEventListener("click", () => {
          current = c.id;
          haptic();
          onSelect(current);
          render();
        });
        wrap.append(chip);
      });
      container.append(wrap);
    }

    render();
    return { get current() { return current; } };
  }

  KN.ui = { sheet, toast, confirm, prompt, storePicker, categoryPicker };
})();

/* ---- js/reorder.js ---- */
/* =========================================================
   かいものノート — long-press to lift, drag to reorder

   Press and hold a row and it lifts off the list — a shadow under it, a
   fraction larger, following your finger. The rows it passes slide aside to
   open the gap it would drop into, so the outcome is visible before you let
   go rather than after. Let go and it settles into that gap.

   Holding still is what starts it. Moving first means you meant to scroll the
   list or swipe the row away, and those keep working untouched: the lift is
   cancelled the moment the finger travels more than a few pixels before the
   timer is up.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { haptic } = KN.util;

  const HOLD   = 400;   // press this long before the row lifts
  const CANCEL = 8;     // travel further than this first and it was a scroll
  const EDGE   = 64;    // how near the end of the list auto-scroll starts
  const SPEED  = 14;    // auto-scroll, px per frame at the very edge
  const DROP   = 190;   // how long the row takes to settle into its gap

  let drag = null;

  /** True while a row is lifted — other gesture handlers stand down on this. */
  const isActive = () => !!drag;

  /**
   * @param {Element} container  the list; only its direct children move
   * @param {object} opts
   * @param {string} opts.item   selector for the rows
   * @param {Function} opts.onDrop  (fromIndex, toIndex) — commit the new order
   * @param {Function} [opts.blocked]  return true to refuse to start
   */
  function attach(container, opts) {
    container.addEventListener("pointerdown", (e) => arm(e, container, opts));
  }

  /* ---------------- the press ---------------- */

  function arm(e, container, opts) {
    if (drag) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (opts.blocked && opts.blocked()) return;

    const el = e.target.closest(opts.item);
    if (!el || el.parentElement !== container) return;

    const startX = e.clientX, startY = e.clientY, pointerId = e.pointerId;

    const moved = (ev) => {
      if (ev.pointerId !== pointerId) return;
      if (Math.abs(ev.clientX - startX) > CANCEL || Math.abs(ev.clientY - startY) > CANCEL) done();
    };
    const done = () => {
      clearTimeout(timer);
      document.removeEventListener("pointermove", moved);
      document.removeEventListener("pointerup", done);
      document.removeEventListener("pointercancel", done);
    };
    const timer = setTimeout(() => { done(); lift({ container, opts, el, pointerId, startY }); }, HOLD);

    document.addEventListener("pointermove", moved);
    document.addEventListener("pointerup", done);
    document.addEventListener("pointercancel", done);
  }

  /* ---------------- the lift ---------------- */

  function lift({ container, opts, el, pointerId, startY }) {
    const kids = Array.prototype.filter.call(container.children, (k) => k.matches(opts.item));
    const from = kids.indexOf(el);
    if (from < 0 || kids.length < 2) return;

    // Measured once, before anything moves. Everything after this is arithmetic
    // on these numbers, so a row half way through its own transition cannot
    // feed a wrong position back in.
    const rects = kids.map((k) => k.getBoundingClientRect());
    const gap = Math.max(0, rects[1].top - rects[0].bottom);
    const scroller = findScroller(container);

    drag = {
      container, opts, el, kids, rects, from, to: from,
      // What the rows in between move by is the lifted row's own height —
      // it is the space that opens where it was and closes where it lands,
      // whatever the rows around it happen to measure.
      step: rects[from].height + gap,
      scroller, startScroll: scroller ? scroller.scrollTop : 0,
      startY, clientY: startY, pointerId, raf: 0,
    };

    container.classList.add("is-reordering");
    el.classList.add("reorder-lift");
    try { el.setPointerCapture(pointerId); } catch (err) { /* mouse in a test rig */ }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
    // The list must not scroll under a row being carried across it.
    document.addEventListener("touchmove", swallowTouch, { passive: false });

    haptic(18);
    paint();
    drag.raf = requestAnimationFrame(tick);
  }

  const swallowTouch = (e) => { if (drag) e.preventDefault(); };

  function onMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.clientY = e.clientY;
  }

  /* Auto-scroll and painting share a frame loop rather than riding on pointer
     events: holding the finger still at the end of the list still has to keep
     scrolling, and no pointer events arrive while it is still. */
  function tick() {
    if (!drag) return;
    autoScroll();
    paint();
    drag.raf = requestAnimationFrame(tick);
  }

  function autoScroll() {
    const d = drag;
    if (!d.scroller) return;
    const r = d.scroller.getBoundingClientRect();
    let v = 0;
    if (d.clientY < r.top + EDGE) v = -SPEED * Math.min(1, (r.top + EDGE - d.clientY) / EDGE);
    else if (d.clientY > r.bottom - EDGE) v = SPEED * Math.min(1, (d.clientY - (r.bottom - EDGE)) / EDGE);
    if (v) d.scroller.scrollTop += v;
  }

  function paint() {
    const d = drag;
    // Scrolling moves the row's own layout position along with everything
    // else, so it has to be added back in for the row to stay under the finger.
    const delta = (d.clientY - d.startY) + (d.scroller ? d.scroller.scrollTop - d.startScroll : 0);
    d.el.style.transform = `translate3d(0, ${Math.round(delta)}px, 0)`;

    const mid = d.rects[d.from].top + d.rects[d.from].height / 2 + delta;
    let to = d.from;
    for (let i = d.from - 1; i >= 0; i--) {
      if (mid < d.rects[i].top + d.rects[i].height / 2) to = i; else break;
    }
    for (let i = d.from + 1; i < d.rects.length; i++) {
      if (mid > d.rects[i].top + d.rects[i].height / 2) to = i; else break;
    }
    if (to !== d.to) { d.to = to; haptic(8); }

    d.kids.forEach((k, i) => {
      if (i === d.from) return;
      let shift = 0;
      if (d.to > d.from && i > d.from && i <= d.to) shift = -d.step;
      else if (d.to < d.from && i >= d.to && i < d.from) shift = d.step;
      k.style.transform = shift ? `translate3d(0, ${shift}px, 0)` : "";
    });
  }

  /* ---------------- the drop ---------------- */

  function onUp(e) {
    if (!drag || (e && e.pointerId !== drag.pointerId)) return;
    const d = drag;
    drag = null;

    cancelAnimationFrame(d.raf);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", swallowTouch);

    // Where the gap is: below its old place the row takes the space ending at
    // the target's bottom edge; above it, the space starting at its top.
    const a = d.rects[d.from];
    const t = d.rects[d.to];
    const landing = d.to > d.from ? t.bottom - a.height : d.to < d.from ? t.top : a.top;
    const scrolled = d.scroller ? d.scroller.scrollTop - d.startScroll : 0;

    d.el.classList.remove("reorder-lift");
    d.el.classList.add("reorder-drop");
    d.el.style.transform = `translate3d(0, ${Math.round(landing - a.top + scrolled)}px, 0)`;
    haptic(12);

    // The press that lifted the row would otherwise land as a tap on release
    // and open whatever the row opens.
    const eatClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener("click", eatClick, true);
    setTimeout(() => document.removeEventListener("click", eatClick, true), 350);

    setTimeout(() => {
      d.container.classList.remove("is-reordering");
      d.kids.forEach((k) => {
        k.style.transform = "";
        k.classList.remove("reorder-drop");
      });
      // Committing last means the re-render it triggers replaces rows that are
      // already sitting where they belong, so nothing jumps at the swap.
      if (d.to !== d.from) d.opts.onDrop(d.from, d.to);
    }, DROP);
  }

  function findScroller(el) {
    let n = el.parentElement;
    while (n && n !== document.body) {
      const o = getComputedStyle(n).overflowY;
      if (o === "auto" || o === "scroll") return n;
      n = n.parentElement;
    }
    return null;
  }

  /** Move one entry of a list and write the result back as `order` fields. */
  function applyOrder(records, from, to, pick) {
    const ids = records.map((r) => r.id);
    const [moved] = ids.splice(from, 1);
    ids.splice(to, 0, moved);
    KN.store.update((s) => {
      ids.forEach((id, i) => {
        const rec = pick(s).find((r) => r.id === id);
        if (rec) rec.order = i;
      });
    });
  }

  KN.reorder = { attach, isActive, applyOrder };
})();

/* ---- js/backup.js ---- */
/* =========================================================
   かいものノート — automatic local snapshots

   A page cannot write files to the phone on its own, so "automatic
   backup" here means rolling copies kept in the app's own storage.
   They cover the accidents that actually happen — a stray「すべて削除」,
   a restore from the wrong file — but not a lost or wiped phone, so the
   manual export is still nudged once the data is worth protecting.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { today } = KN.util;
  const store = KN.store;

  // Kept apart from the live data so「すべて削除」cannot take the snapshots with it.
  const SNAP_KEY = "kaimono-note-snapshots";
  const KEEP = 7;
  const REMIND_AFTER_DAYS = 30;
  const REMIND_MIN_PRODUCTS = 5;

  function read() {
    try {
      const list = JSON.parse(localStorage.getItem(SNAP_KEY) || "[]");
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  }

  function write(list) {
    // Snapshots must never crowd out the live shopping data. If the quota is
    // full, drop the oldest and retry instead of letting the write throw.
    let keep = list.slice(-KEEP);
    while (keep.length) {
      try {
        localStorage.setItem(SNAP_KEY, JSON.stringify(keep));
        return true;
      } catch (err) {
        keep = keep.slice(1);
      }
    }
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* nothing left to do */ }
    return false;
  }

  function summarize(state) {
    return {
      products: (state.products || []).length,
      stores: (state.stores || []).length,
      items: (state.items || []).length,
    };
  }

  function isEmpty(state) {
    const s = summarize(state);
    return !s.products && !s.stores && !s.items;
  }

  /** Store the current state. Returns false when there was nothing worth keeping. */
  function snapshot(reason) {
    const state = store.get();
    if (isEmpty(state)) return false;

    const list = read();
    const payload = JSON.stringify(state);

    // Skip an identical repeat, otherwise simply opening the app on quiet days
    // would push the genuinely different older snapshots out of the window.
    const last = list[list.length - 1];
    if (last && last.payload === payload) return false;

    list.push({ at: today(), reason: reason || "自動", payload, summary: summarize(state) });
    return write(list);
  }

  /** One snapshot per calendar day, taken at boot. */
  function maybeDaily() {
    const list = read();
    const last = list[list.length - 1];
    if (last) {
      const a = new Date(last.at);
      const b = new Date();
      const sameDay =
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
      if (sameDay) return false;
    }
    return snapshot("自動");
  }

  /** Newest first. */
  function list() {
    return read().slice().reverse();
  }

  function restore(at) {
    const found = read().find((s) => s.at === at);
    if (!found) throw new Error("その控えが見つかりません");
    // Take one first so that restoring is itself undoable.
    snapshot("復元前");
    store.importJSON(found.payload);
  }

  function clear() {
    try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* already gone */ }
  }

  /* ---------------- off-device export nudge ---------------- */

  function lastExportAt() {
    const st = store.get();
    return (st.settings && st.settings.lastExportAt) || null;
  }

  function markExported() {
    store.update((s) => { s.settings.lastExportAt = today(); });
  }

  /** True once there is real data and no file has been written out in a while. */
  function exportDue() {
    const st = store.get();
    if ((st.products || []).length < REMIND_MIN_PRODUCTS) return false;
    const last = lastExportAt();
    if (!last) return true;
    const days = (Date.now() - new Date(last).getTime()) / 86400000;
    return !(days < REMIND_AFTER_DAYS);
  }

  function init() {
    maybeDaily();
    if (exportDue()) {
      // Late enough that it does not collide with the first paint.
      setTimeout(() => {
        KN.ui && KN.ui.toast("設定からバックアップを書き出しておくと安心です");
      }, 2500);
    }
  }

  KN.backup = {
    SNAP_KEY, KEEP,
    snapshot, maybeDaily, list, restore, clear,
    lastExportAt, markExported, exportDue,
    init,
  };
})();

/* ---- js/insights.js ---- */
/* =========================================================
   かいものノート — insights

   Reads the shopping data and says something useful about it. Everything
   here is arithmetic on the user's own records: no network, no key, works
   on a plane. That also means it never guesses — a figure shown here can
   be traced back to a price the user typed in.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { yen, formatDate, unitPrice } = KN.util;
  const store = KN.store;

  const STALE_DAYS = 90;
  const ONE_STOP_TOLERANCE = 0.05;   // within 5% of the best split is "close enough"

  const daysSince = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;

  /** Every price recorded for one product at one store, oldest first. */
  function history(product, storeId) {
    return product.prices
      .filter((pr) => pr.storeId === storeId)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
  }

  /* ---------------- individual checks ---------------- */

  /* The latest price against the one before it, at the same store. Anything
     else would compare two different shops and call it a change. */
  function priceMoves(products) {
    const out = [];
    products.forEach((p) => {
      store.currentPrices(p).forEach((cur) => {
        const h = history(p, cur.storeId);
        if (h.length < 2) return;
        const prev = h[h.length - 2];
        const delta = cur.price - prev.price;
        if (!delta) return;
        const st = store.getStore(cur.storeId);
        if (!st) return;
        const up = delta > 0;
        out.push({
          kind: "price-move",
          weight: 60 + Math.abs(delta) / Math.max(prev.price, 1) * 40,
          icon: up ? "📈" : "📉",
          title: `${p.name}が${up ? "値上がり" : "値下がり"}`,
          body: `${st.name}で ${yen(prev.price)} → ${yen(cur.price)}（${up ? "+" : ""}${yen(delta)}）`,
        });
      });
    });
    return out;
  }

  /* Cheapest sticker price is not always cheapest per millilitre — the whole
     reason the app records sizes at all. */
  function unitPriceUpsets(products) {
    const out = [];
    products.forEach((p) => {
      if (!p.unit) return;
      const rows = store.currentPrices(p)
        .map((pr) => {
          const amount = pr.amount || p.amount;
          const u = unitPrice(pr.price, amount, p.unit);
          return u ? { pr, u, st: store.getStore(pr.storeId) } : null;
        })
        .filter((r) => r && r.st);
      if (rows.length < 2) return;

      const byPrice = rows.slice().sort((a, b) => a.pr.price - b.pr.price)[0];
      const byUnit  = rows.slice().sort((a, b) => a.u.value - b.u.value)[0];
      if (byPrice === byUnit) return;

      out.push({
        kind: "unit-price",
        weight: 70,
        icon: "⚖️",
        title: `${p.name}は${byUnit.st.name}の方が割安`,
        body: `${byPrice.st.name} ${yen(byPrice.pr.price)}（${byPrice.u.text}）より、`
            + `${byUnit.st.name} ${yen(byUnit.pr.price)}（${byUnit.u.text}）の方が量あたりは安く済みます`,
      });
    });
    return out;
  }

  /* Is this trip worth splitting across shops, or is one stop good enough? */
  function tripRouting(items) {
    const priced = items
      .map((it) => ({ it, p: store.getProduct(it.productId) }))
      .filter((r) => r.p && store.bestPrice(r.p));
    if (priced.length < 2) return [];

    const cheapest = priced.reduce((sum, r) => sum + store.bestPrice(r.p).price * r.it.qty, 0);

    // What each store costs if you buy there whatever it stocks and pick up
    // the rest wherever it is cheapest — a total you could actually spend.
    const totals = store.sortedStores().map((st) => {
      let total = 0, here = 0;
      priced.forEach((r) => {
        const at = store.priceAt(r.p, st.id);
        const best = store.bestPrice(r.p);
        if (at) { total += at.price * r.it.qty; here += 1; }
        else { total += best.price * r.it.qty; }
      });
      return { st, total, here };
    }).filter((t) => t.here > 0).sort((a, b) => a.total - b.total);

    if (!totals.length) return [];
    const top = totals[0];
    const extra = top.total - cheapest;

    if (extra <= 0 || extra <= cheapest * ONE_STOP_TOLERANCE) {
      return [{
        kind: "one-stop",
        weight: 100,
        icon: "🛒",
        title: `今回は${top.st.name}だけで足ります`,
        body: extra <= 0
          ? `${priced.length}品を ${yen(top.total)} で買えます。店を回る必要はありません。`
          : `${priced.length}品を ${yen(top.total)}。店を分けても ${yen(extra)} しか変わりません。`,
      }];
    }
    return [{
      kind: "split",
      weight: 95,
      icon: "🧭",
      title: `店を分けると ${yen(extra)} 安くなります`,
      body: `${top.st.name}中心なら ${yen(top.total)}、それぞれ最安の店で買うと ${yen(cheapest)} です。`,
    }];
  }

  /* A price from last spring is a guess, not a price. */
  function stalePrices(products) {
    const out = [];
    products.forEach((p) => {
      const best = store.bestPrice(p);
      if (!best) return;
      const age = daysSince(best.date);
      if (!(age > STALE_DAYS)) return;
      out.push({
        kind: "stale",
        weight: 40 + Math.min(age / 10, 20),
        icon: "🕰️",
        title: `${p.name}の値段が古くなっています`,
        body: `最後に記録したのは ${formatDate(best.date)}。次に見かけたら確かめると合計が正確になります。`,
      });
    });
    return out;
  }

  /* ---------------- public ---------------- */

  /**
   * Findings for the items being shopped, strongest first.
   * @param {Array} items  the trip (or the whole active list when nothing is starred)
   */
  function forItems(items, limit = 3) {
    const products = [];
    const seen = new Set();
    items.forEach((it) => {
      if (seen.has(it.productId)) return;
      seen.add(it.productId);
      const p = store.getProduct(it.productId);
      if (p && p.prices.length) products.push(p);
    });
    if (!products.length) return [];

    const found = [
      ...tripRouting(items),
      ...priceMoves(products),
      ...unitPriceUpsets(products),
      ...stalePrices(products),
    ];

    // One finding per kind, so a single stale shelf cannot fill the card.
    const bestOfKind = new Map();
    found.forEach((f) => {
      const cur = bestOfKind.get(f.kind);
      if (!cur || f.weight > cur.weight) bestOfKind.set(f.kind, f);
    });

    return [...bestOfKind.values()].sort((a, b) => b.weight - a.weight).slice(0, limit);
  }

  KN.insights = { forItems, STALE_DAYS };
})();

/* ---- js/pull-refresh.js ---- */
/* =========================================================
   かいものノート — pull to refresh

   There is no server behind this app, so a refresh cannot fetch anything.
   What it can do is real, if small: write out any save still in flight,
   re-read the file from disk so a copy open elsewhere is picked up, repaint
   the screen, and ask the service worker whether a newer build has been
   deployed. The gesture is mostly there because reaching the top of a list
   and pulling is what a phone user does; this makes that mean something
   instead of nothing.
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, raw, haptic } = KN.util;

  /* The mark, drawn rather than borrowed from the icon set, because it has to
     do two different things.

     While you pull it is a redo mark: a ring with a gap, an arrowhead at the
     leading end that never quite closes the circle, and the whole thing turns
     as you go — one full revolution by the time it is armed. The ring is not
     just revealed, it is drawn: the stroke runs on from the gap and the head
     fades in as the last of it lands.

     Once you let go the arrowhead goes and a second arc takes over, chasing
     itself around the ring. Same circle, same weight, so it reads as the mark
     carrying on rather than a different thing appearing.

     Geometry, so the numbers are not mysterious: r=9 about (12,12). The arc
     runs clockwise from -60° to 240°, i.e. 300° of the circle, leaving the
     gap across the top. Its length is 2·π·9·(300/360) = 47.12, which is the
     dash pattern the drawing-on relies on. The head is a triangle centred on
     the arc's end and turned to its tangent there. */
  const MARK = raw(`
    <svg class="ptr-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path class="ptr-arc" d="M16.5 4.21A9 9 0 1 1 7.5 4.21"/>
      <path class="ptr-head" d="M10.1 2.71 7.3 6.86 5.1 3.05Z" fill="currentColor" stroke="none"/>
      <circle class="ptr-spin" cx="12" cy="12" r="9"/>
    </svg>
  `);

  const ARC_LEN = 47.12;

  const TRIGGER = 56;    // pull the chip this far down to arm the refresh
  const HOLD    = 52;    // where it parks while the refresh runs
  const MAX     = 96;    // it never stretches further than this
  const MIN_RUN = 550;   // keep the spinner up long enough to be read
  const SLOP    = 10;    // finger travel before we decide what this gesture is

  let host = null;       // #screens
  let ptr = null;        // the chip
  let mark = null;       // the svg inside it
  let arc = null;        // the redo ring, drawn on as you pull
  let head = null;       // its arrowhead

  let screenEl = null;   // the screen being pulled
  let startY = 0, startX = 0;
  let pull = 0;
  let armed = false;     // the touch started somewhere a pull could begin
  let engaged = false;   // it turned out to be a downward pull
  let busy = false;
  let frame = 0;

  function init() {
    host = document.getElementById("screens");
    if (!host) return;

    ptr = node(html`<div class="ptr"><span class="ptr-ring">${MARK}</span></div>`);
    mark = ptr.querySelector(".ptr-mark");
    arc = ptr.querySelector(".ptr-arc");
    head = ptr.querySelector(".ptr-head");
    // First child, so the screens paint over it. It only ever shows in the
    // gap a pull opens up above them.
    host.prepend(ptr);

    host.addEventListener("touchstart", onStart, { passive: true });
    host.addEventListener("touchmove", onMove, { passive: false });
    host.addEventListener("touchend", onEnd);
    host.addEventListener("touchcancel", onEnd);
  }

  /** Nothing should be pulled out from under a keyboard, a sheet or a swipe. */
  function blocked() {
    if (busy) return true;
    if (KN.reorder.isActive()) return true;
    if (document.documentElement.classList.contains("kb-open")) return true;
    if (document.querySelector(".sheet")) return true;
    if (document.querySelector(".item-wrap.is-open")) return true;
    return false;
  }

  function onStart(e) {
    armed = engaged = false;
    if (e.touches.length !== 1 || blocked()) return;

    screenEl = host.querySelector(".screen.is-active");
    // Only from the very top: anywhere else, a downward drag is a scroll.
    if (!screenEl || screenEl.scrollTop > 0) return;

    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    armed = true;
    screenEl.classList.remove("is-settling");
  }

  function onMove(e) {
    if (!armed) return;
    // A row lifted out of the list mid-press: that gesture is now a reorder.
    if (KN.reorder.isActive()) { armed = false; return; }
    const t = e.touches[0];
    const dy = t.clientY - startY;
    const dx = t.clientX - startX;

    if (!engaged) {
      // Give up on anything that is not a straight pull downwards — an upward
      // scroll, or the sideways drag that deletes a row.
      if (dy < -SLOP / 2 || Math.abs(dx) > SLOP) { armed = false; return; }
      if (dy < SLOP || Math.abs(dy) < Math.abs(dx) * 1.5) return;
      if (screenEl.scrollTop > 0) { armed = false; return; }
      engaged = true;
    }

    // Taking the gesture means the scroller must not also act on it.
    e.preventDefault();
    // Rubber band: the first pixels come easily, the last ones barely move.
    pull = MAX * (1 - Math.exp(-Math.max(0, dy) / MAX));
    paint();
  }

  function onEnd() {
    if (!engaged) { armed = false; return; }
    armed = engaged = false;
    if (pull >= TRIGGER) run();
    else settle(0);
  }

  function paint() {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const p = pull / TRIGGER;
      const ready = pull >= TRIGGER && !busy;
      ptr.classList.toggle("is-ready", ready);
      ptr.style.transform = `translate3d(0, ${pull.toFixed(1)}px, 0)`;
      ptr.style.opacity = String(Math.min(1, pull / 26));
      if (screenEl) screenEl.style.transform = `translate3d(0, ${pull.toFixed(1)}px, 0)`;
      if (busy) return;   // from here on the spinner has the mark

      // The ring draws itself on, the head lands at the end of it, and the
      // whole mark turns once by the time the pull is armed.
      const drawn = Math.min(1, p);
      arc.style.strokeDashoffset = (ARC_LEN * (1 - drawn)).toFixed(2);
      head.style.opacity = String(Math.max(0, Math.min(1, (p - 0.72) / 0.28)));
      mark.style.transform = `rotate(${Math.round(Math.min(p, 1.2) * 300)}deg)`;
    });
  }

  /** Animate the chip and the screen to `to`, then stop transitioning. */
  function settle(to) {
    pull = to;
    ptr.classList.add("is-settling");
    if (screenEl) screenEl.classList.add("is-settling");
    paint();
    setTimeout(() => {
      ptr.classList.remove("is-settling");
      if (screenEl) screenEl.classList.remove("is-settling");
      if (to === 0 && screenEl) screenEl.style.transform = "";
    }, 340);
  }

  function run() {
    busy = true;
    haptic();
    ptr.classList.add("is-busy");
    ptr.classList.remove("is-ready");
    // Hand the mark over to the spinner. Both of these were set inline on the
    // way down, and inline beats the `is-busy` rules that would hide them.
    mark.style.transform = "";
    head.style.opacity = "0";
    settle(HOLD);

    const started = Date.now();
    Promise.all([refreshData(), checkForNewBuild()])
      .catch(() => {})
      .then(() => {
        const left = Math.max(0, MIN_RUN - (Date.now() - started));
        setTimeout(() => {
          busy = false;
          ptr.classList.remove("is-busy");
          settle(0);
        }, left);
      });
  }

  function refreshData() {
    return new Promise((resolve) => {
      try { KN.store.reload(); } catch (err) { console.warn("refresh failed", err); }
      resolve();
    });
  }

  /* The installed app can sit on the home screen for weeks. Asking the worker
     to look for a new build is the one thing here that reaches the network —
     and if it finds one, app.js reloads into it on its own. */
  function checkForNewBuild() {
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistration) {
      return Promise.resolve();
    }
    return navigator.serviceWorker.getRegistration()
      .then((reg) => (reg ? reg.update() : null))
      .catch(() => null);
  }

  KN.pullRefresh = { init };
})();

/* ---- js/product-sheet.js ---- */
/* =========================================================
   かいものノート — shared product / item detail sheet
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, icon, yen, unitPrice, formatSize, relativeDate, UNITS, parseNum, debounce, haptic } = KN.util;
  const store = KN.store;

  /**
   * Open the detail sheet for a product.
   * @param {string} productId
   * @param {object} [opts]
   * @param {string} [opts.itemId] when opened from the shopping list, shows qty/memo controls
   */
  function open(productId, { itemId } = {}) {
    const product = store.getProduct(productId);
    if (!product) return;

    const body = node(html`<div class="stack" style="gap:20px"></div>`);

    const pricesWrap = node(html`<div class="stack" style="gap:12px"></div>`);
    const rerenderPrices = () => renderPrices(pricesWrap, productId);

    body.append(nameField(productId));
    if (itemId) body.append(itemSection(itemId));
    body.append(categoryField(productId));
    body.append(sizeField(productId, rerenderPrices));
    body.append(pricesWrap);
    rerenderPrices();

    body.append(historySection(productId));
    body.append(dangerSection(productId, () => sheetHandle.close()));

    const foot = node(html`<button class="btn btn-primary btn-block">完了</button>`);

    const sheetHandle = KN.ui.sheet({
      title: product.name,
      titleMark: store.productMark(product),
      content: body,
      footer: foot,
    });

    foot.addEventListener("click", () => sheetHandle.close());
    return sheetHandle;
  }

  /* ---------------- fields ---------------- */

  function nameField(productId) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <label class="field">
        <span class="field-label">商品名</span>
        <input class="input js-name" value="${p.name}" placeholder="商品名">
      </label>
    `);
    const input = wrap.querySelector(".js-name");
    const save = debounce(() => {
      const v = input.value.trim();
      if (!v) return;
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (rec) rec.name = v;
      });
    }, 350);
    input.addEventListener("input", save);
    return wrap;
  }

  function itemSection(itemId) {
    const item = store.get().items.find((i) => i.id === itemId);
    if (!item) return document.createDocumentFragment();

    const wrap = node(html`
      <div class="stack" style="gap:12px">
        <div class="field">
          <span class="field-label">数量</span>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="icon-btn js-minus" aria-label="減らす" style="background:var(--c-surface-2)">${icon("minus")}</button>
            <span class="js-qty mono-num" style="font-size:22px;font-weight:800;min-width:44px;text-align:center">${item.qty}</span>
            <button class="icon-btn js-plus" aria-label="増やす" style="background:var(--c-surface-2)">${icon("plus")}</button>
            <button class="btn btn-soft btn-sm js-remove" style="margin-left:auto">リストから外す</button>
          </div>
        </div>
        <label class="field">
          <span class="field-label">メモ</span>
          <input class="input js-memo" value="${item.memo || ""}" placeholder="例：詰め替え用・特売のとき">
        </label>
      </div>
    `);

    const qtyEl = wrap.querySelector(".js-qty");
    function setQty(delta) {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.qty = Math.max(1, rec.qty + delta);
      });
      const rec = store.get().items.find((i) => i.id === itemId);
      qtyEl.textContent = rec ? rec.qty : 1;
      haptic();
    }
    wrap.querySelector(".js-minus").addEventListener("click", () => setQty(-1));
    wrap.querySelector(".js-plus").addEventListener("click", () => setQty(1));

    const memo = wrap.querySelector(".js-memo");
    memo.addEventListener("input", debounce(() => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === itemId);
        if (rec) rec.memo = memo.value;
      });
    }, 350));

    wrap.querySelector(".js-remove").addEventListener("click", () => {
      const snapshot = store.get().items.find((i) => i.id === itemId);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== itemId); });
      KN.ui.toast("リストから外しました", {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => { s.items.unshift(snapshot); }),
        },
      });
      const sheetEl = wrap.closest(".sheet");
      if (sheetEl) sheetEl.querySelector(".js-close").click();
    });

    return wrap;
  }

  function categoryField(productId) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">カテゴリ</span>
        <div class="js-picker"></div>
      </div>
    `);
    KN.ui.categoryPicker(wrap.querySelector(".js-picker"), {
      selectedId: p.categoryId,
      onSelect: (categoryId) => {
        store.update((s) => {
          const rec = s.products.find((x) => x.id === productId);
          if (rec) rec.categoryId = categoryId;
        });
      },
    });
    return wrap;
  }

  function sizeField(productId, onChanged) {
    const p = store.getProduct(productId);
    const wrap = node(html`
      <div class="field">
        <span class="field-label">内容量（単価の計算に使います）</span>
        <div class="input-group">
          <input class="input js-amount" style="flex:1" type="number" inputmode="decimal" min="0" step="any"
                 value="${p.amount != null ? p.amount : ""}" placeholder="500">
          <select class="select js-unit" style="flex:0 0 110px">
            <option value="">単位なし</option>
            ${UNITS.map((u) => html`<option value="${u}" ${p.unit === u ? KN.util.raw("selected") : ""}>${u}</option>`)}
          </select>
        </div>
      </div>
    `);

    const amountEl = wrap.querySelector(".js-amount");
    const unitEl = wrap.querySelector(".js-unit");

    function save() {
      const amount = parseNum(amountEl.value);
      store.update((s) => {
        const rec = s.products.find((x) => x.id === productId);
        if (!rec) return;
        rec.amount = isFinite(amount) && amount > 0 ? amount : null;
        rec.unit = unitEl.value;
      });
      onChanged && onChanged();
    }

    amountEl.addEventListener("input", debounce(save, 400));
    unitEl.addEventListener("change", save);
    return wrap;
  }

  /* ---------------- prices ---------------- */

  function renderPrices(container, productId) {
    container.innerHTML = "";
    container.classList.add("js-prices-host");

    const p = store.getProduct(productId);
    const prices = store.currentPrices(p);
    const best = prices[0] || null;

    const section = node(html`
      <div class="stack js-prices" style="gap:10px">
        <span class="field-label">お店ごとの値段</span>
      </div>
    `);

    if (!prices.length) {
      section.append(node(html`
        <p style="color:var(--c-text-3);font-size:13px;line-height:1.6">
          まだ登録がありません。下のフォームからお店と値段を追加すると、いちばん安いお店が分かります。
        </p>
      `));
    } else {
      const list = node(html`<div class="price-list"></div>`);
      prices.forEach((pr) => {
        const st = store.getStore(pr.storeId);
        const amount = pr.amount || p.amount;
        const up = unitPrice(pr.price, amount, p.unit);
        const isBest = best && pr.id === best.id && prices.length > 1;

        const row = node(html`
          <div class="price-row ${isBest ? "is-best" : ""}">
            <span class="dot" style="background:${st.color}"></span>
            <div class="price-store-wrap">
              <span class="price-store">${st.name}</span>
              ${isBest ? html`<span class="crown">🏆</span>` : ""}
            </div>
            <div class="price-figures">
              <span class="price-amount">${yen(pr.price)}</span>
              ${up ? html`<span class="price-unit">${up.text}</span>` : ""}
              <span class="price-date">${relativeDate(pr.date)}</span>
            </div>
            <button class="icon-btn is-danger js-del" aria-label="この価格を削除">${icon("trash")}</button>
          </div>
        `);

        row.querySelector(".js-del").addEventListener("click", () => {
          store.update((s) => {
            const rec = s.products.find((x) => x.id === productId);
            if (rec) rec.prices = rec.prices.filter((x) => x.id !== pr.id);
          });
          renderPrices(container, productId);
          KN.ui.toast("価格を削除しました", {
            action: {
              label: "元に戻す",
              onClick: () => {
                store.update((s) => {
                  const rec = s.products.find((x) => x.id === productId);
                  if (rec) rec.prices.push(pr);
                });
                renderPrices(container, productId);
              },
            },
          });
        });

        list.append(row);
      });
      section.append(list);
    }

    section.append(addPriceForm(productId, () => renderPrices(container, productId)));
    container.append(section);
  }

  function addPriceForm(productId, onAdded) {
    const p = store.getProduct(productId);
    const hasStores = store.get().stores.length > 0;

    const form = node(html`
      <form class="stack" style="gap:10px;padding:12px;border:1.5px dashed var(--c-border-2);border-radius:12px">
        <span class="field-label">値段を追加</span>
        <div class="js-stores"></div>
        <div class="input-group">
          <input class="input js-price" type="number" inputmode="numeric" min="0" step="1"
                 placeholder="値段" style="flex:1.2" required>
          <input class="input js-size" type="number" inputmode="decimal" min="0" step="any"
                 placeholder="${p.unit ? `内容量(${p.unit})` : "内容量"}" style="flex:1"
                 ${p.unit ? "" : KN.util.raw("disabled")}>
          <button class="btn btn-primary js-add" type="submit" style="flex:0 0 auto">追加</button>
        </div>
        <p class="js-hint" style="font-size:11px;color:var(--c-text-3);margin:0">
          ${p.unit
            ? html`内容量は、その店だけ容量が違うときに入れてください（空なら ${formatSize(p.amount, p.unit) || "商品の内容量"} を使います）`
            : html`上の「内容量」を設定すると、100gあたりなどの単価でも比べられます`}
        </p>
      </form>
    `);

    let selectedStore = null;
    KN.ui.storePicker(form.querySelector(".js-stores"), {
      selectedId: null,
      onSelect: (id) => { selectedStore = id; },
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const priceEl = form.querySelector(".js-price");
      const sizeEl = form.querySelector(".js-size");
      const price = parseNum(priceEl.value);

      if (!hasStores && !selectedStore) {
        KN.ui.toast("先に「＋ お店を追加」でお店を登録してください");
        return;
      }
      if (!selectedStore) { KN.ui.toast("お店を選んでください"); return; }
      if (!isFinite(price) || price < 0) { KN.ui.toast("値段を入力してください"); return; }

      store.addPrice(productId, {
        storeId: selectedStore,
        price,
        amount: parseNum(sizeEl.value),
      });
      haptic(12);
      priceEl.value = "";
      sizeEl.value = "";
      onAdded();
    });

    return form;
  }

  /* ---------------- history ---------------- */

  function historySection(productId) {
    const p = store.getProduct(productId);
    if (!p.prices || p.prices.length < 3) return document.createDocumentFragment();

    const sorted = [...p.prices].sort((a, b) => new Date(a.date) - new Date(b.date));
    const values = sorted.map((x) => x.price);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const span = max - min || 1;

    const W = 300, H = 48, PAD = 4;
    const pts = sorted.map((pr, i) => {
      const x = sorted.length === 1 ? W / 2 : (i / (sorted.length - 1)) * (W - PAD * 2) + PAD;
      const y = H - PAD - ((pr.price - min) / span) * (H - PAD * 2);
      return [x, y];
    });

    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;

    return node(html`
      <div class="field">
        <span class="field-label">値段の記録（${sorted.length}件）</span>
        <div class="card" style="padding:12px">
          <svg class="spark" viewBox="0 0 ${String(W)} ${String(H)}" preserveAspectRatio="none" aria-hidden="true">
            <path class="spark-area" d="${area}"></path>
            <path class="spark-line" d="${line}"></path>
          </svg>
          <div class="spread" style="margin-top:6px">
            <span style="font-size:11px;color:var(--c-text-3)">いちばん安いとき ${yen(min)}</span>
            <span style="font-size:11px;color:var(--c-text-3)">高いとき ${yen(max)}</span>
          </div>
        </div>
      </div>
    `);
  }

  /* ---------------- danger ---------------- */

  function dangerSection(productId, closeSheet) {
    const btn = node(html`
      <button class="btn btn-danger btn-block">${icon("trash")} この商品を削除</button>
    `);
    btn.addEventListener("click", async () => {
      const p = store.getProduct(productId);
      const ok = await KN.ui.confirm({
        title: "商品を削除しますか？",
        message: `「${p.name}」の価格記録と、買い物リストの項目もまとめて削除されます。`,
        okLabel: "削除する",
        danger: true,
      });
      if (!ok) return;
      store.update((s) => {
        s.products = s.products.filter((x) => x.id !== productId);
        s.items = s.items.filter((i) => i.productId !== productId);
      });
      KN.ui.toast("削除しました");
      closeSheet();
    });
    return btn;
  }

  KN.productSheet = { open };
})();

/* ---- js/screen-list.js ---- */
/* =========================================================
   かいものノート — shopping list screen
   ========================================================= */
(function () {
  "use strict";

  const KN = window.KN;
  const { html, node, frag, icon, yen, haptic } = KN.util;
  const store = KN.store;

  let root = null;
  let els = {};
  let categoryFilter = null;   // categoryId or null = all
  let acIndex = -1;            // active autocomplete row
  let acMatches = [];
  let openWrap = null;         // the one row currently swiped open, if any

  /* ---------------- mount (static chrome) ---------------- */

  function mount(el) {
    root = el;
    root.innerHTML = "";

    const chrome = node(html`
      <div class="stack">
        <header class="topbar">
          <div class="topbar-row">
            <div style="flex:1;min-width:0">
              <h1 class="topbar-title">買い物リスト</h1>
              <div class="topbar-sub js-sub"></div>
            </div>
            <button class="icon-btn js-clear" aria-label="購入済みをまとめて削除" title="購入済みをまとめて削除">
              ${icon("trash")}
            </button>
          </div>
        </header>

        <div class="progress-wrap js-progress-wrap" hidden>
          <div class="progress"><div class="progress-bar js-progress" style="width:0%"></div></div>
        </div>

        <div class="js-filter"></div>
        <div class="js-body"></div>
      </div>
    `);

    root.append(chrome);

    /* The add bar sits in the shell's dock, not in this screen. Adding an item
       is the one thing done one-handed in a shop aisle, so it belongs at the
       bottom — but as a plain element there, not a sticky one in here. */
    const dock = document.getElementById("dock");
    dock.innerHTML = "";
    dock.append(node(html`
      <div class="quick-add">
        <form class="quick-add-bar js-form">
          ${icon("cart")}
          <input class="quick-add-input js-input" placeholder="商品を追加（例：食器用洗剤）"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-label="商品を追加" aria-autocomplete="list">
          <button class="quick-add-btn js-add" type="submit" aria-label="追加" disabled>${icon("plus")}</button>
        </form>
        <div class="js-ac"></div>
      </div>
    `));

    els = {
      sub:        chrome.querySelector(".js-sub"),
      clear:      chrome.querySelector(".js-clear"),
      form:       dock.querySelector(".js-form"),
      input:      dock.querySelector(".js-input"),
      addBtn:     dock.querySelector(".js-add"),
      ac:         dock.querySelector(".js-ac"),
      progWrap:   chrome.querySelector(".js-progress-wrap"),
      progress:   chrome.querySelector(".js-progress"),
      filter:     chrome.querySelector(".js-filter"),
      body:       chrome.querySelector(".js-body"),
      topbar:     chrome.querySelector(".topbar"),
    };

    wireQuickAdd();

    els.clear.addEventListener("click", clearChecked);

    root.addEventListener("scroll", () => {
      els.topbar.classList.toggle("is-stuck", root.scrollTop > 4);
    });
  }

  /* ---------------- quick add + autocomplete ---------------- */

  function wireQuickAdd() {
    const { input, form, addBtn, ac } = els;

    input.addEventListener("input", () => {
      addBtn.disabled = !input.value.trim();
      renderAutocomplete();
    });

    input.addEventListener("keydown", (e) => {
      if (!acMatches.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        acIndex = (acIndex + 1) % acMatches.length;
        paintActive();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        acIndex = acIndex <= 0 ? acMatches.length - 1 : acIndex - 1;
        paintActive();
      } else if (e.key === "Escape") {
        closeAutocomplete();
      }
    });

    input.addEventListener("blur", () => setTimeout(closeAutocomplete, 140));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const picked = acIndex >= 0 ? acMatches[acIndex] : null;
      if (picked && picked.product) {
        addExisting(picked.product);
      } else {
        addByName(input.value);
      }
    });
  }

  function renderAutocomplete() {
    const typed = els.input.value.trim();
    const q = KN.util.foldKana(typed);
    acIndex = -1;
    acMatches = [];
    if (!q) { closeAutocomplete(); return; }

    const onList = new Set(store.get().items.map((i) => i.productId));
    // Matched on the folded name, so a single「え」already surfaces
    // 「エマール」— nobody switches to katakana just to search their own list.
    const found = store.get().products
      .map((p) => ({ p, key: KN.util.foldKana(p.name) }))
      .filter((r) => r.key.includes(q))
      .sort((a, b) => {
        const aStarts = a.key.startsWith(q) ? 0 : 1;
        const bStarts = b.key.startsWith(q) ? 0 : 1;
        return aStarts - bStarts || a.p.name.localeCompare(b.p.name, "ja");
      })
      .slice(0, 6)
      .map((r) => r.p);

    // Against what was actually typed, not the folded form — this decides
    // whether we are looking at an existing product or offering a new one.
    const exact = store.findProductByName(typed);
    acMatches = found.map((p) => ({ product: p }));
    if (!exact) acMatches.push({ product: null, name: typed });
    if (!acMatches.length) { closeAutocomplete(); return; }

    /* Reuse the panel across keystrokes. Rebuilding it meant the open
       animation — a fade up from transparent — restarted on every character,
       which read as the list flickering while you typed. The panel is created
       once, when it opens from nothing, and after that only its rows change. */
    let box = els.ac.querySelector(".ac");
    if (!box) {
      box = node(html`<div class="ac" role="listbox"></div>`);
      els.ac.append(box);
    } else {
      box.innerHTML = "";
    }

    acMatches.forEach((m, idx) => {
      let row;
      if (m.product) {
        const cat = store.getCategory(m.product.categoryId);
        const best = store.bestPrice(m.product);
        const bestStore = best ? store.getStore(best.storeId) : null;
        row = node(html`
          <button type="button" class="ac-item" role="option" data-idx="${String(idx)}">
            <span class="ac-emoji">${store.productMark(m.product)}</span>
            <span class="ac-main">
              <span class="ac-name">${m.product.name}</span>
              <span class="ac-sub">
                ${best && bestStore ? html`${bestStore.name} ${yen(best.price)} が最安` : "価格の記録なし"}
                ${onList.has(m.product.id) ? html` ・<b>リストにあります</b>` : ""}
              </span>
            </span>
          </button>
        `);
      } else {
        row = node(html`
          <button type="button" class="ac-item" role="option" data-idx="${String(idx)}">
            <span class="ac-emoji">✨</span>
            <span class="ac-main">
              <span class="ac-name ac-new">「${m.name}」を新しく追加</span>
              <span class="ac-sub">カテゴリは自動で振り分けます</span>
            </span>
          </button>
        `);
      }

      row.addEventListener("mousedown", (e) => e.preventDefault());
      row.addEventListener("click", () => {
        if (m.product) addExisting(m.product);
        else addByName(m.name);
      });
      box.append(row);
    });
  }

  function paintActive() {
    els.ac.querySelectorAll(".ac-item").forEach((r, i) => {
      r.classList.toggle("is-active", i === acIndex);
    });
  }

  function closeAutocomplete() {
    els.ac.innerHTML = "";
    acIndex = -1;
    acMatches = [];
  }

  function resetInput() {
    els.input.value = "";
    els.addBtn.disabled = true;
    closeAutocomplete();
    els.input.focus();
  }

  function addExisting(product) {
    const already = store.get().items.find((i) => i.productId === product.id && !i.checked);
    if (already) {
      // `already` points at the live record, so read the new quantity back
      // after the update rather than adding one to a value that already moved.
      store.update((s) => {
        const rec = s.items.find((i) => i.id === already.id);
        if (rec) rec.qty += 1;
      });
      const updated = store.get().items.find((i) => i.id === already.id);
      KN.ui.toast(`${product.name} を ${updated ? updated.qty : already.qty} 個にしました`);
    } else {
      store.addItem(product.id);
    }
    haptic(10);
    resetInput();
  }

  function addByName(rawName) {
    const name = String(rawName).trim();
    if (!name) return;

    const existing = store.findProductByName(name);
    if (existing) { addExisting(existing); return; }

    const product = store.addProduct({ name, categoryId: store.guessCategory(name) });
    store.addItem(product.id);
    haptic(10);
    resetInput();

    const cat = store.getCategory(product.categoryId);
    KN.ui.toast(`${cat.emoji} ${cat.name} に追加しました`, {
      action: {
        label: "編集",
        onClick: () => {
          const item = store.get().items.find((i) => i.productId === product.id);
          KN.productSheet.open(product.id, { itemId: item && item.id });
        },
      },
    });
  }

  /* ---------------- clear checked ---------------- */

  async function clearChecked() {
    const checked = store.get().items.filter((i) => i.checked);
    if (!checked.length) { KN.ui.toast("購入済みの商品はありません"); return; }

    const ok = await KN.ui.confirm({
      title: "購入済みを削除",
      message: `${checked.length}件の購入済み商品をリストから消します。商品と価格の記録は残ります。`,
      okLabel: "削除する",
      danger: true,
    });
    if (!ok) return;

    store.update((s) => { s.items = s.items.filter((i) => !i.checked); });
    KN.ui.toast(`${checked.length}件を削除しました`, {
      action: {
        label: "元に戻す",
        onClick: () => store.update((s) => { s.items = [...checked, ...s.items]; }),
      },
    });
  }

  /* ---------------- render ---------------- */

  function render() {
    const st = store.get();
    const items = st.items;

    // Once anything is starred the header tracks that trip rather than the whole
    // list, so it agrees with the tab badge instead of quoting a second number.
    const scope = items.some((i) => i.fav) ? items.filter((i) => i.fav) : items;
    const done = scope.filter((i) => i.checked).length;
    const label = scope === items ? "" : "今回買うもの ";

    // 「N件中M件購入済み」rather than「N件・M件購入済み」: the section heading
    // below counts what is left, and two different numbers under the same
    // wording read as a contradiction.
    els.sub.textContent = items.length
      ? (scope.length ? `${label}${scope.length}件中 ${done}件購入済み` : "今回買うものは未選択です")
      : "リストは空です";

    els.progWrap.hidden = scope.length === 0;
    els.progress.style.width = scope.length ? `${(done / scope.length) * 100}%` : "0%";

    renderFilter(items);
    renderBody(items);
  }

  function renderFilter(items) {
    els.filter.innerHTML = "";
    const counts = new Map();
    items.filter((i) => !i.checked).forEach((i) => {
      const p = store.getProduct(i.productId);
      if (!p) return;
      counts.set(p.categoryId, (counts.get(p.categoryId) || 0) + 1);
    });

    if (counts.size < 2) { categoryFilter = null; return; }
    if (categoryFilter && !counts.has(categoryFilter)) categoryFilter = null;

    const row = node(html`<div class="chip-row"></div>`);

    const all = node(html`
      <button type="button" class="chip" aria-pressed="${String(!categoryFilter)}">すべて</button>
    `);
    all.addEventListener("click", () => { categoryFilter = null; render(); });
    row.append(all);

    store.sortedCategories()
      .filter((c) => counts.has(c.id))
      .forEach((c) => {
        const chip = node(html`
          <button type="button" class="chip" aria-pressed="${String(categoryFilter === c.id)}">
            <span class="chip-emoji">${c.emoji}</span>${c.name}
            <span class="chip-count">${counts.get(c.id)}</span>
          </button>
        `);
        chip.addEventListener("click", () => {
          categoryFilter = categoryFilter === c.id ? null : c.id;
          haptic();
          render();
        });
        row.append(chip);
      });

    els.filter.append(row);
  }

  function renderBody(items) {
    // Rows are rebuilt from scratch, so any remembered open row is now detached.
    openWrap = null;
    els.body.innerHTML = "";

    if (!items.length) {
      els.body.append(emptyState());
      return;
    }

    const active = items.filter((i) => !i.checked);
    const checked = items.filter((i) => i.checked);
    const trip = active.filter((i) => i.fav);

    if (!trip.length) {
      // Nothing starred yet: one plain list with one total, as before. Splitting
      // the screen the moment favourites exist as a concept would leave anyone
      // not using them staring at an empty「今回買うもの」and a — total.
      const shown = appendGroups(active);
      if (!shown && categoryFilter) els.body.append(noneInCategory());
      if (checked.length) els.body.append(checkedSection(checked));
      els.body.append(summaryCard(active));
      els.body.append(insightsCard(active));
      return;
    }

    const rest = active.filter((i) => !i.fav);

    els.body.append(sectionHead("今回買うもの", trip.length, "trip"));
    const tripShown = appendGroups(trip);
    if (!tripShown && categoryFilter) els.body.append(noneInCategory());
    // The total belongs to the trip, so it sits directly under it — everything
    // below this line is explicitly not being bought today.
    els.body.append(summaryCard(trip, { trip: true }));
    els.body.append(insightsCard(trip));

    if (rest.length) {
      els.body.append(sectionHead("そのほか", rest.length, "rest"));
      appendGroups(rest);
    }

    if (checked.length) els.body.append(checkedSection(checked));
  }

  /** Renders category groups for the given items. Returns whether anything showed. */
  function appendGroups(list) {
    const groups = new Map();
    list.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (!p) return;
      if (categoryFilter && p.categoryId !== categoryFilter) return;
      if (!groups.has(p.categoryId)) groups.set(p.categoryId, []);
      groups.get(p.categoryId).push({ item, product: p });
    });

    store.sortedCategories().forEach((cat) => {
      const entries = groups.get(cat.id);
      if (!entries || !entries.length) return;

      const group = node(html`
        <section class="cat-group">
          <h2 class="cat-head">
            <span class="cat-head-emoji">${cat.emoji}</span>${cat.name}
            <span class="cat-head-count">${entries.length}</span>
          </h2>
          <div class="item-list"></div>
        </section>
      `);
      const listEl = group.querySelector(".item-list");
      entries.forEach(({ item, product }) => listEl.append(itemRow(item, product)));
      wireReorder(listEl);
      els.body.append(group);
    });

    return groups.size > 0;
  }

  /* Reordering is within a group, because a group is exactly the set of rows
     that are interchangeable: same category, same side of the「今回買うもの」
     line. Dragging a row into another category's group would have to silently
     recategorise it, which is not what picking it up looks like it means. */
  function wireReorder(listEl) {
    KN.reorder.attach(listEl, {
      item: ".item-wrap",
      // A row already swiped open is mid-gesture; picking it up on top of that
      // would leave the delete panel hanging in the air.
      blocked: () => !!openWrap,
      onDrop: (from, to) => {
        const ids = Array.prototype.map.call(listEl.children, (w) => w.dataset.itemId);
        const [moved] = ids.splice(from, 1);
        ids.splice(to, 0, moved);

        // The group's order is its members' order within the whole list, so
        // the move writes them back into the same slots they already occupy —
        // everything not in this group stays exactly where it was.
        store.update((s) => {
          const inGroup = new Set(ids);
          const slots = [];
          s.items.forEach((it, i) => { if (inGroup.has(it.id)) slots.push(i); });
          const byId = new Map(s.items.map((it) => [it.id, it]));
          ids.forEach((id, k) => { s.items[slots[k]] = byId.get(id); });
        });
        KN.util.haptic(12);
      },
    });
  }

  function sectionHead(label, count, kind) {
    return node(html`
      <h2 class="trip-head trip-head-${kind}">
        ${kind === "trip" ? icon("star") : ""}
        <span>${label}</span>
        <span class="cat-head-count">${count}</span>
      </h2>
    `);
  }

  function noneInCategory() {
    return node(html`
      <p style="text-align:center;color:var(--c-text-3);padding:32px 16px">
        このカテゴリに未購入の商品はありません
      </p>
    `);
  }

  function itemRow(item, product) {
    const best = store.bestPrice(product);
    const bestStore = best ? store.getStore(best.storeId) : null;

    const wrap = node(html`
      <article class="item-wrap" data-item-id="${item.id}">
        <div class="item-actions">
          <button class="item-del" tabindex="-1" aria-label="${product.name} をリストから削除">削除</button>
        </div>
      </article>
    `);

    const row = node(html`
      <div class="item ${item.checked ? "is-checked" : ""}">
        <button class="check" role="checkbox" aria-checked="${String(item.checked)}"
                aria-label="${product.name} を購入済みにする">${icon("check")}</button>
        <span class="item-emoji" aria-hidden="true">${store.productMark(product)}</span>
        <button class="item-body">
          <span class="item-name-row">
            <span class="item-name">${product.name}</span>
            ${item.qty > 1 ? html`<span class="item-qty">×${item.qty}</span>` : ""}
          </span>
          <span class="item-meta">
            ${item.memo ? html`<span class="item-memo">${item.memo}</span>` : ""}
          </span>
        </button>
        <div class="item-price"></div>
        <button class="fav ${item.fav ? "is-on" : ""}" aria-pressed="${String(!!item.fav)}"
                aria-label="${product.name} を今回買うものにする">${icon("star")}</button>
      </div>
    `);
    wrap.append(row);

    const priceBox = row.querySelector(".item-price");
    if (best && bestStore) {
      priceBox.append(frag(html`
        <span class="item-price-amount">${yen(best.price * item.qty)}</span>
        <span class="item-price-store">🏆 ${bestStore.name}</span>
      `));
    } else {
      priceBox.append(node(html`<span class="item-price-none">値段は未登録</span>`));
    }

    row.querySelector(".check").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) {
          rec.checked = !rec.checked;
          rec.checkedAt = rec.checked ? KN.util.today() : null;
        }
      });
      haptic(12);
    });

    row.querySelector(".fav").addEventListener("click", () => {
      store.update((s) => {
        const rec = s.items.find((i) => i.id === item.id);
        if (rec) rec.fav = !rec.fav;
      });
      haptic(12);
    });

    row.querySelector(".item-body").addEventListener("click", () => {
      KN.productSheet.open(product.id, { itemId: item.id });
    });

    wrap.querySelector(".item-del").addEventListener("click", () => {
      const removed = store.get().items.find((i) => i.id === item.id);
      const at = store.get().items.indexOf(removed);
      store.update((s) => { s.items = s.items.filter((i) => i.id !== item.id); });
      haptic(12);
      // Deleting straight from a swipe is the platform convention, so the safety
      // net is an undo rather than a dialog standing between every removal.
      KN.ui.toast(`「${product.name}」を削除しました`, {
        action: {
          label: "元に戻す",
          onClick: () => store.update((s) => {
            const next = s.items.slice();
            next.splice(Math.max(0, Math.min(at, next.length)), 0, removed);
            s.items = next;
          }),
        },
      });
    });

    attachSwipe(wrap, row);
    return wrap;
  }

  /* ---------------- swipe to reveal delete ---------------- */

  // Only one row may sit open; a second one opening closes the first.
  function closeOpenRow() {
    if (openWrap) {
      openWrap.classList.remove("is-open");
      holdPanelDuringClose(openWrap);
    }
    openWrap = null;
  }

  /* The row slides back over 0.22s. Hiding the panel the instant the class goes
     would leave a bare strip of background trailing the row for that moment, so
     keep it on screen until the row has finished covering it again. */
  function holdPanelDuringClose(wrap) {
    const row = wrap.querySelector(".item");
    if (!row) return;
    wrap.classList.add("is-closing");
    const done = () => wrap.classList.remove("is-closing");
    row.addEventListener("transitionend", done, { once: true });
    // A transition that never runs (already at rest) would otherwise strand it.
    // Comfortably longer than the slide, or the panel vanishes mid-flight.
    setTimeout(done, 900);
  }

  function attachSwipe(wrap, row) {
    const REVEAL = 88;      // width of the delete panel
    const SLOP = 14;        // travel before a drag counts as a drag and not a tap
    const DOMINANCE = 1.6;  // how much horizontal has to beat vertical by
    let startX = 0, startY = 0, dx = 0;
    let dragging = false, decided = false, pointerId = null, swallowClick = false;
    let pendingDx = null, rafId = 0;

    // Pointer moves arrive faster than the screen refreshes. Painting once per
    // frame instead of once per event keeps the row gliding rather than
    // stuttering under a quick finger.
    const paint = () => {
      rafId = 0;
      if (pendingDx === null) return;
      row.style.transform = `translate3d(${pendingDx}px, 0, 0)`;
    };
    const schedule = (v) => {
      pendingDx = v;
      if (!rafId) rafId = requestAnimationFrame(paint);
    };

    // touch-action keeps the list scrollable up to the moment a swipe is
    // recognised; from then on the browser has to be told to stop, or the list
    // scrolls under the finger while the row slides sideways.
    row.addEventListener("touchmove", (e) => {
      if (dragging) e.preventDefault();
    }, { passive: false });

    row.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      dragging = false;
      decided = false;
      // Deliberately touches no styles: a press that never becomes a swipe
      // should leave the row exactly as it was.
    });

    row.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pointerId) return;
      // Held still long enough to lift the row out of the list — from here the
      // gesture belongs to the reorder, not to the delete swipe.
      if (KN.reorder.isActive()) return;
      const mx = e.clientX - startX;
      const my = e.clientY - startY;

      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
        decided = true;
        // Has to be a clearly sideways movement, not a drifting scroll. A
        // diagonal belongs to the list, which stays scrollable throughout.
        // Rightwards only counts on an open row, where it means "put it back";
        // on a closed row there is nothing to the right to reach for.
        const isOpen = wrap.classList.contains("is-open");
        dragging = Math.abs(mx) >= SLOP
          && Math.abs(mx) > Math.abs(my) * DOMINANCE
          && (isOpen || mx < 0);
        if (!dragging) return;
        row.setPointerCapture(pointerId);
        row.style.transition = "none";
        wrap.classList.add("is-swiping");
        if (openWrap && openWrap !== wrap) closeOpenRow();
      }
      if (!dragging) return;

      const base = wrap.classList.contains("is-open") ? -REVEAL : 0;
      // Bounded by the panel at both ends. Going further left than the panel is
      // wide opened a strip of bare background beyond it — very visible on a
      // second swipe of an already-open row — and going right of 0 would show
      // the same on the other side.
      dx = Math.min(0, Math.max(-REVEAL, base + mx));
      schedule(dx);
    });

    const finish = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      if (!dragging) return;

      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      pendingDx = null;
      row.style.transition = "";
      row.style.transform = "";
      wrap.classList.remove("is-swiping");
      const open = dx < -REVEAL / 2;
      wrap.classList.toggle("is-open", open);
      if (!open) holdPanelDuringClose(wrap);
      openWrap = open ? wrap : (openWrap === wrap ? null : openWrap);
      dragging = false;
      // A pointer sequence still emits a click afterwards. Left alone it would
      // press whatever the finger lifted over, and — because the row is open by
      // then — immediately close the row the swipe just opened.
      swallowClick = true;
    };
    row.addEventListener("pointerup", finish);
    row.addEventListener("pointercancel", finish);

    row.addEventListener("click", (e) => {
      if (swallowClick) {
        swallowClick = false;
        e.stopPropagation();
        e.preventDefault();
        return;
      }
      // With the delete panel showing, a tap on the row means "put it back".
      if (wrap.classList.contains("is-open")) {
        e.stopPropagation();
        e.preventDefault();
        closeOpenRow();
      }
    }, true);
  }

  function checkedSection(checked) {
    const st = store.get();
    const open = st.settings.showChecked !== false;

    const section = node(html`
      <section class="cat-group">
        <button class="done-head" aria-expanded="${String(open)}">
          ${icon("chevron")} 購入済み <span class="cat-head-count">${checked.length}</span>
        </button>
        <div class="item-list js-done" ${open ? "" : KN.util.raw("hidden")}></div>
      </section>
    `);

    const list = section.querySelector(".js-done");
    checked.forEach((item) => {
      const p = store.getProduct(item.productId);
      if (p) list.append(itemRow(item, p));
    });

    section.querySelector(".done-head").addEventListener("click", () => {
      store.update((s) => { s.settings.showChecked = !open; });
    });

    return section;
  }

  function summaryCard(active, { trip = false } = {}) {
    let total = 0;
    let unknown = 0;

    active.forEach((item) => {
      const p = store.getProduct(item.productId);
      const best = p && store.bestPrice(p);
      if (best) total += best.price * item.qty;
      else unknown += 1;
    });

    if (!active.length) return document.createDocumentFragment();

    const scope = trip ? "今回買うもの" : "未購入";
    return node(html`
      <div class="list-summary">
        <div class="summary-row">
          <span class="summary-label">最安値で買うと</span>
          <span class="summary-total">${total > 0 ? yen(total) : "—"}</span>
        </div>
        <p class="summary-note">
          ${unknown > 0
            ? html`${unknown}品は値段が未登録です。商品をタップして登録すると合計に反映されます。`
            : html`${scope} ${active.length}品を、それぞれいちばん安いお店で買った場合の合計です。`}
        </p>
      </div>
    `);
  }

  /* Whatever the numbers happen to be worth saying out loud. Renders nothing
     at all when there is nothing to say, which is most of the time early on. */
  function insightsCard(items) {
    const found = KN.insights.forItems(items);
    if (!found.length) return document.createDocumentFragment();

    const card = node(html`
      <section class="insights">
        <h2 class="insights-head">${icon("sparkles")} 気づいたこと</h2>
        <div class="insights-list"></div>
      </section>
    `);
    const listEl = card.querySelector(".insights-list");
    found.forEach((f) => {
      listEl.append(node(html`
        <div class="insight">
          <span class="insight-ico">${f.icon}</span>
          <span class="insight-main">
            <span class="insight-title">${f.title}</span>
            <span class="insight-body">${f.body}</span>
          </span>
        </div>
      `));
    });
    return card;
  }

  function emptyState() {
    const wrap = node(html`
      <div class="empty">
        <div class="empty-art">🛒</div>
        <h2 class="empty-title">買うものを追加しましょう</h2>
        <p class="empty-text">
          下の欄に商品名を入れるだけ。カテゴリは自動で振り分けられ、
          お店ごとの値段を登録すると「どこが一番安いか」が分かります。
        </p>
        <button class="btn btn-soft js-sample" style="margin-top:8px">サンプルを入れて試す</button>
      </div>
    `);
    wrap.querySelector(".js-sample").addEventListener("click", async () => {
      const ok = await KN.ui.confirm({
        title: "サンプルを入れますか？",
        message: "3つのお店と7つの商品・価格が入ったサンプルデータを読み込みます。あとから設定画面で全部消せます。",
        okLabel: "入れる",
      });
      if (ok) { store.loadSample(); KN.ui.toast("サンプルを読み込みました"); }
    });
    return wrap;
  }

  KN.screens = KN.screens || {};
  KN.screens.list = { mount, render };
})();
