name: Daily full tests

# 門の外の試験も、毎日一度ぜんぶ回す（docs/roadmap-seamless.md の X20）。
# 配るのは止めない——ここが落ちても pages.yml の門と deploy はそのまま。
# 結果はセッションの頭に一度だけ見る（docs/dev.md「テストの回し方」）。
on:
  schedule:
    - cron: "0 18 * * *"   # 日本の朝3時
  workflow_dispatch:

# 権限はジョブごとに（docs/dev.md「配信の守り」）。
permissions: {}

concurrency:
  group: tests-daily
  cancel-in-progress: true

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # playwright は tests/ だけの package.json で入れる（pages.yml と同じ）。
      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # frame-pace・heavy-pace は run-all が外す（測るだけで、手で回す）。
      # 日本の時間帯で回す（2026年10月10日）。走るのは UTC の18時＝日本の朝3時で、端末の日付が UTC より
      # 一日先——門（pages.yml）は UTC のままなので、日本の0〜9時にだけ出る日付の取り違えは、ここでしか見えない。
      # 時計は差し替えない（KN_CLOCK は動きの台本と相性が悪い。tests/README.md）。TZ は台本の側、KN_TZ は頁。
      - name: Run all tests
        env:
          TZ: Asia/Tokyo
          KN_TZ: Asia/Tokyo
        run: node tests/run-all.js

      # AI の窓口の試験は SDK が要るので門の外。lock どおりに入れて、毎日ここで回す（docs/dev.md「外との口の守り」）。
      # audit は配るもの（dependencies）だけ・high 以上で赤に。
      - name: AI worker tests
        if: ${{ !cancelled() }}   # 全部の試験が落ちても回す
        working-directory: ai
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node worker.test.mjs

  # WebKit の列（roadmap-3.2 の G3・X22 (a)）：エンジンで違いが出る台本だけ。知らせるだけ——門にも配るのにも入れない。
  # Linux の WebKit は iOS の Safari と同じではない。ここで落ちても、iPhone で確かめるまでアプリは直さない。
  # CDP・page.coverage を使う台本は入れない（Chromium だけ）。
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps webkit

      - name: Run WebKit tests
        env:
          TZ: Asia/Tokyo
          KN_TZ: Asia/Tokyo
          KN_BROWSER: webkit
        run: node tests/run-all.js scroll-anchor fit-fields typeface text-size top-tap feel-3

  # 西の時間帯の列（総点検 2026-10-27 の P2-5）：日付の台本だけを America/Los_Angeles で。知らせるだけ——門にも配るのにも入れない。
  # 日本の祝日・節気・雑節は日本時間で決まり、端末の時間帯で変わってはいけない（js/season.js・js/holiday.js）。
  west:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run date tests (America/Los_Angeles)
        env:
          TZ: America/Los_Angeles
          KN_TZ: America/Los_Angeles
        run: node tests/run-all.js holiday season season-art season-beat when-dict when-fields yearbook due-sheet sky
