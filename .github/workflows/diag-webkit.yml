# DIAG（一時）：WebKit 26.6 で scroll-anchor の「暦を払う」が固まって落ちる件の切り分け。main には入れない。
name: DIAG webkit hang
on:
  push:
    branches: [claude/webkit-compositor-segfault-diag-uwp4na]
permissions: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps webkit
          sudo apt-get install -y -q gdb > /dev/null
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope || true
      - name: Bisect CSS
        env:
          TZ: Asia/Tokyo
          KN_TZ: Asia/Tokyo
          KN_BROWSER: webkit
          KN_TRIES: "2"
        run: |
          python3 -m http.server 8765 --directory . 2> /dev/null > /dev/null &
          sleep 1
          node tests/diag/bisect.js 2>&1 | cut -c1-300 || true
      - name: dmesg
        if: always()
        run: sudo dmesg | grep -i segfault | cut -c1-200 | tail -40
