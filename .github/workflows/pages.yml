name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be on: Settings → Pages → Source: GitHub Actions.
      # `enablement: true` cannot do it for us — GITHUB_TOKEN is not allowed to
      # create a Pages site ("Resource not accessible by integration").
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is static — publish the repository root as-is.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
