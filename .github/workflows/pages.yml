name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 門（docs/roadmap.md の R22）。main に入ったものは、ここを通ってから配る——
  # 落ちたら deploy は走らず、iPhone に届くのは試験を通った版だけ。
  # 入れるのは速くて揺れないものだけ（tests/run-all.js の GATE）。残りは手元で
  # `node tests/run-all.js`。門で一度でも揺れた試験は GATE から外して手元へ戻し、
  # 直してから戻す（飛ばす・消すのではない）。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # playwright は tests/ だけの package.json で入れる（サイトの中には入らない）。
      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the gate tests
        run: node tests/run-all.js --gate

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be on: Settings → Pages → Source: GitHub Actions.
      # `enablement: true` cannot do it for us — GITHUB_TOKEN is not allowed to
      # create a Pages site ("Resource not accessible by integration").
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Names the worker's cache after the commit and versions every css/js URL.
      # The URL versioning is what reaches an app already carrying an older
      # worker: that worker fetches navigations from the network, so it picks up
      # the new index.html, and the versioned asset URLs then miss its
      # cache-first lookup and go to the network too. The script exits non-zero
      # if any part of the stamping fails to match, so a rename cannot silently
      # freeze installed apps on an old build again.
      - name: Stamp the build into the service worker and asset URLs
        run: node stamp-build.js

      # The test scripts (tests/) are for local runs only; keep them off the site.
      - name: Leave the test scripts out of the site
        run: rm -rf tests

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is static — publish the repository root as-is.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
