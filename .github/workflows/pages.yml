name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 権限はジョブごとに（docs/dev.md「配信の守り」）。ここは何も渡さない。
permissions: {}

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 門（docs/roadmap.md の R22）。main に入ったものは、ここを通ってから配る——
  # 落ちたら deploy は走らず、iPhone に届くのは試験を通った版だけ。
  # 入れるのは速くて揺れないものだけ（tests/run-all.js の GATE）。残りは手元で
  # `node tests/run-all.js`。門で一度でも揺れた試験は GATE から外して手元へ戻し、
  # 直してから戻す（飛ばす・消すのではない）。
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest（26.04）は Playwright 1.56 が Chromium を入れられない（2026年11月1日）
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # playwright は tests/ だけの package.json と package-lock.json で入れる（サイトの中には入らない）。
      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the gate tests
        run: node tests/run-all.js --gate

  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-24.04   # ubuntu-latest（26.04）は Playwright 1.56 が Chromium を入れられない（2026年11月1日）
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Requires Pages to be on: Settings → Pages → Source: GitHub Actions.
      # `enablement: true` cannot do it for us — GITHUB_TOKEN is not allowed to
      # create a Pages site ("Resource not accessible by integration").
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Names the worker's cache after the commit and versions every css/js URL.
      # The URL versioning is what reaches an app already carrying an older
      # worker: that worker fetches navigations from the network, so it picks up
      # the new index.html, and the versioned asset URLs then miss its
      # cache-first lookup and go to the network too. The script exits non-zero
      # if any part of the stamping fails to match, so a rename cannot silently
      # freeze installed apps on an old build again.
      - name: Stamp the build into the service worker and asset URLs
        run: node stamp-build.js

      # The test scripts (tests/) are for local runs only; keep them off the site.
      - name: Leave the test scripts out of the site
        run: rm -rf tests

      # 見本（偽の記録の試作）は手元で開くだけ。サイトには載せない（docs/dev.md「配信の守り」）。
      - name: Leave the prototypes out of the site
        run: rm -f tools/notes-proto*.html tools/todo-proto.html shots/vision/mock.html

      # Since v4 dotfiles (.nojekyll, .claude/) stay out; an Actions deploy runs no Jekyll.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # The app is static — publish the repository root as-is.
          path: .

      # 上げた直後の artifact を「見つからない」として落ちることがある（#1379・#1381。test は緑）。
      # 落ちたら30秒待って、このジョブの中で一度だけやり直す。二度目も落ちたら赤。test はやり直さない。
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
