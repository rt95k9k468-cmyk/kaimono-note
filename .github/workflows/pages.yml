name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be on: Settings → Pages → Source: GitHub Actions.
      # `enablement: true` cannot do it for us — GITHUB_TOKEN is not allowed to
      # create a Pages site ("Resource not accessible by integration").
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Names the worker's cache after the commit and versions every css/js URL.
      # The URL versioning is what reaches an app already carrying an older
      # worker: that worker fetches navigations from the network, so it picks up
      # the new index.html, and the versioned asset URLs then miss its
      # cache-first lookup and go to the network too. The script exits non-zero
      # if any part of the stamping fails to match, so a rename cannot silently
      # freeze installed apps on an old build again.
      - name: Stamp the build into the service worker and asset URLs
        run: node stamp-build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is static — publish the repository root as-is.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
