<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- くらしノートのアイコン（B5 の二度目。はじまり＝水平線の日の出）。
     地の色は基調色（設定 → 基調色）に合わせる。icons/accent/ に8色ぶんあり、
     app.js の applyAccent がタブの絵とホーム画面用の絵を差し替える。 -->
  <defs>
    <clipPath id="c"><rect width="512" height="512" rx="114"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#529caa"/><stop offset=".55" stop-color="#a9d3db"/><stop offset="1" stop-color="#d3e9ed"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#afd6dd"/><stop offset=".55" stop-color="#d3d4e1"/><stop offset="1" stop-color="#cdcbd9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".54" r=".36">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="276" fill="url(#sky)"/>
    <rect y="276" width="512" height="236" fill="url(#sea)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <path d="M172 276a84 84 0 0 1 168 0z" fill="#ffffff"/>
    <rect y="273" width="512" height="6" fill="#ffffff" opacity=".7"/>
    <rect x="192" y="302" width="128" height="9" rx="4.5" fill="#ffffff" opacity=".55"/>
    <rect x="220" y="330" width="72" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  </g>
</svg>
